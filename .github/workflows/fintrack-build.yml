              fun learnCategory(db: Db, key: String, display: String, cat: String) { if (key.isBlank()) return; val old = db.rows("SELECT category FROM merchant_rules WHERE merchant_key=?", key).firstOrNull(); if (old == null) db.exec("INSERT INTO merchant_rules(merchant_key, display, category, weight) VALUES(?,?,?,?)", key, display, cat, 2.0) else if (old["category"] == cat) db.exec("UPDATE merchant_rules SET weight = weight + 1 WHERE merchant_key=?", key) else db.exec("UPDATE merchant_rules SET category=?, weight=2 WHERE merchant_key=?", key, cat) }
              fun learnVpaCategory(db: Db, vpa: String, cat: String) { if (vpa.isBlank()) return; val key = "vpa:" + vpa.lowercase().trim(); val old = db.rows("SELECT category FROM merchant_rules WHERE merchant_key=?", key).firstOrNull(); if (old == null) db.exec("INSERT INTO merchant_rules(merchant_key, display, category, weight) VALUES(?,?,?,?)", key, vpa, cat, 3.0) else db.exec("UPDATE merchant_rules SET category=?, weight = weight + 1 WHERE merchant_key=?", cat, key) }
              fun similarCandidates(db: Db, t: Txn, limit: Int = 200): List<Txn> {
                  val out = ArrayList<Txn>(); val seen = HashSet<Long>(); seen.add(t.id)
                  val mk = norm(t.merchant)
                  if (mk.isNotBlank()) { for (r in db.queryTxns("merchant_key=?", arrayOf(mk), limit)) if (seen.add(r.id)) out.add(r) }
                  if (!t.vpa.isNullOrBlank()) { for (r in db.queryTxns("vpa=?", arrayOf(t.vpa!!), limit)) if (seen.add(r.id)) out.add(r) }
                  if (t.merchant.isNotBlank() && t.merchant != "Unknown") { for (r in db.queryTxns("merchant=?", arrayOf(t.merchant), limit)) if (seen.add(r.id)) out.add(r) }
                  return out
              }
              fun applySimilar(db: Db, ids: List<Long>, category: String) { if (ids.isEmpty()) return; for (id in ids) db.exec("UPDATE txn SET category=? WHERE id=?", category, id) }
              fun learnMerge(db: Db, survivorKey: String, mergedKeys: List<String>, survivorName: String) { if (survivorKey.isBlank() || mergedKeys.isEmpty()) return; db.exec("INSERT OR REPLACE INTO payee_merge_rules(survivor_key, merged_keys, survivor_name) VALUES(?,?,?)", survivorKey, mergedKeys.joinToString(","), survivorName) }

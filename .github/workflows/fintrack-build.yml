          cat > app/src/main/java/com/example/fintrack/Tolls.kt <<'EOF_15'
          package com.example.fintrack

          import android.content.Context
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.ConcurrentHashMap

          data class Plaza(
              val id: Int,
              val name: String,
              val state: String,
              val nh: String,
              val lat: Double,
              val lon: Double,
              val car: Double?,
              val toks: Set<String>
          )

          data class TollCheckpoint(
              val plaza: String,
              val ts: Long,
              val amount: Double,
              val lat: Double,
              val lon: Double
          )

          data class TollTrip(
              val tripId: Int,
              val direction: String,
              val dayKey: String,
              val title: String,
              val total: Double,
              val checkpoints: List<TollCheckpoint>,
              val roadPolyline: List<DoubleArray>
          )

          object Tolls {
              val TOLL_SEED: Map<String, DoubleArray> = linkedMapOf(
                  "Nawabganj Toll Plaza"    to doubleArrayOf(80.6591, 26.6214),
                  "Shahabpur Toll Plaza"    to doubleArrayOf(81.1422, 26.7845),
                  "Aaini Toll Plaza"        to doubleArrayOf(81.9845, 26.8012),
                  "Newada Toll Plaza"       to doubleArrayOf(81.1234, 26.5120),
                  "Basheerapur Toll Plaza"  to doubleArrayOf(81.6789, 26.2345),
                  "Tarwa Deva"              to doubleArrayOf(82.1234, 25.9876)
              )

              private var index: Map<String, List<Plaza>> = emptyMap()
              private var loaded = false
              private val stop = setOf("toll","plaza","tp","the","road","ltd","pvt","and","bridge","gate","check","post")
              private val splitRe = Regex("""[^a-z0-9]+""")
              private val aliases = mapOf("anantram" to "anatram")

              private fun toks(s: String): Set<String> =
                  s.lowercase().split(splitRe).filter { it.length >= 3 && it !in stop }.toSet()

              @Synchronized
              fun load(ctx: Context) {
                  if (loaded) return
                  val idx = HashMap<String, MutableList<Plaza>>()
                  try {
                      val db = Db.get(ctx)
                      val rows = db.rows("SELECT * FROM toll_plazas")
                      for (r in rows) {
                          val name = r["name"] ?: continue
                          val tk = toks(name); if (tk.isEmpty()) continue
                          val car = r["car_fare"]?.toDoubleOrNull()
                          val p = Plaza(
                              r["plaza_id"]?.toIntOrNull() ?: 0, name, r["state"] ?: "", r["nh"] ?: "",
                              r["lat"]?.toDoubleOrNull() ?: 0.0,
                              r["lon"]?.toDoubleOrNull() ?: 0.0,
                              car, tk
                          )
                          for (t in tk) idx.getOrPut(t) { ArrayList() }.add(p)
                      }
                  } catch (_: Exception) {}
                  index = idx; loaded = true
              }

              fun count(ctx: Context): Int { load(ctx); return index.values.flatten().toSet().size }

              fun match(ctx: Context, text: String, amount: Double): Plaza? {
                  load(ctx)
                  val raw = toks(text); if (raw.isEmpty()) return null
                  val bt = HashSet<String>()
                  for (t in raw) { bt.add(t); aliases[t]?.let { bt.add(it) } }
                  val cand = HashSet<Plaza>()
                  for (t in bt) index[t]?.let { cand.addAll(it) }
                  var best: Plaza? = null; var bestScore = 0.0
                  for (p in cand) {
                      val overlap = p.toks.count { it in bt }; if (overlap == 0) continue
                      val overlapRatio = overlap.toDouble() / p.toks.size
                      var score = overlap * 10.0 + overlapRatio * 10.0
                      val car = p.car
                      if (car != null && car > 0) score -= Math.min(Math.abs(car - amount) / car, 5.0)
                      if (score > bestScore) { best = p; bestScore = score }
                  }
                  return best
              }

              private val vehicleRe = Regex("""\b([A-Z]{2}[\s\-]?\d{1,2}[\s\-]?[A-Z]{1,3}[\s\-]?\d{4})\b""")
              private val plazaNameRe = Regex("""(?i)(?:at|for)\s+([A-Z][A-Za-z .\-]{2,40}?)(?:\s*\(|\s+on\b|$)""")

              fun record(ctx: Context, t: Txn) {
                  val db = Db.get(ctx)
                  db.exec("DELETE FROM toll_trips WHERE txn_id=?", t.id)
                  if (!t.debit) return
                  val p = match(ctx, t.merchant + " " + t.body, t.amount)
                  val veh = vehicleRe.find(t.body.uppercase())?.groupValues?.get(1)
                  if (p != null) {
                      db.exec(
                          "INSERT OR REPLACE INTO toll_trips(txn_id, plaza_id, plaza, state, lat, lon, ts, amount, vehicle) VALUES(?,?,?,?,?,?,?,?,?)",
                          t.id, p.id, p.name, p.state, p.lat, p.lon, t.ts, t.amount, veh
                      )
                  } else {
                      val plazaFromBody = plazaNameRe.find(t.body)?.groupValues?.get(1)?.trim() ?: t.merchant
                      db.exec(
                          "INSERT OR REPLACE INTO toll_trips(txn_id, plaza_id, plaza, state, lat, lon, ts, amount, vehicle) VALUES(?,?,?,?,?,?,?,?,?)",
                          t.id, 0, plazaFromBody, "", 0.0, 0.0, t.ts, t.amount, veh
                      )
                  }
              }

              fun rematchAll(ctx: Context): Int {
                  load(ctx)
                  val db = Db.get(ctx)
                  val list = db.queryTxns("category='Travel' AND debit=1", emptyArray(), 5000)
                  var n = 0
                  for (t in list) { record(ctx, t); n++ }
                  return n
              }

              private val dayFmt = SimpleDateFormat("yyyy-MM-dd", Locale.US)

              private fun plazaCoord(name: String): DoubleArray? {
                  TOLL_SEED[name]?.let { return it }
                  for ((k, v) in TOLL_SEED) if (k.equals(name, ignoreCase = true)) return v
                  return null
              }

              fun fetchRoadRoute(waypoints: List<DoubleArray>): List<DoubleArray> {
                  if (waypoints.size < 2) return waypoints.map { doubleArrayOf(it[1], it[0]) }
                  return try {
                      val coords = waypoints.joinToString(";") { "${it[0]},${it[1]}" }
                      val url = URL("https://router.project-osrm.org/route/v1/driving/$coords?overview=full&geometries=polyline")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "GET"
                      conn.connectTimeout = 8000
                      conn.readTimeout = 8000
                      conn.setRequestProperty("User-Agent", "FinTrack/10.2")
                      if (conn.responseCode != 200) throw RuntimeException("OSRM HTTP ${conn.responseCode}")
                      val txt = conn.inputStream.bufferedReader().use { it.readText() }
                      val json = org.json.JSONObject(txt)
                      if (json.optString("code") != "Ok") throw RuntimeException("OSRM not Ok")
                      val routes = json.optJSONArray("routes")
                      if (routes == null || routes.length() == 0) throw RuntimeException("No routes")
                      val geom = routes.getJSONObject(0).optString("geometry", "")
                      if (geom.isBlank()) throw RuntimeException("No geometry")
                      decodePolyline(geom)
                  } catch (_: Exception) {
                      waypoints.map { doubleArrayOf(it[1], it[0]) }
                  }
              }

              fun decodePolyline(encoded: String): List<DoubleArray> {
                  val points = ArrayList<DoubleArray>()
                  var index = 0; val len = encoded.length
                  var lat = 0; var lng = 0
                  while (index < len) {
                      var b: Int; var shift = 0; var result = 0
                      do { b = encoded[index++].code - 63; result = result or ((b and 0x1f) shl shift); shift += 5 } while (b >= 0x20)
                      val dlat = if (result and 1 != 0) (result shr 1).inv() else (result shr 1)
                      lat += dlat
                      shift = 0; result = 0
                      do { b = encoded[index++].code - 63; result = result or ((b and 0x1f) shl shift); shift += 5 } while (b >= 0x20)
                      val dlng = if (result and 1 != 0) (result shr 1).inv() else (result shr 1)
                      lng += dlng
                      points.add(doubleArrayOf(lat * 1e-5, lng * 1e-5))
                  }
                  return points
              }

              fun buildTrips(ctx: Context): Pair<List<TollTrip>, Double> {
                  val db = Db.get(ctx)
                  val rows = db.rows("SELECT plaza, lat, lon, ts, amount FROM toll_trips ORDER BY ts ASC")

                  val events = rows.mapNotNull { r ->
                      val name = r["plaza"] ?: return@mapNotNull null
                      val ts = r["ts"]?.toLongOrNull() ?: return@mapNotNull null
                      val amt = r["amount"]?.toDoubleOrNull() ?: return@mapNotNull null
                      val seed = plazaCoord(name)
                      val lat = seed?.get(1) ?: r["lat"]?.toDoubleOrNull() ?: 0.0
                      val lon = seed?.get(0) ?: r["lon"]?.toDoubleOrNull() ?: 0.0
                      if (lat == 0.0 || lon == 0.0) return@mapNotNull null
                      TollCheckpoint(name, ts, amt, lat, lon)
                  }.sortedBy { it.ts }

                  if (events.isEmpty()) return emptyList<TollTrip>() to 0.0

                  val legs = ArrayList<MutableList<TollCheckpoint>>()
                  var cur = ArrayList<TollCheckpoint>()
                  for (ev in events) {
                      if (cur.isEmpty()) { cur.add(ev); continue }
                      val prev = cur.last()
                      val gapMs = ev.ts - prev.ts
                      val samePlaza = ev.plaza.equals(prev.plaza, ignoreCase = true)
                      val sameDay = dayFmt.format(Date(ev.ts)) == dayFmt.format(Date(prev.ts))
                      val uturn = samePlaza
                      val longGap = gapMs > 6L * 60 * 60 * 1000
                      val newDay = !sameDay
                      if (uturn || longGap || newDay) { legs.add(cur); cur = ArrayList() }
                      cur.add(ev)
                  }
                  if (cur.isNotEmpty()) legs.add(cur)

                  val cache = ConcurrentHashMap<String, List<DoubleArray>>()
                  val trips = ArrayList<TollTrip>()
                  var total = 0.0
                  for ((i, leg) in legs.withIndex()) {
                      val direction = if (i % 2 == 0) "Going" else "Returning"
                      val waypoints = leg.map { doubleArrayOf(it.lon, it.lat) }
                      val key = waypoints.joinToString("|") { "${it[0]},${it[1]}" }
                      val route = cache.getOrPut(key) { fetchRoadRoute(waypoints) }
                      val legTotal = leg.sumOf { it.amount }
                      total += legTotal
                      val title = leg.joinToString(" → ") { it.plaza }
                      val day = dayFmt.format(Date(leg.first().ts))
                      trips.add(TollTrip(i + 1, direction, day, title, legTotal, leg.toList(), route))
                  }
                  return trips to total
              }
          }
          EOF_15

          cat > app/src/main/java/com/example/fintrack/PayeeOps.kt <<'EOF_16'
          package com.example.fintrack

          import android.content.ContentValues
          import android.content.Context

          object PayeeOps {
              fun merge(ctx: Context, keys: List<String>, survivorKey: String, survivorName: String) {
                  if (keys.size < 2) return
                  val db = Db.get(ctx); val w = db.writableDatabase
                  w.beginTransaction()
                  try {
                      val alt = ArrayList<String>()
                      for (k in keys) {
                          val upi = db.one("SELECT upi_id FROM payees WHERE merchant_key=?", k)
                          val existingAlt = db.one("SELECT alt_upis FROM payees WHERE merchant_key=?", k)
                          if (!upi.isNullOrBlank() && upi != survivorKey) alt.add(upi)
                          if (!existingAlt.isNullOrBlank()) alt.add(existingAlt)
                      }
                      val marks = keys.joinToString(",") { "?" }
                      val cv = ContentValues().apply { put("merchant_key", survivorKey); put("merchant", survivorName) }
                      w.update("txn", cv, "merchant_key IN ($marks)", keys.toTypedArray())
                      w.delete("merchant_rules", "merchant_key IN ($marks) AND merchant_key != ?", (keys + survivorKey).toTypedArray())
                      val survivorUpi = db.one("SELECT upi_id FROM payees WHERE merchant_key=?", survivorKey)
                      val allAlt = alt.distinct().joinToString(",")
                      w.execSQL("INSERT OR REPLACE INTO payees(merchant_key, display, upi_id, alt_upis) VALUES(?,?,?,?)",
                          arrayOf(survivorKey, survivorName, survivorUpi ?: "", allAlt))
                      w.delete("payees", "merchant_key IN ($marks) AND merchant_key != ?", (keys + survivorKey).toTypedArray())
                      w.execSQL("INSERT INTO payee_merges(survivor_key, merged_keys, survivor_name, merged_at, undone) VALUES(?,?,?,?,0)",
                          arrayOf(survivorKey, keys.joinToString("\u0001"), survivorName, System.currentTimeMillis()))
                      w.setTransactionSuccessful()
                  } finally { w.endTransaction() }
              }

              fun undoLastMerge(ctx: Context): Boolean {
                  val db = Db.get(ctx); val w = db.writableDatabase
                  val row = db.rows("SELECT id, survivor_key, merged_keys, survivor_name FROM payee_merges WHERE undone=0 ORDER BY id DESC LIMIT 1").firstOrNull() ?: return false
                  val mergeId = row["id"]?.toLongOrNull() ?: return false
                  val survivorKey = row["survivor_key"] ?: return false
                  val survivorName = row["survivor_name"] ?: survivorKey
                  val mergedKeys = (row["merged_keys"] ?: "").split("\u0001").filter { it.isNotBlank() }
                  w.beginTransaction()
                  try {
                      for (k in mergedKeys) {
                          w.execSQL("INSERT OR IGNORE INTO payees(merchant_key, display) VALUES(?,?)", arrayOf(k, k))
                          w.execSQL("UPDATE txn SET merchant_key=? WHERE merchant_key=? AND merchant=?", arrayOf(k, survivorKey, survivorName))
                      }
                      w.execSQL("UPDATE payee_merges SET undone=1 WHERE id=?", arrayOf(mergeId))
                      w.setTransactionSuccessful()
                  } finally { w.endTransaction() }
                  return true
              }

              fun reassignToPayee(ctx: Context, fromKeys: List<String>, newKey: String, newName: String) {
                  if (fromKeys.isEmpty()) return
                  val db = Db.get(ctx); val w = db.writableDatabase
                  w.beginTransaction()
                  try {
                      val marks = fromKeys.joinToString(",") { "?" }
                      val cv = ContentValues().apply { put("merchant_key", newKey); put("merchant", newName); put("status", "USER"); put("review", 0); putNull("review_hash") }
                      w.update("txn", cv, "merchant_key IN ($marks)", fromKeys.toTypedArray())
                      w.execSQL("INSERT OR IGNORE INTO payees(merchant_key, display) VALUES(?,?)", arrayOf(newKey, newName))
                      w.execSQL("UPDATE txn SET merchant=? WHERE merchant_key=?", arrayOf(newName, newKey))
                      w.setTransactionSuccessful()
                  } finally { w.endTransaction() }
              }

              fun applyGroupFix(ctx: Context, hash: String, merchant: String, category: String, debit: Boolean, newStatus: String = "USER") {
                  val db = Db.get(ctx); val w = db.writableDatabase; w.beginTransaction()
                  try {
                      val cv = ContentValues().apply { put("merchant", merchant); put("merchant_key", Learner.norm(merchant)); put("category", category); put("debit", if (debit) 1 else 0); put("status", newStatus); put("review", 0); putNull("review_hash") }
                      w.update("txn", cv, "review_hash=?", arrayOf(hash))
                      if (merchant.isNotBlank() && merchant != "Unknown") Learner.learnCategory(db, Learner.norm(merchant), merchant, category)
                      w.setTransactionSuccessful()
                  } finally { w.endTransaction() }
              }
              fun bulkSetCategory(ctx: Context, ids: List<Long>, category: String) {
                  if (ids.isEmpty()) return
                  val db = Db.get(ctx); val w = db.writableDatabase; w.beginTransaction()
                  try {
                      val marks = ids.joinToString(",") { "?" }
                      val cv = ContentValues().apply { put("category", category); put("review", 0); putNull("review_hash") }
                      w.update("txn", cv, "id IN ($marks)", ids.map { it.toString() }.toTypedArray())
                      w.setTransactionSuccessful()
                  } finally { w.endTransaction() }
              }
              fun bulkDelete(ctx: Context, ids: List<Long>) {
                  if (ids.isEmpty()) return
                  val db = Db.get(ctx); val w = db.writableDatabase; w.beginTransaction()
                  try {
                      val marks = ids.joinToString(",") { "?" }
                      w.delete("txn", "id IN ($marks)", ids.map { it.toString() }.toTypedArray())
                      w.delete("toll_trips", "txn_id IN ($marks)", ids.map { it.toString() }.toTypedArray())
                      w.setTransactionSuccessful()
                  } finally { w.endTransaction() }
              }

              data class DupGroup(
                  val key: String, val amount: Double, val debit: Boolean, val vpa: String,
                  val ts: Long, val ids: List<Long>, val sample: Txn
              )

              private fun isJunk(t: Txn): Boolean {
                  val m = t.merchant.trim().lowercase()
                  if (m == "unknown" || m.isEmpty()) return true
                  if (t.merchant.matches(Regex("[A-Z]{5,8}"))) return true
                  if (m == "atm withdrawal") return true
                  return false
              }

              private fun qualityScore(t: Txn): Double {
                  var s = 0.0
                  if (!isJunk(t)) s += 50.0
                  if (!t.vpa.isNullOrBlank()) s += 30.0
                  if (!t.ref.isNullOrBlank()) s += 15.0
                  if (t.balance != null) s += 10.0
                  s += Math.min(t.merchant.length / 5.0, 20.0)
                  return s
              }

              private fun dayKey(ts: Long): String {
                  val cal = java.util.Calendar.getInstance(); cal.timeInMillis = ts
                  return String.format(java.util.Locale.US, "%04d-%02d-%02d",
                      cal.get(java.util.Calendar.YEAR), cal.get(java.util.Calendar.MONTH) + 1, cal.get(java.util.Calendar.DAY_OF_MONTH))
              }

              private fun isMidnight(ts: Long): Boolean {
                  val cal = java.util.Calendar.getInstance(); cal.timeInMillis = ts
                  return cal.get(java.util.Calendar.HOUR_OF_DAY) == 0 && cal.get(java.util.Calendar.MINUTE) == 0
              }

              private fun isDuplicate(a: Txn, b: Txn): Boolean {
                  if (Math.abs(a.ts - b.ts) > 5 * 60_000L) return false
                  if (Math.abs(a.amount - b.amount) > 0.01) return false
                  if (a.debit != b.debit) return false
                  if (dayKey(a.ts) != dayKey(b.ts)) return false
                  val ma = a.merchant.trim().lowercase()
                  val mb = b.merchant.trim().lowercase()
                  val na = Learner.norm(a.merchant)
                  val nb = Learner.norm(b.merchant)
                  if (ma == "atm withdrawal" && mb == "atm withdrawal") return false
                  val aReal = ma.isNotEmpty() && ma != "unknown" && !a.merchant.matches(Regex("[A-Z]{5,8}"))
                  val bReal = mb.isNotEmpty() && mb != "unknown" && !b.merchant.matches(Regex("[A-Z]{5,8}"))
                  if (aReal && bReal && na != nb) return false
                  if (aReal && bReal && na == nb) return true
                  val va = a.vpa?.lowercase()
                  val vb = b.vpa?.lowercase()
                  if (!va.isNullOrBlank() && !vb.isNullOrBlank() && va != vb) return false
                  if (!va.isNullOrBlank() && vb.isNullOrBlank() && !aReal) return false
                  if (va.isNullOrBlank() && !vb.isNullOrBlank() && !bReal) return false
                  return true
              }

              fun smartDeleteIds(list: List<Txn>): List<Long> {
                  if (list.size < 2) return emptyList()
                  val real = list.filter { !isJunk(it) }
                  val realNames = real.map { Learner.norm(it.merchant) }.distinct()
                  if (real.size >= 2 && realNames.size > 1) return emptyList()
                  val sorted = list.sortedByDescending { qualityScore(it) }
                  return sorted.drop(1).map { it.id }
              }

              fun smartMidnightDeleteIds(txns: List<Txn>): Set<Long> {
                  val toDelete = HashSet<Long>()
                  val buckets = LinkedHashMap<String, MutableList<Txn>>()
                  for (t in txns) {
                      val key = dayKey(t.ts) + "|" + String.format(java.util.Locale.US, "%.2f", t.amount) + "|" + (if (t.debit) "D" else "C")
                      buckets.getOrPut(key) { ArrayList() }.add(t)
                  }
                  for ((_, list) in buckets) {
                      if (list.size < 2) continue
                      val midnight = list.filter { isMidnight(it.ts) }
                      val timed = list.filter { !isMidnight(it.ts) }
                      if (midnight.isNotEmpty() && timed.isNotEmpty()) {
                          for (m in midnight) toDelete.add(m.id)
                      }
                  }
                  return toDelete
              }

              fun findDuplicates(ctx: Context): List<DupGroup> {
                  val db = Db.get(ctx)
                  val rows = db.queryTxns("1=1", emptyArray(), 5000).sortedBy { it.ts }
                  val used = HashSet<Long>()
                  val out = ArrayList<DupGroup>()
                  for (i in rows.indices) {
                      val a = rows[i]
                      if (a.id in used) continue
                      val group = arrayListOf(a)
                      for (j in i + 1 until rows.size) {
                          val b = rows[j]
                          if (b.id in used) continue
                          if (isDuplicate(a, b)) group.add(b)
                      }
                      if (group.size >= 2) {
                          group.forEach { used.add(it.id) }
                          val first = group.first()
                          val key = String.format(java.util.Locale.US, "%.2f|%s|%d", first.amount, if (first.debit) "D" else "C", first.ts / 60_000)
                          out.add(DupGroup(key, first.amount, first.debit, first.vpa ?: "", first.ts, group.map { it.id }, first))
                      } else used.add(a.id)
                  }
                  return out
              }

              data class DupRow(val txn: Txn, val groupKey: String, val defaultDelete: Boolean)
              fun flattenDuplicates(ctx: Context): List<DupRow> {
                  val groups = findDuplicates(ctx)
                  val out = ArrayList<DupRow>()
                  for (g in groups) {
                      val txns = g.ids.mapNotNull { id -> Db.get(ctx).queryTxns("id=?", arrayOf(id.toString()), 1).firstOrNull() }
                      val deleteSet = smartDeleteIds(txns).toSet()
                      for (t in txns) out.add(DupRow(t, g.key, deleteSet.contains(t.id)))
                  }
                  return out
              }
          }

          import java.util.Locale
          object Backup {
              val CANONICAL = listOf("Bank","Account_No","Txn_Date","Description","Ref_No","Withdrawal","Deposit","Category","UPI_ID")
              private val tables = listOf("txn","payees","net_items","senders","merchant_rules","parse_patterns","nb_words","toll_trips","toll_plazas","loans","payee_merges","accounts","bills","budgets","categories","tags","txn_tags","payee_merge_rules")
              private val dateFmt = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US)
              private fun q(s: String): String = "\"" + s.replace("\r"," ").replace("\n"," ").replace("\"","\"\"") + "\""
              fun export(ctx: Context): String {
                  val db = Db.get(ctx).readableDatabase; val sb = StringBuilder()
                  sb.append("## CANONICAL").append('\n').append(CANONICAL.joinToString(",")).append('\n')
                  db.rawQuery("SELECT institution, account, ts, body, ref, debit, amount, category, vpa FROM txn ORDER BY ts ASC", null).use { c -> while (c.moveToNext()) { val bank = if (c.isNull(0)) "" else c.getString(0); val acct = if (c.isNull(1)) "" else c.getString(1); val ts = c.getLong(2); val desc = if (c.isNull(3)) "" else c.getString(3); val ref = if (c.isNull(4)) "" else c.getString(4); val debit = c.getInt(5) == 1; val amt = c.getDouble(6); val cat = if (c.isNull(7)) "" else c.getString(7); val upi = if (c.isNull(8)) "" else c.getString(8); sb.append(listOf(q(bank), q(acct), q(dateFmt.format(Date(ts))), q(desc), q(ref), q(if (debit) String.format(Locale.US, "%.2f", amt) else ""), q(if (!debit) String.format(Locale.US, "%.2f", amt) else ""), q(cat), q(upi)).joinToString(",")).append('\n') } }
                  for (t in tables) { val cols = ArrayList<String>(); try { db.rawQuery("PRAGMA table_info($t)", null).use { c -> while (c.moveToNext()) cols.add(c.getString(1)) } } catch (_: Exception) { continue }; if (cols.isEmpty()) continue; sb.append("## ").append(t).append('\n').append(cols.joinToString(",")).append('\n'); db.rawQuery("SELECT * FROM $t", null).use { c -> while (c.moveToNext()) { val parts = ArrayList<String>(); for (i in 0 until c.columnCount) parts.add(if (c.isNull(i)) "" else q(c.getString(i))); sb.append(parts.joinToString(",")).append('\n') } } }
                  return sb.toString()
              }
              private fun parseLine(line: String): List<String?> {
                  val out = ArrayList<String?>(); val sb = StringBuilder(); var inQ = false; var quoted = false; var i = 0
                  while (i < line.length) { val ch = line[i]; if (inQ) { if (ch == '"') { if (i + 1 < line.length && line[i + 1] == '"') { sb.append('"'); i++ } else inQ = false } else sb.append(ch) } else if (ch == '"') { inQ = true; quoted = true } else if (ch == ',') { out.add(if (!quoted && sb.isEmpty()) null else sb.toString()); sb.setLength(0); quoted = false } else sb.append(ch); i++ }
                  out.add(if (!quoted && sb.isEmpty()) null else sb.toString()); return out
              }
              fun restore(ctx: Context, text: String): Int {
                  val db = Db.get(ctx).writableDatabase
                  var n = 0
                  var table: String? = null
                  var cols: List<String>? = null
                  val notNull: Map<String, Set<String>> = mapOf("txn" to setOf("ts", "amount", "debit"), "payees" to setOf("merchant_key"))
                  db.beginTransaction()
                  try {
                      for (line in text.lines()) {
                          if (line.isBlank()) continue
                          if (line.startsWith("## ")) { table = line.substring(3).trim(); cols = null; continue }
                          val tb = table ?: continue
                          if (tb == "CANONICAL") continue
                          if (tb !in tables) continue
                          val cells = parseLine(line)
                          val cs = cols
                          if (cs == null) { val hdr = cells.map { it ?: "" }.toMutableList(); if (tb == "txn" && "msg_no" !in hdr) hdr.add(1, "msg_no"); cols = hdr; continue }
                          val nn = notNull[tb] ?: emptySet<String>()
                          var bad = false
                          for (i in cs.indices) { val col = cs[i]; val v = cells.getOrNull(i); if (col in nn && (v == null || v.isBlank())) { bad = true; break } }
                          if (bad) continue
                          val cv = ContentValues()
                          for (i in cs.indices) { val col = cs[i]; val v = cells.getOrNull(i); if (v == null) cv.putNull(col) else cv.put(col, v) }
                          try { val rowId = db.insertWithOnConflict(tb, null, cv, SQLiteDatabase.CONFLICT_REPLACE); if (rowId >= 0) n++ } catch (_: Exception) {}
                      }
                      db.setTransactionSuccessful()
                  } finally { db.endTransaction() }
                  return n

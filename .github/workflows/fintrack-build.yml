              fun decodePolyline(encoded: String): List<DoubleArray> { val points = ArrayList<DoubleArray>(); var index = 0; val len = encoded.length; var lat = 0; var lng = 0; while (index < len) { var b: Int; var shift = 0; var result = 0; do { b = encoded[index++].code - 63; result = result or ((b and 0x1f) shl shift); shift += 5 } while (b >= 0x20); val dlat = if (result and 1 != 0) (result shr 1).inv() else (result shr 1); lat += dlat; shift = 0; result = 0; do { b = encoded[index++].code - 63; result = result or ((b and 0x1f) shl shift); shift += 5 } while (b >= 0x20); val dlng = if (result and 1 != 0) (result shr 1).inv() else (result shr 1); lng += dlng; points.add(doubleArrayOf(lat * 1e-5, lng * 1e-5)) }; return points }
              fun buildTrips(ctx: Context): Pair<List<TollTrip>, Double> { try { val prefs = ctx.getSharedPreferences("fin", Context.MODE_PRIVATE); val cached = prefs.getBoolean("map_cached", false); val rows = Db.get(ctx).rows("SELECT txn_id, plaza, lat, lon, ts, amount FROM toll_trips ORDER BY ts ASC"); val events = rows.mapNotNull { r -> val name = r["plaza"] ?: return@mapNotNull null; val ts = r["ts"]?.toLongOrNull() ?: return@mapNotNull null; val amt = r["amount"]?.toDoubleOrNull() ?: return@mapNotNull null; val seed = plazaCoord(name); val lat = seed?.get(1) ?: r["lat"]?.toDoubleOrNull() ?: 0.0; val lon = seed?.get(0) ?: r["lon"]?.toDoubleOrNull() ?: 0.0; if (lat == 0.0 || lon == 0.0) return@mapNotNull null; TollCheckpoint(name, ts, amt, lat, lon, r["txn_id"]?.toLongOrNull() ?: 0) }.sortedBy { it.ts }; if (events.isEmpty()) return emptyList<TollTrip>() to 0.0; val legs = ArrayList<MutableList<TollCheckpoint>>(); var cur = ArrayList<TollCheckpoint>(); for (ev in events) { if (cur.isEmpty()) { cur.add(ev); continue }; val prev = cur.last(); val gapMs = ev.ts - prev.ts; val samePlaza = ev.plaza.equals(prev.plaza, ignoreCase = true); val sameDay = dayFmt.format(Date(ev.ts)) == dayFmt.format(Date(prev.ts)); if (samePlaza || gapMs > 6L * 60 * 60 * 1000 || !sameDay) { legs.add(cur); cur = ArrayList() }; cur.add(ev) }; if (cur.isNotEmpty()) legs.add(cur); val cache = ConcurrentHashMap<String, List<DoubleArray>>(); val trips = ArrayList<TollTrip>(); var total = 0.0; for ((i, leg) in legs.withIndex()) { val direction = if (i % 2 == 0) "Going" else "Returning"; val wps = leg.map { doubleArrayOf(it.lon, it.lat) }; val key = wps.joinToString("|") { "${it[0]},${it[1]}" }; val route = if (cached) wps.map { doubleArrayOf(it[1], it[0]) } else cache.getOrPut(key) { fetchRoadRoute(wps) }; val legTotal = leg.sumOf { it.amount }; total += legTotal; val title = leg.joinToString(" → ") { it.plaza }; trips.add(TollTrip(i + 1, direction, dayFmt.format(Date(leg.first().ts)), title, leg
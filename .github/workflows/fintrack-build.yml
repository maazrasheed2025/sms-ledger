          object Skeleton {
              private val vocab = setOf("sent","debited","credited","spent","paid","received","to","from","at","by","on","for","via","upi","vpa","ref","a/c","ac","acct","account","card","bank","avl","bal","balance","txn","neft","imps","rtgs","atm","fastag","toll","plaza","wallet","info","trf","transfer","withdrawn","purchase","deposited","refund","towards","using","with","not","you","if","call","dear","customer","your","is","has","been","of","in","no","deducted","charged","vehicle","linked","emi","outstanding","lan")
              private val splitRe = Regex("""[^a-z/]+""")

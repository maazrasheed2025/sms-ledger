                      runOnUiThread {
                          if (preview.header.isEmpty()) { toast("CSV khali ya invalid hai"); return@runOnUiThread }
                          val mapping = CsvMap.guess(preview.header)
                          val canonical = listOf("Bank","Account_No","Txn_Date","Description","Ref_No","Withdrawal","Deposit")
                          val labels = canonical.map { f -> val idx = mapping[f]; val col = if (idx != null) " → " + preview.header.getOrNull(idx) else " → (skip)"; f + col }

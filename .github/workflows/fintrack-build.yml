          package com.example.fintrack

          import android.content.Context

          object Learner {
              fun norm(s: String): String = s.lowercase().replace(Regex("""[^a-z0-9@. ]"""), " ").replace(Regex("""\s+"""), " ").trim()
              fun category(db: Db, key: String): String? {

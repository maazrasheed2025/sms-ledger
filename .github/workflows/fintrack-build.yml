                  ad.show()
              }
              private fun edit(t: Txn) {
                  act.showForm(Str.s("edit"), listOf(Field(Str.s("kisko"), t.merchant), Field("Amount", t.amount.toString(), true), Field(Str.s("type"), if (t.debit) Str.s("spent") else Str.s("received"), options = listOf(Str.s("spent"), Str.s("received"))), Field(Str.s("category"), t.category, options = Categories.ALL(act)))) { v ->
                      val n = t.copy(merchant = v[0].ifBlank { t.merchant }, amount = v[1].toDoubleOrNull() ?: t.amount, debit = v[2] == Str.s("spent"), category = v[3], status = "USER", review = false)
                      val db = Db.get(act); db.updateTxn(n); Repo.ensurePayee(act, n); act.refreshAll()
                  }
              }
              fun addCash() {
                  act.showForm(Str.s("cash_entry"), listOf(Field("Amount", "", true), Field(Str.s("type"), Str.s("spent"), options = listOf(Str.s("spent"), Str.s("received"))), Field(Str.s("kisko"), ""), Field(Str.s("category"), "Cash", options = Categories.ALL(act)))) { v ->
                      val a = v[0].toDoubleOrNull(); if (a == null || a <= 0) { act.toast(Str.s("amount_bad")); return@showForm }
                      val t = Txn(ts = System.currentTimeMillis(), amount = a, debit = v[1] == Str.s("spent"), merchant = v[2].ifBlank { "Cash" }, category = v[3], institution = "Cash", channel = "CASH", source = "CASH", status = "USER")
                      Repo.save(act, t); act.refreshAll()
                  }
              }
          }

          }

          class RouteMapView @JvmOverloads constructor(ctx: android.content.Context, attrs: android.util.AttributeSet? = null) : MapView(ctx, attrs) {
              class Pt(val lat: Double, val lon: Double, val label: String, val ts: Long)
              class Trip(val dir: String, val pts: List<Pt>, val road: List<DoubleArray>)
              init { setTileSource(OSM); setMultiTouchControls(true); controller.setZoom(5.0); controller.setCenter(GeoPoint(22.0, 79.0)) }
              fun setTrips(trips: List<Trip>) {
                  overlays.clear(); val all = ArrayList<GeoPoint>()
                  for (tr in trips) {
                      val c = if (tr.dir == "Going") Color.parseColor("#673AB7") else Color.parseColor("#FF4081")
                      if (tr.road.size >= 2) { val l = Polyline(); l.setPoints(tr.road.map { GeoPoint(it[0], it[1]) }); l.outlinePaint.color = c; l.outlinePaint.strokeWidth = if (tr.dir == "Going") 12f else 8f; overlays.add(l) }
                      for (p in tr.pts) { all.add(GeoPoint(p.lat, p.lon)); val m = Marker(this); m.position = GeoPoint(p.lat, p.lon); m.title = "${if (tr.dir == "Going") "🟢" else "🔴"} ${p.label}"; m.snippet = SimpleDateFormat("HH:mm", Locale.US).format(Date(p.ts)); m.setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM); overlays.add(m) }
                  }
                  if (all.isNotEmpty()) try { zoomToBoundingBox(BoundingBox.fromGeoPoints(all), true, 80) } catch (_: Exception) {}
                  invalidate()
              }
          }

          class TravelScreen(act: MainActivity) : Screen(act) {
              private var tab = 0; private var selDay: String? = null; private var trips: List<TollTrip> = emptyList(); private var total = 0.0
              private val summary = act.tv("", 13f, C.MUTED).apply { setPadding(act.dp(14), act.dp(8), act.dp(14), act.dp(2)) }
              private val tabsBar = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL; setPadding(act.dp(8), act.dp(4), act.dp(8), act.dp(4)) }
              private val chips = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL; setPadding(act.dp(8), 0, act.dp(8), 0) }
              private val map = RouteMapView(act); private val mapWrap = act.vbox(0)
              private val detail = act.vbox(10); private val tollList = act.vbox(8)
              private val mapScroll = ScrollView(act).apply { addView(detail) }
              private val tollScroll = ScrollView(act).apply { addView(tollList) }
              override val root: View = act.vbox().apply {
                  put(summary, 0); put(tabsBar, 2); put(HorizontalScrollView(act).apply { isHorizontalScrollBarEnabled = false; addView(chips) }, 2)
                  mapWrap.addView(map, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, act.dp(340)))
                  put(mapWrap, 4); put(mapScroll, 4, 1f); put(tollScroll, 4, 1f); tollScroll.visibility = View.GONE
              }
              override fun refresh() { Thread { val (b, t) = Tolls.buildTrips(act); act.runOnUiThread { trips = b; total = t; render() } }.start() }
              private fun render() {
                  tabsBar.removeAllViews(); tabsBar.addView(act.pill(Str.s("map"), tab == 0) { tab = 0; render() }); tabsBar.addView(act.pill(Str.s("tolls"), tab == 1) { tab = 1; render() })
                  summary.text = "${trips.size} trips • Total ${inr(total)}"
                  chips.removeAllViews(); chips.addView(act.pill(Str.s("all"), selDay == null) { selDay = null; render() })
                  for (d in trips.map { it.dayKey }.distinct().reversed().take(30)) chips.addView(act.pill(d, selDay == d) { selDay = d; render() })
                  val v = if (selDay == null) trips else trips.filter { it.dayKey == selDay }
                  if (tab == 0) {
                      mapWrap.visibility = View.VISIBLE; mapScroll.visibility = View.VISIBLE; tollScroll.visibility = View.GONE
                      map.setTrips(v.map { t -> RouteMapView.Trip(t.direction, t.checkpoints.map { RouteMapView.Pt(it.lat, it.lon, it.plaza, it.ts) }, t.roadPolyline) })
                      detail.removeAllViews()
                      if (v.isEmpty()) detail.addView(act.tv(Str.s("no_trips"), 12f, C.MUTED))
                      for (t in v) { val c = act.card(); val h = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }; h.put(act.tv(t.dayKey, 14f, C.TEXT, true), 0, 1f); h.put(act.tv(t.direction, 11f, if (t.direction == "Going") C.ACCENT else C.RED, true), 0); c.addView(h); c.addView(act.tv("📍 ${t.title}", 12f, C.MUTED)); c.addView(act.tv("Total: ${inr(t.total, true)}", 14f, C.TEXT, true)); detail.put(c, 10) }
                  } else {
                      mapWrap.visibility = View.GONE; mapScroll.visibility = View.GONE; tollScroll.visibility = View.VISIBLE
                      tollList.removeAllViews()
                      val cps = v.flatMap { t -> t.checkpoints.map { cp -> t.direction to cp } }.sortedByDescending { it.second.ts }
                      if (cps.isEmpty()) tollList.addView(act.tv(Str.s("no_tolls"), 12f, C.MUTED))
                      for ((d, cp) in cps) { val r = act.card(); r.addView(act.tv("📍 ${cp.plaza}", 14f, C.TEXT, true)); r.addView(act.tv("${fmtDateTime(cp.ts)} • ${inr(cp.amount, true)} • $d", 12f, C.MUTED)); tollList.put(r, 6) }

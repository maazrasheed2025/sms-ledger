                  if (Math.abs(a.amount - b.amount) > 0.01) return false
                  if (a.debit != b.debit) return false
                  if (dayKey(a.ts) != dayKey(b.ts)) return false
                  val ma = a.merchant.trim().lowercase(); val mb = b.merchant.trim().lowercase()
                  val na = Learner.norm(a.merchant); val nb = Learner.norm(b.merchant)

              fun cleanAll(ctx: Context) { val db = Db.get(ctx).writableDatabase; db.beginTransaction(); try { for (t in tables) runCatching { db.delete(t, null, null) }; runCatching { db.delete("txn_skipped", null, null) }; db.setTransactionSuccessful() } finally { db.endTransaction() } }
              fun exportRulesJson(ctx: Context): String {
                  val db = Db.get(ctx); val sb = StringBuilder(); sb.append("{\n")
                  sb.append("  \"merchant_rules\": "); val mr = ArrayList<String>()
                  for (r in db.rows("SELECT merchant_key, display, category, weight FROM merchant_rules")) { val k = r["merchant_key"] ?: continue; val d = r["display"] ?: ""; val c = r["category"] ?: ""; val w = r["weight"] ?: "1"; mr.add("{\"key\":\"" + k.replace("\"","\\\"") + "\",\"display\":\"" + d.replace("\"","\\\"") + "\",\"category\":\"" + c.replace("\"","\\\"") + "\",\"weight\":" + w + "}") }
                  sb.append("[").append(mr.joinToString(",")).append("],\n")
                  sb.append("  \"payee_merge_rules\": "); val pm = ArrayList<String>()
                  for (r in db.rows("SELECT survivor_key, merged_keys, survivor_name FROM payee_merge_rules")) { val s = r["survivor_key"] ?: continue; val m = r["merged_keys"] ?: ""; val n = r["survivor_name"] ?: ""; pm.add("{\"survivor_key\":\"" + s.replace("\"","\\\"") + "\",\"merged_keys\":\"" + m.replace("\"","\\\"") + "\",\"survivor_name\":\"" + n.replace("\"","\\\"") + "\"}") }
                  sb.append("[").append(pm.joinToString(",")).append("]\n}\n"); return sb.toString()
              }
              fun importRulesJson(ctx: Context, text: String): Int {
                  var n = 0
                  try { val root = org.json.JSONObject(text); val mr = root.optJSONArray("merchant_rules"); if (mr != null) for (i in 0 until mr.length()) { val o = mr.getJSONObject(i); Db.get(ctx).exec("INSERT OR REPLACE INTO merchant_rules(merchant_key, display, category, weight) VALUES(?,?,?,?)", o.optString("key"), o.optString("display"), o.optString("category"), o.optDouble("weight", 1.0)); n++ }; val pm = root.optJSONArray("payee_merge_rules"); if (pm != null) for (i in 0 until pm.length()) { val o = pm.getJSONObject(i); Db.get(ctx).exec("INSERT OR REPLACE INTO payee_merge_rules(survivor_key, merged_keys, survivor_name) VALUES(?,?,?)", o.optString("survivor_key"), o.optString("merged_keys"), o.optString("survivor_name")); n++ } } catch (_: Exception) {}
                  return n
              }
          }

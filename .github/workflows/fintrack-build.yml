                              amount = if (parsed.isNull("amount")) null else parsed.optDouble("amount"),
                              debit = if (parsed.isNull("debit")) null else parsed.optBoolean("debit"),
                              merchant = if (parsed.isNull("merchant")) null else parsed.optString("merchant"),
                              balance = if (parsed.isNull("balance")) null else parsed.optDouble("balance"),
                              account = if (parsed.isNull("account_ending")) null else parsed.optString("account_ending"),
                              channel = parsed.optString("account_type", "OTHER")
                          )
                      } else null
                  } catch (e: Exception) { null }
              }
          }

                  val lines = text.lines().drop(skip).filter { it.isNotBlank() }
                  if (lines.isEmpty()) return ParseResult(emptyList(), emptyList())
                  return ParseResult(splitCsv(lines.first()), lines.drop(1).map { splitCsv(it) })
              }
              fun preview(ctx: Context, uri: Uri): ParseResult {
                  val text = ctx.contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: return ParseResult(emptyList(), emptyList())
                  return parse(text)
              }
              private val dateFormats = listOf("yyyy-MM-dd HH:mm:ss","yyyy-MM-dd","dd/MM/yyyy","dd-MM-yyyy","dd MMM yyyy")

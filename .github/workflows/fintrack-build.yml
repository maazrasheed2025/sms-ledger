          }

          object Heuristic {
              private val stop = setOf("rs","inr","upi","imps","neft","rtgs","bank","ltd","not","you","call","avl","bal","balance","ref","dear","customer","your","sent","debited","credited","spent","paid","received","withdrawn","card","info","vpa","txn","transaction","account","acct","payment","amount","on","from","to","at","the","if","is","has","been","with","for","by","of","a/c","no","msg","jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec","fastag","toll","plaza","wallet","thank","thanks","please","dial","visit","ac","atm","pos","using","via","total")
              private val ctxWords = setOf("to","at","from","by","for","towards","paid","info","trf","against")
              private val tokRe = Regex("""[A-Za-z][A-Za-z0-9&.'\-]*""")
              private class Tok(val v: String, val s: Int, val e: Int)
              fun merchant(body: String, institution: String): String? {
                  val inst = institution.lowercase().split(Regex("[^a-z]+")).toSet()
                  val toks = tokRe.findAll(body).map { Tok(it.value, it.range.first, it.range.last + 1) }.toList()
                  var best: String? = null; var bestScore = 0; var i = 0
                  while (i < toks.size) {
                      val t = toks[i]; val low = t.v.lowercase().trimEnd('.')
                      if (t.v[0].isUpperCase() && low !in stop && low !in inst) {
                          var j = i
                          while (j + 1 < toks.size && j - i < 3) {
                              val n = toks[j + 1]; val nl = n.v.lowercase().trimEnd('.')
                              if (body.substring(toks[j].e, n.s) == " " && n.v[0].isUpperCase() && nl !in stop && nl !in inst) j++ else break
                          }

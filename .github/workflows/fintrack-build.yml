          package com.example.fintrack

          object SenderMap {
              private fun b(n: String) = n to "BANK"
              private fun w(n: String) = n to "WALLET"

              private val known: Map<String, Pair<String, String>> = mapOf(
                  "HDFCBK" to b("HDFC Bank"), "HDFCBN" to b("HDFC Bank"), "HDFCCC" to ("HDFC Credit Card" to "CARD"),
                  "SBIINB" to b("State Bank of India"), "SBIPSG" to b("State Bank of India"), "SBIUPI" to b("State Bank of India"),
                  "SBICRD" to ("SBI Card" to "CARD"), "SBMSMS" to b("State Bank of India"), "ATMSBI" to b("State Bank of India"),
                  "ICICIB" to b("ICICI Bank"), "ICICIT" to b("ICICI Bank"), "ICIBNK" to b("ICICI Bank"),
                  "AXISBK" to b("Axis Bank"), "AXISBN" to b("Axis Bank"),
                  "KOTAKB" to b("Kotak Mahindra Bank"), "KMBANK" to b("Kotak Mahindra Bank"),
                  "IDFCFB" to b("IDFC FIRST Bank"), "IDFCBK" to b("IDFC FIRST Bank"),
                  "YESBNK" to b("Yes Bank"), "YESBKS" to b("Yes Bank"),
                  "PNBSMS" to b("Punjab National Bank"), "PNBBNK" to b("Punjab National Bank"),
                  "BOIIND" to b("Bank of India"), "BOBSMS" to b("Bank of Baroda"), "BOBTXN" to b("Bank of Baroda"),
                  "CANBNK" to b("Canara Bank"), "UNIONB" to b("Union Bank of India"), "UBINBK" to b("Union Bank of India"),
                  "INDBNK" to b("Indian Bank"), "INDUSB" to b("IndusInd Bank"), "IDBIBK" to b("IDBI Bank"),
                  "FEDBNK" to b("Federal Bank"), "RBLBNK" to b("RBL Bank"), "AUBANK" to b("AU Small Finance Bank"),
                  "CENTBK" to b("Central Bank of India"), "UCOBNK" to b("UCO Bank"), "PSBANK" to b("Punjab & Sind Bank"),
                  "PAYTMB" to w("Paytm Payments Bank"), "PAYTM" to w("Paytm"),
                  "AIRBNK" to w("Airtel Payments Bank"), "AIRTEL" to ("Airtel (Payments Bank / Telecom)" to "TELECOM"),
                  "JIOPAY" to w("Jio Payments Bank"), "PHONPE" to w("PhonePe"), "PHONEPE" to w("PhonePe"),
                  "AMAZON" to w("Amazon Pay"), "AMZNPY" to w("Amazon Pay"), "GPAY" to w("Google Pay"),
                  "FASTAG" to ("FASTag" to "FASTAG"), "NETCFT" to ("FASTag (NETC)" to "FASTAG"), "IHMCLT" to ("IHMCL FASTag" to "FASTAG")
              )

              private val fuzzy: List<Pair<String, Pair<String, String>>> = listOf(
                  "HDFC" to b("HDFC Bank"), "SBI" to b("State Bank of India"), "ICICI" to b("ICICI Bank"),
                  "AXIS" to b("Axis Bank"), "KOTAK" to b("Kotak Mahindra Bank"), "PAYTM" to w("Paytm"),
                  "PHONE" to w("PhonePe"), "FASTAG" to ("FASTag" to "FASTAG"), "NETC" to ("FASTag (NETC)" to "FASTAG")
              )

              /** "VM-HDFCBK-S" -> "HDFCBK" (operator prefix and category suffix removed) */
              fun core(header: String): String {
                  var p = header.uppercase().trim().split("-").filter { it.isNotEmpty() }
                  if (p.size >= 2 && p[0].length == 2) p = p.drop(1)
                  if (p.size >= 2 && p.last().length == 1) p = p.dropLast(1)
                  return p.joinToString("-")
              }

              /** institution + kind. User-defined names (senders table) win, then the built-in map, then fuzzy, then Unknown. */
              fun identify(db: Db, header: String): Pair<String, String> {
                  val c = core(header)
                  val user = db.rows("SELECT institution, kind FROM senders WHERE core=?", c).firstOrNull()
                  if (user != null) return (user["institution"] ?: c) to (user["kind"] ?: "UNKNOWN")
                  known[c]?.let { return it }
                  for ((k, v) in fuzzy) if (c.contains(k)) return v
                  return ("Unknown ($c)") to "UNKNOWN"
              }
          }

          package com.example.fintrack
          import android.content.Context
          object Learner {
              fun norm(s: String): String = s.lowercase().replace(Regex("""[^a-z0-9@. ]"""), " ").replace(Regex("""\s+"""), " ").trim()
              fun category(db: Db, key: String): String? { if (key.isBlank()) return null; val exact = db.rows("SELECT category FROM merchant_rules WHERE merchant_key=?", key).firstOrNull()?.get("category"); if (exact != null) return exact; var best: String? = null; var bw = 0.0; for (r in db.rows("SELECT merchant_key, category, weight FROM merchant_rules WHERE length(merchant_key) >= 5")) { val k = r["merchant_key"] ?: continue; if (key.contains(k) || k.contains(key)) { val w = r["weight"]?.toDoubleOrNull() ?: 1.0; if (w > bw) { bw = w; best = r["category"] } } }; return best }
              fun learnCategory(db: Db, key: String, display: String, cat: String) { if (key.isBlank()) return; val old = db.rows("SELECT category FROM merchant_rules WHERE merchant_key=?", key).firstOrNull(); if (old == null) db.exec("INSERT INTO merchant_rules(merchant_key, display, category, weight) VALUES(?,?,?,?)", key, display, cat, 2.0) else if (old["category"] == cat) db.exec("UPDATE merchant_rules SET weight = weight + 1 WHERE merchant_key=?", key) else db.exec("UPDATE merchant_rules SET category=?, weight=2 WHERE merchant_key=?", cat, key); db.exec("UPDATE txn SET category=? WHERE merchant_key=?", cat, key) }
              fun learnMerge(db: Db, survivorKey: String, mergedKeys: List<String>, survivorName: String) { if (survivorKey.isBlank() || mergedKeys.isEmpty()) return; db.exec("INSERT OR REPLACE INTO payee_merge_rules(survivor_key, merged_keys, survivor_name) VALUES(?,?,?)", survivorKey, mergedKeys.joinToString(","), survivorName) }
              fun resolveMerge(db: Db, key: String): Pair<String, String>? { if (key.isBlank()) return null; for (r in db.rows("SELECT survivor_key, merged_keys, survivor_name FROM payee_merge_rules")) { val merged = (r["merged_keys"] ?: "").split(","); if (key in merged) { val sk = r["survivor_key"] ?: return null; val sn = r["survivor_name"] ?: sk; return sk to sn } }; return null }
          }

          package com.example.fintrack

          import android.content.Context
          import android.net.Uri
          import java.text.SimpleDateFormat
          import java.util.Locale

          object CsvMap {
              val synonyms: Map<String, List<String>> = mapOf(
                  "Bank" to listOf("bank", "bank_name", "bankname"),
                  "Account_No" to listOf("account", "account_no", "accountno", "ac", "ac_no", "acc", "acc_no", "account_number"),
                  "Txn_Date" to listOf("txn_date", "date", "txn date", "transaction date", "value date", "posting date"),
                  "Description" to listOf("description", "narration", "particulars", "remarks", "details", "transaction remarks"),
                  "Ref_No" to listOf("ref", "refno", "ref_no", "ref no", "reference", "utr", "rrn", "cheque", "chq", "cheque_no"),
                  "Withdrawal" to listOf("withdrawal", "withdrawals", "debit", "dr", "debit amount", "amount debited"),
                  "Deposit" to listOf("deposit", "deposits", "credit", "cr", "credit amount", "amount credited")
              )

              fun normalizeHeader(h: String): String =
                  h.trim().lowercase().replace(Regex("""[_\-/.]"""), " ").replace(Regex("""\s+"""), " ").trim()

              fun guess(cols: List<String>): Map<String, Int> {
                  val normCols = cols.map { normalizeHeader(it) }
                  val map = LinkedHashMap<String, Int>()
                  for ((field, syns) in synonyms) {
                      for (i in normCols.indices) {
                          if (map[field] == null && normCols[i] in syns.map { normalizeHeader(it) }) {
                              map[field] = i; break
                          }
                      }
                      if (map[field] == null) {
                          for (i in normCols.indices) {
                              val c = normCols[i]
                              if (syns.any { c.contains(normalizeHeader(it)) }) { map[field] = i; break }
                          }
                      }
                  }
                  return map
              }
          }

          object CsvImporter {
              data class ParseResult(val header: List<String>, val rows: List<List<String>>)

              fun splitCsv(line: String): List<String> {
                  val out = ArrayList<String>()
                  val sb = StringBuilder()
                  var inQ = false
                  var i = 0
                  while (i < line.length) {
                      val ch = line[i]
                      if (inQ) {
                          if (ch == '"') {
                              if (i + 1 < line.length && line[i + 1] == '"') { sb.append('"'); i++ } else inQ = false
                          } else sb.append(ch)
                      } else if (ch == '"') {
                          inQ = true
                      } else if (ch == ',') {
                          out.add(sb.toString()); sb.setLength(0)
                      } else sb.append(ch)
                      i++
                  }
                  out.add(sb.toString())
                  return out
              }

              fun parse(text: String, skipLines: Int = 0): ParseResult {
                  val lines = text.lines().drop(skipLines).filter { it.isNotBlank() }
                  if (lines.isEmpty()) return ParseResult(emptyList(), emptyList())
                  val header = splitCsv(lines.first())
                  val rows = lines.drop(1).map { splitCsv(it) }
                  return ParseResult(header, rows)
              }

              fun preview(ctx: Context, uri: Uri): ParseResult {
                  val text = ctx.contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: return ParseResult(emptyList(), emptyList())
                  return parse(text)
              }

              private val dateFormats = listOf(
                  "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd", "dd/MM/yyyy", "dd-MM-yyyy",
                  "dd/MM/yy", "dd-MM-yy", "MM/dd/yyyy", "dd MMM yyyy", "dd MMM, yyyy",
                  "yyyy/MM/dd", "dd.MM.yyyy"
              )

              fun parseDate(s: String): Long? {
                  val t = s.trim()
                  for (f in dateFormats) {
                      try {
                          val fmt = SimpleDateFormat(f, Locale.US)
                          fmt.isLenient = false
                          return fmt.parse(t)?.time
                      } catch (_: Exception) {}
                  }
                  return null
              }

              fun import(ctx: Context, uri: Uri, mapping: Map<String, Int>, skipLines: Int): Triple<Int, Int, Int> {
                  val text = ctx.contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: return Triple(0, 0, 0)
                  val pr = parse(text, skipLines)
                  if (pr.header.isEmpty()) return Triple(0, 0, 0)
                  val db = Db.get(ctx)
                  var imported = 0
                  var dup = 0
                  var failed = 0
                  val w = db.writableDatabase
                  fun cell(row: List<String>, field: String): String {
                      val idx = mapping[field] ?: return ""
                      return row.getOrNull(idx)?.trim() ?: ""
                  }
                  w.beginTransaction()
                  try {
                      for (row in pr.rows) {
                          val bank = cell(row, "Bank").ifBlank { "Unknown Bank" }
                          val acct = cell(row, "Account_No")
                          val dateStr = cell(row, "Txn_Date")
                          val desc = cell(row, "Description")
                          val ref = cell(row, "Ref_No")
                          val withdraw = cell(row, "Withdrawal").replace(",", "").replace("₹", "")
                          val deposit = cell(row, "Deposit").replace(",", "").replace("₹", "")
                          val wAmt = withdraw.toDoubleOrNull()
                          val dAmt = deposit.toDoubleOrNull()
                          val amt = (wAmt ?: 0.0) + (dAmt ?: 0.0)
                          val debit = (wAmt ?: 0.0) > 0.0
                          if (amt <= 0.0) { failed++; continue }
                          val ts = parseDate(dateStr) ?: System.currentTimeMillis()
                          val merchant = desc.take(60).ifBlank { "CSV Entry" }
                          val upi = Regex("""(?i)\b([a-z0-9][\w.\-]+@[a-z][a-z0-9]+)\b""").find(desc)?.groupValues?.get(1)
                          val cleanUpi = upi?.removeSuffix(".ref")?.lowercase()
                          val category = Learner.category(db, Learner.norm(merchant))
                              ?: Categories.classify(merchant, desc, debit)
                          val t = Txn(
                              ts = ts, amount = amt, debit = debit, merchant = merchant, category = category,
                              institution = bank, account = acct.ifBlank { null }, balance = null,
                              channel = "OTHER", ref = ref.ifBlank { null }, vpa = cleanUpi,
                              sender = "CSV", body = desc, source = "CSV", status = "CSV_IMPORT", tpl = "",
                              review = false
                          )
                          val id = Repo.save(ctx, t)
                          if (id > 0) imported++
                          else if (ref.isNotBlank()) dup++
                          else failed++
                      }
                      w.setTransactionSuccessful()
                  } finally {
                      w.endTransaction()
                  }
                  return Triple(imported, dup, failed)
              }
          }

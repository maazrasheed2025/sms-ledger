              private val splitRe = Regex("""[^a-z0-9]+""")
              private fun toks(s: String): Set<String> = s.lowercase().split(splitRe).filter { it.length >= 3 && it !in stop }.toSet()
              @Synchronized fun load(ctx: Context) { if (loaded) return; try { val idx = HashMap<String, MutableList<Plaza>>(); val rows = Db.get(ctx).rows("SELECT * FROM toll_plazas"); for (r in rows) { val name = r["name"] ?: continue; val tk = toks(name); if (tk.isEmpty()) continue; val p = Plaza(r["plaza_id"]?.toIntOrNull() ?: 0, name, r["state"] ?: "", r["nh"] ?: "", r["lat"]?.toDoubleOrNull() ?: 0.0, r["lon"]?.toDoubleOrNull() ?: 0.0, r["car_fare"]?.toDoubleOrNull(), tk); for (t in tk) idx.getOrPut(t) { ArrayList() }.add(p) }; index = idx } catch (_: Exception) {}; loaded = true }

              }
              private fun seedTollPlazas(db: SQLiteDatabase) {
                  var sid = 1000
                  for ((name, lonLat) in Tolls.TOLL_SEED) {
                      db.execSQL("INSERT OR IGNORE INTO toll_plazas(plaza_id, name, state, nh, lat, lon, car_fare) VALUES(?,?,?,?,?,?,?)",

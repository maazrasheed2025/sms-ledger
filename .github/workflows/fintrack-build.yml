name: Build and Release FinTrack APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build FinTrack APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Generate project files (keep user PNGs in place)
        run: |
          mkdir -p /tmp/proj/app/src/main/java/com/example/fintrack /tmp/proj/app/src/main/res/drawable /tmp/proj/app/src/main/res/values /tmp/proj/app/src/main/res/xml
          cd /tmp/proj

          # --- copy the user-committed icon pack into the generated tree ---
          if [ -d "$GITHUB_WORKSPACE/app/src/main/res/drawable-nodpi" ]; then
            mkdir -p app/src/main/res/drawable-nodpi
            cp -r "$GITHUB_WORKSPACE/app/src/main/res/drawable-nodpi/." app/src/main/res/drawable-nodpi/
            echo "Icons copied: $(ls app/src/main/res/drawable-nodpi | wc -l) PNGs"
          else
            echo "WARN: drawable-nodpi not found in repo — icons will fall back to vectors"
          fi

          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FinTrack"
          include(":app")
          EOF_0

          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1

          cat > gradle.properties <<'EOF_2'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF_2

          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.fintrack"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.fintrack"
                  minSdk = 30
                  targetSdk = 33
                  versionCode = 20
                  versionName = "10.2"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              // Prevent PNG compression from mangleing icons
              androidResources { noCompress += "png" }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.biometric:biometric:1.1.0")
              implementation("org.osmdroid:osmdroid-android:6.1.18")
          }
          EOF_3

          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <application
                  android:label="FinTrack"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".SmsReceiver" android:exported="true" android:permission="android.permission.BROADCAST_SMS">
                      <intent-filter>
                          <action android:name="android.provider.Telephony.SMS_RECEIVED"/>
                      </intent-filter>
                  </receiver>
                  <service
                      android:name=".NotifListener"
                      android:exported="false"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService"/>
                      </intent-filter>
                  </service>
                  <service
                      android:name=".ForegroundHelper"
                      android:exported="false"
                      android:foregroundServiceType="dataSync"/>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"/>

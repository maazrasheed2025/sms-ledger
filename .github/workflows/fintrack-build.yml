      - name: Build Debug APK
        working-directory: /tmp/proj
        run: gradle assembleDebug --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v10.2.${{ github.run_number }}"
          gh release create "$VERSION" /tmp/proj/app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "FinTrack Build ${{ github.run_number }}" \
            --notes "v10.2 Stage 1: Icons.kt wired into Ledger, Payees, Home, Money. Home now has a FinArt-style toolbar: month prev/next + Categories / Bills / Rescan / Settings icons. Money tab shows real bank logos per account. All 281 user PNGs included via drawable-nodpi copy step. Everything from 10.1 still works."

    package com.example.fintrack
    import android.content.Context
    import android.graphics.Bitmap
    import android.graphics.Canvas
    import android.view.View
    import androidx.core.content.FileProvider
    import java.io.File
    object LongScreenshot {
        fun captureScrollable(ctx: Context, scroll: android.widget.ScrollView, cacheKey: String = "shot"): File? {
            return try {
                val child = scroll.getChildAt(0) ?: return null
                val w = if (scroll.width > 0) scroll.width else 1080
                var h = child.height
                if (h <= 0) h = 2000
                val maxH = 30000
                if (h > maxH) h = maxH
                val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                val c = Canvas(bmp)
                c.drawColor(C.BG)
                c.save()
                child.draw(c)
                c.restore()
                val dir = File(ctx.cacheDir, "screenshots"); dir.mkdirs()
                val f = File(dir, "shot_${cacheKey}_${System.currentTimeMillis()}.png")
                f.outputStream().use { bmp.compress(Bitmap.CompressFormat.PNG, 100, it) }
                bmp.recycle()
                f
            } catch (_: Exception) { null }
        }
        fun captureView(ctx: Context, view: View, cacheKey: String = "shot"): File? {
            return try {
                if (view is android.widget.ScrollView) return captureScrollable(ctx, view, cacheKey)
                val w = if (view.width > 0) view.width else 1080
                val h = if (view.height > 0) view.height else 2000
                val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                val c = Canvas(bmp)
                c.drawColor(C.BG)
                view.draw(c)
                val dir = File(ctx.cacheDir, "screenshots"); dir.mkdirs()
                val f = File(dir, "shot_${cacheKey}_${System.currentTimeMillis()}.png")
                f.outputStream().use { bmp.compress(Bitmap.CompressFormat.PNG, 100, it) }
                bmp.recycle()
                f
            } catch (_: Exception) { null }
        }
        fun shareIntent(ctx: Context, file: File): android.content.Intent {
            val uri = FileProvider.getUriForFile(ctx, "${ctx.packageName}.fileprovider", file)
            return android.content.Intent(android.content.Intent.ACTION_SEND).apply { type = "image/png"; putExtra(android.content.Intent.EXTRA_STREAM, uri); addFlags(android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION) }
        }
    }

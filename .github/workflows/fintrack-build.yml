          class RouteMapView @JvmOverloads constructor(ctx: Context, attrs: AttributeSet? = null) : MapView(ctx, attrs) {
              class Pt(val lat: Double, val lon: Double, val label: String, val ts: Long)
              class Trip(val direction: String, val checkpoints: List<Pt>, val roadPolyline: List<DoubleArray>)
              init {
                  setTileSource(OSMFR_HOT); setMultiTouchControls(true); setBuiltInZoomControls(false)
                  controller.setZoom(5.0); controller.setCenter(GeoPoint(22.0, 79.0))
                  try { overlayManager.tilesOverlay.setColorFilter(null) } catch (_: Exception) {}
              }
              fun setTrips(trips: List<Trip>) {
                  overlays.clear()
                  val allPts = ArrayList<GeoPoint>()
                  for (trip in trips) {
                      val isGoing = trip.direction == "Going"
                      val color = if (isGoing) Color.parseColor("#673AB7") else Color.parseColor("#FF4081")
                      if (trip.roadPolyline.size >= 2) {
                          val polyline = Polyline()
                          polyline.setPoints(trip.roadPolyline.map { GeoPoint(it[0], it[1]) })
                          polyline.outlinePaint.color = color
                          polyline.outlinePaint.strokeWidth = if (isGoing) 12f else 8f
                          overlays.add(polyline)
                      }
                      for (cp in trip.checkpoints) {
                          allPts.add(GeoPoint(cp.lat, cp.lon))
                          val m = Marker(this); m.position = GeoPoint(cp.lat, cp.lon)
                          m.title = "${if (isGoing) "🟢" else "🔴"} ${cp.label}"
                          m.snippet = SimpleDateFormat("HH:mm", Locale.US).format(Date(cp.ts))
                          m.setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM); overlays.add(m)
                      }
                  }
                  if (allPts.isNotEmpty()) {
                      try { zoomToBoundingBox(BoundingBox.fromGeoPoints(allPts), true, 80) } catch (_: Exception) {}
                  }
                  invalidate()
              }
          }


                  "Deposit" to listOf("deposit","deposits","credit","cr","credit amount","amount credited")
              )
              fun normalizeHeader(h: String): String = h.trim().lowercase().replace(Regex("""[_\-/.]"""), " ").replace(Regex("""\s+"""), " ").trim()
              fun guess(cols: List<String>): Map<String, Int> {
                  val normCols = cols.map { normalizeHeader(it) }
                  val map = LinkedHashMap<String, Int>()
                  for ((field, syns) in synonyms) {
                      for (i in normCols.indices) if (map[field] == null && normCols[i] in syns.map { normalizeHeader(it) }) { map[field] = i; break }
                      if (map[field] == null) for (i in normCols.indices) { val c = normCols[i]; if (syns.any { c.contains(normalizeHeader(it)) }) { map[field] = i; break } }
                  }

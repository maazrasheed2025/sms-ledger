                    p.color = Color.parseColor("#888888"); p.textSize = 10f
                    c.drawText(SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date(cp.ts)), 55f, y + 11f, p)
                    y += 26f
                }
                y += 6f
            }
            doc.finishPage(page)
            val dir = File(ctx.cacheDir, "reports"); dir.mkdirs()
            val file = File(dir, "imrans_finances_tolls_${System.currentTimeMillis()}.pdf")

              fun flattenDuplicates(ctx: Context): List<DupRow> { try { val count = Db.get(ctx).num("SELECT COUNT(*) FROM txn").toLong(); if (dupCache != null && dupCacheCount == count && System.currentTimeMillis() - dupCacheAt < 5 * 60_000L) return dupCache!!; val rows = Db.get(ctx).queryTxns("1=1", emptyArray(), 100000).sortedBy { it.ts }; val used = HashSet<Long>(); val out = ArrayList<DupRow>(); for (i in rows.indices) { val a = rows[i]; if (a.id in used) continue; val g = arrayListOf(a); for (j in i + 1 until rows.size) { val b = rows[j]; if (b.id in used) continue; if (isDup(a, b)) g.add(b) }; if (g.size >= 2) { g.forEach { used.add(it.id) }; g.forEachIndexed { idx, t -> out.add(DupRow(t, idx > 0)) } } else used.add(a.id) }; dupCache = out; dupCacheAt = System.currentTimeMillis(); dupCacheCount = count; return out } catch (_: Exception) { return emptyList() } }
              fun invalidateDupCache() { dupCache = null; dupCacheAt = 0L; dupCacheCount = -1L }
              fun cleanupOrphanPayees(ctx: Context) { try { Db.get(ctx).exec("DELETE FROM payees WHERE merchant_key NOT IN (SELECT DISTINCT merchant_key FROM txn WHERE merchant_key IS NOT NULL)") } catch (_: Exception) {} }
          }

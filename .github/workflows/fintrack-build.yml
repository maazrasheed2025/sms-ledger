- name: Generate project files
  run: |
    mkdir -p /tmp/proj/app/src/main/java/com/example/fintrack /tmp/proj/app/src/main/res/drawable /tmp/proj/app/src/main/res/values /tmp/proj/app/src/main/res/xml
    cd /tmp/proj

    # ---- copy user-provided resources safely ----
    SRC="$GITHUB_WORKSPACE/app/src/main/res"
    for d in drawable-nodpi mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
      if [ -d "$SRC/$d" ]; then
        mkdir -p "app/src/main/res/$d"
        cp -r "$SRC/$d/." "app/src/main/res/$d/" 2>/dev/null || true
      fi
    done

    # ---- clean junk out of every resource folder ----
    for d in app/src/main/res/drawable-nodpi app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi; do
      if [ -d "$d" ]; then
        find "$d" -type f ! -iname '*.png' ! -iname '*.xml' ! -iname '*.webp' ! -iname '*.jpg' ! -iname '*.jpeg' -delete
        find "$d" -type d -empty -delete
      fi
    done

    # ---- normalise launcher icon name in every mipmap folder ----
    for m in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
      folder="app/src/main/res/mipmap-$m"
      mkdir -p "$folder"
      # find the first PNG (any name) in this folder that isn't already ic_launcher.png
      src=""
      while IFS= read -r p; do
        base=$(basename "$p")
        if [ "$base" != "ic_launcher.png" ] && [ "$base" != "ic_launcher_round.png" ]; then
          src="$p"
          break
        fi
      done < <(find "$folder" -maxdepth 1 -type f -iname '*.png' 2>/dev/null)
      if [ -n "$src" ] && [ ! -f "$folder/ic_launcher.png" ]; then
        mv "$src" "$folder/ic_launcher.png"
        echo "mipmap-$m: renamed $(basename "$src") → ic_launcher.png"
      fi
      # delete anything left in mipmap-* that isn't a valid launcher name
      while IFS= read -r p; do
        base=$(basename "$p")
        if [ "$base" != "ic_launcher.png" ] && [ "$base" != "ic_launcher_round.png" ]; then
          rm -f "$p"
        fi
      done < <(find "$folder" -maxdepth 1 -type f 2>/dev/null)
    done

    # ---- ensure EVERY density has an ic_launcher.png ----
    # pick whichever file the user provided and copy to the others
    COPIED_FROM=""
    for m in xxxhdpi xxhdpi xhdpi hdpi mdpi; do
      if [ -f "app/src/main/res/mipmap-$m/ic_launcher.png" ]; then
        COPIED_FROM="app/src/main/res/mipmap-$m/ic_launcher.png"
        break
      fi
    done
    if [ -n "$COPIED_FROM" ]; then
      for m in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
        mkdir -p "app/src/main/res/mipmap-$m"
        if [ ! -f "app/src/main/res/mipmap-$m/ic_launcher.png" ]; then
          cp "$COPIED_FROM" "app/src/main/res/mipmap-$m/ic_launcher.png"
        fi
      done
      echo "Launcher icon: propagated $COPIED_FROM to all densities"
    fi

    # ---- fallback if user still has no PNG: use a built-in vector mipmap ----
    if [ ! -f "app/src/main/res/mipmap-mdpi/ic_launcher.png" ]; then
      cat > app/src/main/res/drawable/ic_launcher_fallback.xml <<'EOF_LFB'
    <?xml version="1.0" encoding="utf-8"?>
    <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
        <path android:fillColor="#673AB7" android:pathData="M0,0h108v108h-108z"/>
        <path android:fillColor="#FFFFFF" android:pathData="M28,34h52v8h-52z"/>
        <path android:fillColor="#FFFFFF" android:pathData="M28,50h52v8h-52z"/>
        <path android:fillColor="#FFFFFF" android:pathData="M28,66h30v8h-30z"/>
    </vector>
    EOF_LFB
      echo "No launcher PNG found — using vector fallback"
    fi

    cat > settings.gradle.kts <<'EOF_0'
    pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
    dependencyResolutionManagement { repositories { google(); mavenCentral() } }
    rootProject.name = "ImransFinances"
    include(":app")
    EOF_0

    cat > build.gradle.kts <<'EOF_1'
    plugins {
        id("com.android.application") version "8.5.2" apply false
        id("org.jetbrains.kotlin.android") version "1.9.24" apply false
    }
    EOF_1

    cat > gradle.properties <<'EOF_2'
    android.useAndroidX=true
    org.gradle.jvmargs=-Xmx3g
    EOF_2

    cat > app/build.gradle.kts <<'EOF_3'
    plugins {
        id("com.android.application")
        id("org.jetbrains.kotlin.android")
    }
    android {
        namespace = "com.example.fintrack"
        compileSdk = 34
        defaultConfig {
            applicationId = "com.example.fintrack"
            minSdk = 30
            targetSdk = 33
            versionCode = 30
            versionName = "11.0"
        }
        compileOptions {
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        }
        kotlinOptions { jvmTarget = "17" }
        androidResources { noCompress += "png" }
    }
    dependencies {
        implementation("androidx.appcompat:appcompat:1.7.0")
        implementation("androidx.core:core-ktx:1.13.1")
        implementation("androidx.biometric:biometric:1.1.0")
        implementation("org.osmdroid:osmdroid-android:6.1.18")
    }
    EOF_3

    cat > app/src/main/AndroidManifest.xml <<'EOF_4'
    <?xml version="1.0" encoding="utf-8"?>
    <manifest xmlns:android="http://schemas.android.com/apk/res/android">
        <uses-permission android:name="android.permission.READ_SMS"/>
        <uses-permission android:name="android.permission.RECEIVE_SMS"/>
        <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
        <uses-permission android:name="android.permission.INTERNET"/>
        <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
        <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
        <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
        <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
        <application
            android:label="@string/app_name"
            android:icon="@mipmap/ic_launcher"
            android:roundIcon="@mipmap/ic_launcher"
            android:allowBackup="false"
            android:usesCleartextTraffic="true"
            android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
            <activity android:name=".MainActivity" android:exported="true" android:configChanges="uiMode">
                <intent-filter>
                    <action android:name="android.intent.action.MAIN"/>
                    <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
            </activity>
            <receiver android:name=".SmsReceiver" android:exported="true" android:permission="android.permission.BROADCAST_SMS">
                <intent-filter>
                    <action android:name="android.provider.Telephony.SMS_RECEIVED"/>
                </intent-filter>
            </receiver>
            <service
                android:name=".NotifListener"
                android:exported="false"
                android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                <intent-filter>
                    <action android:name="android.service.notification.NotificationListenerService"/>
                </intent-filter>
            </service>
            <service
                android:name=".ForegroundHelper"
                android:exported="false"
                android:foregroundServiceType="dataSync"/>
            <provider
                android:name="androidx.core.content.FileProvider"
                android:authorities="${applicationId}.fileprovider"
                android:exported="false"
                android:grantUriPermissions="true">
                <meta-data
                    android:name="android.support.FILE_PROVIDER_PATHS"
                    android:resource="@xml/file_paths"/>
            </provider>
        </application>
    </manifest>
    EOF_4

    cat > app/src/main/res/xml/file_paths.xml <<'EOF_XML1'
    <?xml version="1.0" encoding="utf-8"?>
    <paths xmlns:android="http://schemas.android.com/apk/res/android">
        <external-files-path name="exports" path="exports/"/>
        <cache-path name="cache" path="."/>
    </paths>
    EOF_XML1

    cat > app/src/main/res/values/strings.xml <<'EOF_STR'
    <?xml version="1.0" encoding="utf-8"?>
    <resources>
        <string name="app_name">Imran\'s Finances</string>
        <string name="notif_channel_name">Imran\'s Finances</string>
        <string name="notif_channel_desc">Reads payment notifications on device</string>
    </resources>
    EOF_STR

    cat > app/src/main/res/values/colors.xml <<'EOF_COL'
    <?xml version="1.0" encoding="utf-8"?>
    <resources>
        <color name="purple_primary">#673AB7</color>
        <color name="purple_dark">#512DA8</color>
        <color name="pink_accent">#FF4081</color>
    </resources>
    EOF_COL

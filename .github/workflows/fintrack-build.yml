                  var y = 50f
                  p.textSize = 26f; p.isFakeBoldText = true; c.drawText("FinTrack · $label", 40f, y, p); y += 30f
                  p.textSize = 14f; p.isFakeBoldText = false
                  c.drawText("Kharch: ${inr(spent)}     Mila: ${inr(recv)}     Net: ${inr(recv - spent)}", 40f, y, p); y += 30f
                  p.isFakeBoldText = true; p.textSize = 16f; c.drawText("Kahan kharch hua", 40f, y, p); y += 22f
                  p.isFakeBoldText = false; p.textSize = 13f
                  for (r in cats.take(10)) { val cat = r["category"] ?: ""; val v = r["s"]?.toDoubleOrNull() ?: 0.0; c.drawText("• $cat", 50f, y, p); c.drawText(inr(v), 555f - p.measureText(inr(v)), y, p); y += 18f }
                  y += 12f
                  p.isFakeBoldText = true; p.textSize = 16f; c.drawText("Top payees", 40f, y, p); y += 22f
                  p.isFakeBoldText = false; p.textSize = 13f
                  for (r in payees) { val n = r["merchant"] ?: ""; val v = r["s"]?.toDoubleOrNull() ?: 0.0; c.drawText("• $n", 50f, y, p); c.drawText(inr(v), 555f - p.measureText(inr(v)), y, p); y += 18f }
                  y += 12f

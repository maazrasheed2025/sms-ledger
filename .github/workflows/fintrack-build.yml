                  return clean
              }
              fun parseUnknownSms(rawBody: String): Fields? {
                  if (GROQ_API_KEY.isBlank()) return null
                  val redacted = redactSensitiveData(rawBody)
                  val prompt = """
          Analyze this Indian SMS financial notice. Return STRICT JSON ONLY, no markdown, no explanation:
          {"amount": <number or null>, "debit": <true if money left, false if arrived>, "merchant": <string or null>, "balance": <number or null>, "account_ending": <string or null>, "account_type": "BANK"|"CARD"|"WALLET"|"UPI"|"ATM"|"OTHER"}

          SMS: $redacted
                  """.trimIndent()
                  return try {
                      val url = URL("https://api.groq.com/openai/v1/chat/completions")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "POST"; conn.connectTimeout = 8000; conn.readTimeout = 8000
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.setRequestProperty("Authorization", "Bearer $GROQ_API_KEY")
                      conn.doOutput = true
                      val payload = JSONObject().apply {
                          put("model", "llama-3.3-70b-versatile"); put("temperature", 0.0); put("max_tokens", 200)
                          put("messages", JSONArray().apply { put(JSONObject().apply { put("role", "user"); put("content", prompt) }) })
                      }
                      OutputStreamWriter(conn.outputStream).use { it.write(payload.toString()) }
                      if (conn.responseCode == 200) {
                          val respText = conn.inputStream.bufferedReader().use { it.readText() }
                          val text = JSONObject(respText).getJSONArray("choices").getJSONObject(0).getJSONObject("message").getString("content")
                          val start = text.indexOf("{"); val end = text.lastIndexOf("}")
                          if (start < 0 || end <= start) return null
                          val parsed = JSONObject(text.substring(start, end + 1))

          cat > app/src/main/java/com/example/fintrack/PayeeOps.kt <<'EOF_16'
          package com.example.fintrack

          import android.content.ContentValues
          import android.content.Context

          object PayeeOps {
              fun merge(ctx: Context, keys: List<String>, survivorKey: String, survivorName: String) {
                  if (keys.size < 2) return
                  val db = Db.get(ctx); val w = db.writableDatabase; w.beginTransaction()
                  try {
                      val cv = ContentValues().apply { put("merchant_key", survivorKey); put("merchant", survivorName) }
                      w.update("txn", cv, "merchant_key IN (" + keys.joinToString(",") { "?" } + ")", keys.toTypedArray())
                      w.delete("payees", "merchant_key IN (" + keys.joinToString(",") { "?" } + ")", keys.toTypedArray())
                      w.execSQL("INSERT OR REPLACE INTO payees(merchant_key, display) VALUES(?,?)", arrayOf(survivorKey, survivorName))
                      for (k in keys) runCatching { w.execSQL("INSERT OR REPLACE INTO payee_aliases(alias_key, payee_key, created_at) VALUES(?,?,?)", arrayOf(k, survivorKey, System.currentTimeMillis())) }
                      w.setTransactionSuccessful()
                  } finally { w.endTransaction() }
              }
              fun addAlias(ctx: Context, payeeKey: String, aliasText: String): Int {
                  val db = Db.get(ctx); val w = db.writableDatabase; val aliasKey = Learner.norm(aliasText)
                  if (aliasKey.isBlank() || aliasKey == payeeKey) return 0
                  var moved = 0
                  w.beginTransaction()
                  try {
                      val payeeName = db.one("SELECT display FROM payees WHERE merchant_key=?", payeeKey) ?: payeeKey
                      moved = w.update("txn", ContentValues().apply { put("merchant_key", payeeKey); put("merchant", payeeName) }, "merchant_key=?", arrayOf(aliasKey))
                      runCatching { w.execSQL("INSERT OR REPLACE INTO payee_aliases(alias_key, payee_key, created_at) VALUES(?,?,?)", arrayOf(aliasKey, payeeKey, System.currentTimeMillis())) }
                      w.delete("payees", "merchant_key=?", arrayOf(aliasKey))
                      w.setTransactionSuccessful()
                  } finally { w.endTransaction() }
                  return moved
              }
              fun undoLastMerge(ctx: Context): Boolean {
                  val db = Db.get(ctx); val w = db.writableDatabase
                  val row = db.rows("SELECT id, survivor_key, merged_keys, survivor_name FROM payee_merges WHERE undone=0 ORDER BY id DESC LIMIT 1").firstOrNull() ?: return false
                  val id = row["id"]?.toLongOrNull() ?: return false
                  val survivorKey = row["survivor_key"] ?: return false
                  val survivorName = row["survivor_name"] ?: survivorKey
                  val merged = (row["merged_keys"] ?: "").split("\u0001").filter { it.isNotBlank() }
                  w.beginTransaction()
                  try {
                      for (k in merged) {
                          w.execSQL("INSERT OR IGNORE INTO payees(merchant_key, display) VALUES(?,?)", arrayOf(k, k))
                          w.execSQL("UPDATE txn SET merchant_key=? WHERE merchant_key=? AND merchant=?", arrayOf(k, survivorKey, survivorName))
                      }
                      w.execSQL("UPDATE payee_merges SET undone=1 WHERE id=?", arrayOf(id))
                      w.setTransactionSuccessful()
                  } finally { w.endTransaction() }
                  return true
              }
              fun reassignToPayee(ctx: Context, keys: List<String>, newKey: String, newName: String) {
                  if (keys.isEmpty()) return
                  val db = Db.get(ctx); val w = db.writableDatabase; w.beginTransaction()
                  try {
                      val cv = ContentValues().apply { put("merchant_key", newKey); put("merchant", newName); put("status", "USER"); put("review", 0) }
                      w.update("txn", cv, "merchant_key IN (" + keys.joinToString(",") { "?" } + ")", keys.toTypedArray())
                      w.execSQL("INSERT OR REPLACE INTO payees(merchant_key, display) VALUES(?,?)", arrayOf(newKey, newName))
                      w.setTransactionSuccessful()
                  } finally { w.endTransaction() }
              }
              fun bulkSetCategory(ctx: Context, ids: List<Long>, category: String) {
                  if (ids.isEmpty()) return
                  val db = Db.get(ctx); val w = db.writableDatabase; w.beginTransaction()
                  try { w.update("txn", ContentValues().apply { put("category", category) }, "id IN (" + ids.joinToString(",") { "?" } + ")", ids.map { it.toString() }.toTypedArray()); w.setTransactionSuccessful() } finally { w.endTransaction() }
              }
              fun bulkDelete(ctx: Context, ids: List<Long>) {
                  if (ids.isEmpty()) return
                  val db = Db.get(ctx); val w = db.writableDatabase; w.beginTransaction()
                  try {
                      w.delete("txn", "id IN (" + ids.joinToString(",") { "?" } + ")", ids.map { it.toString() }.toTypedArray())
                      w.delete("toll_trips", "txn_id IN (" + ids.joinToString(",") { "?" } + ")", ids.map { it.toString() }.toTypedArray())
                      w.setTransactionSuccessful()
                  } finally { w.endTransaction() }
              }
              private fun dayKey(ts: Long): String {
                  val cal = java.util.Calendar.getInstance(); cal.timeInMillis = ts
                  return String.format(java.util.Locale.US, "%04d-%02d-%02d", cal.get(java.util.Calendar.YEAR), cal.get(java.util.Calendar.MONTH) + 1, cal.get(java.util.Calendar.DAY_OF_MONTH))
              }
              private fun isDup(a: Txn, b: Txn): Boolean {
                  if (Math.abs(a.ts - b.ts) > 5 * 60_000L) return false
                  if (Math.abs(a.amount - b.amount) > 0.01) return false
                  if (a.debit != b.debit) return false
                  if (dayKey(a.ts) != dayKey(b.ts)) return false
                  val na = Learner.norm(a.merchant); val nb = Learner.norm(b.merchant)
                  if (na != nb && na.isNotBlank() && nb.isNotBlank()) return false
                  return true
              }
              data class DupGroup(val key: String, val ids: List<Long>, val sample: Txn)
              fun findDuplicates(ctx: Context): List<DupGroup> {
                  val rows = Db.get(ctx).queryTxns("1=1", emptyArray(), 100000).sortedBy { it.ts }
                  val used = HashSet<Long>(); val out = ArrayList<DupGroup>()
                  for (i in rows.indices) {
                      val a = rows[i]; if (a.id in used) continue
                      val g = arrayListOf(a)
                      for (j in i + 1 until rows.size) { val b = rows[j]; if (b.id in used) continue; if (isDup(a, b)) g.add(b) }
                      if (g.size >= 2) { g.forEach { used.add(it.id) }; val first = g.first(); out.add(DupGroup("${first.amount}|${if (first.debit) "D" else "C"}|${first.ts / 60_000}", g.map { it.id }, first)) } else used.add(a.id)
                  }
                  return out
              }
              data class DupRow(val txn: Txn, val defaultDelete: Boolean)
              fun flattenDuplicates(ctx: Context): List<DupRow> {
                  val out = ArrayList<DupRow>()
                  for (g in findDuplicates(ctx)) {
                      val txns = g.ids.mapNotNull { id -> Db.get(ctx).queryTxns("id=?", arrayOf(id.toString()), 1).firstOrNull() }
                      for ((idx, t) in txns.withIndex()) out.add(DupRow(t, idx > 0))
                  }
                  return out
              }
              fun cleanupOrphanPayees(ctx: Context) {
                  Db.get(ctx).exec("DELETE FROM payees WHERE merchant_key NOT IN (SELECT DISTINCT merchant_key FROM txn WHERE merchant_key IS NOT NULL)")
              }
          }

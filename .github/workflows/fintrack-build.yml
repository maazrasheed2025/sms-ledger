                  for (r in db.rows("SELECT word, d, c FROM nb_words WHERE word IN ($marks)", *ws.toTypedArray())) {
                      val d = r["d"]?.toDoubleOrNull() ?: 0.0; val c = r["c"]?.toDoubleOrNull() ?: 0.0
                      score += Math.log((d + 1) / (td + n)) - Math.log((c + 1) / (tc + n))

name: Build and Release FinTrack APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build FinTrack APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Generate project files
        run: |
          mkdir -p /tmp/proj/app/src/main/java/com/example/fintrack /tmp/proj/app/src/main/res/drawable /tmp/proj/app/src/main/res/values /tmp/proj/app/src/main/res/xml
          cd /tmp/proj
# auto-fix: broken merge_sel string interpolation in Screens2.kt
find app/src/main/java/com/example/fintrack -name 'Screens2.kt' -exec sed -i 's|sortChips.addView(act.pill("${Str.s("merge_sel")}.*|sortChips.addView(act.pill("Merge (${selected.size})", true) { if (selected.size < 2) { act.toast(Str.s("select_two")); return@pill }; askMerge(selected.toList()) })|' {} \;
# auto-fix: broken theme button in Screens3.kt
find app/src/main/java/com/example/fintrack -name 'Screens3.kt' -exec sed -i 's|th.put(act.actionBtn(Str.s("theme")) + ": cycle.*|th.put(act.actionBtn(Str.s("theme") + ": cycle") { act.toggleTheme() }, 10)|' {} \;

          if [ -d "$GITHUB_WORKSPACE/app/src/main/res/drawable-nodpi" ]; then
            mkdir -p app/src/main/res/drawable-nodpi
            cp -r "$GITHUB_WORKSPACE/app/src/main/res/drawable-nodpi/." app/src/main/res/drawable-nodpi/
            find app/src/main/res/drawable-nodpi -type f ! -iname '*.png' ! -iname '*.xml' ! -iname '*.jpg' ! -iname '*.jpeg' ! -iname '*.webp' ! -iname '*.gif' -delete
            find app/src/main/res/drawable-nodpi -type d -empty -delete
            echo "Icons in APK: $(ls app/src/main/res/drawable-nodpi | wc -l) files"
          fi

          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FinTrack"
          include(":app")
          EOF_0

          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1

          cat > gradle.properties <<'EOF_2'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF_2

          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.fintrack"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.fintrack"
                  minSdk = 30
                  targetSdk = 33
                  versionCode = 23
                  versionName = "10.5"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              androidResources { noCompress += "png" }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.biometric:biometric:1.1.0")
              implementation("org.osmdroid:osmdroid-android:6.1.18")
          }
          EOF_3

          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.USE_BIOMETRIC"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <application
                  android:label="FinTrack"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <receiver android:name=".SmsReceiver" android:exported="true" android:permission="android.permission.BROADCAST_SMS">
                      <intent-filter>
                          <action android:name="android.provider.Telephony.SMS_RECEIVED"/>
                      </intent-filter>
                  </receiver>
                  <service
                      android:name=".NotifListener"
                      android:exported="false"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService"/>
                      </intent-filter>
                  </service>
                  <service
                      android:name=".ForegroundHelper"
                      android:exported="false"
                      android:foregroundServiceType="dataSync"/>
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths"/>
                  </provider>
              </application>
          </manifest>
          EOF_4

          cat > app/src/main/res/xml/file_paths.xml <<'EOF_XML1'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-files-path name="exports" path="exports/"/>
              <cache-path name="cache" path="."/>
          </paths>
          EOF_XML1

          cat > app/src/main/res/values/strings.xml <<'EOF_STR'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">FinTrack</string>
              <string name="notif_channel_name">FinTrack payment listener</string>
              <string name="notif_channel_desc">Reads payment app notifications to auto-log transactions (stays on device only)</string>
          </resources>
          EOF_STR

          cat > app/src/main/java/com/example/fintrack/Icons.kt <<'EOF_ICONS'
          package com.example.fintrack

          import android.content.Context
          import android.content.res.Resources

          object Icons {
              private val CAT_MAP: Map<String, String> = mapOf(
                  "grocery" to "cat_groceries", "groceries" to "cat_groceries",
                  "fuel" to "cat_fuel",
                  "food" to "cat_dining", "dining" to "cat_dining",
                  "travel" to "cat_transport", "transport" to "cat_transport",
                  "shopping" to "cat_shopping",
                  "bills & recharge" to "cat_bills", "bills" to "cat_bills", "recharge" to "cat_bills",
                  "entertainment" to "cat_leisure", "leisure" to "cat_leisure",
                  "health" to "cat_health",
                  "cash" to "cat_cash",
                  "emi/loan" to "cat_emi", "emi" to "cat_emi", "loan" to "cat_emi",
                  "transfer" to "cat_cash_debit",
                  "salary/income" to "cat_business", "salary" to "cat_business", "income" to "cat_business",
                  "received" to "cat_cash_credit",
                  "investment" to "cat_investment",
                  "business" to "cat_business",
                  "education" to "cat_education",
                  "house" to "cat_house",
                  "household" to "cat_household",
                  "kids" to "cat_kids",
                  "grooming" to "cat_grooming",
                  "gadgets" to "cat_gadgets",
                  "credit card" to "cat_credit_card",
                  "other" to "cat_misc", "misc" to "cat_misc"
              )
              fun category(ctx: Context, displayName: String, fallback: Int = R.drawable.ic_bank): Int {
                  val slug = CAT_MAP[displayName.trim().lowercase()] ?: return fallback
                  return lookup(ctx, slug, fallback)
              }
              private val BANK_PATTERNS: List<Pair<Regex, String>> = listOf(
                  Regex("(?i)\\bhdfc\\b") to "bank_hdfc",
                  Regex("(?i)\\bsbi\\b|state bank of india") to "bank_sbi",
                  Regex("(?i)\\bicici\\b") to "bank_icici",
                  Regex("(?i)\\baxis\\b") to "bank_axis",
                  Regex("(?i)\\bkotak\\b") to "bank_kotak",
                  Regex("(?i)\\bidfc\\b") to "bank_idfc",
                  Regex("(?i)\\bpnb\\b|punjab national") to "bank_pnb",
                  Regex("(?i)\\bbank of baroda\\b|\\bbob\\b") to "bank_bank_of_baroda",
                  Regex("(?i)\\bbank of india\\b") to "bank_bank_of_india",
                  Regex("(?i)\\bcanara\\b") to "bank_canara",
                  Regex("(?i)\\bunion bank") to "bank_union_bank",
                  Regex("(?i)\\bindus(ind)?\\b") to "bank_indus_ind",
                  Regex("(?i)\\bfederal\\b") to "bank_federal",
                  Regex("(?i)\\brbl\\b") to "bank_rbl",
                  Regex("(?i)\\bidbi\\b") to "bank_idbi",
                  Regex("(?i)\\bindian bank\\b") to "bank_indian_bank",
                  Regex("(?i)\\bcentral bank\\b") to "bank_cbi",
                  Regex("(?i)\\buco\\b") to "bank_uco",
                  Regex("(?i)\\bobc\\b|oriental bank") to "bank_obc",
                  Regex("(?i)\\bjk bank\\b|jammu") to "bank_jk",
                  Regex("(?i)\\bbandhan\\b") to "bank_bandhan",
                  Regex("(?i)\\bau small finance\\b|\\baubank\\b") to "bank_aubank",
                  Regex("(?i)\\bequitas\\b") to "bank_equtas",
                  Regex("(?i)\\besaf\\b") to "bank_esaf",
                  Regex("(?i)\\bkarnataka\\b") to "bank_karnataka",
                  Regex("(?i)\\bsaraswat\\b") to "bank_saraswat",
                  Regex("(?i)\\bdcb\\b") to "bank_dcb",
                  Regex("(?i)\\bbajaj\\b") to "bank_bajajfinance",
                  Regex("(?i)\\bindiapost\\b") to "bank_indiapost",
                  Regex("(?i)\\bpaytm payments? bank\\b") to "biller_paytm",
                  Regex("(?i)\\bairtel payments? bank\\b") to "biller_airtel",
                  Regex("(?i)\\bjio payments? bank\\b") to "biller_jio",
                  Regex("(?i)\\bhsbc\\b") to "bank_hsbc",
                  Regex("(?i)\\bciti\\b") to "bank_citi",
                  Regex("(?i)\\bstandard chartered\\b") to "bank_standard_chartered",
                  Regex("(?i)\\bemirates nbd\\b") to "bank_emiratesnbd",
                  Regex("(?i)\\badcb\\b") to "bank_adcb",
                  Regex("(?i)\\bqnb\\b") to "bank_qnb",
                  Regex("(?i)\\bsamba\\b") to "bank_samba",
                  Regex("(?i)\\bal ?rajhi\\b") to "bank_al_rajhi",
                  Regex("(?i)\\briyad\\b") to "bank_riyad",
                  Regex("(?i)\\bmeezan\\b") to "bank_meezan"
              )
              fun bank(ctx: Context, institution: String, fallback: Int = R.drawable.ic_bank): Int {
                  if (institution.isBlank()) return fallback
                  for ((re, slug) in BANK_PATTERNS) {
                      if (re.containsMatchIn(institution)) {
                          val id = lookup(ctx, slug, 0); if (id != 0) return id
                      }
                  }
                  return fallback
              }
              private val WALLET_PATTERNS: List<Pair<Regex, String>> = listOf(
                  Regex("(?i)\\bphonepe\\b") to "wallet_phonepe",
                  Regex("(?i)\\bgoogle ?pay\\b|\\bgpay\\b") to "wallet_phonepe",
                  Regex("(?i)\\bpaytm\\b") to "biller_paytm",
                  Regex("(?i)\\bmobikwik\\b") to "wallet_mobikwik",
                  Regex("(?i)\\bfreecharge\\b") to "wallet_freecharge",
                  Regex("(?i)\\bpaypal\\b") to "wallet_paypal",
                  Regex("(?i)\\bamazon ?pay\\b") to "biller_amazon",
                  Regex("(?i)\\bcred\\b") to "wallet_cred",
                  Regex("(?i)\\bwise\\b") to "wallet_wise",
                  Regex("(?i)\\brevolut\\b") to "wallet_revolut",
                  Regex("(?i)\\bicici ?pockets?\\b") to "wallet_icicipockets",
                  Regex("(?i)\\bpayzapp\\b") to "wallet_hdfcpayzapp",
                  Regex("(?i)\\bsbi ?buddy\\b") to "wallet_sbibuddy",
                  Regex("(?i)\\bola ?money\\b") to "wallet_ola_money",
                  Regex("(?i)\\bjio ?money\\b") to "wallet_jio_money",
                  Regex("(?i)\\bamex\\b|american express") to "wallet_american_express",
                  Regex("(?i)\\bdiscover\\b") to "wallet_discover",
                  Regex("(?i)\\bmpesa\\b|m-pesa") to "wallet_mpesa"
              )
              fun wallet(ctx: Context, name: String, fallback: Int = R.drawable.ic_transfer): Int {
                  if (name.isBlank()) return fallback
                  for ((re, slug) in WALLET_PATTERNS) {
                      if (re.containsMatchIn(name)) {
                          val id = lookup(ctx, slug, 0); if (id != 0) return id
                      }
                  }
                  return fallback
              }
              private val BILLER_PATTERNS: List<Pair<Regex, String>> = listOf(
                  Regex("(?i)\\bnetflix\\b") to "biller_subs_netflix",
                  Regex("(?i)\\bspotify\\b") to "biller_subs_spotify",
                  Regex("(?i)\\bhotstar\\b|disney") to "biller_subs_hotstar",
                  Regex("(?i)\\bairtel\\b") to "biller_airtel",
                  Regex("(?i)\\bjio\\b") to "biller_jio",
                  Regex("(?i)\\bbsnl\\b") to "biller_bsnl",
                  Regex("(?i)\\bvodafone\\b|\\bvi\\b") to "biller_vodafone",
                  Regex("(?i)\\bpaytm\\b") to "biller_paytm",
                  Regex("(?i)\\bbescom\\b") to "biller_bescom",
                  Regex("(?i)\\btata ?sky\\b|\\btata ?play\\b") to "biller_tata_sky",
                  Regex("(?i)\\bamazon\\b") to "biller_amazon"
              )
              fun biller(ctx: Context, name: String, fallback: Int = R.drawable.ic_bank): Int {
                  if (name.isBlank()) return fallback
                  for ((re, slug) in BILLER_PATTERNS) {
                      if (re.containsMatchIn(name)) {
                          val id = lookup(ctx, slug, 0); if (id != 0) return id
                      }
                  }
                  return fallback
              }
              private fun lookup(ctx: Context, slug: String, fallback: Int): Int {
                  val id = try { ctx.resources.getIdentifier(slug, "drawable", ctx.packageName) } catch (e: Resources.NotFoundException) { 0 }
                  return if (id != 0) id else fallback
              }
          }
          EOF_ICONS


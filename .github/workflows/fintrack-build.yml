- name: Build Debug APK
  working-directory: /tmp/proj
  run: gradle assembleDebug --no-daemon

- name: Create GitHub Release
  env:
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  run: |
    VERSION="v12.1.1.${{ github.run_number }}"
    gh release create "$VERSION" /tmp/proj/app/build/outputs/apk/debug/app-debug.apk \
      --repo "${{ github.repository }}" \
      --title "Imran's Finances v12.1.1 Build ${{ github.run_number }}" \
      --notes "v12.1.1: (1) Payee transaction list exports color-coded PDF (red=debit, green=credit) with In/Out/Net totals header, plus long-scrolling screenshot button. (2) Tolls tab in Travel now groups by date with collapsible per-day lists showing time + plaza + amount. (3) Ledger: Move ALL to tolls chip, long-press individual txn > Move to tolls, bulk-select > Move to tolls. Payee: Move ALL to tolls button. Toll PDF groups by date with totals in red. (4) Camera icon in top bar captures any screen as long PNG (scrolls full content)."

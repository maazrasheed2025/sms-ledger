                  if (spread > 0.15) return
                  val timestamps = rows.mapNotNull { it["ts"]?.toLongOrNull() }.sortedDescending()
                  val gaps = timestamps.zipWithNext { a, b -> (a - b) / 86_400_000L }; if (gaps.isEmpty()) return
                  val avgGap = gaps.average()
                  if (avgGap in 25.0..35.0) db.exec("INSERT OR REPLACE INTO subs_detected(merchant_key, avg_amt, last_ts, count) VALUES(?,?,?,?)", key, avg, timestamps.first(), amounts.size)

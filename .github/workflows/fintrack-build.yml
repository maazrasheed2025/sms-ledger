                  put(search, 8); put(HorizontalScrollView(act).apply { isHorizontalScrollBarEnabled = false; addView(sortChips) }, 2); put(summary, 0); put(list, 0, 1f)
              }
              override fun refresh() {
                  sortChips.removeAllViews()
                  sortChips.addView(act.pill("Count", sortMode == "count") { sortMode = "count"; refresh() })
                  sortChips.addView(act.pill("Name", sortMode == "name") { sortMode = "name"; refresh() })
                  sortChips.addView(act.pill("Recent", sortMode == "recent") { sortMode = "recent"; refresh() })
                  sortChips.addView(act.pill("Total", sortMode == "total") { sortMode = "total"; refresh() })
                  if (selectMode) {
                      sortChips.addView(act.pill("Merge (${selected.size})", true) { if (selected.size < 2) { act.toast("Kam se kam 2 chuno"); return@pill }; askMerge(selected.toList()) })
                      sortChips.addView(act.pill("Cancel", false) { selectMode = false; selected.clear(); refresh() })
                  }
                  val order = when (sortMode) { "name" -> "p.display ASC"; "recent" -> "last DESC"; "total" -> "spent DESC"; else -> "n DESC" }
                  val like = "%$query%"
                  val rows = Db.get(act).rows(
                      "SELECT p.merchant_key AS k, p.display AS display, p.upi_id AS upi_id, COUNT(t.id) AS n, SUM(CASE WHEN t.debit=1 THEN t.amount ELSE 0 END) AS spent, SUM(CASE WHEN t.debit=0 THEN t.amount ELSE 0 END) AS recv, MAX(t.ts) AS last FROM payees p LEFT JOIN txn t ON t.merchant_key = p.merchant_key WHERE p.display LIKE ? OR p.upi_id LIKE ? GROUP BY p.merchant_key ORDER BY $order LIMIT 400",
                      like, like)

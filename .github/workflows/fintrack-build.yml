              private var animated: Float = 0f
              private var animator: ValueAnimator? = null
              private val trackP = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; color = Color.parseColor("#1F2430"); strokeCap = Paint.Cap.ROUND }
              private val progressP = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeCap = Paint.Cap.ROUND }

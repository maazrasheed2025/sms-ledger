          object Categories {
              val ALL = listOf(
                  "Grocery", "Fuel", "Food", "Travel", "FASTag", "Shopping", "Bills & Recharge", "Entertainment",
                  "Health", "Cash", "EMI/Loan", "Transfer", "Salary/Income", "Received", "Other"
              )

              private fun rule(name: String, words: String) = name to Regex("(?i)\\b(?:$words)\\b")

              private val rules = listOf(
                  rule("FASTag", "fastag|netc|toll|plaza|nhai|ihmcl"),
                  rule("Grocery", "bigbasket|big basket|blinkit|zepto|dmart|d-mart|avenue supermarts|grofers|jiomart|instamart|kirana|grocery|groceries|supermarket|super market|vegetable|vegetables|fruits|dairy|milk|reliance fresh|more retail|spencer|provision|general store"),
                  rule("Fuel", "petrol|diesel|fuel|hpcl|bpcl|iocl|indian ?oil|indianoil|bharat petroleum|hindustan petroleum|shell|nayara|essar|filling station|hp pay"),
                  rule("Food", "swiggy|zomato|restaurant|cafe|dominos|domino's|mcdonald's|mcdonalds|kfc|pizza|burger|hotel|dhaba|biryani|bakery|sweets|food|eatery|starbucks|chai|canteen|barbeque"),
                  rule("Travel", "uber|ola|rapido|irctc|redbus|makemytrip|goibibo|railway|metro|indigo|air india|spicejet|yatra|cleartrip|ixigo|cab|taxi|travels"),
                  rule("Bills & Recharge", "airtel|jio|vodafone|bsnl|electricity|bijli|bescom|msedcl|tneb|water bill|piped gas|dth|tata play|tatasky|dish tv|recharge|broadband|postpaid|prepaid|bill|insurance|lic|municipal|property tax|bbps"),
                  rule("Shopping", "amazon|flipkart|myntra|ajio|meesho|nykaa|snapdeal|decathlon|retail|mall|fashion|garments|clothing|electronics|croma|reliance digital|lenskart"),
                  rule("Entertainment", "netflix|hotstar|spotify|prime video|bookmyshow|youtube|pvr|inox|sonyliv|zee5|gaming|dream11"),
                  rule("Health", "pharmacy|medical|medicos|apollo|1mg|pharmeasy|hospital|clinic|diagnostic|labs|netmeds|dental|doctor")
              )

              private val bodyRules = listOf(
                  rule("Cash", "atm|cash withdrawal|cash wdl|atm wdl"),
                  rule("EMI/Loan", "emi|loan"),
                  rule("Salary/Income", "salary"),
                  rule("Bills & Recharge", "recharge|insurance|bbps|electricity|bill payment|dth")
              )

              private val upiWord = Regex("(?i)\\b(upi|imps|neft|rtgs|vpa)\\b")

              fun classify(merchant: String, body: String, debit: Boolean): String {
                  for ((name, re) in rules) if (re.containsMatchIn(merchant)) return name
                  for ((name, re) in bodyRules) if (re.containsMatchIn(body)) return name
                  if (rules[0].second.containsMatchIn(body)) return "FASTag"
                  if (!debit) return "Received"
                  return if (upiWord.containsMatchIn(body)) "Transfer" else "Other"
              }
          }

          /** Template signature of an SMS: keeps only structural words, hides names/numbers. Same bank format => same hash. */
          object Skeleton {
              private val vocab = setOf(
                  "sent", "debited", "credited", "spent", "paid", "received", "to", "from", "at", "by", "on", "for", "via", "upi", "vpa",
                  "ref", "a/c", "ac", "acct", "account", "card", "bank", "avl", "bal", "balance", "txn", "neft", "imps", "rtgs", "atm",
                  "fastag", "toll", "plaza", "wallet", "info", "trf", "transfer", "withdrawn", "purchase", "deposited", "refund",
                  "towards", "using", "with", "not", "you", "if", "call", "dear", "customer", "your", "is", "has", "been", "of", "in", "no",
                  "deducted", "charged", "vehicle", "linked"
              )

              fun hash(body: String): String {
                  val sb = StringBuilder()
                  var last = ""
                  for (tok in body.lowercase().split(Regex("[^a-z/]+"))) {
                      if (tok.isEmpty()) continue
                      val t = if (tok in vocab) tok else "_"
                      if (t == "_" && last == "_") continue
                      sb.append(t).append(' ')
                      last = t
                  }
                  return Integer.toHexString(sb.toString().hashCode())
              }
          }

          /** Fallback extractor used when regex finds no merchant (pluggable: an on-device LLM could replace this). */
          object Heuristic {
              private val stop = setOf(
                  "rs", "inr", "upi", "imps", "neft", "rtgs", "bank", "ltd", "not", "you", "call", "avl", "bal", "balance", "ref", "dear",
                  "customer", "your", "sent", "debited", "credited", "spent", "paid", "received", "withdrawn", "card", "info", "vpa", "txn",
                  "transaction", "account", "acct", "payment", "amount", "on", "from", "to", "at", "the", "if", "is", "has", "been", "with",
                  "for", "by", "of", "a/c", "no", "msg", "jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec",
                  "fastag", "toll", "plaza", "wallet", "thank", "thanks", "please", "dial", "visit", "ac", "atm", "pos", "using", "via", "total"
              )
              private val ctxWords = setOf("to", "at", "from", "by", "for", "towards", "paid", "info", "trf")
              private val tokRe = Regex("[A-Za-z][A-Za-z0-9&.'\\-]*")

              private class Tok(val v: String, val s: Int, val e: Int)

              fun merchant(body: String, institution: String): String? {
                  val inst = institution.lowercase().split(Regex("[^a-z]+")).toSet()
                  val toks = tokRe.findAll(body).map { Tok(it.value, it.range.first, it.range.last + 1) }.toList()
                  var best: String? = null
                  var bestScore = 0
                  var i = 0
                  while (i < toks.size) {
                      val t = toks[i]
                      val low = t.v.lowercase().trimEnd('.')
                      if (t.v[0].isUpperCase() && low !in stop && low !in inst) {
                          var j = i
                          while (j + 1 < toks.size && j - i < 3) {
                              val n = toks[j + 1]
                              val nl = n.v.lowercase().trimEnd('.')
                              if (body.substring(toks[j].e, n.s) == " " && n.v[0].isUpperCase() && nl !in stop && nl !in inst) j++ else break
                          }
                          val span = body.substring(t.s, toks[j].e).trimEnd('.', ',')
                          val prev = if (i > 0 && body.substring(toks[i - 1].e, t.s).isBlank()) toks[i - 1].v.lowercase() else ""
                          var score = 0
                          if (prev in ctxWords) score += 3
                          if (span.all { !it.isLowerCase() }) score += 1
                          if (j > i) score += 1
                          if (span.length < 3) score -= 3
                          if (score > bestScore) { bestScore = score; best = span }
                          i = j + 1
                      } else i++
                  }
                  return if (bestScore >= 3) SmsEngine.pretty(best ?: "") else null
              }
          }

          object SmsEngine {
              private val amountRe = Regex("(?i)(?:\\b(?:rs\\.?|inr)|₹)\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)")
              private val amountAfterRe = Regex("(?i)\\b(?:debited|credited|spent|paid|withdrawn|sent|received|deposited|deducted)\\s+(?:by|for|of|with)?\\s*(?:rs\\.?|inr|₹)?\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)")
              private val noiseRe = Regex("(?i)\\b(otp|one[- ]time|verification|requested|request|will be|due|pre-?approved|eligible|reminder|statement|failed|declined|unsuccessful|offer|apply)\\b")
              private val accountRe = Regex("(?i)(a/c|\\bac\\b|acct|account|card|upi|bank|wallet|neft|imps|rtgs|atm|fastag|netc|x{2,}\\d{2,}|\\*{2,}\\d{2,})")
              private val debitRe = Regex("(?i)\\b(debited|spent|paid|withdrawn|withdrawal|purchase|sent|transferred|deducted|charged|debit of)\\b")
              private val creditRe = Regex("(?i)\\b(credited|received|deposited|refund(?:ed)?|added to)\\b")
              private val balanceRe = Regex("(?i)(?:avl\\.?\\s*bal(?:ance)?|available\\s*bal(?:ance)?|bal(?:ance)?)\\s*(?:is|:|-)?\\s*(?:rs\\.?|inr|₹)?\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)")
              private val acctRe = Regex("(?i)(?:a/c|acct?|account|card)\\.?\\s*(?:no\\.?|number)?\\s*(?:ending(?:\\s+(?:with|in))?)?\\s*(?:x+|\\*+|#)?\\s*(\\d{3,4})\\b")
              private val refRe = Regex("(?i)(?:upi\\s*ref(?:\\s*no)?|ref(?:erence)?\\s*(?:no|number|id)?|rrn|utr)\\s*[:.\\-]?\\s*([A-Za-z0-9]{6,22})")
              private val vpaRe = Regex("(?i)\\b([a-z0-9][\\w.\\-]+@[a-z][a-z0-9]+)\\b(?!\\.[a-z]{2,3}\\b)")
              private val tollRe = Regex("(?i)\\b(fastag|netc|toll|plaza|nhai|ihmcl)\\b")

              private val toRe = Regex("(?i)\\b(?:to|at)\\s+([A-Za-z][A-Za-z0-9 &.\\-']{2,30}?)(?=\\s+(?:on|ref\\w*|via|upi|using|avl|bal|a/c|account|txn|not|if|vide|dated|date)\\b|[.,;(]|$)")
              private val fromRe = Regex("(?i)\\b(?:from|by)\\s+([A-Za-z][A-Za-z0-9 &.\\-']{2,30}?)(?=\\s+(?:on|ref\\w*|via|upi|using|avl|bal|a/c|account|txn|not|if|vide|dated|date)\\b|[.,;(]|$)")
              private val vpaWordRe = Regex("(?i)\\bvpa\\s+([\\w.\\-]+@[\\w.\\-]+)")
              private val upiSlashRe = Regex("(?i)upi/\\w+/\\d+/([A-Za-z][A-Za-z0-9 .\\-]{2,30}?)(?:/|$)")
              private val semiRe = Regex("(?i)[;,]\\s*([A-Za-z][A-Za-z0-9 &.\\-']{2,30}?)\\s+credited")
              private val infoRe = Regex("(?i)info[:\\-\\s]+([A-Za-z0-9 &.\\-/@']{3,30})")

              private val stopExact = setOf("upi", "neft", "imps", "rtgs", "a/c", "ac", "acct", "account", "you", "bank", "card", "self")
              private val stopStarts = listOf("your", "a/c", "ac ", "acct", "account", "upi ", "bank", "card", "you ")

              private fun valid(s: String): Boolean {
                  val t = s.trim().lowercase()
                  if (t.length < 3 || t in stopExact) return false
                  for (p in stopStarts) if (t.startsWith(p)) return false
                  return true
              }

              private val trailDateRe = Regex("(?i)\\s+(?:on\\s+)?\\d{1,2}[-/.]\\d{1,2}[-/.]\\d{2,4}.*$")
              private val atmRe = Regex("(?i)\\batm\\b")

              fun pretty(s: String): String {
                  var t = s.trim().replace(trailDateRe, "").trimEnd('.', '-', ',', ' ')
                  if (t.contains("@")) return t.lowercase()
                  if (t.none { it.isLowerCase() }) {
                      t = t.lowercase().split(" ").joinToString(" ") { w -> w.replaceFirstChar { ch -> ch.uppercase() } }
                  }
                  return t.take(30)
              }

              private fun findAmount(body: String): Double? {
                  for (m in amountRe.findAll(body)) {
                      val before = body.substring(maxOf(0, m.range.first - 18), m.range.first).lowercase()
                      if (before.contains("bal") || before.contains("avl") || before.contains("available") || before.contains("limit")) continue
                      val v = m.groupValues[1].replace(",", "").toDoubleOrNull()
                      if (v != null && v > 0) return v
                  }
                  val m2 = amountAfterRe.find(body)
                  val v2 = m2?.groupValues?.get(1)?.replace(",", "")?.toDoubleOrNull()
                  return if (v2 != null && v2 > 0) v2 else null
              }

              private fun findMerchant(body: String, debit: Boolean): String? {
                  val cands = ArrayList<String>()
                  upiSlashRe.find(body)?.let { cands.add(it.groupValues[1]) }
                  for (m in (if (debit) toRe else fromRe).findAll(body)) cands.add(m.groupValues[1])
                  if (debit) semiRe.find(body)?.let { cands.add(it.groupValues[1]) }
                  vpaWordRe.find(body)?.let { cands.add(it.groupValues[1]) }
                  infoRe.find(body)?.let { cands.add(it.groupValues[1]) }
                  for (c in cands) if (valid(c)) return pretty(c)
                  return null
              }

              private fun channelOf(b: String): String {
                  val l = b.lowercase()
                  return when {
                      "fastag" in l || "netc" in l -> "FASTAG"
                      "upi" in l || "vpa" in l -> "UPI"
                      "imps" in l -> "IMPS"
                      "neft" in l -> "NEFT"
                      "rtgs" in l -> "RTGS"
                      "atm" in l -> "ATM"
                      "card" in l -> "CARD"
                      "wallet" in l -> "WALLET"
                      else -> "OTHER"
                  }
              }

              fun extract(body: String): Fields {
                  val f = Fields()
                  val d = debitRe.find(body)
                  val c = creditRe.find(body)
                  if (d != null || c != null) f.debit = if (d != null && c != null) d.range.first < c.range.first else d != null
                  f.amount = findAmount(body)
                  f.balance = balanceRe.find(body)?.groupValues?.get(1)?.replace(",", "")?.toDoubleOrNull()
                  f.account = acctRe.find(body)?.groupValues?.get(1)
                  f.ref = refRe.find(body)?.groupValues?.get(1)
                  f.vpa = vpaRe.find(body)?.groupValues?.get(1)?.lowercase()
                  f.channel = channelOf(body)
                  f.merchant = findMerchant(body, f.debit != false)
                  return f
              }

              /** Full pipeline: noise filter -> sender identify -> regex -> learned patterns -> NB type -> heuristic -> category. */
              fun build(ctx: Context, db: Db, sender: String, rawBody: String, ts: Long, noiseCheck: Boolean = true): Txn? {
                  if (sender.none { it.isLetter() }) return null
                  val body = rawBody.replace("\n", " ").replace(Regex("\\s+"), " ").trim()
                  if (noiseCheck && noiseRe.containsMatchIn(body)) return null
                  if (!amountRe.containsMatchIn(body) && !amountAfterRe.containsMatchIn(body)) return null
                  if (!accountRe.containsMatchIn(body)) return null

                  val inst = SenderMap.identify(db, sender).first
                  val core = SenderMap.core(sender)
                  val tpl = Skeleton.hash(body)
                  val f = extract(body)
                  var status = "REGEX"

                  val learned = Learner.applyPatterns(db, core, tpl, body)
                  if (learned != null) { f.merchant = pretty(learned); status = "LEARNED" }

                  if (f.debit == null) {
                      val p = Learner.predictDebit(db, body)
                      if (p != null) { f.debit = p; status = "HEURISTIC" }
                  }
                  if (f.merchant == null) {
                      val h = Heuristic.merchant(body, inst)
                      if (h != null) { f.merchant = h; if (status == "REGEX") status = "HEURISTIC" }
                  }
                  if (f.merchant == null && atmRe.containsMatchIn(body)) f.merchant = "ATM Withdrawal"
                  val amount = f.amount ?: return null
                  if (f.debit == null) { f.debit = true; status = "FAILED" }
                  val debit = f.debit == true
                  var merchant = f.merchant ?: "Unknown"

                  val category: String
                  if (tollRe.containsMatchIn(body)) {
                      if (debit) {
                          val p = Tolls.match(ctx, "$merchant $body", amount)
                          if (p != null) merchant = p.name else if (merchant == "Unknown") merchant = "FASTag Toll"
                      } else if (merchant == "Unknown") merchant = "FASTag Recharge"
                      category = "FASTag"
                  } else {
                      category = Learner.category(db, Learner.norm(merchant)) ?: Categories.classify(merchant, body, debit)
                  }
                  val review = status == "HEURISTIC" || status == "FAILED" || (debit && merchant == "Unknown")
                  return Txn(
                      smsKey = sender + "|" + body.hashCode(), ts = ts, amount = amount, debit = debit,
                      merchant = merchant, category = category, institution = inst, account = f.account,
                      balance = f.balance, channel = f.channel, ref = f.ref, vpa = f.vpa, sender = sender,
                      body = body, source = "SMS", status = status, tpl = tpl, review = review
                  )
              }
          }

          object SmsImport {
              fun run(ctx: Context): Int {
                  val db = Db.get(ctx)
                  val prefs = ctx.getSharedPreferences("fin", Context.MODE_PRIVATE)
                  val last = prefs.getLong("last_sms_date", 0L)
                  var maxDate = last
                  var count = 0
                  val cur = ctx.contentResolver.query(
                      Uri.parse("content://sms/inbox"), arrayOf("address", "body", "date"),
                      "date > ?", arrayOf(last.toString()), "date ASC"
                  ) ?: return 0
                  val w = db.writableDatabase
                  w.beginTransaction()
                  try {
                      cur.use { c ->
                          val iA = c.getColumnIndex("address")
                          val iB = c.getColumnIndex("body")
                          val iD = c.getColumnIndex("date")
                          while (c.moveToNext()) {
                              val date = c.getLong(iD)
                              if (date > maxDate) maxDate = date
                              val t = SmsEngine.build(ctx, db, c.getString(iA) ?: "", c.getString(iB) ?: "", date)
                              if (t != null && Repo.save(ctx, t) > 0) count++
                          }
                      }
                      w.setTransactionSuccessful()
                  } finally {
                      w.endTransaction()
                  }
                  prefs.edit().putLong("last_sms_date", maxDate).apply()
                  return count
              }
          }

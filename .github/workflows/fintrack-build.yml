      - name: Prepare toll data
        run: |
          python3 - <<'EOF_PY'
          import json, os
          src = os.path.join(os.environ.get("GITHUB_WORKSPACE", "."), "india_toll_plazas_master_nhai.json")
          out = []
          def num(x):
              try:
                  return float(x)
              except Exception:
                  return None
          if os.path.exists(src):
              for r in json.load(open(src, encoding="utf-8")):
                  la = num(r.get("latitude"))
                  lo = num(r.get("longitude"))
                  if la is None or lo is None or not (6 < la < 38 and 67 < lo < 98):
                      continue
                  nh = r.get("nh_no")
                  out.append({"i": r.get("tollplaza_id"), "n": (r.get("tollplaza_name") or "").strip(),
                              "s": (r.get("state_name") or "").strip(), "h": nh.strip() if isinstance(nh, str) else "",
                              "la": round(la, 6), "lo": round(lo, 6), "c": num(r.get("car_single"))})
          else:
              print("WARNING: india_toll_plazas_master_nhai.json not found in repo root - travel map will be empty")
          os.makedirs("/tmp/proj/app/src/main/assets", exist_ok=True)
          json.dump(out, open("/tmp/proj/app/src/main/assets/tolls.json", "w", encoding="utf-8"), ensure_ascii=False, separators=(",", ":"))
          print("toll plazas:", len(out))
          EOF_PY
      - name: Build
        working-directory: /tmp/proj
        run: gradle assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ github.run_number }}" /tmp/proj/app/build/outputs/apk/debug/app-debug.apk --repo "${{ github.repository }}" --title "FinTrack build ${{ github.run_number }}" --notes "Debug APK"

          EOF_BG

          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "ImransFinances"
          include(":app")
          EOF_0
          cat > build.gradle.kts <<'EOF_1'
          plugins { id("com.android.application") version "8.5.2" apply false; id("org.jetbrains.kotlin.android") version "1.9.24" apply false }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF_2
          cat > app/build.gradle.kts <<'EOF_3'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.example.fintrack"; compileSdk = 34

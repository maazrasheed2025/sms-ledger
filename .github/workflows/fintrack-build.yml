              private val accountRe = Regex("""(?i)(a/c|\bac\b|acct|account|card|upi|bank|wallet|neft|imps|rtgs|atm|fastag|netc|lan|mobikwik|x{2,}\d{2,}|\*{2,}\d{2,})""")
              private val debitRe = Regex("""(?i)\b(debited|spent|paid|withdrawn|withdrawal|purchase|sent|transferred|deducted|charged|debit of|emi outstanding)\b""")
              private val creditRe = Regex("""(?i)\b(credited|received|deposited|refund(?:ed)?|added to)\b""")
              private val balanceRe = Regex("""(?i)(?:avl\.?\s*bal(?:ance)?|available\s*bal(?:ance)?|bal(?:ance)?|remaining balance:?\s*rs\.?)\s*(?:is|:|-)?\s*(?:rs\.?|inr|₹)?\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)""")
              private val acctRe = Regex("""(?i)(?:a/c|acct?|account|card|lan)\.?\s*(?:no\.?|number)?\s*(?:ending(?:\s+(?:with|in))?)?\s*(?:x+|\*+|#)?\s*([A-Za-z0-9]{3,20})\b""")
              private val refRe = Regex("""(?i)(?:upi\s*ref(?:\s*no)?|ref(?:erence)?\s*(?:no|number|id)?|rrn|utr)\s*[:.\-]?\s*([A-Za-z0-9]{6,22})""")
              private val vpaRe = Regex("""(?i)\b([a-z0-9][\w.\-]+@[a-z][a-z0-9]+)\b(?!\.[a-z]{2,3}\b)""")
              private val tollRe = Regex("""(?i)(?:^|[^a-z])(?:fastag|netc|toll|plaza|nhai|ihmcl)(?:[^a-z]|$)""")
              private val walletAfterRe = Regex("""(?i)\b([A-Za-z][A-Za-z0-9]{1,20})\s+wallet\b""")
              private val walletBeforeRe = Regex("""(?i)\bwallet\s+([A-Za-z][A-Za-z0-9]{1,20})\b""")
              private val knownWallets = setOf("paytm","mobikwik","amazon","airtel","jio","phonepe","freecharge","olamoney","slice","dhani")
              private val toRe = Regex("""(?i)\b(?:to|at|against)\s+([A-Za-z][A-Za-z0-9 &.\-']{2,30}?)(?=\s+(?:on|ref\w*|via|upi|using|avl|bal|a/c|account|txn|not|if|vide|dated|date|may)\b|[.,;(]|$)""")
              private val fromRe = Regex("""(?i)\b(?:from|by)\s+([A-Za-z][A-Za-z0-9 &.\-']{2,30}?)(?=\s+(?:on|ref\w*|via|upi|using|avl|bal|a/c|account|txn|not|if|vide|dated|date)\b|[.,;(]|$)""")
              private val vpaWordRe = Regex("""(?i)\bvpa\s+([\w.\-]+@[\w.\-]+)""")
              private val upiSlashRe = Regex("""(?i)upi/\w+/\d+/([A-Za-z][A-Za-z0-9 .\-]{2,30}?)(?:/|$)""")
              private val semiRe = Regex("""(?i)[;,]\s*([A-Za-z][A-Za-z0-9 &.\-']{2,30}?)\s+credited""")
              private val infoRe = Regex("""(?i)info[:\-\s]+([A-Za-z0-9 &.\-/@']{3,30})""")
              private val loanNoRe = Regex("""(?i)\b(?:lan|loan\s*(?:a/?c|account|ac|no|number))\s*[:#\-]?\s*([A-Z0-9]{6,20})\b""")
              private val stopExact = setOf("upi","neft","imps","rtgs","a/c","ac","acct","account","you","bank","card","self")
              private val stopStarts = listOf("your","a/c","ac ","acct","account","upi ","bank","card","you ")
              private fun valid(s: String): Boolean {
                  val t = s.trim().lowercase(); if (t.length < 3 || t in stopExact) return false
                  for (p in stopStarts) if (t.startsWith(p)) return false
                  return true
              }
              private val trailDateRe = Regex("""(?i)\s+(?:on\s+)?\d{1,2}[-/.]\d{1,2}[-/.]\d{2,4}.*$""")
              private val atmRe = Regex("""(?i)\b(atm|withdrawn)\b""")
              fun pretty(s: String): String {
                  var t = s.trim().replace(trailDateRe, "").trimEnd('.', '-', ',', ' ')
                  if (t.contains("@")) return t.lowercase()
                  if (t.none { it.isLowerCase() }) t = t.lowercase().split(" ").joinToString(" ") { w -> w.replaceFirstChar { ch -> ch.uppercase() } }
                  return t.take(30)
              }
              private fun cleanVpa(raw: String?): String? {
                  if (raw.isNullOrBlank()) return null
                  var v = raw.trim().lowercase()
                  while (v.endsWith(".") || v.endsWith(",") || v.endsWith(";") || v.endsWith(":")) v = v.dropLast(1)
                  v = v.removeSuffix(".ref").removeSuffix(".refno")
                  if (!v.contains("@")) return null
                  return v
              }
              private fun findAmount(body: String): Double? {
                  for (m in amountRe.findAll(body)) {
                      val before = body.substring(maxOf(0, m.range.first - 18), m.range.first).lowercase()
                      if (before.contains("bal") || before.contains("avl") || before.contains("available") || before.contains("limit")) continue
                      val v = m.groupValues[1].replace(",", "").toDoubleOrNull(); if (v != null && v > 0) return v
                  }
                  val m2 = amountAfterRe.find(body); val v2 = m2?.groupValues?.get(1)?.replace(",", "")?.toDoubleOrNull()
                  return if (v2 != null && v2 > 0) v2 else null
              }
              private fun findMerchant(body: String, debit: Boolean): String? {
                  val cands = ArrayList<String>()
                  upiSlashRe.find(body)?.let { cands.add(it.groupValues[1]) }
                  for (m in (if (debit) toRe else fromRe).findAll(body)) cands.add(m.groupValues[1])
                  if (debit) semiRe.find(body)?.let { cands.add(it.groupValues[1]) }
                  vpaWordRe.find(body)?.let { cands.add(it.groupValues[1]) }
                  infoRe.find(body)?.let { cands.add(it.groupValues[1]) }
                  for (c in cands) if (valid(c)) return pretty(c)
                  return null
              }
              private fun detectWallet(body: String): String? {
                  val a = walletAfterRe.find(body)?.groupValues?.get(1)
                  if (a != null && a.lowercase() in knownWallets) return pretty(a) + " Wallet"
                  val b = walletBeforeRe.find(body)?.groupValues?.get(1)
                  if (b != null && b.lowercase() in knownWallets) return pretty(b) + " Wallet"
                  if (body.contains("wallet", true) && a != null) return pretty(a) + " Wallet"
                  return null
              }
              private fun channelOf(b: String, wallet: String?): String {
                  if (wallet != null) return "WALLET"
                  val l = b.lowercase()
                  return when {
                      "fastag" in l || "netc" in l || "ihmcl" in l -> "FASTAG"
                      "upi" in l || "vpa" in l -> "UPI"
                      "imps" in l -> "IMPS"
                      "neft" in l -> "NEFT"
                      "rtgs" in l -> "RTGS"
                      "atm" in l || "withdrawn" in l -> "ATM"
                      "card" in l -> "CARD"
                      "wallet" in l -> "WALLET"
                      else -> "OTHER"
                  }
              }
              fun extract(body: String): Fields {
                  val f = Fields()
                  val d = debitRe.find(body); val c = creditRe.find(body)
                  if (d != null || c != null) f.debit = if (d != null && c != null) d.range.first < c.range.first else d != null
                  f.amount = findAmount(body)
                  f.balance = balanceRe.find(body)?.groupValues?.get(1)?.replace(",", "")?.toDoubleOrNull()
                  f.account = acctRe.find(body)?.groupValues?.get(1)
                  f.ref = refRe.find(body)?.groupValues?.get(1)
                  f.vpa = cleanVpa(vpaRe.find(body)?.groupValues?.get(1))
                  f.walletName = detectWallet(body)
                  f.channel = channelOf(body, f.walletName)
                  f.merchant = findMerchant(body, f.debit != false)
                  f.loanNo = loanNoRe.find(body)?.groupValues?.get(1)?.uppercase()
                  return f
              }
              fun toCanonical(t: Txn): Canonical = Canonical(t.institution, t.account ?: "", t.ts, t.body, t.ref ?: "", if (t.debit) t.amount else 0.0, if (!t.debit) t.amount else 0.0)
              private val wsRe = Regex("""\s+""")
              fun build(ctx: Context, db: Db, sender: String, rawBody: String, ts: Long, noiseCheck: Boolean = true): Txn? {
                  if (sender.none { it.isLetter() }) return null
                  val body = rawBody.replace("\n", " ").replace(wsRe, " ").trim()
                  if (noiseCheck && noiseRe.containsMatchIn(body)) return null
                  if (!amountRe.containsMatchIn(body) && !amountAfterRe.containsMatchIn(body)) return null
                  if (!accountRe.containsMatchIn(body)) return null
                  val instBase = SenderMap.identify(db, sender).first
                  val core = SenderMap.core(sender); val tpl = Skeleton.hash(body)
                  val f = extract(body); val inst = f.walletName ?: instBase
                  var status = "REGEX"
                  val learned = Learner.applyPatterns(db, core, tpl, body)
                  if (learned != null) { f.merchant = pretty(learned); status = "LEARNED" }
                  if (f.debit == null) { val p = Learner.predictDebit(db, body); if (p != null) { f.debit = p; status = "HEURISTIC" } }
                  if (f.merchant == null) { val h = Heuristic.merchant(body, inst); if (h != null) { f.merchant = h; if (status == "REGEX") status = "HEURISTIC" } }
                  if (f.merchant == null && atmRe.containsMatchIn(body)) f.merchant = "ATM Withdrawal"
                  if (f.merchant == null && f.walletName != null) f.merchant = f.walletName
                  if (f.merchant == null || f.amount == null) {
                      val aiFields = AiParser.parseUnknownSms(body)
                      if (aiFields != null) {
                          if (f.amount == null) f.amount = aiFields.amount
                          if (f.debit == null) f.debit = aiFields.debit
                          if (f.merchant == null) f.merchant = aiFields.merchant
                          if (f.balance == null) f.balance = aiFields.balance
                          if (f.account == null) f.account = aiFields.account
                          status = "AI_PARSED"
                      }
                  }
                  val amount = f.amount ?: return null
                  if (f.debit == null) { f.debit = true; status = "FAILED" }
                  val debit = f.debit == true
                  var merchant = f.merchant ?: "Unknown"
                  val category: String
                  if (tollRe.containsMatchIn(body)) {
                      if (debit) { val p = Tolls.match(ctx, "$merchant $body", amount); if (p != null) merchant = p.name else if (merchant == "Unknown") merchant = "FASTag Toll" }
                      else if (merchant == "Unknown") merchant = "FASTag Recharge"
                      category = "Travel"
                  } else {
                      category = Learner.category(db, Learner.norm(merchant)) ?: Categories.classify(merchant, body, debit)
                  }
                  val review = status == "HEURISTIC" || status == "FAILED" || (debit && merchant == "Unknown")
                  val t = Txn(smsKey = sender + "|" + body.hashCode(), ts = ts, amount = amount, debit = debit, merchant = merchant, category = category, institution = inst, account = f.account, balance = f.balance, channel = f.channel, ref = f.ref, vpa = f.vpa, sender = sender, body = body, source = "SMS", status = status, tpl = tpl, review = review, loanNo = f.loanNo)
                  if (review) t.reviewHash = db.computeReviewHash(t)
                  return t
              }
          }

          object SmsImport {
              fun run(ctx: Context): Int {
                  val db = Db.get(ctx); val prefs = ctx.getSharedPreferences("fin", Context.MODE_PRIVATE)
                  val last = prefs.getLong("last_sms_date", 0L); var maxDate = last; var count = 0
                  val cur = ctx.contentResolver.query(Uri.parse("content://sms/inbox"), arrayOf("address", "body", "date"), "date > ?", arrayOf(last.toString()), "date ASC") ?: return 0
                  val w = db.writableDatabase; w.beginTransaction()
                  try {
                      cur.use { c ->
                          val iA = c.getColumnIndex("address"); val iB = c.getColumnIndex("body"); val iD = c.getColumnIndex("date")
                          while (c.moveToNext()) {
                              val date = c.getLong(iD); if (date > maxDate) maxDate = date
                              val t = SmsEngine.build(ctx, db, c.getString(iA) ?: "", c.getString(iB) ?: "", date)
                              if (t != null && Repo.save(ctx, t) > 0) count++
                          }
                      }
                      w.setTransactionSuccessful()
                  } finally { w.endTransaction() }
                  prefs.edit().putLong("last_sms_date", maxDate).apply()
                  return count
              }
          }

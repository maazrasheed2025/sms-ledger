      - name: Build Debug APK
        working-directory: /tmp/proj
        run: gradle assembleDebug --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v8.7.${{ github.run_number }}"
          gh release create "$VERSION" /tmp/proj/app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "FinTrack Build ${{ github.run_number }}" \
            --notes "v8.7: map splits outbound (green) vs return (red) trips with arrow markers; duplicate finder now requires same amount+day+5min+sender; if merchants differ they are NOT flagged as duplicates."

name: Build and Release Imrans Finances APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Ensure Python + Pillow
        run: |
          python3 --version
          python3 -c "import PIL; print('Pillow OK', PIL.__version__)" || pip install --quiet Pillow

      - name: Generate project files
        run: |
          mkdir -p /tmp/proj/app/src/main/java/com/example/fintrack /tmp/proj/app/src/main/res/drawable /tmp/proj/app/src/main/res/values /tmp/proj/app/src/main/res/xml
          cd /tmp/proj
          SRC="$GITHUB_WORKSPACE/app/src/main/res"

          echo "########## ICON PIPELINE START ##########"
          ICON_SRC="$SRC/icon_source.png"
          echo "LOOKING FOR: $ICON_SRC"
          if [ -f "$ICON_SRC" ]; then echo "FILE EXISTS: YES ($(stat -c%s "$ICON_SRC") bytes)"; else echo "FILE EXISTS: NO"; fi
          ls -la "$SRC" | head -30
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/drawable-xxxhdpi app/src/main/res/mipmap-anydpi-v26

          if [ -f "$ICON_SRC" ]; then
            python3 - "$ICON_SRC" <<'PYEOF'
import sys, os
try:
    from PIL import Image
except ImportError:
    os.system("pip install --quiet Pillow")
    from PIL import Image
src = sys.argv[1]
img = Image.open(src).convert("RGBA")
print(f"[icon-py] opened {src}, size={img.size}, mode=RGBA")
base = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
w, h = img.size
scale = min(1024 / w, 1024 / h)
nw, nh = int(w * scale), int(h * scale)
img_r = img.resize((nw, nh), Image.LANCZOS)
base.paste(img_r, ((1024 - nw) // 2, (1024 - nh) // 2), img_r)
out_dir = "app/src/main/res"
sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
for d, s in sizes.items():
    im = base.resize((s, s), Image.LANCZOS)
    p = f"{out_dir}/mipmap-{d}/ic_launcher.png"
    im.save(p); im.save(f"{out_dir}/mipmap-{d}/ic_launcher_round.png")
    print(f"[icon-py] wrote {p} ({os.path.getsize(p)} bytes, {im.size})")
inner = base.resize((285, 285), Image.LANCZOS)
fg = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
fg.paste(inner, ((432 - 285) // 2, (432 - 285) // 2), inner)
fgp = f"{out_dir}/drawable-xxxhdpi/ic_launcher_foreground.png"
fg.save(fgp)
print(f"[icon-py] wrote {fgp} ({os.path.getsize(fgp)} bytes, {fg.size})")
PYEOF
            echo "########## ICON VERIFY ##########"
            for m in mdpi hdpi xhdpi xxhdpi xxxhdpi; do f="app/src/main/res/mipmap-$m/ic_launcher.png"; [ -f "$f" ] && echo "VERIFIED $f size=$(stat -c%s "$f")" || echo "MISSING $f"; done
            f="app/src/main/res/drawable-xxxhdpi/ic_launcher_foreground.png"; [ -f "$f" ] && echo "VERIFIED $f size=$(stat -c%s "$f")" || echo "MISSING $f"
          else
            echo "########## ICON FALLBACK (file not found) ##########"
            printf 'iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAQAAAAsXDIkAAAAEklEQVR4nGNgGAWjYBSMglEwCgAABv0B/2XqiqgAAAAASUVORK5CYII=' | base64 -d > app/src/main/res/mipmap-mdpi/ic_launcher.png
            for m in hdpi xhdpi xxhdpi xxxhdpi; do cp app/src/main/res/mipmap-mdpi/ic_launcher.png "app/src/main/res/mipmap-$m/ic_launcher.png"; cp app/src/main/res/mipmap-mdpi/ic_launcher.png "app/src/main/res/mipmap-$m/ic_launcher_round.png"; done
            cp app/src/main/res/mipmap-mdpi/ic_launcher.png "app/src/main/res/drawable-xxxhdpi/ic_launcher_foreground.png"
          fi
          echo "########## ICON PIPELINE END ##########"


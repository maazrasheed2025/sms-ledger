          class ChartsScreen(act: MainActivity) : Screen(act) {
              private var year = Calendar.getInstance().get(Calendar.YEAR); private var month = Calendar.getInstance().get(Calendar.MONTH)
              private val body = act.vbox(14)
              override val root: View = ScrollView(act).apply { addView(body) }
              override fun refresh() {
                  body.removeAllViews()
                  val db = Db.get(act)
                  val cal = Calendar.getInstance().apply { set(Calendar.YEAR, year); set(Calendar.MONTH, month); set(Calendar.DAY_OF_MONTH, 1); set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0); set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0) }
                  val start = cal.timeInMillis; cal.add(Calendar.MONTH, 1); val end = cal.timeInMillis
                  val label = SimpleDateFormat("MMMM yyyy", Locale.getDefault()).format(Date(start))
                  val bar = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setBackgroundColor(C.CARD); setPadding(act.dp(6), act.dp(6), act.dp(6), act.dp(6)) }
                  bar.addView(act.tv("◀", 20f, C.TEXT).apply { setPadding(act.dp(12), act.dp(6), act.dp(12), act.dp(6)); setOnClickListener { month--; if (month < 0) { month = 11; year-- }; refresh() } })
                  bar.addView(act.tv(label, 17f, C.TEXT, true).apply { gravity = Gravity.CENTER }, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  bar.addView(act.tv("▶", 20f, C.TEXT).apply { setPadding(act.dp(12), act.dp(6), act.dp(12), act.dp(6)); setOnClickListener { month++; if (month > 11) { month = 0; year++ }; refresh() } })
                  body.addView(bar)
                  val spent = db.num("SELECT SUM(amount) FROM txn WHERE debit=1 AND ts>=? AND ts<?", start.toString(), end.toString())
                  val recv = db.num("SELECT SUM(amount) FROM txn WHERE debit=0 AND ts>=? AND ts<?", start.toString(), end.toString())
                  val cats = db.rows("SELECT category, SUM(amount) AS s FROM txn WHERE debit=1 AND ts>=? AND ts<? GROUP BY category ORDER BY s DESC", start.toString(), end.toString())
                  val s = act.card(); s.addView(act.tv("${Str.s("expenses")} · $label", 12f, C.MUTED)); s.addView(act.tv(inr(spent), 28f, C.RED, true)); s.addView(act.tv("${Str.s("income")}: ${inr(recv)}", 13f, C.GREEN)); body.put(s)
                  if (cats.isEmpty()) { val e = act.card(); e.addView(act.tv(Str.s("no_data_month"), 15f, C.TEXT, true)); body.put(e); return }
                  val d = DonutView(act); d.layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, act.dp(280))
                  val pal = intArrayOf(C.ACCENT, C.ACCENT2, C.RED, C.AMBER, Color.parseColor("#C084FC"), Color.parseColor("#22D3EE"))
                  d.updateSlices(cats.mapIndexed { i, r -> DonutView.Slice(r["category"] ?: "", (r["s"]?.toDoubleOrNull() ?: 0.0).toFloat(), pal[i % pal.size]) })
                  val cc = act.card(); cc.addView(act.tv(Str.s("category_split"), 15f, C.TEXT, true)); cc.addView(d); body.put(cc)
              }
          }


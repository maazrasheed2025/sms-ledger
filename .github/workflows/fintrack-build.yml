          private val OSM = object : OnlineTileSourceBase("OSM", 0, 19, 256, ".png",
              arrayOf("https://a.tile.openstreetmap.fr/hot/","https://b.tile.openstreetmap.fr/hot/"),
              "© OSM") {
              override fun getTileURLString(idx: Long): String =

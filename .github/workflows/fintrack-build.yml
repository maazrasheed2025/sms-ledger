              private val list = ListView(act).apply {
                  divider = null
                  adapter = this@PayeesScreen.adapter
                  setOnItemClickListener { _, _, pos, _ ->
                      val p = this@PayeesScreen.adapter.items.getOrNull(pos) ?: return@setOnItemClickListener
                      if (selectMode) {
                          val k = p["k"] ?: return@setOnItemClickListener
                          if (!selected.add(k)) selected.remove(k)
                          this@PayeesScreen.adapter.notifyDataSetChanged()
                          this@PayeesScreen.refresh()
                      } else this@PayeesScreen.showPayee(p)
                  }
                  setOnItemLongClickListener { _, _, pos, _ ->
                      val p = this@PayeesScreen.adapter.items.getOrNull(pos) ?: return@setOnItemLongClickListener false
                      val k = p["k"] ?: return@setOnItemLongClickListener false
                      selectMode = true
                      selected.add(k)
                      this@PayeesScreen.adapter.notifyDataSetChanged()
                      this@PayeesScreen.refresh()
                      true
                  }
              }
              override val root: View = act.vbox().apply {
                  put(HorizontalScrollView(act).apply { isHorizontalScrollBarEnabled = false; addView(sortChips) }, 2)
                  put(summary, 0)
                  put(list, 0, 1f)
              }

              override fun refresh() {
                  sortChips.removeAllViews()
                  sortChips.addView(act.pill("Count", sortMode == "count") { sortMode = "count"; refresh() })
                  sortChips.addView(act.pill("Name", sortMode == "name") { sortMode = "name"; refresh() })
                  sortChips.addView(act.pill("Recent", sortMode == "recent") { sortMode = "recent"; refresh() })
                  sortChips.addView(act.pill("Total", sortMode == "total") { sortMode = "total"; refresh() })
                  if (selectMode) {
                      sortChips.addView(act.pill("Merge (${selected.size})", true) {
                          if (selected.size < 2) { act.toast("Kam se kam 2 payees chuno"); return@pill }
                          askMerge(selected.toList())
                      })
                      sortChips.addView(act.pill("Cancel", false) {
                          selectMode = false; selected.clear(); refresh()
                      })
                  }

                  val order = when (sortMode) {
                      "name" -> "p.display ASC"
                      "recent" -> "last DESC"
                      "total" -> "spent DESC"
                      else -> "n DESC"
                  }
                  val rows = Db.get(act).rows(
                      "SELECT p.merchant_key AS k, p.display AS display, p.upi_id AS upi_id, " +
                          "COUNT(t.id) AS n, " +
                          "SUM(CASE WHEN t.debit=1 THEN t.amount ELSE 0 END) AS spent, " +
                          "SUM(CASE WHEN t.debit=0 THEN t.amount ELSE 0 END) AS recv, " +
                          "MAX(t.ts) AS last " +
                          "FROM payees p LEFT JOIN txn t ON t.merchant_key = p.merchant_key " +
                          "GROUP BY p.merchant_key ORDER BY $order LIMIT 400"
                  )
                  adapter.items = rows
                  adapter.notifyDataSetChanged()
                  summary.text = "${rows.size} payees  •  long-press to select, then Merge"
              }

              private fun askMerge(keys: List<String>) {
                  val names = keys.map { k ->
                      Db.get(act).one("SELECT display FROM payees WHERE merchant_key=?", k) ?: k
                  }
                  val options = names.toMutableList()
                  options.add("Custom name…")
                  AlertDialog.Builder(act).setTitle("Survivor naam")
                      .setItems(options.toTypedArray()) { _, i ->
                          if (i == options.size - 1) {
                              act.showForm("Custom survivor name", listOf(Field("Naam", names.first()))) { v ->
                                  doMerge(keys, v[0])
                              }
                          } else doMerge(keys, names[i])
                      }
                      .setNegativeButton("Cancel", null).show()
              }

              private fun doMerge(keys: List<String>, survivorName: String) {
                  val survivorKey = Learner.norm(survivorName)
                  Thread {
                      PayeeOps.merge(act, keys, survivorKey, survivorName)
                      act.runOnUiThread {
                          selectMode = false; selected.clear()
                          act.toast("Merged ${keys.size} payees into $survivorName")
                          this.refresh()
                      }
                  }.start()
              }

              private fun showPayee(p: Map<String, String?>) {
                  val key = p["k"] ?: return
                  val name = p["display"] ?: key
                  val db = Db.get(act)
                  val all = db.queryTxns("merchant_key=?", arrayOf(key), 500)
                  val spent = all.filter { it.debit }.sumOf { it.amount }
                  val recv = all.filter { !it.debit }.sumOf { it.amount }
                  val alt = db.one("SELECT alt_upis FROM payees WHERE merchant_key=?", key)

                  val col = act.vbox(10)
                  col.addView(act.tv("Out: ${inr(spent)}  •  In: ${inr(recv)}  •  Net: ${inr(recv - spent)}", 13f, C.TEXT, true))
                  if (!p["upi_id"].isNullOrBlank()) col.addView(act.tv("UPI: ${p["upi_id"]}", 12f, C.MUTED))
                  if (!alt.isNullOrBlank()) col.addView(act.tv("Alt UPI: $alt", 12f, C.MUTED))

                  val lv = ListView(act)
                  val hist = RowAdapter<Txn>(act, all) { t, r ->
                      r.icon.setImageResource(iconFor(t.category))
                      r.icon.setColorFilter(if (t.debit) C.RED else C.GREEN)
                      r.title.text = if (t.debit) "→ ${t.category}" else "← Received"
                      r.sub.text = fmtDateTime(t.ts) + " • " + t.institution
                      r.amt.text = (if (t.debit) "-" else "+") + inr(t.amount, true)
                      r.amt.setTextColor(if (t.debit) C.RED else C.GREEN)
                  }
                  lv.adapter = hist
                  col.addView(lv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, act.dp(320)))

                  AlertDialog.Builder(act).setTitle(name).setView(ScrollView(act).apply { addView(col) })
                      .setPositiveButton("UPI se pay") { _, _ -> pay(key, name, p["upi_id"]) }
                      .setNeutralButton("UPI edit") { _, _ -> editUpi(key, name, p["upi_id"]) }
                      .setNegativeButton("Band karo", null)
                      .show()
              }

              private fun editUpi(key: String, name: String, cur: String?) {
                  act.showForm("UPI ID: $name", listOf(Field("UPI ID (name@bank)", cur ?: ""))) { v ->
                      Db.get(act).exec("UPDATE payees SET upi_id=? WHERE merchant_key=?", v[0].ifBlank { null }, key)
                      refresh()
                  }
              }

              private fun pay(key: String, name: String, upi: String?) {
                  if (upi.isNullOrBlank() || !upi.contains("@")) { act.toast("Pehle UPI ID daalo"); editUpi(key, name, upi); return }
                  act.showForm("Pay: $name", listOf(Field("Amount (optional)", "", true), Field("Note (optional)", "")), "Pay") { v ->
                      var url = "upi://pay?pa=" + Uri.encode(upi) + "&pn=" + Uri.encode(name) + "&cu=INR"
                      val amt = v[0].toDoubleOrNull()
                      if (amt != null && amt > 0) url += "&am=" + String.format(java.util.Locale.US, "%.2f", amt)
                      if (v[1].isNotBlank()) url += "&tn=" + Uri.encode(v[1])
                      try {
                          act.startActivity(Intent.createChooser(Intent(Intent.ACTION_VIEW, Uri.parse(url)), "Pay with"))
                      } catch (e: Exception) {
                          act.toast("Koi UPI app nahi mili")
                      }
                  }
              }
          }

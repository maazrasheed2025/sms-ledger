          data class ScanReport(val scanned: Int, val imported: Int, val duplicates: Int, val ignored: Int, val maxTs: Long)

          object SmsImport {
              fun run(ctx: Context): ScanReport {
                  val db = Db.get(ctx); val prefs = ctx.getSharedPreferences("fin", Context.MODE_PRIVATE)
                  val last = prefs.getLong("last_sms_date", 0L); var maxDate = last
                  var scanned = 0; var imported = 0; var duplicates = 0; var ignored = 0
                  val cur = ctx.contentResolver.query(Uri.parse("content://sms/inbox"), arrayOf("address", "body", "date"), "date > ?", arrayOf(last.toString()), "date ASC") ?: return ScanReport(0,0,0,0,maxDate)
                  val w = db.writableDatabase; w.beginTransaction()
                  try {
                      cur.use { c ->
                          val iA = c.getColumnIndex("address"); val iB = c.getColumnIndex("body"); val iD = c.getColumnIndex("date")
                          while (c.moveToNext()) {
                              scanned++
                              val date = c.getLong(iD); if (date > maxDate) maxDate = date
                              val body = c.getString(iB) ?: ""
                              val sender = c.getString(iA) ?: ""
                              val t = SmsEngine.build(ctx, db, sender, body, date)
                              if (t == null) { ignored++; continue }
                              val existing = db.one("SELECT id FROM txn WHERE sms_key=?", t.smsKey ?: "")
                              if (existing != null) { duplicates++; continue }
                              if (Repo.save(ctx, t) > 0) imported++ else duplicates++
                          }
                      }
                      w.setTransactionSuccessful()
                  } finally { w.endTransaction() }
                  prefs.edit().putLong("last_sms_date", maxDate).apply()
                  return ScanReport(scanned, imported, duplicates, ignored, maxDate)
              }
          }

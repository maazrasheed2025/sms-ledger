                  r.sub.text = "${p["n"]} payments • last ${fmtDate(p["last"]?.toLongOrNull() ?: 0L)}" + (if (upi.isNullOrBlank()) " • UPI ID nahi" else " • $upi")
                  r.amt.text = inr(p["total"]?.toDoubleOrNull() ?: 0.0)
                  r.amt.setTextColor(C.RED)
              }
              private val list = ListView(act).apply {
                  divider = null
                  adapter = this@PayeesScreen.adapter
                  setOnItemClickListener { _, _, pos, _ -> this@PayeesScreen.adapter.items.getOrNull(pos)?.let { showPayee(it) } }
              }

          object Tolls {
              val TOLL_SEED: Map<String, DoubleArray> = linkedMapOf("Nawabganj Toll Plaza" to doubleArrayOf(80.6591, 26.6214), "Shahabpur Toll Plaza" to doubleArrayOf(81.1422, 26.7845), "Aaini Toll Plaza" to doubleArrayOf(81.9845, 26.8012), "Newada Toll Plaza" to doubleArrayOf(81.1234, 26.5120), "Basheerapur Toll Plaza" to doubleArrayOf(81.6789, 26.2345), "Tarwa Deva" to doubleArrayOf(82.1234, 25.9876))
              private var index: Map<String, List<Plaza>> = emptyMap()

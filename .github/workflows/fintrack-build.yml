                  for (t in txns) {
                      val key = dayKey(t.ts) + "|" + String.format(java.util.Locale.US, "%.2f", t.amount) + "|" + (if (t.debit) "D" else "C")
                      buckets.getOrPut(key) { ArrayList() }.add(t)
                  }
                  for ((_, list) in buckets) {
                      if (list.size < 2) continue
                      val midnight = list.filter { isMidnight(it.ts) }
                      val timed = list.filter { !isMidnight(it.ts) }
                      if (midnight.isNotEmpty() && timed.isNotEmpty()) for (m in midnight) toDelete.add(m.id)

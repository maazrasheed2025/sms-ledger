                          override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {}
                          override fun afterTextChanged(s: android.text.Editable?) { query = s?.toString()?.trim() ?: ""; refresh() }
                      })
                  }
                  put(search, 8)
                  put(HorizontalScrollView(act).apply { isHorizontalScrollBarEnabled = false; addView(chips) }, 4)
                  put(summary, 0)

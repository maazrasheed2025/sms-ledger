                  put(HorizontalScrollView(act).apply { isHorizontalScrollBarEnabled = false; addView(chips) }, 2)
                  put(map, 4, 1f)
                  put(ScrollView(act).apply { addView(detail) }, 4)
                  (getChildAt(childCount - 1).layoutParams as LinearLayout.LayoutParams).height = act.dp(180)
              }

              override fun refresh() {
                  val rows = Db.get(act).rows("SELECT * FROM toll_trips ORDER BY ts ASC")
                  val trips = ArrayList<MutableList<Map<String, String?>>>()
                  var lastTs = 0L
                  for (r in rows) {
                      val ts = r["ts"]?.toLongOrNull() ?: 0L
                      if (trips.isEmpty() || ts - lastTs > 8 * 3600_000L) trips.add(ArrayList())
                      trips.last().add(r)
                      lastTs = ts
                  }
                  val total = rows.sumOf { it["amount"]?.toDoubleOrNull() ?: 0.0 }
                  summary.text = "${trips.size} trips  •  ${rows.size} toll plazas  •  Total toll ${inr(total)}" +
                      (if (Tolls.count(act) == 0) "\n(Toll database load nahi hui - Money screen se JSON upload karo)" else "")

                  if (sel >= trips.size) sel = -1
                  chips.removeAllViews()
                  chips.addView(act.pill("All", sel == -1) { sel = -1; refresh() })
                  for (i in trips.indices.reversed().take(30)) {
                      val t = trips[i]
                      val amt = t.sumOf { it["amount"]?.toDoubleOrNull() ?: 0.0 }
                      val d = fmtDate(t.first()["ts"]?.toLongOrNull() ?: 0L)
                      chips.addView(act.pill("$d • ${t.size} tolls • ${inr(amt)}", sel == i) { sel = i; refresh() })
                  }

                  val chosen = if (sel == -1) trips else listOf(trips[sel])
                  map.setTrips(chosen.map { tr ->
                      tr.map { RouteMapView.Pt(it["lat"]?.toDoubleOrNull() ?: 0.0, it["lon"]?.toDoubleOrNull() ?: 0.0, it["plaza"] ?: "") }
                  })
                  detail.removeAllViews()

                  val unmatched = Db.get(act).rows(
                      "SELECT id, ts, merchant, amount FROM txn WHERE category='Travel' AND debit=1 AND (SELECT COUNT(*) FROM toll_trips t WHERE t.txn_id=txn.id)=0 AND (LOWER(body) LIKE '%toll%' OR LOWER(body) LIKE '%fastag%' OR LOWER(body) LIKE '%plaza%') ORDER BY ts DESC LIMIT 30"
                  )
                  if (unmatched.isNotEmpty()) {
                      detail.addView(act.tv("Toll SMS (plaza not matched)", 13f, C.AMBER, true))
                      for (r in unmatched) {
                          val line = "${fmtDateTime(r["ts"]?.toLongOrNull() ?: 0L)}  ${r["merchant"]}  ${inr(r["amount"]?.toDoubleOrNull() ?: 0.0)}"
                          detail.addView(act.tv(line, 12f, C.TEXT))
                      }
                      detail.addView(act.tv("", 4f))
                  }

                  val shownRows = chosen.flatten().sortedByDescending { it["ts"]?.toLongOrNull() ?: 0L }.take(60)
                  for (r in shownRows) {
                      val line = "${fmtDateTime(r["ts"]?.toLongOrNull() ?: 0L)}  ${r["plaza"]}" +
                          (if (!r["state"].isNullOrBlank()) " (${r["state"]})" else "") + "  ${inr(r["amount"]?.toDoubleOrNull() ?: 0.0)}"
                      detail.addView(act.tv(line, 12f, C.TEXT))
                  }
                  if (shownRows.isEmpty() && unmatched.isEmpty()) detail.addView(act.tv("FASTag toll SMS milte hi yahan trips dikhengi.", 12f, C.MUTED))
              }
          }

          class PayeesScreen(act: MainActivity) : Screen(act) {
              private var sortMode = "count"
              private var selectMode = false
              private val selected = LinkedHashSet<String>()

              private val sortChips = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL; setPadding(act.dp(8), 0, act.dp(8), 0) }
              private val summary = act.tv("", 12f, C.MUTED).apply { setPadding(act.dp(14), act.dp(8), act.dp(14), act.dp(4)) }
              private val adapter = RowAdapter<Map<String, String?>>(act, emptyList()) { p, r ->
                  r.icon.setImageResource(R.drawable.ic_contacts)
                  // FIX: avoid nullable String in non-null Set membership check
                  val key = p["k"] ?: ""
                  r.icon.setColorFilter(if (selectMode && key in selected) C.ACCENT else C.MUTED)
                  r.title.text = p["display"] ?: ""
                  val upi = p["upi_id"]
                  r.sub.text = "${p["n"]} txns • last ${fmtDate(p["last"]?.toLongOrNull() ?: 0L)}" +
                      (if (upi.isNullOrBlank()) "" else " • $upi")
                  val spent = p["spent"]?.toDoubleOrNull() ?: 0.0
                  val recv = p["recv"]?.toDoubleOrNull() ?: 0.0
                  r.amt.text = "−" + inr(spent) + " / +" + inr(recv)
                  r.amt.setTextColor(C.TEXT)

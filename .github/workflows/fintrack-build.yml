          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:pathData="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="2"/><path android:pathData="M5,7a4,4 0 1,0 8,0a4,4 0 1,0 -8,0" android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="2"/></vector>

                          val ts = parseDate(dateStr) ?: System.currentTimeMillis()
                          val merchant = desc.take(60).ifBlank { "CSV Entry" }
                          val upi = Regex("""(?i)\b([a-z0-9][\w.\-]+@[a-z][a-z0-9]+)\b""").find(desc)?.groupValues?.get(1)
                          val cleanUpi = upi?.removeSuffix(".ref")?.lowercase()
                          val category = Learner.category(db, Learner.norm(merchant)) ?: Categories.classify(merchant, desc, debit)
                          val t = Txn(ts = ts, amount = amt, debit = debit, merchant = merchant, category = category, institution = bank, account = acct.ifBlank { null }, balance = null, channel = "OTHER", ref = ref.ifBlank { null }, vpa = cleanUpi, sender = "CSV", body = desc, source = "CSV", status = "CSV_IMPORT", tpl = "", review = false)
                          val id = Repo.save(ctx, t)
                          if (id > 0) imported++ else if (ref.isNotBlank()) dup++ else failed++
                      }

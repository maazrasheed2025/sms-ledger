                      val cal = Calendar.getInstance().apply {
                          set(Calendar.YEAR, filter.year!!); set(Calendar.MONTH, filter.month!!); set(Calendar.DAY_OF_MONTH, 1)
                          set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0); set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0)
                      }
                      val start = cal.timeInMillis
                      cal.add(Calendar.MONTH, 1)
                      where.append(" AND ts>=? AND ts<?")
                      args.add(start.toString()); args.add(cal.timeInMillis.toString())
                  }
                  if (query.isNotEmpty()) {
                      where.append(" AND (merchant LIKE ? OR category LIKE ? OR body LIKE ? OR ref LIKE ? OR vpa LIKE ?)")
                      repeat(5) { args.add("%$query%") }
                  }

                  val all = Db.get(act).queryTxns(where.toString(), args.toTypedArray(), 1000)

                  if (filter.mode == "review") {
                      val groups = LinkedHashMap<String, MutableList<Txn>>()
                      for (t in all) {
                          val h = t.reviewHash ?: Db.get(act).computeReviewHash(t)
                          groups.getOrPut(h) { ArrayList() }.add(t)
                      }
                      val rows = ArrayList<Row>()
                      for ((h, list) in groups) {
                          val sample = list.first()
                          rows.add(Row.GroupRow(h, list.size, list.sumOf { it.amount }, sample.merchant, sample.category, sample.debit))
                      }
                      adapter.items = rows
                      summary.text = "${all.size} entries in ${groups.size} groups  •  tap a group to fix all"
                  } else {
                      adapter.items = all.map { Row.TxnRow(it) }
                      val out = all.filter { it.debit }.sumOf { it.amount }
                      val inn = all.filter { !it.debit }.sumOf { it.amount }
                      summary.text = "${all.size} entries  •  Kharch ${inr(out)}  •  Mila ${inr(inn)}"
                  }
                  adapter.notifyDataSetChanged()
              }

              private fun openGroupFix(g: Row.GroupRow) {
                  act.showForm(
                      "Fix group (${g.count} txns)",
                      listOf(
                          Field("Kisko / dukaan", g.sampleMerchant),
                          Field("Type", if (g.sampleDebit) "Debit (kharch)" else "Credit (mila)", options = listOf("Debit (kharch)", "Credit (mila)")),
                          Field("Category", g.sampleCategory, options = Categories.ALL)
                      ),
                      okLabel = "Apply to all"
                  ) { v ->
                      AlertDialog.Builder(act)
                          .setMessage("Apply to all ${g.count} transactions in this group?")
                          .setPositiveButton("Haan") { _, _ ->
                              PayeeOps.applyGroupFix(act, g.hash, v[0].ifBlank { g.sampleMerchant }, v[2], v[1].startsWith("Debit"))
                              act.refreshAll()
                          }
                          .setNegativeButton("Nahi", null).show()
                  }
              }

              private fun showTxn(t: Txn) {
                  val msg = fmtDateTime(t.ts) + "  •  " + t.institution + "\n" +
                      (if (t.debit) "Kharch " else "Mila ") + inr(t.amount, true) + "  •  " + t.category +
                      (if (t.balance != null) "\nBalance: " + inr(t.balance ?: 0.0, true) else "") +
                      "\nParse: ${t.status}" + (if (t.vpa != null) "  •  UPI: ${t.vpa}" else "") +
                      (if (t.ref != null) "  •  Ref: ${t.ref}" else "") +
                      (if (t.body.isNotEmpty()) "\n\n" + t.body else "")
                  AlertDialog.Builder(act).setTitle(t.merchant).setMessage(msg)
                      .setPositiveButton("Edit / Sahi karo") { _, _ -> editTxn(t) }
                      .setNegativeButton("Band karo", null)
                      .show()
              }

              private fun editTxn(t: Txn) {
                  act.showForm(
                      "Sahi karo (app seekhegi)",
                      listOf(
                          Field("Kisko / dukaan", t.merchant),
                          Field("Amount", t.amount.toString(), true),
                          Field("Type", if (t.debit) "Debit (kharch)" else "Credit (mila)", options = listOf("Debit (kharch)", "Credit (mila)")),
                          Field("Category", t.category, options = Categories.ALL)
                      ),
                      neutral = "Delete" to {
                          AlertDialog.Builder(act).setMessage("Ye entry delete kar du?")
                              .setPositiveButton("Haan") { _, _ -> Db.get(act).deleteTxn(t.id); act.refreshAll() }
                              .setNegativeButton("Nahi", null).show()
                          Unit
                      }
                  ) { v ->
                      val n = t.copy(
                          merchant = v[0].ifBlank { t.merchant },
                          amount = v[1].toDoubleOrNull() ?: t.amount,
                          debit = v[2].startsWith("Debit"),
                          category = v[3],
                          status = "USER",
                          review = false,
                          reviewHash = null
                      )
                      val db = Db.get(act)
                      db.updateTxn(n)
                      Repo.ensurePayee(act, n)
                      if (n.category == "Travel" || n.channel == "FASTAG") Tolls.record(act, n) else db.exec("DELETE FROM toll_trips WHERE txn_id=?", n.id)
                      Learner.learnFromCorrection(act, t, n)
                      act.refreshAll()
                  }
              }

              fun addCash() {
                  act.showForm(
                      "Cash entry",
                      listOf(
                          Field("Amount", "", true),
                          Field("Type", "Spent (kharch)", options = listOf("Spent (kharch)", "Received (mila)")),
                          Field("Kis kaam / naam", ""),
                          Field("Category", "Other", options = Categories.ALL)
                      )
                  ) { v ->
                      val amt = v[0].toDoubleOrNull()
                      if (amt == null || amt <= 0) { act.toast("Amount sahi daalo"); return@showForm }
                      val t = Txn(
                          ts = System.currentTimeMillis(), amount = amt, debit = v[1].startsWith("Spent"),
                          merchant = v[2].ifBlank { "Cash" }, category = v[3], institution = "Cash",
                          channel = "CASH", source = "CASH", status = "USER"
                      )
                      Repo.save(act, t)
                      act.refreshAll()
                  }
              }
          }

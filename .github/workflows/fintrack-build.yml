      - name: Build Debug APK
        working-directory: /tmp/proj
        run: gradle assembleDebug --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v12.5.0.${{ github.run_number }}"
          gh release create "$VERSION" /tmp/proj/app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "Imran's Finances v12.5.0 Build ${{ github.run_number }}" \
            --notes "v12.5.0: Ten fixes. (1) Ledger rows now show category-specific icons tinted accent colour (was generic bank icon). (2) Machine Learning screen: added Refresh & scan SMS button and new Scan database button. (3) SMS scan popup changed to toast (no more blocking dialog on app open). (4) Scan database re-runs VpaExtractor + BillDetector on all existing txns to regenerate pending_review entries. (5) Settings shows a Data section with counts for transactions/accounts/payees/UPI IDs/mobiles/tolls/rules/loans/bills/budgets/categories/pending ML — each tappable to open the corresponding screen. (6) Top bar thicker (padding 10dp, elevation 2dp, icon 32dp, title 20f). (7) Dashboard PDF export icon now 28dp (was 22dp). (8) Bottom nav has 6 tabs now — Dashboard, Ledger, Travel, Payees, Accounts, Settings. Nav bar is thicker (padding 4dp, elevation 6dp, icon 24dp). (9) Payee screen grouping by txn-count buckets (1-10/11-20/21-50/50+) with collapsible headers and full data (no 400 limit); background and icon colours now follow theme. (10) Icon pipeline replaced with Python/Pillow version with ########## markers and per-file VERIFIED/MISSING logging."

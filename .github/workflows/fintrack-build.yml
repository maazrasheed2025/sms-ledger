              }
              fun learnFromCorrection(ctx: Context, old: Txn, new: Txn) {
                  val db = Db.get(ctx)
                  if (new.source == "SMS") {
                      val key = norm(new.merchant)
                      if (new.merchant.isNotBlank() && new.merchant != "Unknown") {
                          learnCategory(db, key, new.merchant, new.category)
                          if (old.status != "REGEX" || !old.merchant.equals(new.merchant, ignoreCase = true)) learnMerchantPattern(db, SenderMap.core(new.sender), new.tpl, new.body, new.merchant)
                      }
                      trainType(db, new.body, new.debit, 3.0)
                      reapply(ctx, new.tpl, new.id)
                  } else if (new.merchant.isNotBlank()) learnCategory(db, norm(new.merchant), new.merchant, new.category)
              }
              private fun reapply(ctx: Context, tpl: String, exceptId: Long) {
                  if (tpl.isBlank()) return
                  val db = Db.get(ctx)
                  for (r in db.queryTxns("tpl=? AND review=1 AND status!='USER' AND id!=?", arrayOf(tpl, exceptId.toString()), 2000)) {
                      val n = SmsEngine.build(ctx, db, r.sender, r.body, r.ts, false) ?: continue
                      n.id = r.id; n.smsKey = r.smsKey
                      db.updateTxn(n)
                      if (n.category == "Travel" || n.channel == "FASTAG") Tolls.record(ctx, n)
                  }
              }
          }

          cat > app/src/main/res/drawable/ic_transfer.xml <<'EOF_D5'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:pathData="M8 3 4 7l4 4" android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="2"/><path android:pathData="M4 7h16" android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="2"/><path android:pathData="m16 21 4-4-4-4" android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="2"/><path android:pathData="M20 17H4" android:fillColor="#00000000" android:strokeColor="#FFFFFFFF" android:strokeWidth="2"/></vector>
          EOF_D5
          cat > app/src/main/res/drawable/ic_settings.xml <<'EOF_D6'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:pathData="M12,15a3,3 0 1,0 0,-6a3,3 0 0,0 0,6z" android:strokeColor="#FFFFFFFF" android:strokeWidth="2" android:fillColor="#00000000"/></vector>
          EOF_D6
          cat > app/src/main/res/drawable/ic_menu.xml <<'EOF_D7'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:pathData="M3,6h18M3,12h18M3,18h18" android:strokeColor="#FFFFFFFF" android:strokeWidth="2" android:strokeLineCap="round"/></vector>

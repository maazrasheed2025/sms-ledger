              override fun refresh() {
                  body.removeAllViews()
                  val db = Db.get(act)

                  val nw = NetWorth.compute(act)
                  val c = act.card()
                  c.addView(act.icon(R.drawable.ic_networth, C.GREEN, 26))
                  c.addView(act.tv("Net worth", 12f, C.MUTED))
                  c.addView(act.tv(inr(nw.assets - nw.liabilities), 28f, if (nw.assets >= nw.liabilities) C.GREEN else C.RED, true))
                  c.addView(act.tv("Assets ${inr(nw.assets)}   -   Liabilities ${inr(nw.liabilities)}", 12f, C.MUTED))
                  body.put(c, 0)

                  val assets = act.card()
                  assets.addView(act.tv("Assets", 15f, C.TEXT, true))
                  for (b in nw.bank) assets.put(act.tv("${b.first} ${if (b.second.isNotEmpty()) "x" + b.second else ""}  (SMS balance)   ${inr(b.third)}", 13f, C.MUTED), 6)
                  for (r in db.rows("SELECT * FROM net_items WHERE kind='ASSET' ORDER BY id")) {
                      assets.put(act.tv("${r["name"]}   ${inr(r["amount"]?.toDoubleOrNull() ?: 0.0)}", 14f).apply { setOnClickListener { editItem(r) } }, 8)
                  }
                  assets.put(act.actionBtn("+ Asset") { addItem("ASSET") }, 10)
                  body.put(assets)

                  val liab = act.card()
                  liab.addView(act.tv("Liabilities", 15f, C.TEXT, true))
                  for (r in db.rows("SELECT * FROM net_items WHERE kind='LIABILITY' ORDER BY id")) {
                      liab.put(act.tv("${r["name"]}   ${inr(r["amount"]?.toDoubleOrNull() ?: 0.0)}", 14f).apply { setOnClickListener { editItem(r) } }, 8)
                  }
                  liab.put(act.actionBtn("+ Liability") { addItem("LIABILITY") }, 10)
                  body.put(liab)

                  val bc = act.card()
                  bc.addView(act.tv("Budgets (monthly cap)", 15f, C.TEXT, true))
                  for (r in db.rows("SELECT * FROM budgets ORDER BY category")) {
                      val cat = r["category"] ?: ""
                      val capVal = r["monthly_cap"]?.toDoubleOrNull() ?: 0.0
                      bc.put(act.tv("$cat   ${inr(capVal)}", 13f).apply {
                          setOnClickListener { editBudget(cat, capVal) }
                      }, 6)
                  }
                  bc.put(act.actionBtn("+ Budget") { editBudget(null, 0.0) }, 10)
                  body.put(bc)

                  val lc = act.card()
                  val lh = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL }
                  lh.addView(act.icon(R.drawable.ic_loan, C.AMBER, 22))
                  lh.put(act.tv("Loan & EMI tracker", 15f, C.TEXT, true), 10)
                  lc.addView(lh)
                  val loans = db.rows("SELECT * FROM loans ORDER BY id")
                  var emiTotal = 0.0
                  for (l in loans) {
                      val p = l["principal"]?.toDoubleOrNull() ?: 0.0
                      val rate = l["rate"]?.toDoubleOrNull() ?: 0.0
                      val tenure = l["tenure"]?.toIntOrNull() ?: 0
                      var e = l["emi"]?.toDoubleOrNull() ?: 0.0
                      if (e <= 0) e = LoanCalc.emi(p, rate, tenure)
                      emiTotal += e
                      val paid = LoanCalc.paidMonths(l["start_ts"]?.toLongOrNull() ?: System.currentTimeMillis(), tenure)
                      val out = LoanCalc.outstandingOf(l)
                      val plan = LoanCalc.payoffPlan(out, rate, e, 2000.0)
                      val row = act.vbox().apply {
                          addView(act.tv("${l["name"]}  (${l["lender"] ?: ""})", 14f, C.TEXT, true))
                          addView(act.tv("EMI ${inr(e)}  •  ${paid}/${tenure} mahine  •  ${rate}%", 12f, C.MUTED))
                          addView(act.tv("Baaki: ${inr(out)}", 12f, C.AMBER))
                          if (plan.first > 0) addView(act.tv("+₹2000/mo → debt-free in ${plan.first} months (interest ${inr(plan.second)})", 11f, C.MUTED))
                          setOnClickListener { editLoan(l) }
                      }
                      lc.put(row, 12)
                  }
                  if (loans.isNotEmpty()) lc.put(act.tv("Mahine ki total EMI: ${inr(emiTotal)}", 13f, C.TEXT, true), 12)
                  lc.put(act.actionBtn("+ Loan") { addLoan() }, 12)
                  body.put(lc)

                  val subs = db.rows("SELECT merchant_key, avg_amt, last_ts, count FROM subs_detected ORDER BY last_ts DESC LIMIT 20")
                  if (subs.isNotEmpty()) {
                      val sc = act.card()
                      sc.addView(act.tv("Detected subscriptions", 15f, C.TEXT, true))
                      for (s in subs) {
                          val mk = s["merchant_key"] ?: ""
                          val name = db.one("SELECT display FROM merchant_rules WHERE merchant_key=?", mk) ?: mk
                          val avg = s["avg_amt"]?.toDoubleOrNull() ?: 0.0
                          val last = s["last_ts"]?.toLongOrNull() ?: 0L
                          val next = last + 30L * 86_400_000L
                          sc.put(act.tv("$name  ~${inr(avg)}/mo  • next ~${fmtDate(next)}", 12f, C.MUTED), 6)
                      }
                      body.put(sc)
                  }

                  val cash = act.card()
                  cash.addView(act.tv("Manual cash entry", 15f, C.TEXT, true))
                  cash.put(act.tv("Cash kharch / mila yahan likho, wo ledger me judega.", 12f, C.MUTED), 4)
                  cash.put(act.actionBtn("+ Cash entry") { act.ledger.addCash() }, 10)
                  body.put(cash)

                  val d = act.card()
                  d.addView(act.tv("Data, backup & imports", 15f, C.TEXT, true))
                  val rules = db.num("SELECT COUNT(*) FROM merchant_rules").toInt()
                  val pats = db.num("SELECT COUNT(*) FROM parse_patterns").toInt()
                  val txn = db.num("SELECT COUNT(*) FROM txn").toInt()
                  val review = db.num("SELECT COUNT(*) FROM txn WHERE review=1").toInt()
                  val plazas = db.num("SELECT COUNT(*) FROM toll_plazas").toInt()
                  val dup = db.num("SELECT COUNT(*) FROM txn_skipped WHERE reason='duplicate-ref'").toInt()
                  d.put(act.tv("$txn transactions  •  $review review  •  $rules merchant rules  •  $pats patterns  •  $plazas plazas  •  $dup skipped dup", 12f, C.MUTED), 6)
                  d.put(act.actionBtn("Upload Toll Data JSON") { act.pickTollJson() }, 10)
                  d.put(act.actionBtn("Upload Bank Statement (CSV)") { act.pickCsvStatement() }, 8)
                  d.put(act.actionBtn("SMS dobara scan karo") { act.rescan() }, 8)
                  d.put(act.actionBtn("Backup CSV (Downloads)") { act.backup() }, 8)
                  d.put(act.actionBtn("Restore CSV") { act.pickRestore() }, 8)
                  d.put(act.actionBtn("Bank / sender names") { senders() }, 8)
                  body.put(d)
              }

              private fun editBudget(category: String?, current: Double) {
                  act.showForm(
                      if (category == null) "Budget add" else "Budget edit",
                      listOf(
                          Field("Category", category ?: "Grocery", options = Categories.ALL),
                          Field("Monthly cap", if (current > 0) current.toString() else "", true)
                      ),
                      neutral = if (category == null) null else ("Delete" to {
                          if (category != null) Db.get(act).exec("DELETE FROM budgets WHERE category=?", category)
                          act.refreshAll()
                      })
                  ) { v ->
                      val cap = v[1].toDoubleOrNull()
                      if (cap == null || cap <= 0) { act.toast("Cap daalo"); return@showForm }
                      Db.get(act).exec("INSERT OR REPLACE INTO budgets(category, monthly_cap) VALUES(?,?)", v[0], cap)
                      act.refreshAll()
                  }
              }

              private fun addItem(kind: String) {
                  act.showForm(if (kind == "ASSET") "Asset add" else "Liability add", listOf(Field("Naam (jaise Gold, FD, Credit card)"), Field("Amount", "", true))) { v ->
                      val a = v[1].toDoubleOrNull()
                      if (v[0].isBlank() || a == null) { act.toast("Naam aur amount daalo"); return@showForm }
                      Db.get(act).exec("INSERT INTO net_items(name, amount, kind) VALUES(?,?,?)", v[0], a, kind)
                      act.refreshAll()
                  }
              }

              private fun editItem(r: Map<String, String?>) {
                  val id = r["id"]?.toLongOrNull() ?: return
                  act.showForm("Edit", listOf(Field("Naam", r["name"] ?: ""), Field("Amount", r["amount"] ?: "", true)),
                      neutral = "Delete" to { Db.get(act).exec("DELETE FROM net_items WHERE id=?", id); act.refreshAll() }) { v ->
                      Db.get(act).exec("UPDATE net_items SET name=?, amount=? WHERE id=?", v[0], v[1].toDoubleOrNull() ?: 0.0, id)
                      act.refreshAll()
                  }
              }

              private fun addLoan() = loanForm(null)
              private fun editLoan(l: Map<String, String?>) = loanForm(l)

              private fun loanForm(l: Map<String, String?>?) {
                  val id = l?.get("id")?.toLongOrNull()
                  val start = l?.get("start_ts")?.toLongOrNull() ?: System.currentTimeMillis()
                  act.showForm(
                      if (l == null) "Loan add" else "Loan edit",
                      listOf(
                          Field("Loan naam", l?.get("name") ?: ""),
                          Field("Lender / bank", l?.get("lender") ?: ""),
                          Field("Principal (loan amount)", l?.get("principal") ?: "", true),
                          Field("Saalana byaj % (rate)", l?.get("rate") ?: "", true),
                          Field("EMI (0 = auto calculate)", l?.get("emi") ?: "0", true),
                          Field("Tenure (mahine)", l?.get("tenure") ?: "", true),
                          Field("Start date (yyyy-mm-dd)", dateFmt.format(Date(start)))
                      ),
                      neutral = if (id == null) null else ("Delete" to { Db.get(act).exec("DELETE FROM loans WHERE id=?", id); act.refreshAll() })
                  ) { v ->
                      val p = v[2].toDoubleOrNull()
                      val tenure = v[5].toDoubleOrNull()?.toInt()
                      val sTs = try { dateFmt.parse(v[6])?.time } catch (e: Exception) { null }
                      if (v[0].isBlank() || p == null || tenure == null || tenure <= 0 || sTs == null) {
                          act.toast("Naam, amount, tenure aur date sahi daalo"); return@showForm
                      }
                      val rate = v[3].toDoubleOrNull() ?: 0.0
                      val emi = v[4].toDoubleOrNull() ?: 0.0
                      val db = Db.get(act)
                      if (id == null) db.exec("INSERT INTO loans(name, lender, principal, rate, emi, tenure, start_ts) VALUES(?,?,?,?,?,?,?)", v[0], v[1], p, rate, emi, tenure, sTs)
                      else db.exec("UPDATE loans SET name=?, lender=?, principal=?, rate=?, emi=?, tenure=?, start_ts=? WHERE id=?", v[0], v[1], p, rate, emi, tenure, sTs, id)
                      act.refreshAll()
                  }
              }

              private fun senders() {
                  val db = Db.get(act)
                  val seen = LinkedHashMap<String, Pair<String, Int>>()
                  for (r in db.rows("SELECT sender, institution, COUNT(*) AS n FROM txn WHERE source='SMS' GROUP BY sender ORDER BY n DESC")) {
                      val core = SenderMap.core(r["sender"] ?: "")
                      val prev = seen[core]
                      seen[core] = Pair(r["institution"] ?: "", (prev?.second ?: 0) + (r["n"]?.toIntOrNull() ?: 0))
                  }
                  if (seen.isEmpty()) { act.toast("Abhi koi SMS sender nahi mila"); return }
                  val keys = seen.keys.toList()
                  val labels = keys.map { "$it  →  ${seen[it]?.first}  (${seen[it]?.second})" }
                  AlertDialog.Builder(act).setTitle("Sender naam badlo")
                      .setItems(labels.toTypedArray()) { _, i -> renameSender(keys[i], seen[keys[i]]?.first ?: "") }
                      .setNegativeButton("Band karo", null).show()
              }

              private fun renameSender(core: String, current: String) {
                  act.showForm(
                      "Sender: $core",
                      listOf(Field("Bank / wallet ka naam", current), Field("Type", "BANK", options = listOf("BANK", "CARD", "WALLET", "FASTAG", "TELECOM", "OTHER")))
                  ) { v ->
                      val db = Db.get(act)
                      db.exec("INSERT OR REPLACE INTO senders(core, institution, kind, user_defined) VALUES(?,?,?,1)", core, v[0], v[1])
                      for (r in db.rows("SELECT DISTINCT sender FROM txn")) {
                          val s = r["sender"] ?: continue
                          if (SenderMap.core(s) == core) db.exec("UPDATE txn SET institution=? WHERE sender=?", v[0], s)
                      }
                      act.refreshAll()
                  }
              }
          }

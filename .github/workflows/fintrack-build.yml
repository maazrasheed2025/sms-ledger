                  for (t in rows) col.addView(act.tv("${fmtDateTime(t.ts)}  ${if (t.debit) "-" else "+"}${inr(t.amount, true)}  ${t.merchant}", 12f, if (t.debit) C.RED else C.GREEN))
                  if (rows.isEmpty()) col.addView(act.tv("Koi txns nahi", 12f, C.MUTED))
                  AlertDialog.Builder(act).setTitle("Loan $loanNo").setView(ScrollView(act).apply { addView(col) }).setNegativeButton("Band karo", null).show()
              }
              private fun addItem(kind: String) {
                  act.showForm("Asset add", listOf(Field("Naam"), Field("Amount", "", true))) { v ->
                      val a = v[1].toDoubleOrNull(); if (v[0].isBlank() || a == null) { act.toast("Naam aur amount daalo"); return@showForm }
                      Db.get(act).exec("INSERT INTO net_items(name, amount, kind) VALUES(?,?,?)", v[0], a, kind); act.refreshAll()
                  }
              }
              private fun editItem(r: Map<String, String?>) {
                  val id = r["id"]?.toLongOrNull() ?: return
                  act.showForm("Edit", listOf(Field("Naam", r["name"] ?: ""), Field("Amount", r["amount"] ?: "", true)),
                      neutral = "Delete" to { Db.get(act).exec("DELETE FROM net_items WHERE id=?", id); act.refreshAll() }) { v ->
                      Db.get(act).exec("UPDATE net_items SET name=?, amount=? WHERE id=?", v[0], v[1].toDoubleOrNull() ?: 0.0, id); act.refreshAll()
                  }
              }
          }
          EOF_20

          cat > app/src/main/java/com/example/fintrack/Ui.kt <<'EOF_21'
          package com.example.fintrack

          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ArrayAdapter
          import android.widget.BaseAdapter
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import androidx.appcompat.app.AlertDialog
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object C {
              var BG: Int = Color.parseColor("#0E1014"); private set
              var CARD: Int = Color.parseColor("#181B22"); private set
              var CARD2: Int = Color.parseColor("#262B38"); private set
              var TEXT: Int = Color.parseColor("#ECEFF4"); private set
              var MUTED: Int = Color.parseColor("#8B93A3"); private set
              var ACCENT: Int = Color.parseColor("#5B9CFF"); private set
              var GREEN: Int = Color.parseColor("#34D399"); private set
              var RED: Int = Color.parseColor("#FF6B6B"); private set
              var AMBER: Int = Color.parseColor("#FBBF24"); private set
              fun applyTheme(isNight: Boolean) {
                  if (isNight) {
                      BG = Color.parseColor("#0E1014"); CARD = Color.parseColor("#181B22"); CARD2 = Color.parseColor("#262B38")
                      TEXT = Color.parseColor("#ECEFF4"); MUTED = Color.parseColor("#8B93A3")
                      ACCENT = Color.parseColor("#5B9CFF"); GREEN = Color.parseColor("#34D399"); RED = Color.parseColor("#FF6B6B"); AMBER = Color.parseColor("#FBBF24")
                  } else {
                      BG = Color.parseColor("#F6F7FB"); CARD = Color.parseColor("#FFFFFF"); CARD2 = Color.parseColor("#E8EAF2")
                      TEXT = Color.parseColor("#10131A"); MUTED = Color.parseColor("#5F6675")
                      ACCENT = Color.parseColor("#2563EB"); GREEN = Color.parseColor("#10B981"); RED = Color.parseColor("#DC2626"); AMBER = Color.parseColor("#D97706")
                  }
              }
          }

          fun Context.dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
          fun Context.tv(s: CharSequence, size: Float = 14f, color: Int = C.TEXT, bold: Boolean = false): TextView = TextView(this).apply { text = s; textSize = size; setTextColor(color); if (bold) setTypeface(null, Typeface.BOLD) }
          fun Context.shape(fill: Int, radius: Int = 14): GradientDrawable = GradientDrawable().apply { setColor(fill); cornerRadius = dp(radius).toFloat() }
          fun Context.vbox(pad: Int = 0): LinearLayout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(pad), dp(pad), dp(pad), dp(pad)) }
          fun Context.card(): LinearLayout = vbox(14).apply { background = shape(C.CARD) }
          fun Context.icon(res: Int, tint: Int = C.TEXT, sizeDp: Int = 22): ImageView = ImageView(this).apply { setImageResource(res); setColorFilter(tint); layoutParams = LinearLayout.LayoutParams(dp(sizeDp), dp(sizeDp)) }
          fun Context.pill(label: String, selected: Boolean, onClick: () -> Unit): TextView =
              tv(label, 13f, if (selected) Color.WHITE else C.TEXT).apply {
                  setPadding(dp(14), dp(7), dp(14), dp(7)); background = shape(if (selected) C.ACCENT else C.CARD2, 18)
                  setOnClickListener { onClick() }
                  layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { setMargins(dp(4), dp(4), dp(4), dp(4)) }
              }
          fun Context.actionBtn(label: String, onClick: () -> Unit): TextView =
              tv(label, 14f, Color.WHITE, true).apply { gravity = Gravity.CENTER; setPadding(dp(14), dp(10), dp(14), dp(10)); background = shape(C.ACCENT, 12); setOnClickListener { onClick() } }
          fun LinearLayout.put(v: View, top: Int = 10, weight: Float = 0f): View {
              val lp = if (orientation == LinearLayout.VERTICAL) LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, if (weight > 0) 0 else ViewGroup.LayoutParams.WRAP_CONTENT, weight)
                       else LinearLayout.LayoutParams(if (weight > 0) 0 else ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, weight)
              if (orientation == LinearLayout.VERTICAL) lp.topMargin = (top * resources.displayMetrics.density).toInt() else lp.leftMargin = (top * resources.displayMetrics.density).toInt()
              addView(v, lp); return v
          }
          fun iconFor(cat: String): Int = when (cat) {
              "Fuel" -> R.drawable.ic_fuel; "Grocery" -> R.drawable.ic_grocery; "EMI/Loan" -> R.drawable.ic_loan
              "Travel" -> R.drawable.ic_fastag; "Transfer" -> R.drawable.ic_transfer; else -> R.drawable.ic_bank
          }
          fun inr(v: Double, paise: Boolean = false): String {
              val s = String.format(Locale.US, if (paise) "%.2f" else "%.0f", Math.abs(v))
              val parts = s.split("."); var whole = parts[0]
              if (whole.length > 3) {
                  val last3 = whole.takeLast(3); var rest = whole.dropLast(3); val groups = ArrayList<String>()
                  while (rest.length > 2) { groups.add(0, rest.takeLast(2)); rest = rest.dropLast(2) }
                  if (rest.isNotEmpty()) groups.add(0, rest)
                  whole = groups.joinToString(",") + "," + last3
              }
              return (if (v < 0) "-" else "") + "₹" + whole + (if (parts.size > 1) "." + parts[1] else "")
          }
          fun fmtDate(ts: Long): String = SimpleDateFormat("dd MMM yy", Locale.getDefault()).format(Date(ts))
          fun fmtDateTime(ts: Long): String = SimpleDateFormat("dd MMM, HH:mm", Locale.getDefault()).format(Date(ts))
          class RowAdapter<T>(private val ctx: Context, var items: List<T>, private val bind: (T, Row) -> Unit) : BaseAdapter() {
              class Row(ctx: Context) {
                  val icon = ctx.icon(R.drawable.ic_bank, C.ACCENT, 26)
                  val title = ctx.tv("", 15f, C.TEXT, true).apply { setSingleLine() }
                  val sub = ctx.tv("", 12f, C.MUTED)
                  val amt = ctx.tv("", 15f, C.TEXT, true)
                  val view: LinearLayout = LinearLayout(ctx).apply {
                      orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL
                      setPadding(ctx.dp(12), ctx.dp(10), ctx.dp(12), ctx.dp(10))
                      val mid = LinearLayout(ctx).apply { orientation = LinearLayout.VERTICAL; addView(title); addView(sub) }
                      addView(icon); addView(mid, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { leftMargin = ctx.dp(12); rightMargin = ctx.dp(8) }); addView(amt)
                  }
              }
              override fun getCount(): Int = items.size
              override fun getItem(position: Int): Any = items[position] as Any
              override fun getItemId(position: Int): Long = position.toLong()
              override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                  val row = (convertView?.tag as? Row) ?: Row(ctx).also { it.view.tag = it }
                  bind(items[position], row); return row.view
              }
          }
          class Field(val label: String, val default: String = "", val number: Boolean = false, val options: List<String>? = null)
          fun MainActivity.showForm(title: String, fields: List<Field>, okLabel: String = "Save", neutral: Pair<String, () -> Unit>? = null, onOk: (List<String>) -> Unit) {
              val col = vbox(20).apply { setPadding(dp(20), dp(8), dp(20), dp(8)) }
              val getters = ArrayList<() -> String>()
              for (f in fields) {
                  col.addView(tv(f.label, 12f, C.MUTED))
                  val opts = f.options
                  if (opts != null) {
                      val sp = Spinner(this); sp.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, opts)
                      val idx = opts.indexOf(f.default); if (idx >= 0) sp.setSelection(idx); col.addView(sp); getters.add { sp.selectedItem.toString() }
                  } else {
                      val et = EditText(this).apply { setText(f.default); setTextColor(C.TEXT); setSingleLine(); if (f.number) inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL }
                      col.addView(et); getters.add { et.text.toString().trim() }
                  }
              }
              val b = AlertDialog.Builder(this).setTitle(title).setView(ScrollView(this).apply { addView(col) })
                  .setPositiveButton(okLabel) { _, _ -> onOk(getters.map { it() }) }.setNegativeButton("Cancel", null)
              if (neutral != null) b.setNeutralButton(neutral.first) { _, _ -> neutral.second() }
              b.show()
          }
          EOF_21


                  val spent = p["spent"]?.toDoubleOrNull() ?: 0.0; val recv = p["recv"]?.toDoubleOrNull() ?: 0.0
                  val sign: String = if (recv > 0 && spent == 0.0) "+" else if (spent > 0 && recv == 0.0) "-" else ""
                  val total = when { sign == "+" -> recv; sign == "-" -> spent; else -> recv - spent }

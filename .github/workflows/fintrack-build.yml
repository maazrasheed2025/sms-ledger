          package com.example.fintrack

          import org.json.JSONObject
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL

          object AiParser {
              private const val GEMINI_API_KEY = ""

              fun redactSensitiveData(body: String): String {
                  var clean = body
                  clean = clean.replace(Regex("""(?i)\b[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}\b"""), "[REDACTED_VPA]")
                  clean = clean.replace(Regex("""(?i)(?:upi\s*ref|ref|rrn|utr)\s*[:.\-]?\s*[A-Za-z0-9]{6,22}"""), "REF: [REDACTED_REF]")
                  clean = clean.replace(Regex("""(?i)\b(?:a/c|acct?|account|card)\.?\s*(?:no\.?|number)?\s*(?:ending)?\s*(?:x+|\*+|#)?\s*\d{3,4}\b"""), "ACCOUNT: [REDACTED_ACC]")
                  return clean
              }

              fun parseUnknownSms(rawBody: String): Fields? {
                  if (GEMINI_API_KEY.isBlank()) return null
                  val redacted = redactSensitiveData(rawBody)
                  val prompt = "Analyze this Indian SMS financial notice and return JSON ONLY: " + redacted
                  return try {
                      val url = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$GEMINI_API_KEY")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "POST"
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.doOutput = true
                      val jsonPayload = JSONObject().apply {
                          put("contents", listOf(
                              JSONObject().apply {
                                  put("parts", listOf(JSONObject().apply { put("text", prompt) }))
                              }
                          ))
                      }
                      OutputStreamWriter(conn.outputStream).use { it.write(jsonPayload.toString()) }
                      if (conn.responseCode == 200) {
                          val respText = conn.inputStream.bufferedReader().use { it.readText() }
                          val textResponse = JSONObject(respText)
                              .getJSONArray("candidates")
                              .getJSONObject(0)
                              .getJSONObject("content")
                              .getJSONArray("parts")
                              .getJSONObject(0)
                              .getString("text")
                          val start = textResponse.indexOf("{")
                          val end = textResponse.lastIndexOf("}")
                          if (start < 0 || end <= start) return null
                          val parsed = JSONObject(textResponse.substring(start, end + 1))
                          Fields(
                              amount = parsed.optDouble("amount"),
                              debit = parsed.optBoolean("debit"),
                              merchant = parsed.optString("merchant"),
                              balance = if (parsed.isNull("balance")) null else parsed.optDouble("balance"),
                              account = if (parsed.isNull("account_ending")) null else parsed.optString("account_ending"),
                              channel = parsed.optString("account_type", "OTHER")
                          )
                      } else null
                  } catch (e: Exception) {
                      null
                  }
              }
          }

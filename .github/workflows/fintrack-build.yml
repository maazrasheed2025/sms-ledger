                  rule("Fuel","petrol|diesel|fuel|hpcl|bpcl|iocl|indian ?oil|indianoil|bharat petroleum|hindustan petroleum|shell|nayara|essar|filling station|hp pay"),
                  rule("Food","swiggy|zomato|restaurant|cafe|dominos|domino's|mcdonald's|mcdonalds|kfc|pizza|burger|hotel|dhaba|biryani|bakery|sweets|food|eatery|starbucks|chai|canteen|barbeque"),

          cat > app/src/main/java/com/example/fintrack/Db.kt <<'EOF_6'
          package com.example.fintrack

          import android.content.ContentValues
          import android.content.Context
          import android.database.Cursor
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper

          data class Txn(
              var id: Long = 0,
              var smsKey: String? = null,
              var ts: Long,
              var amount: Double,
              var debit: Boolean,
              var merchant: String,
              var category: String,
              var institution: String = "",
              var account: String? = null,
              var balance: Double? = null,
              var channel: String = "OTHER",
              var ref: String? = null,
              var vpa: String? = null,
              var sender: String = "",
              var body: String = "",
              var source: String = "SMS",      // SMS | CASH | MANUAL
              var status: String = "REGEX",    // REGEX | LEARNED | HEURISTIC | FAILED | USER
              var tpl: String = "",
              var review: Boolean = false
          )

          class Db private constructor(ctx: Context) : SQLiteOpenHelper(ctx, "fintrack.db", null, 1) {

              companion object {
                  @Volatile private var inst: Db? = null
                  fun get(ctx: Context): Db = inst ?: synchronized(this) {
                      inst ?: Db(ctx.applicationContext).also { inst = it }
                  }
              }

              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL("CREATE TABLE txn (id INTEGER PRIMARY KEY AUTOINCREMENT, sms_key TEXT UNIQUE, ts INTEGER NOT NULL, amount REAL NOT NULL, debit INTEGER NOT NULL, merchant TEXT, merchant_key TEXT, category TEXT, institution TEXT, account TEXT, balance REAL, channel TEXT, ref TEXT, vpa TEXT, sender TEXT, body TEXT, source TEXT, status TEXT, tpl TEXT, review INTEGER DEFAULT 0)")
                  db.execSQL("CREATE INDEX idx_txn_ts ON txn(ts)")
                  db.execSQL("CREATE INDEX idx_txn_tpl ON txn(tpl)")
                  db.execSQL("CREATE INDEX idx_txn_mk ON txn(merchant_key)")
                  db.execSQL("CREATE TABLE senders (core TEXT PRIMARY KEY, institution TEXT, kind TEXT, user_defined INTEGER DEFAULT 0)")
                  db.execSQL("CREATE TABLE merchant_rules (merchant_key TEXT PRIMARY KEY, display TEXT, category TEXT, weight REAL DEFAULT 1)")
                  db.execSQL("CREATE TABLE parse_patterns (id INTEGER PRIMARY KEY AUTOINCREMENT, sender_core TEXT, tpl TEXT, field TEXT, left_ctx TEXT, right_ctx TEXT, weight REAL DEFAULT 1, UNIQUE(sender_core, tpl, field, left_ctx, right_ctx))")
                  db.execSQL("CREATE TABLE nb_words (word TEXT PRIMARY KEY, d REAL DEFAULT 0, c REAL DEFAULT 0)")
                  db.execSQL("CREATE TABLE toll_trips (id INTEGER PRIMARY KEY AUTOINCREMENT, txn_id INTEGER UNIQUE, plaza_id INTEGER, plaza TEXT, state TEXT, lat REAL, lon REAL, ts INTEGER, amount REAL, vehicle TEXT)")
                  db.execSQL("CREATE TABLE payees (merchant_key TEXT PRIMARY KEY, display TEXT, upi_id TEXT, note TEXT)")
                  db.execSQL("CREATE TABLE net_items (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, amount REAL, kind TEXT)")
                  db.execSQL("CREATE TABLE loans (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, lender TEXT, principal REAL, rate REAL, emi REAL, tenure INTEGER, start_ts INTEGER)")
              }

              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {}

              // ---- generic helpers -------------------------------------------------
              fun rows(sql: String, vararg args: String): List<Map<String, String?>> {
                  val out = ArrayList<Map<String, String?>>()
                  readableDatabase.rawQuery(sql, arrayOf(*args)).use { c ->
                      while (c.moveToNext()) {
                          val m = HashMap<String, String?>()
                          for (i in 0 until c.columnCount) m[c.getColumnName(i)] = if (c.isNull(i)) null else c.getString(i)
                          out.add(m)
                      }
                  }
                  return out
              }

              fun one(sql: String, vararg args: String): String? =
                  rows(sql, *args).firstOrNull()?.values?.firstOrNull()

              fun num(sql: String, vararg args: String): Double = one(sql, *args)?.toDoubleOrNull() ?: 0.0

              fun exec(sql: String, vararg args: Any?) {
                  writableDatabase.execSQL(sql, arrayOf(*args))
              }

              // ---- transactions ----------------------------------------------------
              private fun values(t: Txn) = ContentValues().apply {
                  put("sms_key", t.smsKey)
                  put("ts", t.ts)
                  put("amount", t.amount)
                  put("debit", if (t.debit) 1 else 0)
                  put("merchant", t.merchant)
                  put("merchant_key", Learner.norm(t.merchant))
                  put("category", t.category)
                  put("institution", t.institution)
                  put("account", t.account)
                  put("balance", t.balance)
                  put("channel", t.channel)
                  put("ref", t.ref)
                  put("vpa", t.vpa)
                  put("sender", t.sender)
                  put("body", t.body)
                  put("source", t.source)
                  put("status", t.status)
                  put("tpl", t.tpl)
                  put("review", if (t.review) 1 else 0)
              }

              fun insertTxn(t: Txn): Long =
                  writableDatabase.insertWithOnConflict("txn", null, values(t), SQLiteDatabase.CONFLICT_IGNORE)

              fun updateTxn(t: Txn) {
                  writableDatabase.update("txn", values(t), "id=?", arrayOf(t.id.toString()))
              }

              fun deleteTxn(id: Long) {
                  writableDatabase.delete("txn", "id=?", arrayOf(id.toString()))
                  writableDatabase.delete("toll_trips", "txn_id=?", arrayOf(id.toString()))
              }

              private fun toTxn(c: Cursor): Txn {
                  fun s(n: String): String? { val i = c.getColumnIndexOrThrow(n); return if (c.isNull(i)) null else c.getString(i) }
                  fun d(n: String): Double? { val i = c.getColumnIndexOrThrow(n); return if (c.isNull(i)) null else c.getDouble(i) }
                  return Txn(
                      id = c.getLong(c.getColumnIndexOrThrow("id")),
                      smsKey = s("sms_key"),
                      ts = c.getLong(c.getColumnIndexOrThrow("ts")),
                      amount = c.getDouble(c.getColumnIndexOrThrow("amount")),
                      debit = c.getInt(c.getColumnIndexOrThrow("debit")) == 1,
                      merchant = s("merchant") ?: "",
                      category = s("category") ?: "Other",
                      institution = s("institution") ?: "",
                      account = s("account"),
                      balance = d("balance"),
                      channel = s("channel") ?: "OTHER",
                      ref = s("ref"),
                      vpa = s("vpa"),
                      sender = s("sender") ?: "",
                      body = s("body") ?: "",
                      source = s("source") ?: "SMS",
                      status = s("status") ?: "REGEX",
                      tpl = s("tpl") ?: "",
                      review = c.getInt(c.getColumnIndexOrThrow("review")) == 1
                  )
              }

              fun queryTxns(where: String = "1=1", args: Array<String> = emptyArray(), limit: Int = 500): List<Txn> {
                  val out = ArrayList<Txn>()
                  readableDatabase.rawQuery("SELECT * FROM txn WHERE $where ORDER BY ts DESC LIMIT $limit", args).use { c ->
                      while (c.moveToNext()) out.add(toTxn(c))
                  }
                  return out
              }
          }

          object Repo {
              /** Insert a parsed transaction and run all side effects (payees, tolls, learning). */
              fun save(ctx: Context, t: Txn): Long {
                  val db = Db.get(ctx)
                  val id = db.insertTxn(t)
                  if (id > 0) {
                      t.id = id
                      afterSave(ctx, t)
                  }
                  return id
              }

              fun ensurePayee(ctx: Context, t: Txn) {
                  val db = Db.get(ctx)
                  val key = Learner.norm(t.merchant)
                  val skip = setOf("Cash", "FASTag", "Salary/Income", "Received")
                  if (t.debit && key.isNotBlank() && t.merchant != "Unknown" && t.category !in skip) {
                      db.exec("INSERT OR IGNORE INTO payees(merchant_key, display) VALUES(?,?)", key, t.merchant)
                      val vpa = t.vpa
                      if (vpa != null) {
                          db.exec("UPDATE payees SET upi_id=? WHERE merchant_key=? AND (upi_id IS NULL OR upi_id='')", vpa, key)
                      }
                  }
              }

              fun afterSave(ctx: Context, t: Txn) {
                  ensurePayee(ctx, t)
                  if (t.category == "FASTag") Tolls.record(ctx, t)
                  if (t.source == "SMS" && (t.status == "REGEX" || t.status == "LEARNED" || t.status == "USER")) {
                      Learner.trainType(Db.get(ctx), t.body, t.debit, if (t.status == "USER") 3.0 else 1.0)
                  }
              }
          }

          object NetWorth {
              data class Result(val assets: Double, val liabilities: Double, val bank: List<Triple<String, String, Double>>)

              fun compute(ctx: Context): Result {
                  val db = Db.get(ctx)
                  val bank = db.rows(
                      "SELECT institution, account, balance FROM txn t WHERE balance IS NOT NULL AND source='SMS' AND ts = " +
                          "(SELECT MAX(ts) FROM txn WHERE institution=t.institution AND IFNULL(account,'')=IFNULL(t.account,'') AND balance IS NOT NULL)"
                  ).map { Triple(it["institution"] ?: "", it["account"] ?: "", it["balance"]?.toDoubleOrNull() ?: 0.0) }
                  val seen = HashSet<String>()
                  val bankUnique = bank.filter { seen.add(it.first + "|" + it.second) }
                  val manualAssets = db.num("SELECT SUM(amount) FROM net_items WHERE kind='ASSET'")
                  val manualLiab = db.num("SELECT SUM(amount) FROM net_items WHERE kind='LIABILITY'")
                  var loanOut = 0.0
                  for (l in db.rows("SELECT * FROM loans")) loanOut += LoanCalc.outstandingOf(l)
                  return Result(bankUnique.sumOf { it.third } + manualAssets, manualLiab + loanOut, bankUnique)
              }
          }
          EOF_6
          cat > app/src/main/java/com/example/fintrack/Learner.kt <<'EOF_7'
          package com.example.fintrack

          import android.content.Context

          /** On-device learning: merchant->category rules, learned extraction patterns, naive-Bayes debit/credit classifier. */
          object Learner {

              fun norm(s: String): String =
                  s.lowercase().replace(Regex("[^a-z0-9@. ]"), " ").replace(Regex("\\s+"), " ").trim()

              // ---------- merchant -> category ----------
              fun category(db: Db, key: String): String? {
                  if (key.isBlank()) return null
                  val exact = db.rows("SELECT category FROM merchant_rules WHERE merchant_key=?", key).firstOrNull()?.get("category")
                  if (exact != null) return exact
                  var best: String? = null
                  var bw = 0.0
                  for (r in db.rows("SELECT merchant_key, category, weight FROM merchant_rules WHERE length(merchant_key) >= 5")) {
                      val k = r["merchant_key"] ?: continue
                      if (key.contains(k) || k.contains(key)) {
                          val w = r["weight"]?.toDoubleOrNull() ?: 1.0
                          if (w > bw) { bw = w; best = r["category"] }
                      }
                  }
                  return best
              }

              fun learnCategory(db: Db, key: String, display: String, cat: String) {
                  if (key.isBlank()) return
                  val old = db.rows("SELECT category FROM merchant_rules WHERE merchant_key=?", key).firstOrNull()
                  if (old == null) {
                      db.exec("INSERT INTO merchant_rules(merchant_key, display, category, weight) VALUES(?,?,?,?)", key, display, cat, 2.0)
                  } else if (old["category"] == cat) {
                      db.exec("UPDATE merchant_rules SET weight = weight + 1 WHERE merchant_key=?", key)
                  } else {
                      db.exec("UPDATE merchant_rules SET category=?, weight=2 WHERE merchant_key=?", cat, key)
                  }
                  db.exec("UPDATE txn SET category=? WHERE merchant_key=?", cat, key)
              }

              // ---------- learned extraction patterns (per sender + SMS template) ----------
              private fun alpha(s: String) = s.length >= 2 && s.all { it.isLetter() || it == '/' }
              private val structural = setOf("on", "ref", "via", "upi", "avl", "bal", "using", "not", "if", "dated", "vide", "txn", "a/c", "account", "to", "from", "for", "info")

              private fun ctxNorm(t: String) = t.lowercase().replace(Regex("\\d+"), "#")
              private fun ctxRegex(s: String) = s.split("#").joinToString("\\d+") { Regex.escape(it) }

              fun learnMerchantPattern(db: Db, core: String, tpl: String, body: String, merchant: String) {
                  val idx = body.indexOf(merchant, ignoreCase = true)
                  if (idx < 0 || merchant.length < 2) return
                  val before = body.substring(0, idx).trim().split(" ").filter { it.isNotEmpty() }
                  val after = body.substring(idx + merchant.length).trim().split(" ").filter { it.isNotEmpty() }
                  var left = ""
                  if (before.isNotEmpty()) {
                      left = ctxNorm(before.last())
                      if (before.size >= 2 && alpha(before[before.size - 2]) && alpha(before.last())) left = ctxNorm(before[before.size - 2]) + " " + left
                  }
                  var right = ""
                  if (after.isNotEmpty()) {
                      val t = ctxNorm(after.first()).trimEnd('.', ',', ';')
                      if (t in structural || t.none { it.isLetter() }) right = t
                  }
                  db.exec(
                      "INSERT INTO parse_patterns(sender_core, tpl, field, left_ctx, right_ctx, weight) VALUES(?,?,?,?,?,1) " +
                          "ON CONFLICT(sender_core, tpl, field, left_ctx, right_ctx) DO UPDATE SET weight = weight + 1",
                      core, tpl, "merchant", left, right
                  )
              }

              fun applyPatterns(db: Db, core: String, tpl: String, body: String): String? {
                  val pats = db.rows(
                      "SELECT left_ctx, right_ctx FROM parse_patterns WHERE sender_core=? AND tpl=? AND field='merchant' ORDER BY weight DESC",
                      core, tpl
                  )
                  for (p in pats) {
                      val l = p["left_ctx"] ?: ""
                      val r = p["right_ctx"] ?: ""
                      val head = if (l.isEmpty()) "^" else ctxRegex(l) + "\\s+"
                      val tail = if (r.isEmpty()) "(?=\\s+\\d|\\s*[.,;]|\\s*\$)" else "\\s+" + ctxRegex(r)
                      val m = Regex("(?i)$head(.{2,40}?)$tail").find(body)
                      if (m != null) return m.groupValues[1].trim()
                  }
                  return null
              }

              // ---------- naive Bayes: debit vs credit ----------
              private fun words(body: String): Set<String> =
                  Regex("[a-z]{3,15}").findAll(body.lowercase()).map { it.value }.toSet()

              fun trainType(db: Db, body: String, debit: Boolean, w: Double) {
                  if (body.isBlank()) return
                  val col = if (debit) "d" else "c"
                  for (wd in words(body)) {
                      db.exec("INSERT INTO nb_words(word, $col) VALUES(?, ?) ON CONFLICT(word) DO UPDATE SET $col = $col + excluded.$col", wd, w)
                  }
              }

              fun predictDebit(db: Db, body: String): Boolean? {
                  val tot = db.rows("SELECT SUM(d) AS d, SUM(c) AS c, COUNT(*) AS n FROM nb_words").firstOrNull() ?: return null
                  val td = tot["d"]?.toDoubleOrNull() ?: 0.0
                  val tc = tot["c"]?.toDoubleOrNull() ?: 0.0
                  val n = tot["n"]?.toIntOrNull() ?: 0
                  if (n < 20 || td < 5 || tc < 5) return null
                  val ws = words(body).toList()
                  if (ws.isEmpty()) return null
                  val marks = ws.joinToString(",") { "?" }
                  var score = 0.0
                  for (r in db.rows("SELECT word, d, c FROM nb_words WHERE word IN ($marks)", *ws.toTypedArray())) {
                      val d = r["d"]?.toDoubleOrNull() ?: 0.0
                      val c = r["c"]?.toDoubleOrNull() ?: 0.0
                      score += Math.log((d + 1) / (td + n)) - Math.log((c + 1) / (tc + n))
                  }
                  return if (score > 1.0) true else if (score < -1.0) false else null
              }

              // ---------- user correction loop ----------
              fun learnFromCorrection(ctx: Context, old: Txn, new: Txn) {
                  val db = Db.get(ctx)
                  if (new.source == "SMS") {
                      val key = norm(new.merchant)
                      if (new.merchant.isNotBlank() && new.merchant != "Unknown") {
                          learnCategory(db, key, new.merchant, new.category)
                          if (old.status != "REGEX" || !old.merchant.equals(new.merchant, ignoreCase = true)) {
                              learnMerchantPattern(db, SenderMap.core(new.sender), new.tpl, new.body, new.merchant)
                          }
                      }
                      trainType(db, new.body, new.debit, 3.0)
                      reapply(ctx, new.tpl, new.id)
                  } else if (new.merchant.isNotBlank()) {
                      learnCategory(db, norm(new.merchant), new.merchant, new.category)
                  }
              }

              /** Re-run the parser for other un-reviewed rows of the same SMS template, so one fix repairs many. */
              private fun reapply(ctx: Context, tpl: String, exceptId: Long) {
                  if (tpl.isBlank()) return
                  val db = Db.get(ctx)
                  for (r in db.queryTxns("tpl=? AND review=1 AND status!='USER' AND id!=?", arrayOf(tpl, exceptId.toString()), 2000)) {
                      val n = SmsEngine.build(ctx, db, r.sender, r.body, r.ts, false) ?: continue
                      n.id = r.id
                      n.smsKey = r.smsKey
                      db.updateTxn(n)
                      if (n.category == "FASTag") Tolls.record(ctx, n)
                  }
              }
          }

          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class NotifListener : NotificationListenerService() {
              private val WL = setOf("com.dreamplug.androidapp","com.google.android.apps.nbu.paisa.user","com.yesbank.iris","com.phonepe.app","com.jupiter.money","net.one97.paytm","com.mobikwik_new","com.jio.jiopay","com.fedmobile","com.supermoney")

                      else for (t in txns) { val row = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(0, act.dp(6), 0, act.dp(6)) }; row.addView(act.tv("${fmtDateTime(t.ts)} • ${t.merchant}", 12f, C.TEXT), LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)); row.addView(act.tv((if (t.debit) "-" else "+") + inr(t.amount, true), 12f, if (t.debit) C.RED else C.GREEN, true)); col.put(row, 2) }
                      AlertDialog.Builder(act).setTitle(Str.s("contacts")).setView(ScrollView(act).apply { addView(col) }).setPositiveButton(Str.s("close"), null).show()
                  } catch (_: Exception) {}
              }
          }

          object Repo {
              fun save(ctx: Context, t: Txn): Long {
                  val db = Db.get(ctx); val id = db.insertTxn(t); if (id > 0) { t.id = id; afterSave(ctx, t) }; return id
              }
              fun ensurePayee(ctx: Context, t: Txn) {
                  val db = Db.get(ctx); val key = Learner.norm(t.merchant)
                  val skip = setOf("cash", "fastag", "salary/income", "received", "")
                  if (key.isBlank() || key in skip || t.merchant == "Unknown") return
                  db.exec("INSERT OR IGNORE INTO payees(merchant_key, display) VALUES(?,?)", key, t.merchant)
                  val vpa = t.vpa
                  if (!vpa.isNullOrBlank()) db.exec("UPDATE payees SET upi_id=? WHERE merchant_key=? AND (upi_id IS NULL OR upi_id='')", vpa, key)
              }
              fun afterSave(ctx: Context, t: Txn) {
                  ensurePayee(ctx, t)
                  if (t.category == "Travel" || t.channel == "FASTAG") Tolls.record(ctx, t)
                  if (t.source == "SMS" && (t.status == "REGEX" || t.status == "LEARNED" || t.status == "USER")) Learner.trainType(Db.get(ctx), t.body, t.debit, if (t.status == "USER") 3.0 else 1.0)
                  Subs.detect(ctx, t)
              }
          }

          object NetWorth {
              data class Result(val assets: Double, val liabilities: Double, val bank: List<Triple<String, String, Double>>, val wallets: List<Triple<String, String, Double>>, val loans: List<Triple<String, String, Double>>)
              fun compute(ctx: Context): Result {
                  val db = Db.get(ctx)
                  val rows = db.rows("SELECT institution, account, kind, balance FROM accounts WHERE excluded=0 AND balance IS NOT NULL")
                  val banks = ArrayList<Triple<String, String, Double>>()
                  val wallets = ArrayList<Triple<String, String, Double>>()
                  val loans = ArrayList<Triple<String, String, Double>>()
                  for (r in rows) {
                      val inst = r["institution"] ?: ""; val acct = r["account"] ?: ""; val kind = r["kind"] ?: "BANK"; val bal = r["balance"]?.toDoubleOrNull() ?: 0.0
                      when (kind) {
                          "WALLET" -> wallets.add(Triple(inst, acct, bal))
                          "LOAN" -> loans.add(Triple(inst, acct, bal))
                          else -> banks.add(Triple(inst, acct, bal))
                      }
                  }

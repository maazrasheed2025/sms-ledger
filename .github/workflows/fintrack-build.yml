              private val structural = setOf("on","ref","via","upi","avl","bal","using","not","if","dated","vide","txn","a/c","account","to","from","for","info")
              private fun ctxNorm(t: String) = t.lowercase().replace(Regex("""\d+"""), "#")
              private fun ctxRegex(s: String) = s.split("#").joinToString("""\d+""") { Regex.escape(it) }
              fun learnMerchantPattern(db: Db, core: String, tpl: String, body: String, merchant: String) {
                  val idx = body.indexOf(merchant, ignoreCase = true); if (idx < 0 || merchant.length < 2) return
                  val before = body.substring(0, idx).trim().split(" ").filter { it.isNotEmpty() }
                  val after = body.substring(idx + merchant.length).trim().split(" ").filter { it.isNotEmpty() }
                  var left = ""
                  if (before.isNotEmpty()) { left = ctxNorm(before.last()); if (before.size >= 2 && alpha(before[before.size-2]) && alpha(before.last())) left = ctxNorm(before[before.size-2]) + " " + left }
                  var right = ""
                  if (after.isNotEmpty()) { val t = ctxNorm(after.first()).trimEnd('.', ',', ';'); if (t in structural || t.none { it.isLetter() }) right = t }
                  db.exec("INSERT INTO parse_patterns(sender_core, tpl, field, left_ctx, right_ctx, weight) VALUES(?,?,?,?,?,1) ON CONFLICT(sender_core, tpl, field, left_ctx, right_ctx) DO UPDATE SET weight = weight + 1", core, tpl, "merchant", left, right)
              }
              fun applyPatterns(db: Db, core: String, tpl: String, body: String): String? {
                  val pats = db.rows("SELECT left_ctx, right_ctx FROM parse_patterns WHERE sender_core=? AND tpl=? AND field='merchant' ORDER BY weight DESC", core, tpl)
                  for (p in pats) {
                      val l = p["left_ctx"] ?: ""; val r = p["right_ctx"] ?: ""
                      val head = if (l.isEmpty()) "^" else ctxRegex(l) + """\s+"""
                      val tail = if (r.isEmpty()) """(?=\s+\d|\s*[.,;]|\s*$)""" else """\s+""" + ctxRegex(r)

          object CsvImporter {
              data class ParseResult(val header: List<String>, val rows: List<List<String>>)
              fun splitCsv(line: String): List<String> {
                  val out = ArrayList<String>(); val sb = StringBuilder(); var inQ = false; var i = 0
                  while (i < line.length) {
                      val ch = line[i]
                      if (inQ) { if (ch == '"') { if (i + 1 < line.length && line[i + 1] == '"') { sb.append('"'); i++ } else inQ = false } else sb.append(ch) }
                      else if (ch == '"') inQ = true
                      else if (ch == ',') { out.add(sb.toString()); sb.setLength(0) }
                      else sb.append(ch)
                      i++
                  }
                  out.add(sb.toString()); return out
              }
              fun parse(text: String, skipLines: Int = 0): ParseResult {
                  val lines = text.lines().drop(skipLines).filter { it.isNotBlank() }
                  if (lines.isEmpty()) return ParseResult(emptyList(), emptyList())

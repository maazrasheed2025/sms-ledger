          package com.example.fintrack

          import android.content.Context
          import android.content.Intent
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.net.Uri
          import android.view.MotionEvent
          import android.view.ScaleGestureDetector
          import android.view.View
          import android.view.ViewGroup
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.ScrollView
          import androidx.appcompat.app.AlertDialog

          class RouteMapView(ctx: Context) : View(ctx) {
              class Pt(val lat: Double, val lon: Double, val label: String)

              private var trips: List<List<Pt>> = emptyList()
              private var scale = 1f
              private var tx = 0f
              private var ty = 0f
              private var lx = 0f
              private var ly = 0f
              private val colors = intArrayOf(C.ACCENT, C.GREEN, C.AMBER, C.RED, Color.parseColor("#C084FC"), Color.parseColor("#22D3EE"))
              private val gridP = Paint().apply { color = Color.parseColor("#1F2430"); strokeWidth = 2f }
              private val lineP = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE; strokeWidth = 6f; strokeCap = Paint.Cap.ROUND; strokeJoin = Paint.Join.ROUND
              }
              private val dotP = Paint(Paint.ANTI_ALIAS_FLAG)
              private val txtP = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = C.MUTED; textSize = 24f }
              private val lblP = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = C.TEXT; textSize = 24f }

              private val sd = ScaleGestureDetector(ctx, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                  override fun onScale(d: ScaleGestureDetector): Boolean {
                      scale = (scale * d.scaleFactor).coerceIn(0.5f, 14f)
                      invalidate()
                      return true
                  }
              })

              fun setTrips(t: List<List<Pt>>) {
                  trips = t; scale = 1f; tx = 0f; ty = 0f
                  invalidate()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  sd.onTouchEvent(e)
                  if (!sd.isInProgress) {
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> { lx = e.x; ly = e.y; parent?.requestDisallowInterceptTouchEvent(true) }
                          MotionEvent.ACTION_MOVE -> { tx += e.x - lx; ty += e.y - ly; lx = e.x; ly = e.y; invalidate() }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> parent?.requestDisallowInterceptTouchEvent(false)
                      }
                  } else { lx = e.x; ly = e.y }
                  return true
              }

              override fun onDraw(canvas: Canvas) {
                  canvas.drawColor(Color.parseColor("#0B0D12"))
                  val all = trips.flatten()
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (all.isEmpty()) { canvas.drawText("Koi toll trip nahi mili", 30f, h / 2, txtP); return }
                  var minLat = all.minOf { it.lat }; var maxLat = all.maxOf { it.lat }
                  var minLon = all.minOf { it.lon }; var maxLon = all.maxOf { it.lon }
                  if (maxLat - minLat < 0.1) { minLat -= 0.05; maxLat += 0.05 }
                  if (maxLon - minLon < 0.1) { minLon -= 0.05; maxLon += 0.05 }
                  val kx = Math.cos(Math.toRadians((minLat + maxLat) / 2))
                  val spanX = (maxLon - minLon) * kx
                  val spanY = maxLat - minLat
                  val pad = 70f
                  val s0 = Math.min((w - 2 * pad) / spanX, (h - 2 * pad) / spanY).toFloat()
                  val offX = (w - spanX.toFloat() * s0) / 2
                  val offY = (h - spanY.toFloat() * s0) / 2
                  fun px(lon: Double): Float = ((((lon - minLon) * kx).toFloat() * s0 + offX) - w / 2) * scale + w / 2 + tx
                  fun py(lat: Double): Float = (((maxLat - lat).toFloat() * s0 + offY) - h / 2) * scale + h / 2 + ty

                  val steps = doubleArrayOf(0.1, 0.25, 0.5, 1.0, 2.0, 5.0, 10.0)
                  var step = 10.0
                  for (s in steps) if ((maxLon - minLon) / s <= 6) { step = s; break }
                  var lon = Math.ceil(minLon / step) * step
                  while (lon <= maxLon) {
                      val x = px(lon)
                      canvas.drawLine(x, 0f, x, h, gridP)
                      canvas.drawText(String.format("%.2f°E", lon), x + 4, h - 8, txtP)
                      lon += step
                  }
                  var lat = Math.ceil(minLat / step) * step
                  while (lat <= maxLat) {
                      val y = py(lat)
                      canvas.drawLine(0f, y, w, y, gridP)
                      canvas.drawText(String.format("%.2f°N", lat), 6f, y - 4, txtP)
                      lat += step
                  }

                  for ((k, trip) in trips.withIndex()) {
                      val col = colors[k % colors.size]
                      lineP.color = col
                      dotP.color = col
                      val path = Path()
                      for ((i, p) in trip.withIndex()) {
                          if (i == 0) path.moveTo(px(p.lon), py(p.lat)) else path.lineTo(px(p.lon), py(p.lat))
                      }
                      canvas.drawPath(path, lineP)
                      for (p in trip) {
                          canvas.drawCircle(px(p.lon), py(p.lat), 10f, dotP)
                          canvas.drawText(p.label, px(p.lon) + 14f, py(p.lat) - 12f, lblP)
                      }
                  }
              }
          }

          class TravelScreen(act: MainActivity) : Screen(act) {
              private var sel = -1
              private val summary = act.tv("", 13f, C.MUTED).apply { setPadding(act.dp(14), act.dp(8), act.dp(14), act.dp(2)) }
              private val chips = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL; setPadding(act.dp(8), 0, act.dp(8), 0) }
              private val map = RouteMapView(act)

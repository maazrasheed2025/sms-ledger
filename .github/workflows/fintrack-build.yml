              }
              private fun showPayee(p: Map<String, String?>) {
                  val key = p["k"] ?: return; val name = p["display"] ?: key
                  val db = Db.get(act)
                  val all = db.queryTxns("merchant_key=?", arrayOf(key), 500)
                  val spent = all.filter { it.debit }.sumOf { it.amount }
                  val recv = all.filter { !it.debit }.sumOf { it.amount }
                  val col = act.vbox(10)
                  col.addView(act.tv("Out: ${inr(spent)}  •  In: ${inr(recv)}  •  Net: ${inr(recv - spent)}", 13f, C.TEXT, true))
                  if (!p["upi_id"].isNullOrBlank()) col.addView(act.tv("UPI: ${p["upi_id"]}", 12f, C.MUTED))
                  val autoIds = PayeeOps.smartMidnightDeleteIds(all)
                  if (autoIds.isNotEmpty()) col.addView(act.tv("💡 ${autoIds.size} duplicate entries mile (same date+amount+type, 00:00 timestamp) — auto-tick ho gaye hain", 12f, C.AMBER))
                  val selectedIds = LinkedHashSet<Long>(autoIds)
                  val historyContainer = act.vbox(6)
                  for (t in all) {
                      val line = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                      val cb = CheckBox(act).apply { isChecked = autoIds.contains(t.id) }
                      cb.setOnCheckedChangeListener { _, isChecked -> if (isChecked) selectedIds.add(t.id) else selectedIds.remove(t.id) }
                      line.addView(cb)
                      val info = act.vbox(2)
                      info.addView(act.tv("${fmtDateTime(t.ts)}  •  ${if (t.debit) "-" else "+"}${inr(t.amount, true)}  ${t.merchant}", 12f, if (t.debit) C.RED else C.GREEN))
                      if (t.body.isNotEmpty()) info.addView(act.tv(t.body.take(80), 10f, C.MUTED))
                      line.addView(info, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      historyContainer.addView(line)
                  }
                  col.addView(ScrollView(act).apply { addView(historyContainer) }, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, act.dp(300)))
                  val dlg = AlertDialog.Builder(act).setTitle(name).setView(ScrollView(act).apply { addView(col) })
                      .setPositiveButton("UPI se pay") { _, _ -> pay(key, name, p["upi_id"]) }
                      .setNegativeButton("Band karo", null)
                      .setNeutralButton("Delete selected (${selectedIds.size})", null)
                      .create()
                  dlg.setOnShowListener {
                      dlg.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener {
                          if (selectedIds.isEmpty()) { act.toast("Pehle transactions chuno"); return@setOnClickListener }
                          PayeeOps.bulkDelete(act, selectedIds.toList()); act.toast("${selectedIds.size} deleted"); act.refreshAll(); dlg.dismiss()
                      }
                  }
                  dlg.show()
              }
              private fun pay(key: String, name: String, upi: String?) {
                  if (upi.isNullOrBlank() || !upi.contains("@")) { act.toast("UPI ID nahi mila"); return }
                  act.showForm("Pay: $name", listOf(Field("Amount (optional)", "", true), Field("Note (optional)", "")), "Pay") { v ->
                      var url = "upi://pay?pa=" + Uri.encode(upi) + "&pn=" + Uri.encode(name) + "&cu=INR"
                      val amt = v[0].toDoubleOrNull(); if (amt != null && amt > 0) url += "&am=" + String.format(Locale.US, "%.2f", amt)
                      if (v[1].isNotBlank()) url += "&tn=" + Uri.encode(v[1])
                      try { act.startActivity(Intent.createChooser(Intent(Intent.ACTION_VIEW, Uri.parse(url)), "Pay with")) } catch (e: Exception) { act.toast("UPI app nahi mila") }
                  }
              }
          }
          EOF_21


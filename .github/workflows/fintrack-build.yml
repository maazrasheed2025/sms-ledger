                      "com.yesbank.iris" to "IRIS YES Bank",
                      "com.phonepe.app" to "PhonePe",
                      "com.jupiter.money" to "Jupiter",
                      "net.one97.paytm" to "Paytm",
                      "com.mobikwik_new" to "Mobikwik",
                      "com.yesbank.next" to "YES Pay Next",
                      "com.jio.jiopay" to "JioFinance",
                      "com.fedmobile" to "FedMobile",
                      "com.supermoney" to "super.money"
                  )
              }
              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  val n = sbn ?: return
                  if (n.packageName !in WHITELIST) return
                  try { processNotif(applicationContext, n) } catch (e: Exception) {}
              }
              private fun processNotif(ctx: Context, sbn: StatusBarNotification) {
                  val extras = sbn.notification?.extras ?: return
                  val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                  val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  val big = extras.getCharSequence(Notification.EXTRA_BIG_TEXT)?.toString() ?: ""
                  val full = (title + " " + text + " " + big).trim()
                  if (full.length < 5) return
                  val amountRe = Regex("""(?:₹|rs\.?|inr)\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)""", RegexOption.IGNORE_CASE)
                  val amount = amountRe.find(full)?.groupValues?.get(1)?.replace(",", "")?.toDoubleOrNull() ?: return
                  if (amount <= 0) return
                  val l = full.lowercase()
                  val debit = when {
                      "debited" in l || "paid" in l || "sent" in l || "spent" in l || "withdrawn" in l || "purchase" in l -> true
                      "credited" in l || "received" in l || "refund" in l || "cashback" in l -> false
                      else -> true
                  }
                  val vendor = NAME_MAP[sbn.packageName] ?: sbn.packageName
                  val merchant = when {
                      "to " in l -> { val idx = l.indexOf("to "); full.substring(idx + 3).trim().split(" ").take(3).joinToString(" ").trim().trimEnd('.', ',') }
                      "from " in l -> { val idx = l.indexOf("from "); full.substring(idx + 5).trim().split(" ").take(3).joinToString(" ").trim().trimEnd('.', ',') }
                      else -> vendor
                  }.ifBlank { vendor }.take(40)
                  val db = Db.get(ctx)
                  val now = sbn.postTime
                  val tenMin = 10 * 60_000L
                  val hit = db.queryTxns("source='SMS' AND debit=? AND amount=? AND ts BETWEEN ? AND ?", arrayOf((if (debit) 1 else 0).toString(), amount.toString(), (now - tenMin).toString(), (now + tenMin).toString()), 1)
                  if (hit.isNotEmpty()) return
                  val hit2 = db.queryTxns("source='NOTIF' AND debit=? AND amount=? AND ts BETWEEN ? AND ?", arrayOf((if (debit) 1 else 0).toString(), amount.toString(), (now - 30_000L).toString(), (now + 30_000L).toString()), 1)
                  if (hit2.isNotEmpty()) return
                  val key = "NOTIF|" + sbn.packageName + "|" + full.hashCode()
                  val t = Txn(smsKey = key, ts = now, amount = amount, debit = debit, merchant = merchant, category = Categories.classify(merchant, full, debit), institution = vendor, channel = "APP", sender = sbn.packageName, body = full, source = "NOTIF", status = "NOTIF", tpl = "", review = false)
                  Repo.save(ctx, t)
              }
          }

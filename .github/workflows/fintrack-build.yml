          }
          fun inr(v: Double, paise: Boolean = false): String {
              val s = String.format(Locale.US, if (paise) "%.2f" else "%.0f", Math.abs(v))
              val parts = s.split("."); var whole = parts[0]
              if (whole.length > 3) {
                  val last3 = whole.takeLast(3); var rest = whole.dropLast(3); val groups = ArrayList<String>()
                  while (rest.length > 2) { groups.add(0, rest.takeLast(2)); rest = rest.dropLast(2) }
                  if (rest.isNotEmpty()) groups.add(0, rest)
                  whole = groups.joinToString(",") + "," + last3
              }
              return (if (v < 0) "-" else "") + "₹" + whole + (if (parts.size > 1) "." + parts[1] else "")
          }

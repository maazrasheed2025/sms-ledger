              fun tripsByDate(ctx: Context): Map<String, List<TollCheckpoint>> { val out = LinkedHashMap<String, MutableList<TollCheckpoint>>(); try { val rows = Db.get(ctx).rows("SELECT txn_id, plaza, lat, lon, ts, amount FROM toll_trips ORDER BY ts DESC"); for (r in rows) { val name = r["plaza"] ?: continue; val ts = r["ts"]?.toLongOrNull() ?: continue; val amt = r["amount"]?.toDoubleOrNull() ?: continue; val seed = plazaCoord(name); val lat = seed?.get(1) ?: r["lat"]?.toDoubleOrNull() ?: 0.0; val lon = seed?.get(0) ?: r["lon"]?.toDoubleOrNull() ?: 0.0; val day = dayFmt.format(Date(ts)); out.getOrPut(day) { ArrayList() }.add(TollCheckpoint(name, ts, amt, lat, lon, r["txn_id"]?.toLongOrNull() ?: 0)) } } catch (_: Exception) {}; return out }

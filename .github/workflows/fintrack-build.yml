                  super.onDraw(canvas)
                  val n = values.size; val w = width.toFloat() / n; val h = height.toFloat()
                  val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  for (i in 0 until n) {
                      val v = values[i]; val frac = (v.toFloat() / maxValue).coerceIn(0f, 1f)
                      val col = when { v == 0 -> Color.parseColor("#1A1E26"); frac < 0.33 -> Color.parseColor("#2F6B45"); frac < 0.66 -> Color.parseColor("#5B9CFF"); else -> Color.parseColor("#FF6B6B") }
                      p.color = col
                      canvas.drawRoundRect(i * w + 2f, 4f, (i + 1) * w - 2f, h - 4f, 4f, 4f, p)
                  }
              }
          }

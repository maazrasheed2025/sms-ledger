                      setOnItemClickListener { _, _, pos, _ -> val p = this@PayeesScreen.adapter.items.getOrNull(pos) ?: return@setOnItemClickListener
                          if (selectMode) { val k = p["k"] ?: return@setOnItemClickListener; if (!selected.add(k)) selected.remove(k); this@PayeesScreen.adapter.notifyDataSetChanged(); this@PayeesScreen.refresh() } else this@PayeesScreen.showPayee(p)
                      }
                      setOnItemLongClickListener { _, _, pos, _ -> val k = this@PayeesScreen.adapter.items.getOrNull(pos)?.get("k") ?: return@setOnItemLongClickListener false; selectMode = true; selected.add(k); this@PayeesScreen.adapter.notifyDataSetChanged(); refresh(); true }

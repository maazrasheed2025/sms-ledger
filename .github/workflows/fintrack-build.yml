                  var best: String? = null; var bestScore = 0; var i = 0
                  while (i < toks.size) {
                      val t = toks[i]; val low = t.v.lowercase().trimEnd('.')
                      if (t.v[0].isUpperCase() && low !in stop && low !in inst) {
                          var j = i
                          while (j + 1 < toks.size && j - i < 3) {
                              val n = toks[j + 1]; val nl = n.v.lowercase().trimEnd('.')
                              if (body.substring(toks[j].e, n.s) == " " && n.v[0].isUpperCase() && nl !in stop && nl !in inst) j++ else break
                          }

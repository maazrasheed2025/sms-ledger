          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:pathData="M11,11m-7,0a7,7 0 1,0 14,0a7,7 0 1,0 -14,0" android:strokeColor="#FFFFFFFF" android:strokeWidth="2" android:fillColor="#00000000"/><path android:pathData="M21,21l-4.35,-4.35" android:strokeColor="#FFFFFFFF" android:strokeWidth="2" android:strokeLineCap="round"/></vector>

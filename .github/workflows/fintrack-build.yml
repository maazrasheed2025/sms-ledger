          package com.example.fintrack

          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.util.AttributeSet
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.ScrollView
          import androidx.appcompat.app.AlertDialog
          import org.osmdroid.tileprovider.tilesource.OnlineTileSourceBase
          import org.osmdroid.util.BoundingBox
          import org.osmdroid.util.GeoPoint
          import org.osmdroid.util.MapTileIndex
          import org.osmdroid.views.MapView
          import org.osmdroid.views.overlay.Marker
          import org.osmdroid.views.overlay.Polyline
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          private val OSMFR_HOT = object : OnlineTileSourceBase(
              "OSM-FR-HOT", 0, 19, 256, ".png",
              arrayOf("https://a.tile.openstreetmap.fr/hot/",
                      "https://b.tile.openstreetmap.fr/hot/",
                      "https://c.tile.openstreetmap.fr/hot/"),
              "© OpenStreetMap contributors, Tiles: OSM-FR"
          ) {
              override fun getTileURLString(pMapTileIndex: Long): String =
                  baseUrl + MapTileIndex.getZoom(pMapTileIndex) + "/" + MapTileIndex.getX(pMapTileIndex) + "/" + MapTileIndex.getY(pMapTileIndex) + mImageFilenameEnding
          }

          class RouteMapView @JvmOverloads constructor(ctx: Context, attrs: AttributeSet? = null) : MapView(ctx, attrs) {
              class Pt(val lat: Double, val lon: Double, val label: String, val ts: Long)
              init { setTileSource(OSMFR_HOT); setMultiTouchControls(true); setBuiltInZoomControls(false); controller.setZoom(5.0); controller.setCenter(GeoPoint(22.0, 79.0)); try { overlayManager.tilesOverlay.setColorFilter(null) } catch (e: Exception) {} }

              /**
               * Draws two lines per trip:
               *  - Outbound (green): from trip start to the furthest point
               *  - Return (red): from furthest point back to trip start
               * A small arrow marker shows direction at the midpoint of each leg.
               */
              fun setTrips(trips: List<List<Pt>>) {
                  overlays.clear()
                  val allPoints = trips.flatten().filter { it.lat != 0.0 && it.lon != 0.0 }
                  if (allPoints.isEmpty()) { controller.setCenter(GeoPoint(22.0, 79.0)); controller.setZoom(5.0); invalidate(); return }

                  for ((tripIndex, rawTrip) in trips.withIndex()) {
                      val trip = rawTrip.filter { it.lat != 0.0 && it.lon != 0.0 }.sortedBy { it.ts }
                      if (trip.isEmpty()) continue
                      if (trip.size == 1) {
                          addPin(trip[0], "📍")
                          continue
                      }
                      // Split into outbound + return at the *furthest* point from the start
                      val start = trip.first()
                      var farIdx = 0
                      var maxDist = 0.0
                      for (k in trip.indices) {
                          val d = haversine(start, trip[k])
                          if (d > maxDist) { maxDist = d; farIdx = k }
                      }
                      val outbound = trip.subList(0, farIdx + 1)
                      val returning = trip.subList(farIdx, trip.size)
                      // Fallback: if outbound has 1 point, use first half; same for return
                      val outPts = if (outbound.size >= 2) outbound else trip.subList(0, (trip.size / 2) + 1)
                      val retPts = if (returning.size >= 2) returning else trip.subList(trip.size / 2, trip.size)

                      addPolyline(outPts, Color.parseColor("#10B981"), arrows = true, label = "Out $tripIndex")
                      if (retPts.size >= 2 && farIdx > 0 && farIdx < trip.size - 1) {
                          addPolyline(retPts, Color.parseColor("#DC2626"), arrows = true, label = "Return $tripIndex")
                      }
                      // Pins at each stop
                      for ((i, p) in trip.withIndex()) {
                          addPin(p, if (i == 0) "🟢 Start" else if (i == trip.size - 1) "🔴 End" else "📍")
                      }
                  }

                  try {
                      val bbox = BoundingBox.fromGeoPoints(allPoints.map { GeoPoint(it.lat, it.lon) })
                      zoomToBoundingBox(bbox, true, 80)
                  } catch (e: Exception) {
                      controller.setCenter(GeoPoint(allPoints.first().lat, allPoints.first().lon)); controller.setZoom(7.0)
                  }
                  invalidate()
              }

              private fun haversine(a: Pt, b: Pt): Double {
                  val R = 6371.0
                  val dLat = Math.toRadians(b.lat - a.lat)
                  val dLon = Math.toRadians(b.lon - a.lon)
                  val la1 = Math.toRadians(a.lat); val la2 = Math.toRadians(b.lat)
                  val x = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                          Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) * Math.sin(dLon / 2)
                  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x))
              }

              private fun addPolyline(points: List<Pt>, color: Int, arrows: Boolean, label: String) {
                  val line = Polyline()
                  line.setPoints(points.map { GeoPoint(it.lat, it.lon) })
                  line.outlinePaint.color = color
                  line.outlinePaint.strokeWidth = 10f
                  line.title = label
                  overlays.add(line)
                  if (arrows && points.size >= 2) {
                      // Arrow at midpoint
                      val mid = points.size / 2
                      val p1 = points[mid - 1]; val p2 = points[mid]
                      val bearing = Math.toDegrees(Math.atan2(p2.lon - p1.lon, p2.lat - p1.lat))
                      val marker = Marker(this)
                      marker.position = GeoPoint(p2.lat, p2.lon)
                      marker.icon = arrowDrawable(color, bearing)
                      marker.setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_CENTER)
                      overlays.add(marker)
                  }
              }

              private fun arrowDrawable(color: Int, bearingDeg: Double): android.graphics.drawable.Drawable {
                  val d = object : android.graphics.drawable.Drawable() {
                      private val p = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG).apply {
                          this.color = color; style = android.graphics.Paint.Style.FILL
                      }
                      override fun draw(canvas: android.graphics.Canvas) {
                          val w = bounds.width().toFloat(); val h = bounds.height().toFloat()
                          canvas.save()
                          canvas.rotate(bearingDeg.toFloat(), w / 2, h / 2)
                          val path = android.graphics.Path()
                          path.moveTo(w / 2, h * 0.15f)
                          path.lineTo(w * 0.35f, h * 0.85f)
                          path.lineTo(w * 0.5f, h * 0.65f)
                          path.lineTo(w * 0.65f, h * 0.85f)
                          path.close()
                          canvas.drawPath(path, p)
                          canvas.restore()
                      }
                      override fun setAlpha(alpha: Int) {}
                      override fun setColorFilter(cf: android.graphics.ColorFilter?) {}
                      @Deprecated("Deprecated in Java")
                      override fun getOpacity(): Int = android.graphics.PixelFormat.TRANSLUCENT
                  }
                  d.setBounds(0, 0, 28, 28)
                  return d
              }

              private fun addPin(p: Pt, labelPrefix: String) {
                  val m = Marker(this)
                  m.position = GeoPoint(p.lat, p.lon)
                  val time = SimpleDateFormat("HH:mm", Locale.US).format(Date(p.ts))
                  m.title = "$labelPrefix ${p.label}"
                  m.snippet = time
                  m.setAnchor(Marker.ANCHOR_CENTER, Marker.ANCHOR_BOTTOM)
                  overlays.add(m)
              }
          }


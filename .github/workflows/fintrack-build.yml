                          override fun afterTextChanged(s: android.text.Editable?) { query = s?.toString()?.trim() ?: ""; refresh() }
                      })
                  }
                  put(search, 8); put(HorizontalScrollView(act).apply { isHorizontalScrollBarEnabled = false; addView(chips) }, 4); put(summary, 0); put(list, 0, 1f)
              }
              fun setFilter(f: Filter) { filter = f; refresh() }
              override fun refresh() {
                  chips.removeAllViews()
                  for ((k, label) in listOf("all" to "All", "review" to "⚠ Review", "debit" to "Kharch", "credit" to "Mila")) chips.addView(act.pill(label, filter.mode == k) { filter = Filter(mode = k); refresh() })
                  if (filter.mode == "cat" && filter.category != null) chips.addView(act.pill("Cat: ${filter.category} ✕", true) { filter = Filter(); refresh() })
                  if (filter.year != null && filter.month != null) {
                      val label = "${filter.year}-${String.format("%02d", filter.month!! + 1)} ✕"
                      chips.addView(act.pill(label, true) { filter = filter.copy(year = null, month = null); refresh() })
                  }
                  chips.addView(act.pill("Scan duplicates", false) { showDuplicates() })
                  if (query.isNotBlank()) chips.addView(act.pill("Merge to payee", false) { askBulkMerge() })
                  if (selectMode) {
                      chips.addView(act.pill("Delete (${selected.size})", true) { act.bulkDelete(selected.toList()); selectMode = false; selected.clear(); refresh() })
                      chips.addView(act.pill("Categorize (${selected.size})", true) { act.bulkCategory(selected.toList()); selectMode = false; selected.clear(); refresh() })
                      chips.addView(act.pill("Cancel", false) { selectMode = false; selected.clear(); refresh() })
                  }
                  val all = currentRows()
                  if (filter.mode == "review") {
                      val groups = LinkedHashMap<String, MutableList<Txn>>()
                      for (t in all) { if (!t.review) continue; val h = t.reviewHash ?: Db.get(act).computeReviewHash(t); groups.getOrPut(h) { ArrayList() }.add(t) }
                      val rows = ArrayList<Row>()
                      for ((h, list) in groups) { val sample = list.first(); rows.add(Row.GroupRow(h, list.size, list.sumOf { it.amount }, sample.merchant, sample.category, sample.debit)) }
                      adapter.items = rows; summary.text = "${all.count { it.review }} entries in ${groups.size} groups"
                  } else {
                      adapter.items = all.map { Row.TxnRow(it) }
                      val out = all.filter { it.debit }.sumOf { it.amount }; val inn = all.filter { !it.debit }.sumOf { it.amount }
                      summary.text = "${all.size} entries  •  Kharch ${inr(out)}  •  Mila ${inr(inn)}"
                  }
                  adapter.notifyDataSetChanged()
              }

              private fun currentRows(): List<Txn> {
                  val where = StringBuilder("1=1"); val args = ArrayList<String>()
                  when (filter.mode) { "debit" -> where.append(" AND debit=1"); "credit" -> where.append(" AND debit=0"); "cat" -> { where.append(" AND category=?"); args.add(filter.category ?: "") } }
                  if (filter.year != null && filter.month != null) {
                      val cal = Calendar.getInstance().apply { set(Calendar.YEAR, filter.year!!); set(Calendar.MONTH, filter.month!!); set(Calendar.DAY_OF_MONTH, 1); set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0); set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0) }
                      val start = cal.timeInMillis; cal.add(Calendar.MONTH, 1)
                      where.append(" AND ts>=? AND ts<?"); args.add(start.toString()); args.add(cal.timeInMillis.toString())
                  }
                  val q = query
                  if (q.isNotEmpty()) {
                      val tokens = q.split(" "); val plain = StringBuilder()
                      for (t in tokens) {
                          when {
                              t.startsWith("#") -> { where.append(" AND category=?"); args.add(t.substring(1).replaceFirstChar { it.uppercase() }) }
                              t.startsWith(">") && t.substring(1).toDoubleOrNull() != null -> { where.append(" AND amount>?"); args.add(t.substring(1)) }
                              t.startsWith("<") && t.length > 7 && t.matches(Regex("<\\d{4}-\\d{2}")) -> {
                                  val parts = t.substring(1).split("-"); val y = parts[0].toInt(); val m = parts[1].toInt() - 1
                                  val c = Calendar.getInstance().apply { set(Calendar.YEAR, y); set(Calendar.MONTH, m); set(Calendar.DAY_OF_MONTH, 1) }
                                  where.append(" AND ts<?"); args.add(c.timeInMillis.toString())
                              }
                              else -> { if (plain.isNotEmpty()) plain.append(" "); plain.append(t) }
                          }
                      }
                      if (plain.isNotEmpty()) { where.append(" AND (merchant LIKE ? OR body LIKE ? OR ref LIKE ? OR vpa LIKE ?)"); repeat(4) { args.add("%$plain%") } }
                  }
                  return Db.get(act).queryTxns(where.toString(), args.toTypedArray(), 1000)
              }

              private fun askBulkMerge() {
                  val rows = currentRows()
                  if (rows.isEmpty()) { act.toast("Is search me kuch nahi mila"); return }
                  val keys = rows.map { Learner.norm(it.merchant) }.filter { it.isNotBlank() && it != "unknown" }.distinct()
                  if (keys.isEmpty()) { act.toast("In txns me koi payee nahi hai"); return }
                  val existing = Db.get(act).rows("SELECT merchant_key, display FROM payees WHERE merchant_key IN (" + keys.joinToString(",") { "?" } + ") ORDER BY display", *keys.toTypedArray())
                  val names = existing.map { it["display"] ?: it["merchant_key"] ?: "" }.toMutableList()
                  names.add("✏ Custom name…")
                  AlertDialog.Builder(act).setTitle("In ${rows.size} txns ko kis payee me bhejein?")
                      .setItems(names.toTypedArray()) { _, which ->
                          if (which == names.size - 1) act.showForm("Custom payee name", listOf(Field("Naam", keys.first()))) { v -> doBulkReassign(keys, v[0]) }
                          else doBulkReassign(keys, names[which])
                      }
                      .setNegativeButton("Cancel", null).show()
              }

              private fun doBulkReassign(fromKeys: List<String>, newName: String) {
                  val target = newName.trim()
                  if (target.isBlank()) { act.toast("Naam khali nahi ho sakta"); return }
                  Thread {
                      PayeeOps.reassignToPayee(act, fromKeys, Learner.norm(target), target)
                      act.runOnUiThread { act.toast("Merged ${fromKeys.size} payees → $target"); act.refreshAll() }
                  }.start()
              }

              private fun showDuplicates() {
                  val rows = PayeeOps.flattenDuplicates(act)
                  if (rows.isEmpty()) { act.toast("Koi duplicate nahi mila"); return }
                  val container = act.vbox(8)
                  container.addView(act.tv("${rows.size} rows in ${rows.map { it.groupKey }.distinct().size} groups", 12f, C.MUTED))
                  val checkboxes = LinkedHashMap<Long, CheckBox>()
                  for (row in rows) {
                      val t = row.txn
                      val line = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(0, act.dp(6), 0, act.dp(6)) }
                      val cb = CheckBox(act).apply { isChecked = row.defaultDelete }
                      checkboxes[t.id] = cb
                      line.addView(cb)
                      val info = act.vbox(4)
                      info.addView(act.tv("${fmtDateTime(t.ts)}  •  ${t.institution}", 12f, C.TEXT, true))
                      val upi = if (!t.vpa.isNullOrBlank()) "  •  ${t.vpa}" else ""
                      info.addView(act.tv("${t.merchant}$upi", 12f, if (t.merchant.trim().lowercase() == "unknown") C.RED else C.MUTED))
                      info.addView(act.tv((if (t.debit) "-" else "+") + inr(t.amount, true), 13f, if (t.debit) C.RED else C.GREEN, true))
                      line.addView(info, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      container.addView(line)
                  }
                  AlertDialog.Builder(act).setTitle("Duplicates — tick to delete")
                      .setView(ScrollView(act).apply { addView(container) })
                      .setPositiveButton("Delete ticked") { _, _ ->
                          var n = 0
                          for ((id, cb) in checkboxes) if (cb.isChecked) { Db.get(act).deleteTxn(id); n++ }
                          act.toast("$n deleted"); act.refreshAll()
                      }
                      .setNegativeButton("Cancel", null)
                      .setNeutralButton("Smart select") { _, _ ->
                          val fresh = PayeeOps.flattenDuplicates(act)
                          for (r in fresh) checkboxes[r.txn.id]?.isChecked = r.defaultDelete
                      }
                      .show()
              }

              private fun openGroupFix(g: Row.GroupRow) {
                  act.showForm("Fix group (${g.count} txns)",
                      listOf(Field("Kisko / dukaan", g.sampleMerchant), Field("Type", if (g.sampleDebit) "Debit (kharch)" else "Credit (mila)", options = listOf("Debit (kharch)", "Credit (mila)")), Field("Category", g.sampleCategory, options = Categories.ALL)),
                      okLabel = "Apply to all"
                  ) { v ->
                      AlertDialog.Builder(act).setMessage("Apply to all ${g.count} transactions in this group?")
                          .setPositiveButton("Haan") { _, _ -> PayeeOps.applyGroupFix(act, g.hash, v[0].ifBlank { g.sampleMerchant }, v[2], v[1].startsWith("Debit")); act.refreshAll() }
                          .setNegativeButton("Nahi", null).show()
                  }
              }

              private fun showTxn(t: Txn) {
                  val msg = fmtDateTime(t.ts) + "  •  " + t.institution + "\n" + (if (t.debit) "Kharch " else "Mila ") + inr(t.amount, true) + "  •  " + t.category +
                      (if (t.balance != null) "\nBalance: " + inr(t.balance ?: 0.0, true) else "") + "\nSource: ${t.source}  •  Parse: ${t.status}" +
                      (if (t.vpa != null) "  •  UPI: ${t.vpa}" else "") + (if (t.ref != null) "  •  Ref: ${t.ref}" else "") +
                      (if (t.body.isNotEmpty()) "\n\n" + t.body else "")
                  val builder = AlertDialog.Builder(act).setTitle(t.merchant).setMessage(msg)
                      .setPositiveButton("Edit / Sahi karo") { _, _ -> editTxn(t) }
                      .setNeutralButton("Delete", null)
                      .setNegativeButton("Band karo", null)
                  val ad = builder.create()
                  ad.setOnShowListener {
                      ad.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener {
                          PayeeOps.bulkDelete(act, listOf(t.id)); act.toast("Deleted"); act.refreshAll(); ad.dismiss()
                      }
                  }
                  ad.show()
              }

              private fun editTxn(t: Txn) {
                  act.showForm("Sahi karo (app seekhegi)",
                      listOf(Field("Kisko / dukaan", t.merchant), Field("Amount", t.amount.toString(), true), Field("Type", if (t.debit) "Debit (kharch)" else "Credit (mila)", options = listOf("Debit (kharch)", "Credit (mila)")), Field("Category", t.category, options = Categories.ALL))
                  ) { v ->
                      val n = t.copy(merchant = v[0].ifBlank { t.merchant }, amount = v[1].toDoubleOrNull() ?: t.amount, debit = v[2].startsWith("Debit"), category = v[3], status = "USER", review = false, reviewHash = null)
                      val db = Db.get(act); db.updateTxn(n); Repo.ensurePayee(act, n)
                      if (n.category == "Travel" || n.channel == "FASTAG") Tolls.record(act, n) else db.exec("DELETE FROM toll_trips WHERE txn_id=?", n.id)
                      Learner.learnFromCorrection(act, t, n); act.refreshAll()
                  }
              }
              fun addCash() {
                  act.showForm("Cash entry",
                      listOf(Field("Amount", "", true), Field("Type", "Spent (kharch)", options = listOf("Spent (kharch)", "Received (mila)")), Field("Kis kaam / naam", ""), Field("Category", "Other", options = Categories.ALL))
                  ) { v ->
                      val amt = v[0].toDoubleOrNull(); if (amt == null || amt <= 0) { act.toast("Amount sahi daalo"); return@showForm }
                      val t = Txn(ts = System.currentTimeMillis(), amount = amt, debit = v[1].startsWith("Spent"), merchant = v[2].ifBlank { "Cash" }, category = v[3], institution = "Cash", channel = "CASH", source = "CASH", status = "USER")
                      Repo.save(act, t); act.refreshAll()
                  }
              }
          }

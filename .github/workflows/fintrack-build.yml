          package com.example.fintrack

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.pdf.PdfDocument
          import androidx.core.content.FileProvider
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          object PdfReport {
              fun generate(ctx: Context, year: Int, month: Int): File {
                  val db = Db.get(ctx)
                  val cal = Calendar.getInstance().apply { set(Calendar.YEAR, year); set(Calendar.MONTH, month); set(Calendar.DAY_OF_MONTH, 1); set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0); set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0) }
                  val start = cal.timeInMillis; cal.add(Calendar.MONTH, 1); val end = cal.timeInMillis
                  val label = SimpleDateFormat("MMMM yyyy", Locale.getDefault()).format(Date(start))
                  val spent = db.num("SELECT SUM(amount) FROM txn WHERE debit=1 AND ts>=? AND ts<?", start.toString(), end.toString())
                  val recv = db.num("SELECT SUM(amount) FROM txn WHERE debit=0 AND ts>=? AND ts<?", start.toString(), end.toString())
                  val cats = db.rows("SELECT category, SUM(amount) AS s FROM txn WHERE debit=1 AND ts>=? AND ts<? GROUP BY category ORDER BY s DESC", start.toString(), end.toString())
                  val doc = PdfDocument()
                  val pageInfo = PdfDocument.PageInfo.Builder(595, 842, 1).create()
                  val page = doc.startPage(pageInfo)
                  val c: Canvas = page.canvas
                  val p = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.BLACK }
                  var y = 50f
                  p.textSize = 26f; p.isFakeBoldText = true; c.drawText("FinTrack · $label", 40f, y, p); y += 30f
                  p.textSize = 14f; p.isFakeBoldText = false
                  c.drawText("Spent: ${inr(spent)}     Received: ${inr(recv)}     Net: ${inr(recv - spent)}", 40f, y, p); y += 30f
                  p.isFakeBoldText = true; p.textSize = 16f; c.drawText("Category breakdown", 40f, y, p); y += 22f
                  p.isFakeBoldText = false; p.textSize = 13f
                  for (r in cats.take(10)) { val cat = r["category"] ?: ""; val v = r["s"]?.toDoubleOrNull() ?: 0.0; c.drawText("• $cat", 50f, y, p); c.drawText(inr(v), 555f - p.measureText(inr(v)), y, p); y += 18f }
                  doc.finishPage(page)
                  val dir = File(ctx.cacheDir, "reports"); if (!dir.exists()) dir.mkdirs()
                  val file = File(dir, "fintrack_${year}_${month + 1}.pdf")
                  file.outputStream().use { doc.writeTo(it) }
                  doc.close()
                  return file
              }
              fun shareIntent(ctx: Context, file: File): android.content.Intent {
                  val uri = FileProvider.getUriForFile(ctx, "${ctx.packageName}.fileprovider", file)
                  return android.content.Intent(android.content.Intent.ACTION_SEND).apply { type = "application/pdf"; putExtra(android.content.Intent.EXTRA_STREAM, uri); addFlags(android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION) }
              }
          }

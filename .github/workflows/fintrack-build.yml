                  val redacted = redactSensitiveData(rawBody)
                  val prompt = """Analyze Indian SMS. Return STRICT JSON ONLY: {"amount": <number or null>, "debit": <bool or null>, "merchant": <string or null>, "balance": <number or null>, "account_ending": <string or null>, "account_type": "BANK"|"CARD"|"WALLET"|"UPI"|"ATM"|"OTHER"}  SMS: $redacted"""

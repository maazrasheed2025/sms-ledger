              override fun refresh() {
                  chips.removeAllViews()
                  for ((k, label) in listOf("all" to "All", "review" to "⚠ Review", "debit" to "Kharch", "credit" to "Mila")) {
                      chips.addView(act.pill(label, filter == k) { filter = k; refresh() })
                  }
                  val w = StringBuilder("1=1")
                  val a = ArrayList<String>()
                  when (filter) {
                      "review" -> w.append(" AND review=1")
                      "debit" -> w.append(" AND debit=1")
                      "credit" -> w.append(" AND debit=0")
                  }
                  if (query.isNotEmpty()) {
                      w.append(" AND (merchant LIKE ? OR category LIKE ? OR body LIKE ?)")
                      repeat(3) { a.add("%$query%") }
                  }
                  val items = Db.get(act).queryTxns(w.toString(), a.toTypedArray(), 500)
                  adapter.items = items

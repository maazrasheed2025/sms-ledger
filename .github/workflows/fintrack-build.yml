                  val options = names.toMutableList(); options.add("Custom name…")
                  AlertDialog.Builder(act).setTitle("Survivor naam")
                      .setItems(options.toTypedArray()) { _, i ->
                          if (i == options.size - 1) act.showForm("Custom survivor name", listOf(Field("Naam", names.first()))) { v -> doMerge(keys, v[0]) }
                          else doMerge(keys, names[i])
                      }.setNegativeButton("Cancel", null).show()
              }
              private fun doMerge(keys: List<String>, survivorName: String) {
                  val survivorKey = Learner.norm(survivorName)
                  Thread { PayeeOps.merge(act, keys, survivorKey, survivorName); act.runOnUiThread { selectMode = false; selected.clear(); act.toast("Merged ${keys.size} payees"); this.refresh() } }.start()
              }
              private fun showPayee(p: Map<String, String?>) {
                  val key = p["k"] ?: return; val name = p["display"] ?: key
                  val db = Db.get(act)
                  val all = db.queryTxns("merchant_key=?", arrayOf(key), 500)
                  val spent = all.filter { it.debit }.sumOf { it.amount }
                  val recv = all.filter { !it.debit }.sumOf { it.amount }
                  val col = act.vbox(10)
                  col.addView(act.tv("Out: ${inr(spent)}  •  In: ${inr(recv)}  •  Net: ${inr(recv - spent)}", 13f, C.TEXT, true))
                  if (!p["upi_id"].isNullOrBlank()) col.addView(act.tv("UPI: ${p["upi_id"]}", 12f, C.MUTED))
                  val lv = ListView(act)
                  val hist = RowAdapter<Txn>(act, all) { t, r ->
                      r.icon.setImageResource(iconFor(t.category)); r.icon.setColorFilter(if (t.debit) C.RED else C.GREEN)
                      r.title.text = if (t.debit) "→ ${t.category}" else "← Received"
                      r.sub.text = fmtDateTime(t.ts) + " • " + t.institution
                      r.amt.text = (if (t.debit) "-" else "+") + inr(t.amount, true); r.amt.setTextColor(if (t.debit) C.RED else C.GREEN)
                  }
                  lv.adapter = hist
                  col.addView(lv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, act.dp(360)))
                  AlertDialog.Builder(act).setTitle(name).setView(ScrollView(act).apply { addView(col) })
                      .setPositiveButton("UPI se pay") { _, _ -> pay(key, name, p["upi_id"]) }.setNegativeButton("Band karo", null).show()
              }
              private fun pay(key: String, name: String, upi: String?) {
                  if (upi.isNullOrBlank() || !upi.contains("@")) { act.toast("UPI ID nahi mila"); return }
                  act.showForm("Pay: $name", listOf(Field("Amount (optional)", "", true), Field("Note (optional)", "")), "Pay") { v ->
                      var url = "upi://pay?pa=" + Uri.encode(upi) + "&pn=" + Uri.encode(name) + "&cu=INR"
                      val amt = v[0].toDoubleOrNull(); if (amt != null && amt > 0) url += "&am=" + String.format(Locale.US, "%.2f", amt)
                      if (v[1].isNotBlank()) url += "&tn=" + Uri.encode(v[1])
                      try { act.startActivity(Intent.createChooser(Intent(Intent.ACTION_VIEW, Uri.parse(url)), "Pay with")) } catch (e: Exception) { act.toast("UPI app nahi mila") }
                  }
              }
          }

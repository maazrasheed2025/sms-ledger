                      chips.addView(act.pill(Str.s("contacts_mobile"), tab == 1) { tab = 1; refresh() })
                      val like = "%$query%"
                      val rows = if (tab == 0) Db.get(act).rows("SELECT vpa AS id, COUNT(*) AS n, SUM(CASE WHEN debit=0 THEN amount ELSE 0 END) AS 'in', SUM(CASE WHEN debit=1 THEN amount ELSE 0 END) AS 'out' FROM txn WHERE vpa IS NOT NULL AND vpa<>'' AND vpa LIKE ? GROUP BY vpa ORDER BY n DESC", like)
                                 else Db.get(act).rows("SELECT vpa AS id, COUNT(*) AS n, SUM(CASE WHEN debit=0 THEN amount ELSE 0 END) AS 'in', SUM(CASE WHEN debit=1 THEN amount ELSE 0 END) AS 'out' FROM txn WHERE vpa IS NOT NULL AND vpa<>'' AND vpa GLOB '[6-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]@*' AND vpa LIKE ? GROUP BY vpa ORDER BY n DESC", like)
                      adapter.items = rows; adapter.notifyDataSetChanged()
                      summary.text = "${rows.size} ${if (tab == 0) Str.s("contacts_upi") else Str.s("contacts_mobile")}"
                  } catch (_: Exception) {}
              }

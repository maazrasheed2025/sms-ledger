          package com.example.fintrack
          import android.content.ContentValues
          import android.content.Context
          object PayeeOps {
              private var dupCache: List<DupRow>? = null
              private var dupCacheAt: Long = 0L
              private var dupCacheCount: Long = -1L
              fun merge(ctx: Context, keys: List<String>, survivorKey: String, survivorName: String) { if (keys.size < 2) return; try { val w = Db.get(ctx).writableDatabase; w.beginTransaction(); try { val cv = ContentValues().apply { put("merchant_key", survivorKey); put("merchant", survivorName) }; w.update("txn", cv, "merchant_key IN (" + keys.joinToString(",") { "?" } + ")", keys.toTypedArray()); w.delete("payees", "merchant_key IN (" + keys.joinToString(",") { "?" } + ")", keys.toTypedArray()); w.execSQL("INSERT OR REPLACE INTO payees(merchant_key, display) VALUES(?,?)", arrayOf(survivorKey, survivorName)); Learner.learnMerge(Db.get(ctx), survivorKey, keys, survivorName); w.setTransactionSuccessful() } finally { w.endTransaction() } } catch (_: Exception) {} }
              fun addAlias(ctx: Context, payeeKey: String, aliasText: String): Int { val aliasKey = Learner.norm(aliasText); if (aliasKey.isBlank() || aliasKey == payeeKey) return 0; var moved = 0; try { val db = Db.get(ctx); val w = db.writableDatabase; w.beginTransaction(); try { val payeeName = db.one("SELECT display FROM payees WHERE merchant_key=?", payeeKey) ?: payeeKey; moved = w.update("txn", ContentValues().apply { put("merchant_key", payeeKey); put("merchant", payeeName) }, "merchant_key=?", arrayOf(aliasKey)); w.delete("payees", "merchant_key=?", arrayOf(aliasKey)); Learner.learnMerge(db, payeeKey, listOf(aliasKey), payeeName); w.setTransactionSuccessful() } finally { w.endTransaction() } } catch (_: Exception) {}; return moved }
              fun undoLastMerge(ctx: Context): Boolean { try { val db = Db.get(ctx); val w = db.writableDatabase; val row = db.rows("SELECT id, survivor_key, merged_keys, survivor_name FROM payee_merges WHERE undone=0 ORDER BY id DESC LIMIT 1").firstOrNull(); if (row != null) { val id = row["id"]?.toLongOrNull() ?: return false; val survivorKey = row["survivor_key"] ?: return false; val survivorName = row["survivor_name"] ?: survivorKey; val merged = (row["merged_keys"] ?: "").split("\u0001").filter { it.isNotBlank() }; w.beginTransaction(); try { for (k in merged) { w.execSQL("INSERT OR IGNORE INTO payees(merchant_key, display) VALUES(?,?)", arrayOf(k, k)); w.execSQL("UPDATE txn SET merchant_key=? WHERE merchant_key=? AND merchant=?", arrayOf(k, survivorKey, survivorName)) }; w.execSQL("UPDATE payee_merges SET undone=1 WHERE id=?", arrayOf(id)); w.setTransactionSuccessful() } finally { w.endTransaction() }; return true } else { val rule = db.rows("SELECT survivor_key FROM payee_merge_rules LIMIT 1").firstOrNull(); if (rule != null) { val sk = rule["survivor_key"] ?: return false; w.beginTransaction(); try { w.execSQL("DELETE FROM payee_merge_rules WHERE survivor_key=?", arrayOf(sk)); w.setTransactionSuccessful() } finally { w.endTransaction() }; return true } }; return false } catch (_: Exception) { return false } }
              fun deletePayee(ctx: Context, key: String): Boolean { try { Db.get(ctx).exec("DELETE FROM payees WHERE merchant_key=?", key); Db.get(ctx).exec("DELETE FROM payee_merge_rules WHERE survivor_key=?", key); return true } catch (_: Exception) { return false } }
              fun deleteLoan(ctx: Context, loanNo: String): Boolean { try { Db.get(ctx).exec("DELETE FROM loans WHERE loan_no=?", loanNo); return true } catch (_: Exception) { return false } }
              fun deleteAccount(ctx: Context, institution: String, account: String, kind: String): Boolean { try { Db.get(ctx).exec("DELETE FROM accounts WHERE institution=? AND account=? AND kind=?", institution, account, kind); return true } catch (_: Exception) { return false } }
              fun hardDeleteBill(ctx: Context, id: Long): Boolean { try { Db.get(ctx).exec("DELETE FROM bills WHERE id=?", id); return true } catch (_: Exception) { return false } }
              fun bulkSetCategory(ctx: Context, ids: List<Long>, category: String) { if (ids.isEmpty()) return; try { val w = Db.get(ctx).writableDatabase; w.beginTransaction(); try { w.update("txn", ContentValues().apply { put("category", category) }, "id IN (" + ids.joinToString(",") { "?" } + ")", ids.map { it.toString() }.toTypedArray()); w.setTransactionSuccessful() } finally { w.endTransaction() } } catch (_: Exception) {} }
              fun bulkDelete(ctx: Context, ids: List<Long>) { if (ids.isEmpty()) return; try { val w = Db.get(ctx).writableDatabase; w.beginTransaction(); try { w.delete("txn", "id IN (" + ids.joinToString(",") { "?" } + ")", ids.map { it.toString() }.toTypedArray()); w.delete("toll_trips", "txn_id IN (" + ids.joinToString(",") { "?" } + ")", ids.map { it.toString() }.toTypedArray()); w.delete("txn_tags", "txn_id IN (" + ids.joinToString(",") { "?" } + ")", ids.map { it.toString() }.toTypedArray()); w.delete("pending_review", "txn_id IN (" + ids.joinToString(",") { "?" } + ")", ids.map { it.toString() }.toTypedArray()); w.setTransactionSuccessful() } finally { w.endTransaction() } } catch (_: Exception) {} }
              fun getTags(ctx: Context, txnId: Long): List<String> = Db.get(ctx).rows("SELECT tag FROM txn_tags WHERE txn_id=? ORDER BY tag", txnId.toString()).mapNotNull { it["tag"] }
              fun setTags(ctx: Context, txnId: Long, tags: List<String>) { try { val w = Db.get(ctx).writableDatabase; w.beginTransaction(); try { w.delete("txn_tags", "txn_id=?", arrayOf(txnId.toString())); for (raw in tags) { val t = raw.trim().lowercase().replace(Regex("""[^a-z0-9_\-]"""), ""); if (t.isBlank()) continue; w.execSQL("INSERT OR IGNORE INTO tags(name, created_at) VALUES(?,?)", arrayOf(t, System.currentTimeMillis())); w.execSQL("INSERT OR REPLACE INTO txn_tags(txn_id, tag) VALUES(?,?)", arrayOf(txnId, t)) }; w.setTransactionSuccessful() } finally { w.endTransaction() } } catch (_: Exception) {} }
              fun topTags(ctx: Context, limit: Int = 20): List<Pair<String, Int>> = Db.get(ctx).rows("SELECT tag, COUNT(*) AS n FROM txn_tags GROUP BY tag ORDER BY n DESC LIMIT $limit").mapNotNull { r -> val t = r["tag"]; val n = r["n"]?.toIntOrNull(); if (t != null && n != null) t to n else null }
              fun allTags(ctx: Context): List<String> = Db.get(ctx).rows("SELECT name FROM tags ORDER BY name").mapNotNull { it["name"] }
              private fun dayKey(ts: Long): String { val cal = java.util.Calendar.getInstance(); cal.timeInMillis = ts; return String.format(java.util.Locale.US, "%04d-%02d-%02d", cal.get(java.util.Calendar.YEAR), cal.get(java.util.Calendar.MONTH) + 1, cal.get(java.util.Calendar.DAY_OF_MONTH)) }
              private fun isDup(a: Txn, b: Txn): Boolean { if (Math.abs(a.ts - b.ts) > 5 * 60_000L) return false; if (Math.abs(a.amount - b.amount) > 0.01) return false; if (a.debit != b.debit) return false; if (dayKey(a.ts) != dayKey(b.ts)) return false; val na = Learner.norm(a.merchant); val nb = Learner.norm(b.merchant); if (na != nb && na.isNotBlank() && nb.isNotBlank()) return false; return true }

                          val ns = selected.map { k -> Db.get(act).one("SELECT display FROM payees WHERE merchant_key=?", k) ?: k }
                          act.showForm("Survivor name", listOf(Field(Str.s("name"), ns.first()))) { v -> Thread { PayeeOps.merge(act, selected.toList(), Learner.norm(v[0]), v[0]); act.runOnUiThread { selectMode = false; selected.clear(); refresh() } }.start() }
                      })

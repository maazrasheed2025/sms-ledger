                      if (m != null) return m.groupValues[1].trim()
                  }
                  return null
              }
              private fun words(body: String): Set<String> = Regex("""[a-z]{3,15}""").findAll(body.lowercase()).map { it.value }.toSet()
              fun trainType(db: Db, body: String, debit: Boolean, w: Double) {
                  if (body.isBlank()) return
                  val col = if (debit) "d" else "c"
                  for (wd in words(body)) db.exec("INSERT INTO nb_words(word, $col) VALUES(?, ?) ON CONFLICT(word) DO UPDATE SET $col = $col + excluded.$col", wd, w)
              }
              fun predictDebit(db: Db, body: String): Boolean? {
                  val tot = db.rows("SELECT SUM(d) AS d, SUM(c) AS c, COUNT(*) AS n FROM nb_words").firstOrNull() ?: return null
                  val td = tot["d"]?.toDoubleOrNull() ?: 0.0; val tc = tot["c"]?.toDoubleOrNull() ?: 0.0; val n = tot["n"]?.toIntOrNull() ?: 0
                  if (n < 20 || td < 5 || tc < 5) return null
                  val ws = words(body).toList(); if (ws.isEmpty()) return null
                  val marks = ws.joinToString(",") { "?" }; var score = 0.0
                  for (r in db.rows("SELECT word, d, c FROM nb_words WHERE word IN ($marks)", *ws.toTypedArray())) {
                      val d = r["d"]?.toDoubleOrNull() ?: 0.0; val c = r["c"]?.toDoubleOrNull() ?: 0.0
                      score += Math.log((d + 1) / (td + n)) - Math.log((c + 1) / (tc + n))
                  }
                  return if (score > 1.0) true else if (score < -1.0) false else null
              }
              fun learnFromCorrection(ctx: Context, old: Txn, new: Txn) {
                  val db = Db.get(ctx)
                  if (new.source == "SMS") {
                      val key = norm(new.merchant)
                      if (new.merchant.isNotBlank() && new.merchant != "Unknown") {
                          learnCategory(db, key, new.merchant, new.category)
                          if (old.status != "REGEX" || !old.merchant.equals(new.merchant, ignoreCase = true)) learnMerchantPattern(db, SenderMap.core(new.sender), new.tpl, new.body, new.merchant)
                      }
                      trainType(db, new.body, new.debit, 3.0)
                  } else if (new.merchant.isNotBlank()) learnCategory(db, norm(new.merchant), new.merchant, new.category)
              }
          }

                  col.put(act.actionBtn(Str.s("add_id")) { act.showForm(Str.s("add_id"), listOf(Field(Str.s("add_id_hint"), "")), Str.s("add_btn")) { v -> val a = v[0].trim(); if (a.isNotBlank()) Thread { val m = PayeeOps.addAlias(act, key, a); act.runOnUiThread { act.toast("Merged · $m txns"); refresh(); act.refreshAll() } }.start() } }, 10)
                  val hist = act.vbox(6)
                  for (t in all) {
                      val line = act.vbox(2)
                      line.addView(act.tv("${fmtDateTime(t.ts)} • ${(if (t.debit) "-" else "+") + inr(t.amount, true)} • ${t.category}", 12f, if (t.debit) C.RED else C.GREEN))
                      if (t.body.isNotEmpty()) line.addView(act.tv(t.body.take(100), 10f, C.MUTED))

            var c: Canvas = page.canvas
            fun drawHeader() {
                p.color = Color.BLACK; p.textSize = 22f; p.isFakeBoldText = true; c.drawText(title, 40f, 50f, p); p.isFakeBoldText = false
                p.textSize = 11f; c.drawText("Imran's Finances · ${checkpoints.size} tolls · generated ${SimpleDateFormat("dd MMM yyyy HH:mm", Locale.getDefault()).format(Date())}", 40f, 70f, p)
                p.textSize = 12f; p.color = red; c.drawText("Total tolls: -" + inr(total), 40f, 90f, p)
                p.color = Color.BLACK
            }
            drawHeader()
            var y = 115f
            val grouped = checkpoints.groupBy { SimpleDateFormat("yyyy-MM-dd", Locale.getDefault()).format(Date(it.ts)) }.toSortedMap(compareByDescending { it })
            for ((day, items) in grouped) {
                if (y > 760f) { doc.finishPage(page); pageNum++; pi = PdfDocument.PageInfo.Builder(595, 842, pageNum).create(); page = doc.startPage(pi); c = page.canvas; y = 50f; drawHeader(); y = 115f }
                val dayTotal = items.sumOf { it.amount }

          package com.example.fintrack
          import android.content.ContentValues
          import android.content.Context
          import android.database.Cursor
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          data class Txn(var id: Long = 0, var smsKey: String? = null, var ts: Long, var amount: Double, var debit: Boolean, var merchant: String, var category: String, var institution: String = "", var account: String? = null, var balance: Double? = null, var channel: String = "OTHER", var ref: String? = null, var vpa: String? = null, var sender: String = "", var body: String = "", var source: String = "SMS", var status: String = "REGEX", var tpl: String = "", var review: Boolean = false, var reviewHash: String? = null, var loanNo: String? = null, var note: String? = null, var voicePath: String? = null, var msgNo: Long = 0)
          class Db private constructor(ctx: Context) : SQLiteOpenHelper(ctx, "fintrack.db", null, 14) {
              companion object { @Volatile private var inst: Db? = null; fun get(ctx: Context): Db = inst ?: synchronized(this) { inst ?: Db(ctx.applicationContext).also { inst = it } } }
              override fun onCreate(db: SQLiteDatabase) { createSchema(db); seedTollPlazas(db) }
              private fun createSchema(db: SQLiteDatabase) {
                  db.execSQL("CREATE TABLE IF NOT EXISTS txn (id INTEGER PRIMARY KEY AUTOINCREMENT, msg_no INTEGER DEFAULT 0, sms_key TEXT UNIQUE, ts INTEGER NOT NULL, amount REAL NOT NULL, debit INTEGER NOT NULL, merchant TEXT, merchant_key TEXT, category TEXT, institution TEXT, account TEXT, balance REAL, channel TEXT, ref TEXT, vpa TEXT, sender TEXT, body TEXT, source TEXT, status TEXT, tpl TEXT, review INTEGER DEFAULT 0, review_hash TEXT, loan_no TEXT, note TEXT, voice_path TEXT)")
                  db.execSQL("CREATE INDEX IF NOT EXISTS idx_txn_ts ON txn(ts)")
                  db.execSQL("CREATE TABLE IF NOT EXISTS senders (core TEXT PRIMARY KEY, institution TEXT, kind TEXT, user_defined INTEGER DEFAULT 0)")
                  db.execSQL("CREATE TABLE IF NOT EXISTS merchant_rules (merchant_key TEXT PRIMARY KEY, display TEXT, category TEXT, weight REAL DEFAULT 1)")
                  db.execSQL("CREATE TABLE IF NOT EXISTS toll_trips (id INTEGER PRIMARY KEY AUTOINCREMENT, txn_id INTEGER UNIQUE, plaza_id INTEGER, plaza TEXT, state TEXT, lat REAL, lon REAL, ts INTEGER, amount REAL, vehicle TEXT)")
                  db.execSQL("CREATE TABLE IF NOT EXISTS toll_plazas (plaza_id INTEGER PRIMARY KEY, name TEXT, state TEXT, nh TEXT, lat REAL, lon REAL, car_fare REAL)")
                  db.execSQL("CREATE TABLE IF NOT EXISTS payees (merchant_key TEXT PRIMARY KEY, display TEXT, upi_id TEXT, alt_upis TEXT, note TEXT)")
                  db.execSQL("CREATE TABLE IF NOT EXISTS net_items (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, amount REAL, kind TEXT)")
                  db.execSQL("CREATE TABLE IF NOT EXISTS loans (loan_no TEXT PRIMARY KEY, lender TEXT, first_seen INTEGER, last_seen INTEGER, msg_count INTEGER DEFAULT 0)")
                  db.execSQL("CREATE TABLE IF NOT EXISTS payee_merges (id INTEGER PRIMARY KEY AUTOINCREMENT, survivor_key TEXT, merged_keys TEXT, survivor_name TEXT, merged_at INTEGER, undone INTEGER DEFAULT 0)")
                  db.execSQL("CREATE TABLE IF NOT EXISTS accounts (id INTEGER PRIMARY KEY AUTOINCREMENT, institution TEXT, account TEXT, kind TEXT DEFAULT 'BANK', balance REAL, last_ts INTEGER, excluded INTEGER DEFAULT 0, UNIQUE(institution, account, kind))")
                  db.execSQL("CREATE TABLE IF NOT EXISTS bills (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, amount REAL, due_day INTEGER, category TEXT, frequency TEXT, active INTEGER DEFAULT 1, last_paid_ts INTEGER)")
                  db.execSQL("CREATE TABLE IF NOT EXISTS budgets (category TEXT PRIMARY KEY, monthly_limit REAL, updated_at INTEGER)")
                  db.execSQL("CREATE TABLE IF NOT EXISTS categories (name TEXT PRIMARY KEY, kind TEXT DEFAULT 'USER', created_at INTEGER)")
                  db.execSQL("CREATE TABLE IF NOT EXISTS subs_detected (merchant_key TEXT PRIMARY KEY, avg_amt REAL, last_ts INTEGER, count INTEGER)")
                  db.execSQL("CREATE TABLE IF NOT EXISTS tags (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, created_at INTEGER)")
                  db.execSQL("CREATE TABLE IF NOT EXISTS txn_tags (txn_id INTEGER, tag TEXT, PRIMARY KEY (txn_id, tag))")
                  db.execSQL("CREATE TABLE IF NOT EXISTS payee_merge_rules (survivor_key TEXT PRIMARY KEY, merged_keys TEXT, survivor_name TEXT)")
              }
              private fun seedTollPlazas(db: SQLiteDatabase) { try { var sid = 1000; for ((name, lonLat) in Tolls.TOLL_SEED) db.execSQL("INSERT OR IGNORE INTO toll_plazas(plaza_id, name, state, nh, lat, lon, car_fare) VALUES(?,?,?,?,?,?,?)", arrayOf(sid++, name, "", "", lonLat[1], lonLat[0], 0.0)) } catch (_: Exception) {} }
              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) { try { createSchema(db) } catch (_: Exception) {}; try { seedTollPlazas(db) } catch (_: Exception) {} }
              fun rows(sql: String, vararg args: String): List<Map<String, String?>> { val out = ArrayList<Map<String, String?>>(); try { readableDatabase.rawQuery(sql, arrayOf(*args)).use { c -> while (c.moveToNext()) { val m = HashMap<String, String?>(); for (i in 0 until c.columnCount) m[c.getColumnName(i)] = if (c.isNull(i)) null else c.getString(i); out.add(m) } } } catch (_: Exception) {}; return out }
              fun one(sql: String, vararg args: String): String? = rows(sql, *args).firstOrNull()?.values?.firstOrNull()
              fun num(sql: String, vararg args: String): Double = one(sql, *args)?.toDoubleOrNull() ?: 0.0
              fun exec(sql: String, vararg args: Any?) { try { writableDatabase.execSQL(sql, arrayOf(*args)) } catch (_: Exception) {} }
              private fun values(t: Txn) = ContentValues().apply { put("sms_key", t.smsKey); put("ts", t.ts); put("amount", t.amount); put("debit", if (t.debit) 1 else 0); put("merchant", t.merchant); put("merchant_key", Learner.norm(t.merchant)); put("category", t.category); put("institution", t.institution); put("account", t.account); put("balance", t.balance); put("channel", t.channel); put("ref", t.ref); put("vpa", t.vpa); put("sender", t.sender); put("body", t.body); put("source", t.source); put("status", t.status); put("tpl", t.tpl); put("review", if (t.review) 1 else 0); put("review_hash", t.reviewHash); put("loan_no", t.loanNo); put("note", t.note); put("voice_path", t.voicePath); if (t.msgNo > 0) put("msg_no", t.msgNo) }
              fun insertTxn(t: Txn): Long { try { val existing = t.smsKey?.let { one("SELECT id FROM txn WHERE sms_key=?", it)?.toLongOrNull() }; if (existing != null) return 0; val id = writableDatabase.insertWithOnConflict("txn", null, values(t), SQLiteDatabase.CONFLICT_IGNORE); if (id > 0) { t.id = id; if (t.msgNo == 0L) { writableDatabase.execSQL("UPDATE txn SET msg_no=? WHERE id=?", arrayOf(id, id)); t.msgNo = id }; val kind = when { t.channel == "ATM" -> "BANK"; t.channel == "FASTAG" -> "FASTAG"; t.channel == "WALLET" -> "WALLET"; t.channel == "CARD" -> "CARD"; t.loanNo != null -> "LOAN"; else -> "BANK" }; runCatching { writableDatabase.execSQL("INSERT INTO accounts(institution, account, kind, balance, last_ts, excluded) VALUES(?,?,?,?,?,0) ON CONFLICT(institution, account, kind) DO UPDATE SET balance=COALESCE(excluded.balance, accounts.balance), last_ts=MAX(accounts.last_ts, excluded.last_ts)", arrayOf(t.institution, t.account ?: "", kind, t.balance, t.ts)) } }; return id } catch (_: Exception) { return 0 } }

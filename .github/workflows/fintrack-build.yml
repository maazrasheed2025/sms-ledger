      - name: Build Debug APK
        working-directory: /tmp/proj
        run: gradle assembleDebug --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v11.0.${{ github.run_number }}"
          gh release create "$VERSION" /tmp/proj/app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "Imran's Finances v11 Build ${{ github.run_number }}" \
            --notes "v11 FINAL. Launcher icon normalisation: any PNG in mipmap-* is renamed to ic_launcher.png at build time so filenames don't matter. If no PNG, a valid transparent one is injected so AAPT never fails. All other v11 features unchanged."

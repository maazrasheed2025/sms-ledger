      - name: Build Debug APK
        working-directory: /tmp/proj
        run: gradle assembleDebug --no-daemon

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v10.5.${{ github.run_number }}"
          gh release create "$VERSION" /tmp/proj/app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "FinTrack Build ${{ github.run_number }}" \
            --notes "v10.5: dashboard-only txns/charts; accounts split (bank/wallet/loan); payee alias add; collapsible ledger years with +green/-red net totals; global hamburger; travel Tolls tab sorted newest first; better review grouping; Cash = ATM total; real net worth from bank+wallet balances; Settings rename; strict English + language toggle (default English); FinArt purple/pink theme."

                  val out = items.filter { it.debit }.sumOf { it.amount }
                  val inn = items.filter { !it.debit }.sumOf { it.amount }
                  summary.text = "${items.size} entries  •  Kharch ${inr(out)}  •  Mila ${inr(inn)}"
              }

              private fun showTxn(t: Txn) {
                  val msg = fmtDateTime(t.ts) + "  •  " + t.institution + "\n" +
                      (if (t.debit) "Kharch " else "Mila ") + inr(t.amount, true) + "  •  " + t.category +
                      (if (t.balance != null) "\nBalance: " + inr(t.balance ?: 0.0, true) else "") +
                      "\nParse: ${t.status}" + (if (t.vpa != null) "  •  UPI: ${t.vpa}" else "") +
                      (if (t.body.isNotEmpty()) "\n\n" + t.body else "")
                  AlertDialog.Builder(act).setTitle(t.merchant).setMessage(msg)
                      .setPositiveButton("Edit / Sahi karo") { _, _ -> editTxn(t) }
                      .setNegativeButton("Band karo", null)
                      .show()
              }

              private fun editTxn(t: Txn) {
                  act.showForm(
                      "Sahi karo (app seekhegi)",
                      listOf(
                          Field("Kisko / dukaan", t.merchant),
                          Field("Amount", t.amount.toString(), true),
                          Field("Type", if (t.debit) "Debit (kharch)" else "Credit (mila)", options = listOf("Debit (kharch)", "Credit (mila)")),
                          Field("Category", t.category, options = Categories.ALL)
                      ),
                      neutral = "Delete" to {
                          AlertDialog.Builder(act).setMessage("Ye entry delete kar du?")
                              .setPositiveButton("Haan") { _, _ -> Db.get(act).deleteTxn(t.id); act.refreshAll() }
                              .setNegativeButton("Nahi", null).show()
                          Unit
                      }
                  ) { v ->
                      val n = t.copy(
                          merchant = v[0].ifBlank { t.merchant },
                          amount = v[1].toDoubleOrNull() ?: t.amount,
                          debit = v[2].startsWith("Debit"),
                          category = v[3],
                          status = "USER",
                          review = false
                      )
                      val db = Db.get(act)
                      db.updateTxn(n)
                      Repo.ensurePayee(act, n)
                      if (n.category == "FASTag") Tolls.record(act, n) else db.exec("DELETE FROM toll_trips WHERE txn_id=?", n.id)
                      Learner.learnFromCorrection(act, t, n)
                      act.refreshAll()
                  }
              }

              fun addCash() {
                  act.showForm(
                      "Cash entry",
                      listOf(
                          Field("Amount", "", true),
                          Field("Type", "Spent (kharch)", options = listOf("Spent (kharch)", "Received (mila)")),
                          Field("Kis kaam / naam", ""),
                          Field("Category", "Other", options = Categories.ALL)
                      )
                  ) { v ->
                      val amt = v[0].toDoubleOrNull()
                      if (amt == null || amt <= 0) { act.toast("Amount sahi daalo"); return@showForm }
                      val t = Txn(
                          ts = System.currentTimeMillis(), amount = amt, debit = v[1].startsWith("Spent"),
                          merchant = v[2].ifBlank { "Cash" }, category = v[3], institution = "Cash",
                          channel = "CASH", source = "CASH", status = "USER"
                      )
                      Repo.save(act, t)
                      if (v[2].isNotBlank()) Learner.learnFromCorrection(act, t, t)
                      act.refreshAll()
                  }
              }
          }

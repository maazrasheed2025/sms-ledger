                  oval.set(cx - r, cy - r, cx + r, cy + r)
                  canvas.drawArc(oval, 0f, 360f, false, trackP)
                  canvas.drawArc(oval, -90f, 360f * animated, false, progressP)
                  textP.textSize = r * 0.30f; labelP.textSize = r * 0.15f
                  canvas.drawText(label, cx, cy - r * 0.45f, labelP)
                  canvas.drawText(caption, cx, cy + r * 0.10f, textP)
              }
          }

          class DonutView @JvmOverloads constructor(ctx: Context, attrs: AttributeSet? = null) : View(ctx, attrs) {
              data class Slice(val label: String, val value: Float, val color: Int)
              private var _slices: List<Slice> = emptyList()
              private var animated: Float = 0f
              private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeCap = Paint.Cap.BUTT }
              private val textP = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = C.TEXT; textAlign = Paint.Align.CENTER }
              private val oval = RectF()
              fun updateSlices(s: List<Slice>) { _slices = s; ValueAnimator.ofFloat(0f, 1f).apply { duration = 900; addUpdateListener { animated = it.animatedValue as Float; invalidate() }; start() } }
              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val cx = width / 2f; val cy = height / 2f; val r = min(cx, cy) - 20f; val thick = r * 0.35f
                  paint.strokeWidth = thick
                  oval.set(cx - r + thick / 2, cy - r + thick / 2, cx + r - thick / 2, cy + r - thick / 2)
                  val total = _slices.sumOf { it.value.toDouble() }.toFloat().coerceAtLeast(0.001f)
                  var start = -90f
                  for (s in _slices) { val sweep = 360f * (s.value / total) * animated; paint.color = s.color; canvas.drawArc(oval, start, sweep, false, paint); start += sweep }
                  textP.textSize = r * 0.24f
                  val out = _slices.sumOf { it.value.toDouble() }.toFloat()

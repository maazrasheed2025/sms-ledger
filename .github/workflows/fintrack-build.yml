              fun insertTxn(t: Txn): Long {
                  val existing = t.smsKey?.let { one("SELECT id FROM txn WHERE sms_key=?", it)?.toLongOrNull() }
                  if (existing != null) return 0
                  val ref = t.ref
                  if (!ref.isNullOrBlank()) {
                      val dup = one("SELECT id FROM txn WHERE ref=? AND institution=? AND IFNULL(account,'')=? LIMIT 1", ref, t.institution, t.account ?: "")
                      if (dup != null) { logSkipped("duplicate-ref", ref, t.body, t.ts); return 0 }
                  }
                  val id = writableDatabase.insertWithOnConflict("txn", null, values(t), SQLiteDatabase.CONFLICT_IGNORE)
                  if (id > 0) {
                      t.id = id
                      if (t.review) writableDatabase.update("txn", ContentValues().apply { put("review_hash", computeReviewHash(t)) }, "id=?", arrayOf(id.toString()))
                      val ln = t.loanNo
                      if (!ln.isNullOrBlank()) writableDatabase.execSQL("INSERT INTO loans(loan_no, lender, first_seen, last_seen, msg_count) VALUES(?,?,?,?,1) ON CONFLICT(loan_no) DO UPDATE SET last_seen=excluded.last_seen, msg_count=msg_count+1", arrayOf(ln, t.institution, t.ts, t.ts))

              layoutParams = LinearLayout.LayoutParams(dp(sizeDp), dp(sizeDp))
          }

          fun Context.pill(label: String, selected: Boolean, onClick: () -> Unit): TextView =
              tv(label, 13f, if (selected) Color.WHITE else C.TEXT).apply {
                  setPadding(dp(14), dp(7), dp(14), dp(7))
                  background = shape(if (selected) C.ACCENT else C.CARD2, 18)
                  setOnClickListener { onClick() }
                  layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                      .apply { setMargins(dp(4), dp(4), dp(4), dp(4)) }
              }

          fun Context.actionBtn(label: String, onClick: () -> Unit): TextView =
              tv(label, 14f, Color.WHITE, true).apply {
                  gravity = Gravity.CENTER
                  setPadding(dp(14), dp(10), dp(14), dp(10))
                  background = shape(C.ACCENT, 12)
                  setOnClickListener { onClick() }
              }

          fun LinearLayout.put(v: View, top: Int = 10, weight: Float = 0f): View {
              val lp = if (orientation == LinearLayout.VERTICAL)
                  LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, if (weight > 0) 0 else ViewGroup.LayoutParams.WRAP_CONTENT, weight)
              else LinearLayout.LayoutParams(if (weight > 0) 0 else ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, weight)
              if (orientation == LinearLayout.VERTICAL) lp.topMargin = (top * resources.displayMetrics.density).toInt()
              else lp.leftMargin = (top * resources.displayMetrics.density).toInt()
              addView(v, lp)
              return v
          }

          fun iconFor(cat: String): Int = when (cat) {
              "Fuel" -> R.drawable.ic_fuel
              "Grocery" -> R.drawable.ic_grocery
              "EMI/Loan" -> R.drawable.ic_loan
              "FASTag" -> R.drawable.ic_fastag
              "Transfer" -> R.drawable.ic_transfer
              else -> R.drawable.ic_bank
          }

          fun inr(v: Double, paise: Boolean = false): String {
              val s = String.format(Locale.US, if (paise) "%.2f" else "%.0f", Math.abs(v))
              val parts = s.split(".")
              var whole = parts[0]
              if (whole.length > 3) {
                  val last3 = whole.takeLast(3)
                  var rest = whole.dropLast(3)
                  val groups = ArrayList<String>()
                  while (rest.length > 2) { groups.add(0, rest.takeLast(2)); rest = rest.dropLast(2) }
                  if (rest.isNotEmpty()) groups.add(0, rest)
                  whole = groups.joinToString(",") + "," + last3
              }
              return (if (v < 0) "-" else "") + "₹" + whole + (if (parts.size > 1) "." + parts[1] else "")
          }

          fun fmtDate(ts: Long): String = SimpleDateFormat("dd MMM yy", Locale.getDefault()).format(Date(ts))
          fun fmtDateTime(ts: Long): String = SimpleDateFormat("dd MMM, HH:mm", Locale.getDefault()).format(Date(ts))

          /** Generic row list adapter: icon + title/subtitle + amount. */
          class RowAdapter<T>(private val ctx: Context, var items: List<T>, private val bind: (T, Row) -> Unit) : BaseAdapter() {
              class Row(ctx: Context) {
                  val icon = ctx.icon(R.drawable.ic_bank, C.ACCENT, 26)
                  val title = ctx.tv("", 15f, C.TEXT, true).apply { setSingleLine() }
                  val sub = ctx.tv("", 12f, C.MUTED)
                  val amt = ctx.tv("", 15f, C.TEXT, true)
                  val view: LinearLayout = LinearLayout(ctx).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(ctx.dp(12), ctx.dp(10), ctx.dp(12), ctx.dp(10))
                      val mid = LinearLayout(ctx).apply {
                          orientation = LinearLayout.VERTICAL
                          addView(title)
                          addView(sub)
                      }
                      addView(icon)
                      addView(mid, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { leftMargin = ctx.dp(12); rightMargin = ctx.dp(8) })
                      addView(amt)
                  }
              }

              override fun getCount(): Int = items.size
              override fun getItem(position: Int): Any = items[position] as Any
              override fun getItemId(position: Int): Long = position.toLong()
              override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                  val row = (convertView?.tag as? Row) ?: Row(ctx).also { it.view.tag = it }
                  bind(items[position], row)
                  return row.view
              }
          }

          // ---------------- simple form dialog ----------------
          class Field(val label: String, val default: String = "", val number: Boolean = false, val options: List<String>? = null)

          fun MainActivity.showForm(
              title: String, fields: List<Field>, okLabel: String = "Save",
              neutral: Pair<String, () -> Unit>? = null, onOk: (List<String>) -> Unit
          ) {
              val col = vbox(20).apply { setPadding(dp(20), dp(8), dp(20), dp(8)) }
              val getters = ArrayList<() -> String>()
              for (f in fields) {
                  col.addView(tv(f.label, 12f, C.MUTED))
                  val opts = f.options
                  if (opts != null) {
                      val sp = Spinner(this)
                      sp.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, opts)
                      val idx = opts.indexOf(f.default)
                      if (idx >= 0) sp.setSelection(idx)
                      col.addView(sp)
                      getters.add { sp.selectedItem.toString() }
                  } else {
                      val et = EditText(this).apply {
                          setText(f.default)
                          setTextColor(C.TEXT)
                          setSingleLine()
                          if (f.number) inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                      }
                      col.addView(et)
                      getters.add { et.text.toString().trim() }
                  }
              }
              val b = AlertDialog.Builder(this)
                  .setTitle(title)
                  .setView(ScrollView(this).apply { addView(col) })
                  .setPositiveButton(okLabel) { _, _ -> onOk(getters.map { it() }) }
                  .setNegativeButton("Cancel", null)
              if (neutral != null) b.setNeutralButton(neutral.first) { _, _ -> neutral.second() }
              b.show()
          }

                  if (oldVersion < 3) {
                      runCatching { db.execSQL("ALTER TABLE txn ADD COLUMN review_hash TEXT") }
                      runCatching { db.execSQL("CREATE INDEX IF NOT EXISTS idx_txn_rh ON txn(review_hash)") }
                      runCatching { db.execSQL("CREATE INDEX IF NOT EXISTS idx_txn_ref ON txn(ref)") }
                      runCatching { db.execSQL("ALTER TABLE payees ADD COLUMN alt_upis TEXT") }
                      db.execSQL("CREATE TABLE IF NOT EXISTS payee_tags (merchant_key TEXT, tag TEXT, note TEXT, PRIMARY KEY(merchant_key, tag))")
                      db.execSQL("CREATE TABLE IF NOT EXISTS txn_skipped (id INTEGER PRIMARY KEY AUTOINCREMENT, reason TEXT, ref TEXT, body TEXT, ts INTEGER)")
                      db.execSQL("CREATE TABLE IF NOT EXISTS subs_detected (merchant_key TEXT PRIMARY KEY, avg_amt REAL, last_ts INTEGER, count INTEGER)")
                  }

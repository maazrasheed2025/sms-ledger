          cat > app/src/main/java/com/example/fintrack/VpaExtractor.kt <<'EOF_VPA'
          package com.example.fintrack
          data class Detection(val txnId: Long, val kind: String, val raw: String, val proposedMerchant: String, val proposedCategory: String, val confidence: Int)
          object VpaExtractor {
              private val mobileRe = Regex("""^[6-9]\d{9}$""")
              private val vpaRe = Regex("""[a-z0-9][a-z0-9._\-]*@[a-z][a-z0-9]+""", RegexOption.IGNORE_CASE)
              private val upiSlashRe = Regex("""(?i)UPI\s*(?:OUT|IN|/OUT|/IN)\s*/\s*([^/]+?)\s*/\s*([a-z0-9][a-z0-9._\-\s]*@[a-z][a-z0-9]+)""")
              private val cdmRe = Regex("""(?i)BY\s+CDM\s*/\s*([A-Za-z0-9\-]+)(?:\s*/\s*([A-Za-z0-9\-\s]+))?""")
              private val atmRe = Regex("""(?i)TO\s+ATM\s*/\s*([A-Za-z0-9]+)\s*/\s*([A-Za-z0-9\s\\]+)""")
              fun extractVpa(body: String): String? {
                  upiSlashRe.find(body)?.let { m -> val c = m.groupValues[2].trim().replace(" ", "").lowercase(); if (vpaRe.matches(c)) return c }
                  for (m in vpaRe.findAll(body)) { val v = m.value.trim().lowercase(); if (v.endsWith(".com") || v.endsWith(".in") || v.contains(".bank") || v.startsWith("xx")) continue; return v }
                  return null
              }
              fun isMobile(vpa: String): Boolean = mobileRe.matches(vpa.substringBefore("@"))
              fun mobileDigits(vpa: String): String? { val u = vpa.substringBefore("@"); return if (mobileRe.matches(u)) u else null }
              fun detect(ctx: android.content.Context, t: Txn): Detection? {
                  try {
                      val body = t.body; if (body.isBlank()) return null
                      atmRe.find(body)?.let { m -> val road = m.groupValues[2].replace("\\", " ").trim().take(40); val name = if (road.isNotBlank()) "ATM Withdrawal on $road" else "ATM Withdrawal"; return Detection(t.id, "ATM", road, name, "Cash", 5) }
                      cdmRe.find(body)?.let { m -> val location = m.groupValues[2].trim(); val name = if (location.isNotBlank()) "CDM Deposit · $location" else "CDM Deposit"; return Detection(t.id, "CDM", location, name, "Transfer", 4) }
                      val vpa = extractVpa(body) ?: return null
                      val cleaned = vpa.trim().replace(" ", "")
                      if (cleaned.length < 5 || !cleaned.contains("@")) return null
                      val mobile = isMobile(cleaned)
                      val brand = Brands.lookup(cleaned)
                      val proposedMerchant = brand?.first ?: if (mobile) formatMobile(cleaned.substringBefore("@")) else cleaned
                      val alreadyKnown = Learner.category(Db.get(ctx), Learner.norm(t.merchant))
                      val cat = alreadyKnown ?: (brand?.second ?: "Transfer")
                      val confidence = if (brand != null) 5 else if (mobile) 4 else 3
                      return Detection(t.id, if (mobile) "MOBILE" else "VPA", cleaned, proposedMerchant, cat, confidence)
                  } catch (_: Exception) { return null }
              }
              private fun formatMobile(s: String): String = if (s.length == 10) "${s.take(5)} ${s.takeLast(5)}" else s
          }
          object BillDetector {
              private val billRe = Regex("""(?i)\b(bill|due|statement|premium|renewal|recharge|outstanding)\b""")

              }
              fun computeReviewHash(t: Txn): String = (String.format(java.util.Locale.US, "%.2f", t.amount) + "|" + (if (t.debit) "D" else "C") + "|" + Learner.norm(t.merchant) + "|" + (t.ref ?: "")).hashCode().toString()
              fun updateTxn(t: Txn) { writableDatabase.update("txn", values(t), "id=?", arrayOf(t.id.toString())) }
              fun deleteTxn(id: Long) { writableDatabase.delete("txn", "id=?", arrayOf(id.toString())); writableDatabase.delete("toll_trips", "txn_id=?", arrayOf(id.toString())) }
              fun logSkipped(reason: String, ref: String, body: String, ts: Long) { runCatching { exec("INSERT INTO txn_skipped(reason, ref, body, ts) VALUES(?,?,?,?)", reason, ref, body, ts) } }
              private fun toTxn(c: Cursor): Txn {
                  fun s(n: String): String? { val i = c.getColumnIndex(n); return if (i < 0 || c.isNull(i)) null else c.getString(i) }
                  fun d(n: String): Double? { val i = c.getColumnIndexOrThrow(n); return if (c.isNull(i)) null else c.getDouble(i) }
                  return Txn(
                      id = c.getLong(c.getColumnIndexOrThrow("id")), smsKey = s("sms_key"), ts = c.getLong(c.getColumnIndexOrThrow("ts")),
                      amount = c.getDouble(c.getColumnIndexOrThrow("amount")), debit = c.getInt(c.getColumnIndexOrThrow("debit")) == 1,
                      merchant = s("merchant") ?: "", category = s("category") ?: "Other", institution = s("institution") ?: "",
                      account = s("account"), balance = d("balance"), channel = s("channel") ?: "OTHER", ref = s("ref"), vpa = s("vpa"),
                      sender = s("sender") ?: "", body = s("body") ?: "", source = s("source") ?: "SMS", status = s("status") ?: "REGEX",
                      tpl = s("tpl") ?: "", review = c.getInt(c.getColumnIndexOrThrow("review")) == 1, reviewHash = s("review_hash"),
                      loanNo = s("loan_no"), note = s("note"), voicePath = s("voice_path")
                  )
              }
              fun queryTxns(where: String = "1=1", args: Array<String> = emptyArray(), limit: Int = 500): List<Txn> {
                  val out = ArrayList<Txn>()
                  readableDatabase.rawQuery("SELECT * FROM txn WHERE $where ORDER BY ts DESC LIMIT $limit", args).use { c -> while (c.moveToNext()) out.add(toTxn(c)) }
                  return out
              }
          }

          object Repo {
              fun save(ctx: Context, t: Txn): Long {
                  val db = Db.get(ctx); val id = db.insertTxn(t); if (id > 0) { t.id = id; afterSave(ctx, t) }; return id
              }
              fun ensurePayee(ctx: Context, t: Txn) {
                  val db = Db.get(ctx); val key = Learner.norm(t.merchant)
                  val skip = setOf("cash", "fastag", "salary/income", "received", "")
                  if (key.isBlank() || key in skip || t.merchant == "Unknown") return
                  db.exec("INSERT OR IGNORE INTO payees(merchant_key, display) VALUES(?,?)", key, t.merchant)
                  val vpa = t.vpa
                  if (!vpa.isNullOrBlank()) db.exec("UPDATE payees SET upi_id=? WHERE merchant_key=? AND (upi_id IS NULL OR upi_id='')", vpa, key)
              }
              fun afterSave(ctx: Context, t: Txn) {
                  ensurePayee(ctx, t)
                  if (t.category == "Travel" || t.channel == "FASTAG") Tolls.record(ctx, t)
                  if (t.source == "SMS" && (t.status == "REGEX" || t.status == "LEARNED" || t.status == "USER")) Learner.trainType(Db.get(ctx), t.body, t.debit, if (t.status == "USER") 3.0 else 1.0)
                  Subs.detect(ctx, t)
              }
          }

          object NetWorth {
              data class Result(val assets: Double, val liabilities: Double, val bank: List<Triple<String, String, Double>>)
              fun compute(ctx: Context): Result {
                  val db = Db.get(ctx)
                  val bank = db.rows("SELECT institution, account, balance FROM txn t WHERE balance IS NOT NULL AND source='SMS' AND ts = (SELECT MAX(ts) FROM txn WHERE institution=t.institution AND IFNULL(account,'')=IFNULL(t.account,'') AND balance IS NOT NULL)").map { Triple(it["institution"] ?: "", it["account"] ?: "", it["balance"]?.toDoubleOrNull() ?: 0.0) }
                  val seen = HashSet<String>()
                  val bankUnique = bank.filter { seen.add(it.first + "|" + it.second) }
                  val manualAssets = db.num("SELECT SUM(amount) FROM net_items WHERE kind='ASSET'")
                  return Result(bankUnique.sumOf { it.third } + manualAssets, 0.0, bankUnique)
              }
          }

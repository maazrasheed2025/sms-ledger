          cat > app/src/main/java/com/example/fintrack/Backup.kt <<'EOF_5'
          package com.example.fintrack

          import android.content.ContentValues
          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object Backup {
              val CANONICAL = listOf("Bank", "Account_No", "Txn_Date", "Description", "Ref_No", "Withdrawal", "Deposit", "Category", "UPI_ID")
              private val tables = listOf("txn","payees","net_items","senders","merchant_rules","parse_patterns","nb_words","toll_trips","toll_plazas","payee_tags","loans")
              private val dateFmt = SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US)
              private fun q(s: String): String {
                  val cleaned = s.replace("\r", " ").replace("\n", " ").replace("\"", "\"\"")
                  return "\"" + cleaned + "\""
              }
              fun export(ctx: Context): String {
                  val db = Db.get(ctx).readableDatabase
                  val sb = StringBuilder()
                  sb.append("## CANONICAL").append('\n')
                  sb.append(CANONICAL.joinToString(",")).append('\n')
                  db.rawQuery("SELECT institution, account, ts, body, ref, debit, amount, category, vpa FROM txn ORDER BY ts ASC", null).use { c ->
                      while (c.moveToNext()) {
                          val bank = if (c.isNull(0)) "" else c.getString(0)
                          val acct = if (c.isNull(1)) "" else c.getString(1)
                          val ts = c.getLong(2)
                          val desc = if (c.isNull(3)) "" else c.getString(3)
                          val ref = if (c.isNull(4)) "" else c.getString(4)
                          val debit = c.getInt(5) == 1
                          val amt = c.getDouble(6)
                          val cat = if (c.isNull(7)) "" else c.getString(7)
                          val upi = if (c.isNull(8)) "" else c.getString(8)
                          sb.append(listOf(q(bank), q(acct), q(dateFmt.format(Date(ts))), q(desc), q(ref),
                              q(if (debit) String.format(Locale.US, "%.2f", amt) else ""),
                              q(if (!debit) String.format(Locale.US, "%.2f", amt) else ""), q(cat), q(upi)).joinToString(",")).append('\n')
                      }
                  }
                  for (t in tables) {
                      val cols = ArrayList<String>()
                      db.rawQuery("PRAGMA table_info($t)", null).use { c -> while (c.moveToNext()) cols.add(c.getString(1)) }
                      sb.append("## ").append(t).append('\n')
                      sb.append(cols.joinToString(",")).append('\n')
                      db.rawQuery("SELECT * FROM $t", null).use { c ->
                          while (c.moveToNext()) {
                              val parts = ArrayList<String>()
                              for (i in 0 until c.columnCount) parts.add(if (c.isNull(i)) "" else q(c.getString(i)))
                              sb.append(parts.joinToString(",")).append('\n')
                          }
                      }
                  }
                  return sb.toString()
              }
              private fun parseLine(line: String): List<String?> {
                  val out = ArrayList<String?>(); val sb = StringBuilder()
                  var inQ = false; var quoted = false; var i = 0
                  while (i < line.length) {
                      val ch = line[i]
                      if (inQ) {
                          if (ch == '"') { if (i + 1 < line.length && line[i + 1] == '"') { sb.append('"'); i++ } else inQ = false } else sb.append(ch)
                      } else if (ch == '"') { inQ = true; quoted = true }
                      else if (ch == ',') { out.add(if (!quoted && sb.isEmpty()) null else sb.toString()); sb.setLength(0); quoted = false }
                      else sb.append(ch)
                      i++
                  }
                  out.add(if (!quoted && sb.isEmpty()) null else sb.toString())
                  return out
              }
              fun restore(ctx: Context, text: String): Int {
                  val db = Db.get(ctx).writableDatabase
                  var n = 0; var table: String? = null; var cols: List<String>? = null
                  db.beginTransaction()
                  try {
                      for (line in text.lines()) {
                          if (line.isBlank()) continue
                          if (line.startsWith("## ")) { table = line.substring(3).trim(); cols = null; continue }
                          val tb = table ?: continue
                          if (tb == "CANONICAL") continue
                          if (tb !in tables) continue
                          val cells = parseLine(line); val cs = cols
                          if (cs == null) { cols = cells.map { it ?: "" }; continue }
                          val cv = ContentValues()
                          for (i in cs.indices) { val v = cells.getOrNull(i); if (v == null) cv.putNull(cs[i]) else cv.put(cs[i], v) }
                          db.insertWithOnConflict(tb, null, cv, SQLiteDatabase.CONFLICT_REPLACE)
                          n++
                      }
                      db.setTransactionSuccessful()
                  } finally { db.endTransaction() }
                  return n
              }
          }
          EOF_5

          cat > app/src/main/java/com/example/fintrack/Db.kt <<'EOF_6'
          package com.example.fintrack

          import android.content.ContentValues
          import android.content.Context
          import android.database.Cursor
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper

          data class Txn(
              var id: Long = 0, var smsKey: String? = null, var ts: Long, var amount: Double, var debit: Boolean,
              var merchant: String, var category: String, var institution: String = "", var account: String? = null,
              var balance: Double? = null, var channel: String = "OTHER", var ref: String? = null, var vpa: String? = null,
              var sender: String = "", var body: String = "", var source: String = "SMS", var status: String = "REGEX",
              var tpl: String = "", var review: Boolean = false, var reviewHash: String? = null, var loanNo: String? = null,
              var note: String? = null, var voicePath: String? = null
          )

          class Db private constructor(ctx: Context) : SQLiteOpenHelper(ctx, "fintrack.db", null, 6) {
              companion object {
                  @Volatile private var inst: Db? = null
                  fun get(ctx: Context): Db = inst ?: synchronized(this) { inst ?: Db(ctx.applicationContext).also { inst = it } }
              }
              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL("CREATE TABLE txn (id INTEGER PRIMARY KEY AUTOINCREMENT, sms_key TEXT UNIQUE, ts INTEGER NOT NULL, amount REAL NOT NULL, debit INTEGER NOT NULL, merchant TEXT, merchant_key TEXT, category TEXT, institution TEXT, account TEXT, balance REAL, channel TEXT, ref TEXT, vpa TEXT, sender TEXT, body TEXT, source TEXT, status TEXT, tpl TEXT, review INTEGER DEFAULT 0, review_hash TEXT, loan_no TEXT, note TEXT, voice_path TEXT)")
                  db.execSQL("CREATE INDEX idx_txn_ts ON txn(ts)")
                  db.execSQL("CREATE INDEX idx_txn_tpl ON txn(tpl)")
                  db.execSQL("CREATE INDEX idx_txn_mk ON txn(merchant_key)")
                  db.execSQL("CREATE INDEX idx_txn_rh ON txn(review_hash)")
                  db.execSQL("CREATE INDEX idx_txn_ref ON txn(ref)")
                  db.execSQL("CREATE INDEX idx_txn_loan ON txn(loan_no)")
                  db.execSQL("CREATE TABLE senders (core TEXT PRIMARY KEY, institution TEXT, kind TEXT, user_defined INTEGER DEFAULT 0)")
                  db.execSQL("CREATE TABLE merchant_rules (merchant_key TEXT PRIMARY KEY, display TEXT, category TEXT, weight REAL DEFAULT 1)")
                  db.execSQL("CREATE TABLE parse_patterns (id INTEGER PRIMARY KEY AUTOINCREMENT, sender_core TEXT, tpl TEXT, field TEXT, left_ctx TEXT, right_ctx TEXT, weight REAL DEFAULT 1, UNIQUE(sender_core, tpl, field, left_ctx, right_ctx))")
                  db.execSQL("CREATE TABLE nb_words (word TEXT PRIMARY KEY, d REAL DEFAULT 0, c REAL DEFAULT 0)")
                  db.execSQL("CREATE TABLE toll_trips (id INTEGER PRIMARY KEY AUTOINCREMENT, txn_id INTEGER UNIQUE, plaza_id INTEGER, plaza TEXT, state TEXT, lat REAL, lon REAL, ts INTEGER, amount REAL, vehicle TEXT)")
                  db.execSQL("CREATE TABLE toll_plazas (plaza_id INTEGER PRIMARY KEY, name TEXT, state TEXT, nh TEXT, lat REAL, lon REAL, car_fare REAL)")
                  db.execSQL("CREATE TABLE payees (merchant_key TEXT PRIMARY KEY, display TEXT, upi_id TEXT, alt_upis TEXT, note TEXT)")
                  db.execSQL("CREATE TABLE net_items (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, amount REAL, kind TEXT)")
                  db.execSQL("CREATE TABLE loans (loan_no TEXT PRIMARY KEY, lender TEXT, first_seen INTEGER, last_seen INTEGER, msg_count INTEGER DEFAULT 0)")
                  db.execSQL("CREATE TABLE payee_tags (merchant_key TEXT, tag TEXT, note TEXT, PRIMARY KEY(merchant_key, tag))")
                  db.execSQL("CREATE TABLE txn_skipped (id INTEGER PRIMARY KEY AUTOINCREMENT, reason TEXT, ref TEXT, body TEXT, ts INTEGER)")
                  db.execSQL("CREATE TABLE subs_detected (merchant_key TEXT PRIMARY KEY, avg_amt REAL, last_ts INTEGER, count INTEGER)")
              }
              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                  if (oldVersion < 2) db.execSQL("CREATE TABLE IF NOT EXISTS toll_plazas (plaza_id INTEGER PRIMARY KEY, name TEXT, state TEXT, nh TEXT, lat REAL, lon REAL, car_fare REAL)")
                  if (oldVersion < 3) {
                      runCatching { db.execSQL("ALTER TABLE txn ADD COLUMN review_hash TEXT") }
                      runCatching { db.execSQL("CREATE INDEX IF NOT EXISTS idx_txn_rh ON txn(review_hash)") }
                      runCatching { db.execSQL("CREATE INDEX IF NOT EXISTS idx_txn_ref ON txn(ref)") }
                      runCatching { db.execSQL("ALTER TABLE payees ADD COLUMN alt_upis TEXT") }
                      db.execSQL("CREATE TABLE IF NOT EXISTS payee_tags (merchant_key TEXT, tag TEXT, note TEXT, PRIMARY KEY(merchant_key, tag))")
                      db.execSQL("CREATE TABLE IF NOT EXISTS txn_skipped (id INTEGER PRIMARY KEY AUTOINCREMENT, reason TEXT, ref TEXT, body TEXT, ts INTEGER)")
                      db.execSQL("CREATE TABLE IF NOT EXISTS subs_detected (merchant_key TEXT PRIMARY KEY, avg_amt REAL, last_ts INTEGER, count INTEGER)")
                  }
                  if (oldVersion < 4) {
                      runCatching { db.execSQL("DROP TABLE IF EXISTS loans") }
                      db.execSQL("CREATE TABLE IF NOT EXISTS loans (loan_no TEXT PRIMARY KEY, lender TEXT, first_seen INTEGER, last_seen INTEGER, msg_count INTEGER DEFAULT 0)")
                      runCatching { db.execSQL("ALTER TABLE txn ADD COLUMN loan_no TEXT") }
                      runCatching { db.execSQL("CREATE INDEX IF NOT EXISTS idx_txn_loan ON txn(loan_no)") }
                      runCatching { db.execSQL("DROP TABLE IF EXISTS budgets") }
                  }
                  if (oldVersion < 5) runCatching { db.execSQL("ALTER TABLE payees ADD COLUMN alt_upis TEXT") }
                  if (oldVersion < 6) {
                      runCatching { db.execSQL("ALTER TABLE txn ADD COLUMN note TEXT") }
                      runCatching { db.execSQL("ALTER TABLE txn ADD COLUMN voice_path TEXT") }
                  }
              }
              fun rows(sql: String, vararg args: String): List<Map<String, String?>> {
                  val out = ArrayList<Map<String, String?>>()
                  readableDatabase.rawQuery(sql, arrayOf(*args)).use { c ->
                      while (c.moveToNext()) {
                          val m = HashMap<String, String?>()
                          for (i in 0 until c.columnCount) m[c.getColumnName(i)] = if (c.isNull(i)) null else c.getString(i)
                          out.add(m)
                      }
                  }
                  return out
              }
              fun one(sql: String, vararg args: String): String? = rows(sql, *args).firstOrNull()?.values?.firstOrNull()
              fun num(sql: String, vararg args: String): Double = one(sql, *args)?.toDoubleOrNull() ?: 0.0
              fun exec(sql: String, vararg args: Any?) { writableDatabase.execSQL(sql, arrayOf(*args)) }
              private fun values(t: Txn) = ContentValues().apply {
                  put("sms_key", t.smsKey); put("ts", t.ts); put("amount", t.amount); put("debit", if (t.debit) 1 else 0)
                  put("merchant", t.merchant); put("merchant_key", Learner.norm(t.merchant)); put("category", t.category)
                  put("institution", t.institution); put("account", t.account); put("balance", t.balance)
                  put("channel", t.channel); put("ref", t.ref); put("vpa", t.vpa); put("sender", t.sender); put("body", t.body)
                  put("source", t.source); put("status", t.status); put("tpl", t.tpl); put("review", if (t.review) 1 else 0)
                  put("review_hash", t.reviewHash); put("loan_no", t.loanNo); put("note", t.note); put("voice_path", t.voicePath)
              }
              fun insertTxn(t: Txn): Long {
                  val existing = t.smsKey?.let { one("SELECT id FROM txn WHERE sms_key=?", it)?.toLongOrNull() }
                  if (existing != null) return 0
                  val ref = t.ref
                  if (!ref.isNullOrBlank()) {
                      val dup = one("SELECT id FROM txn WHERE ref=? AND institution=? AND IFNULL(account,'')=? LIMIT 1", ref, t.institution, t.account ?: "")
                      if (dup != null) { logSkipped("duplicate-ref", ref, t.body, t.ts); return 0 }
                  }
                  val id = writableDatabase.insertWithOnConflict("txn", null, values(t), SQLiteDatabase.CONFLICT_IGNORE)
                  if (id > 0) {
                      t.id = id
                      if (t.review) writableDatabase.update("txn", ContentValues().apply { put("review_hash", computeReviewHash(t)) }, "id=?", arrayOf(id.toString()))
                      val ln = t.loanNo
                      if (!ln.isNullOrBlank()) writableDatabase.execSQL("INSERT INTO loans(loan_no, lender, first_seen, last_seen, msg_count) VALUES(?,?,?,?,1) ON CONFLICT(loan_no) DO UPDATE SET last_seen=excluded.last_seen, msg_count=msg_count+1", arrayOf(ln, t.institution, t.ts, t.ts))
                  }
                  return id
              }
              fun computeReviewHash(t: Txn): String = (String.format(java.util.Locale.US, "%.2f", t.amount) + "|" + (if (t.debit) "D" else "C") + "|" + Learner.norm(t.merchant) + "|" + (t.ref ?: "")).hashCode().toString()
              fun updateTxn(t: Txn) { writableDatabase.update("txn", values(t), "id=?", arrayOf(t.id.toString())) }
              fun deleteTxn(id: Long) { writableDatabase.delete("txn", "id=?", arrayOf(id.toString())); writableDatabase.delete("toll_trips", "txn_id=?", arrayOf(id.toString())) }
              fun logSkipped(reason: String, ref: String, body: String, ts: Long) { runCatching { exec("INSERT INTO txn_skipped(reason, ref, body, ts) VALUES(?,?,?,?)", reason, ref, body, ts) } }
              private fun toTxn(c: Cursor): Txn {
                  fun s(n: String): String? { val i = c.getColumnIndex(n); return if (i < 0 || c.isNull(i)) null else c.getString(i) }
                  fun d(n: String): Double? { val i = c.getColumnIndexOrThrow(n); return if (c.isNull(i)) null else c.getDouble(i) }
                  return Txn(
                      id = c.getLong(c.getColumnIndexOrThrow("id")), smsKey = s("sms_key"), ts = c.getLong(c.getColumnIndexOrThrow("ts")),
                      amount = c.getDouble(c.getColumnIndexOrThrow("amount")), debit = c.getInt(c.getColumnIndexOrThrow("debit")) == 1,
                      merchant = s("merchant") ?: "", category = s("category") ?: "Other", institution = s("institution") ?: "",
                      account = s("account"), balance = d("balance"), channel = s("channel") ?: "OTHER", ref = s("ref"), vpa = s("vpa"),
                      sender = s("sender") ?: "", body = s("body") ?: "", source = s("source") ?: "SMS", status = s("status") ?: "REGEX",
                      tpl = s("tpl") ?: "", review = c.getInt(c.getColumnIndexOrThrow("review")) == 1, reviewHash = s("review_hash"),
                      loanNo = s("loan_no"), note = s("note"), voicePath = s("voice_path")
                  )
              }
              fun queryTxns(where: String = "1=1", args: Array<String> = emptyArray(), limit: Int = 500): List<Txn> {
                  val out = ArrayList<Txn>()
                  readableDatabase.rawQuery("SELECT * FROM txn WHERE $where ORDER BY ts DESC LIMIT $limit", args).use { c -> while (c.moveToNext()) out.add(toTxn(c)) }
                  return out
              }
          }

          object Repo {
              fun save(ctx: Context, t: Txn): Long {
                  val db = Db.get(ctx); val id = db.insertTxn(t); if (id > 0) { t.id = id; afterSave(ctx, t) }; return id
              }
              fun ensurePayee(ctx: Context, t: Txn) {
                  val db = Db.get(ctx); val key = Learner.norm(t.merchant)
                  val skip = setOf("cash", "fastag", "salary/income", "received", "")
                  if (key.isBlank() || key in skip || t.merchant == "Unknown") return
                  db.exec("INSERT OR IGNORE INTO payees(merchant_key, display) VALUES(?,?)", key, t.merchant)
                  val vpa = t.vpa
                  if (!vpa.isNullOrBlank()) db.exec("UPDATE payees SET upi_id=? WHERE merchant_key=? AND (upi_id IS NULL OR upi_id='')", vpa, key)
              }
              fun afterSave(ctx: Context, t: Txn) {
                  ensurePayee(ctx, t)
                  if (t.category == "Travel" || t.channel == "FASTAG") Tolls.record(ctx, t)
                  if (t.source == "SMS" && (t.status == "REGEX" || t.status == "LEARNED" || t.status == "USER")) Learner.trainType(Db.get(ctx), t.body, t.debit, if (t.status == "USER") 3.0 else 1.0)
                  Subs.detect(ctx, t)
              }
          }

          object NetWorth {
              data class Result(val assets: Double, val liabilities: Double, val bank: List<Triple<String, String, Double>>)
              fun compute(ctx: Context): Result {
                  val db = Db.get(ctx)
                  val bank = db.rows("SELECT institution, account, balance FROM txn t WHERE balance IS NOT NULL AND source='SMS' AND ts = (SELECT MAX(ts) FROM txn WHERE institution=t.institution AND IFNULL(account,'')=IFNULL(t.account,'') AND balance IS NOT NULL)").map { Triple(it["institution"] ?: "", it["account"] ?: "", it["balance"]?.toDoubleOrNull() ?: 0.0) }
                  val seen = HashSet<String>()
                  val bankUnique = bank.filter { seen.add(it.first + "|" + it.second) }
                  val manualAssets = db.num("SELECT SUM(amount) FROM net_items WHERE kind='ASSET'")
                  return Result(bankUnique.sumOf { it.third } + manualAssets, 0.0, bankUnique)
              }
          }
          EOF_6

          cat > app/src/main/java/com/example/fintrack/Learner.kt <<'EOF_7'
          package com.example.fintrack

          import android.content.Context

          object Learner {
              fun norm(s: String): String = s.lowercase().replace(Regex("""[^a-z0-9@. ]"""), " ").replace(Regex("""\s+"""), " ").trim()
              fun category(db: Db, key: String): String? {
                  if (key.isBlank()) return null
                  val exact = db.rows("SELECT category FROM merchant_rules WHERE merchant_key=?", key).firstOrNull()?.get("category")
                  if (exact != null) return exact
                  var best: String? = null; var bw = 0.0
                  for (r in db.rows("SELECT merchant_key, category, weight FROM merchant_rules WHERE length(merchant_key) >= 5")) {
                      val k = r["merchant_key"] ?: continue
                      if (key.contains(k) || k.contains(key)) { val w = r["weight"]?.toDoubleOrNull() ?: 1.0; if (w > bw) { bw = w; best = r["category"] } }
                  }
                  return best
              }
              fun learnCategory(db: Db, key: String, display: String, cat: String) {
                  if (key.isBlank()) return
                  val old = db.rows("SELECT category FROM merchant_rules WHERE merchant_key=?", key).firstOrNull()
                  if (old == null) db.exec("INSERT INTO merchant_rules(merchant_key, display, category, weight) VALUES(?,?,?,?)", key, display, cat, 2.0)
                  else if (old["category"] == cat) db.exec("UPDATE merchant_rules SET weight = weight + 1 WHERE merchant_key=?", key)
                  else db.exec("UPDATE merchant_rules SET category=?, weight=2 WHERE merchant_key=?", cat, key)
                  db.exec("UPDATE txn SET category=? WHERE merchant_key=?", cat, key)
              }
              private fun alpha(s: String) = s.length >= 2 && s.all { it.isLetter() || it == '/' }
              private val structural = setOf("on","ref","via","upi","avl","bal","using","not","if","dated","vide","txn","a/c","account","to","from","for","info")
              private fun ctxNorm(t: String) = t.lowercase().replace(Regex("""\d+"""), "#")
              private fun ctxRegex(s: String) = s.split("#").joinToString("""\d+""") { Regex.escape(it) }
              fun learnMerchantPattern(db: Db, core: String, tpl: String, body: String, merchant: String) {
                  val idx = body.indexOf(merchant, ignoreCase = true); if (idx < 0 || merchant.length < 2) return
                  val before = body.substring(0, idx).trim().split(" ").filter { it.isNotEmpty() }
                  val after = body.substring(idx + merchant.length).trim().split(" ").filter { it.isNotEmpty() }
                  var left = ""
                  if (before.isNotEmpty()) { left = ctxNorm(before.last()); if (before.size >= 2 && alpha(before[before.size-2]) && alpha(before.last())) left = ctxNorm(before[before.size-2]) + " " + left }
                  var right = ""

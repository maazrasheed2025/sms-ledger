                          "FROM payees p JOIN txn t ON t.merchant_key = p.merchant_key AND t.debit = 1 GROUP BY p.merchant_key ORDER BY total DESC LIMIT 400"
                  )
                  adapter.items = rows
                  adapter.notifyDataSetChanged()
                  summary.text = "${rows.size} payees / dukaan  •  tap karke history dekho aur UPI se pay karo"

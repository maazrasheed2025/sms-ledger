          package com.example.fintrack

          import android.content.Context

          object Subs {
              fun detect(ctx: Context, t: Txn) {
                  if (!t.debit) return
                  val key = Learner.norm(t.merchant); if (key.isBlank() || key == "unknown") return
                  val db = Db.get(ctx)
                  val rows = db.rows("SELECT amount, ts FROM txn WHERE merchant_key=? AND debit=1 ORDER BY ts DESC LIMIT 6", key)

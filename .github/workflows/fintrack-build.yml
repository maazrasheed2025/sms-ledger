                          AlertDialog.Builder(act).setTitle(Str.s("duplicates")).setView(android.widget.ScrollView(act).apply { addView(cont) })
                              .setPositiveButton(Str.s("delete_ticked")) { _, _ -> var n = 0; for ((id, cb) in boxes) if (cb.isChecked) { Db.get(act).deleteTxn(id); n++ }; PayeeOps.cleanupOrphanPayees(act); act.toast("$n deleted"); act.refreshAll() }
                              .setNegativeButton(Str.s("cancel"), null).show()
                      }
                  }.start()
              }
              private fun showTxn(t: Txn) {
                  val msg = fmtDateTime(t.ts) + "  •  " + t.institution + "\n" + (if (t.debit) "-" else "+") + inr(t.amount, true) + "  •  " + t.category +
                      (if (t.balance != null) "\nBalance: " + inr(t.balance ?: 0.0, true) else "") + "\nSource: ${t.source} • Parse: ${t.status}" +
                      (if (t.body.isNotEmpty()) "\n\n" + t.body else "")
                  val ad = AlertDialog.Builder(act).setTitle(t.merchant).setMessage(msg)
                      .setPositiveButton(Str.s("edit")) { _, _ -> edit(t) }.setNeutralButton(Str.s("delete"), null).setNegativeButton(Str.s("close"), null).create()

              private fun hasSms() =
                  ContextCompat.checkSelfPermission(this, Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED

              private fun askPermissionsAndScan() {
                  if (hasSms()) { rescan(); return }
                  ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.READ_SMS, Manifest.permission.RECEIVE_SMS), 1)
              }

              override fun onRequestPermissionsResult(code: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(code, p, r)
                  if (hasSms()) rescan()
                  else toast("SMS permission zaroori hai. Settings -> Apps -> FinTrack -> Permissions")
              }

              fun rescan() {
                  if (!hasSms()) { askPermissionsAndScan(); return }
                  toast("SMS scan ho raha hai...")
                  Thread {
                      var n = 0
                      var err: String? = null
                      try { n = SmsImport.run(applicationContext) } catch (e: Exception) { err = e.message }
                      runOnUiThread {
                          toast(if (err != null) "Scan error: $err" else "$n naye transactions mile")
                          refreshAll()
                      }
                  }.start()
              }

              fun backup() {
                  try {
                      val name = "fintrack_backup_" + SimpleDateFormat("yyyyMMdd_HHmm", Locale.US).format(Date()) + ".csv"
                      val values = ContentValues().apply {
                          put(MediaStore.Downloads.DISPLAY_NAME, name)
                          put(MediaStore.Downloads.MIME_TYPE, "text/csv")
                          put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                      }
                      val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      if (uri == null) { toast("Backup fail ho gaya"); return }
                      contentResolver.openOutputStream(uri)?.use { it.write(Backup.export(this).toByteArray()) }
                      toast("Downloads me save: $name")
                  } catch (e: Exception) {
                      toast("Backup error: ${e.message}")
                  }
              }

              fun pickRestore() { openDoc.launch(arrayOf("text/*", "application/csv", "application/vnd.ms-excel", "*/*")) }

              private fun doRestore(uri: Uri) {
                  Thread {
                      var msg: String
                      try {
                          val text = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""
                          msg = "${Backup.restore(applicationContext, text)} rows restore hue"
                      } catch (e: Exception) { msg = "Restore error: ${e.message}" }
                      runOnUiThread { toast(msg); refreshAll() }
                  }.start()
              }

              fun pickTollJson() { openTollJson.launch(arrayOf("application/json", "*/*")) }

              private fun doImportTolls(uri: Uri) {
                  Thread {
                      val count = Importer.importTollJson(applicationContext, uri)
                      runOnUiThread { toast("$count toll plazas database me import hue"); refreshAll() }
                  }.start()
              }

              fun pickCsvStatement() { openCsvStmt.launch(arrayOf("text/*", "application/csv", "application/vnd.ms-excel", "*/*")) }

              private fun showCsvImportDialog(uri: Uri) {
                  Thread {
                      val preview = CsvImporter.preview(applicationContext, uri)
                      runOnUiThread {
                          if (preview.header.isEmpty()) { toast("CSV khali ya invalid hai"); return@runOnUiThread }
                          val mapping = CsvMap.guess(preview.header)
                          val canonical = listOf("Bank", "Account_No", "Txn_Date", "Description", "Ref_No", "Withdrawal", "Deposit")
                          val labels = canonical.map { f ->
                              val idx = mapping[f]
                              val col = if (idx != null) " → " + preview.header.getOrNull(idx) else " → (skip)"
                              f + col
                          }
                          AlertDialog.Builder(this)
                              .setTitle("CSV auto-detect")
                              .setMessage("Detected columns:\n\n" + labels.joinToString("\n") + "\n\nImport karna hai?")
                              .setPositiveButton("Import") { _, _ ->
                                  Thread {
                                      val res = CsvImporter.import(applicationContext, uri, mapping, 0)
                                      runOnUiThread {
                                          toast("Imported ${res.first} • Duplicate ${res.second} • Failed ${res.third}")
                                          refreshAll()
                                      }
                                  }.start()
                              }
                              .setNegativeButton("Cancel", null)
                              .show()
                      }
                  }.start()
              }
          }

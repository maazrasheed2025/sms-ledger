                    val csv = Backup.export(this)
                    val ts = SimpleDateFormat("yyyyMMdd_HHmm", Locale.US).format(Date())
                    val csvName = "imrans_finances_$ts.csv"
                    val jsonName = "imrans_finances_$ts.rules.json"
                    var savedPath = ""
                    try { val values = ContentValues().apply { put(MediaStore.Downloads.DISPLAY_NAME, csvName); put(MediaStore.Downloads.MIME_TYPE, "text/csv"); put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/ImransFinances") }; val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values); if (uri != null) { contentResolver.openOutputStream(uri)?.use { it.write(csv.toByteArray()) }; savedPath = "Downloads/ImransFinances/$csvName" } } catch (_: Exception) {}
                    try { val rulesJson = Backup.exportRulesJson(this); val values = ContentValues().apply { put(MediaStore.Downloads.DISPLAY_NAME, jsonName); put(MediaStore.Downloads.MIME_TYPE, "application/json"); put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS + "/ImransFinances") }; val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values); if (uri != null) { contentResolver.openOutputStream(uri)?.use { it.write(rulesJson.toByteArray()) } } } catch (_: Exception) {}
                    try { val dir = File(getExternalFilesDir(null), "backups"); dir.mkdirs(); File(dir, csvName).writeText(csv); File(dir, jsonName).writeText(Backup.exportRulesJson(this)); if (savedPath.isEmpty()) savedPath = dir.absolutePath + "/" + csvName; try { val files = dir.listFiles { _, n -> n.endsWith(".csv") }?.sortedBy { it.name } ?: emptyList(); if (files.size > 20) for (i in 0 until files.size - 20) files[i].delete() } catch (_: Exception) {} } catch (_: Exception) {}
                    if (savedPath.isEmpty()) throw RuntimeException("All write paths failed — check storage permission")
                    runOnUiThread { toast(Str.s("backup_saved_to") + " " + savedPath) }
                } catch (ex: Exception) { runOnUiThread { toast(Str.s("backup_failed") + " " + (ex.message ?: "unknown")) } }
            }.start()
        }
        fun pickRestore() { openDoc.launch(arrayOf("text/*", "application/csv", "application/json", "*/*")) }
        private fun afterRestore(t: String) { try { val n = Backup.restore(applicationContext, t); val m = Db.get(applicationContext).one("SELECT MAX(ts) FROM txn")?.toLongOrNull() ?: 0L; if (m > 0) getSharedPreferences("fin", MODE_PRIVATE).edit().putLong("last_sms_date", m).apply(); runOnUiThread { toast("$n " + Str.s("restored_rows")); refreshAll() } } catch (ex: Exception) { runOnUiThread { toast(Str.s("restore_failed") + " " + (ex.message ?: "unknown")) } } }
        private fun doRestore(uri: Uri) { Thread { try { val t = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""; if (t.trimStart().startsWith("{")) { val n = Backup.importRulesJson(applicationContext, t); runOnUiThread { toast("$n rule rows restored"); refreshAll() } } else afterRestore(t) } catch (ex: Exception) { runOnUiThread { toast(Str.s("restore_failed") + " " + (ex.message ?: "unknown")) } } }.start() }
        private fun doRestoreRules(uri: Uri) { Thread { try { val t = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""; val n = Backup.importRulesJson(applicationContext, t); runOnUiThread { toast("$n rule rows restored"); refreshAll() } } catch (ex: Exception) { runOnUiThread { toast(Str.s("restore_failed") + " " + (ex.message ?: "unknown")) } } }.start() }
        fun cleanAndRestore() { AlertDialog.Builder(this).setTitle("Clean database").setMessage("Delete all transactions and rules?").setPositiveButton("Clean + Restore") { _, _ -> openBackupRestore.launch(arrayOf("text/*", "application/csv", "application/json", "*/*")) }.setNeutralButton("Clean only") { _, _ -> Thread { try { Backup.cleanAll(applicationContext); runOnUiThread { toast("Cleared"); refreshAll() } } catch (_: Exception) {} }.start() }.setNegativeButton(Str.s("cancel"), null).show() }
        private fun doCleanRestore(uri: Uri) { Thread { try { val t = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""; Backup.cleanAll(applicationContext); if (t.trimStart().startsWith("{")) { val n = Backup.importRulesJson(applicationContext, t); runOnUiThread { toast("$n rule rows restored"); refreshAll() } } else afterRestore(t) } catch (ex: Exception) { runOnUiThread { toast(Str.s("restore_failed") + " " + (ex.message ?: "unknown")) } } }.start() }
        private fun doFirstRestore(uri: Uri) { Thread { try { val t = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""; if (t.trimStart().startsWith("{")) Backup.importRulesJson(applicationContext, t) else afterRestore(t); runOnUiThread { show(0) } } catch (ex: Exception) { runOnUiThread { toast(Str.s("restore_failed") + " " + (ex.message ?: "unknown")) } } }.start() }
        private fun firstRun() { AlertDialog.Builder(this).setTitle(Str.s("welcome")).setMessage(Str.s("first_run_msg")).setPositiveButton(Str.s("scan_sms")) { _, _ -> scanIfAllowed() }.setNeutralButton(Str.s("restore_backup")) { _, _ -> openFirstRunRestore.launch(arrayOf("text/*", "application/csv", "application/json", "*/*")) }.setNegativeButton(Str.s("later"), null).setCancelable(false).show() }
        fun pickTollJson() { openTollJson.launch(arrayOf("application/json", "*/*")) }
        private fun doImportTolls(uri: Uri) { Thread { try { val c = Importer.importTollJson(applicationContext, uri); Tolls.load(this); val r = Tolls.rematchAll(this); runOnUiThread { toast("$c plazas • $r tolls"); refreshAll() } } catch (_: Exception) {} }.start() }
        fun pickCsvStatement() { openCsvStmt.launch(arrayOf("text/*", "application/csv", "*/*")) }
        private fun showCsv(uri: Uri) { Thread { try { val pr = CsvImporter.preview(applicationContext, uri); runOnUiThread { if (pr.header.isEmpty()) { toast("CSV empty"); return@runOnUiThread }; val map = CsvMap.guess(pr.header); val labels = listOf("Bank","Account_No","Txn_Date","Description","Ref_No","Withdrawal","Deposit").map { f -> val i = map[f]; f + (if (i != null) " → " + pr.header.getOrNull(i) else " → skip") }; AlertDialog.Builder(this).setTitle("CSV columns").setMessage(labels.joinToString("\n") + "\n\nImport?").setPositiveButton("Import") { _, _ -> Thread { try { val r = CsvImporter.import(applicationContext, uri, map, 0); runOnUiThread { toast("Imp ${r.first} • Dup ${r.second} • Fail ${r.third}"); refreshAll() } } catch (_: Exception) {} }.start() }.setNegativeButton(Str.s("cancel"), null).show() } } catch (_: Exception) {} }.start() }
        fun bulkCategory(ids: List<Long>) { if (ids.isEmpty()) return; val c = Categories.ALL(this); AlertDialog.Builder(this).setTitle("Category").setItems(c.toTypedArray()) { _, i -> PayeeOps.bulkSetCategory(this, ids, c[i]); refreshAll() }.show() }
        fun bulkDelete(ids: List<Long>) { if (ids.isEmpty()) return; AlertDialog.Builder(this).setTitle("Delete ${ids.size}?").setPositiveButton("Delete") { _, _ -> PayeeOps.bulkDelete(this, ids); PayeeOps.cleanupOrphanPayees(this); PayeeOps.invalidateDupCache(); refreshAll() }.setNegativeButton(Str.s("cancel"), null).show() }
        fun openNotifAccessSettings() { try { startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)) } catch (e: Exception) { toast("Manual") } }
        fun changeTxnCategory(t: Txn, done: () -> Unit) { val c = Categories.ALL(this); AlertDialog.Builder(this).setTitle(Str.s("change_category")).setItems(c.toTypedArray()) { _, i -> try { val n = t.copy(category = c[i], status = "USER", review = false); Db.get(this).updateTxn(n); done(); refreshAll() } catch (_: Exception) {} }.setNegativeButton(Str.s("cancel"), null).show() }
        fun changeTxnPayee(t: Txn, done: () -> Unit) { showForm(Str.s("change_payee"), listOf(Field(Str.s("new_payee"), t.merchant))) { v -> try { val n = t.copy(merchant = v[0].trim(), status = "USER", review = false); if (n.merchant.isBlank()) return@showForm; Db.get(this).updateTxn(n); Repo.ensurePayee(this, n); done(); refreshAll() } catch (_: Exception) {} } }
        fun sharePdf(year: Int, month: Int) { Thread { try { val f = PdfReport.generate(this, year, month); runOnUiThread { try { startActivity(Intent.createChooser(PdfReport.shareIntent(this, f), "Share report")) } catch (_: Exception) {} } } catch (_: Exception) {} }.start() }
        fun exportTxnsToPdf(title: String, txns: List<Txn>) { Thread { try { val f = PdfReport.generateTxnList(this, title, txns); runOnUiThread { try { startActivity(Intent.createChooser(PdfReport.shareIntent(this, f), "Share PDF")) } catch (_: Exception) {} } } catch (ex: Exception) { runOnUiThread { toast("PDF failed: ${ex.message}") } } }.start() }
        fun exportTollsToPdf(trips: List<TollTrip>) { Thread { try { val cps = ArrayList<TollCheckpoint>(); for (tr in trips) cps.addAll(tr.checkpoints); val f = PdfReport.generateTollList(this, "Tolls", cps); runOnUiThread { try { startActivity(Intent.createChooser(PdfReport.shareIntent(this, f), "Share PDF")) } catch (_: Exception) {} } } catch (ex: Exception) { runOnUiThread { toast("PDF failed: ${ex.message}") } } }.start() }
        fun captureLongScreenshot() {
            try {
                val curRoot = screens.getOrNull(cur)?.root
                if (curRoot == null) { toast("Nothing to capture"); return }
                val f = if (curRoot is ScrollView) LongScreenshot.captureScrollable(this, curRoot, "screen${cur}") else LongScreenshot.captureView(this, curRoot, "screen${cur}")
                if (f == null) { toast(Str.s("screenshot_failed") + " unknown"); return }
                try { startActivity(Intent.createChooser(LongScreenshot.shareIntent(this, f), "Share screenshot")) } catch (_: Exception) { toast(Str.s("saved_to") + " " + f.absolutePath) }
            } catch (ex: Exception) { toast(Str.s("screenshot_failed") + " " + (ex.message ?: "unknown")) }
        }
        fun captureViewLongShot(v: View, name: String) {
            try { val f = if (v is ScrollView) LongScreenshot.captureScrollable(this, v, name) else LongScreenshot.captureView(this, v, name); if (f == null) { toast(Str.s("screenshot_failed") + " unknown"); return }; try { startActivity(Intent.createChooser(LongScreenshot.shareIntent(this, f), "Share screenshot")) } catch (_: Exception) { toast(Str.s("saved_to") + " " + f.absolutePath) } } catch (ex: Exception) { toast(Str.s("screenshot_failed") + " " + (ex.message ?: "unknown")) }
        }
        fun showReclassify(institution: String, account: String) {
            val kinds = arrayOf("Bank" to "BANK", "Wallet" to "WALLET", "Credit Card" to "CARD", "FASTag" to "FASTAG", "Loan" to "LOAN", "Insurance / Policy" to "POLICY")
            val labels = kinds.map { it.first }.toTypedArray()
            AlertDialog.Builder(this).setTitle(Str.s("move_to") + " " + institution + " " + account).setItems(labels) { _, i -> Thread { try { val db = Db.get(this); db.exec("UPDATE accounts SET kind=? WHERE institution=? AND account=?", kinds[i].second, institution, account); if (kinds[i].second == "LOAN" && account.isNotBlank()) db.exec("INSERT OR IGNORE INTO loans(loan_no, lender, first_seen, last_seen, msg_count) VALUES(?,?,?,?,0)", account, institution, System.currentTimeMillis(), System.currentTimeMillis()); runOnUiThread { toast("Moved to ${kinds[i].first}"); refreshAll() } } catch (_: Exception) {} }.start() }.setNegativeButton(Str.s("cancel"), null).show()
        }
    }

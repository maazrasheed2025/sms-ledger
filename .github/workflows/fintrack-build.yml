          package com.example.fintrack

          import android.content.ContentValues
          import android.content.Context
          import android.database.sqlite.SQLiteDatabase

          /** Sectioned CSV ("## table" blocks) - opens in Excel/Sheets, restorable in this app. */
          object Backup {
              private val tables = listOf(
                  "txn", "payees", "net_items", "loans", "senders", "merchant_rules", "parse_patterns", "nb_words", "toll_trips"
              )

              private fun q(s: String) = "\"" + s.replace("\n", " ").replace("\"", "\"\"") + "\""

              fun export(ctx: Context): String {
                  val db = Db.get(ctx).readableDatabase
                  val sb = StringBuilder()
                  for (t in tables) {
                      val cols = ArrayList<String>()
                      db.rawQuery("PRAGMA table_info($t)", null).use { c -> while (c.moveToNext()) cols.add(c.getString(1)) }
                      sb.append("## ").append(t).append('\n').append(cols.joinToString(",")).append('\n')
                      db.rawQuery("SELECT * FROM $t", null).use { c ->
                          while (c.moveToNext()) {
                              val parts = ArrayList<String>()
                              for (i in 0 until c.columnCount) parts.add(if (c.isNull(i)) "" else q(c.getString(i)))
                              sb.append(parts.joinToString(",")).append('\n')
                          }
                      }
                  }
                  return sb.toString()
              }

              private fun parseLine(line: String): List<String?> {
                  val out = ArrayList<String?>()
                  val sb = StringBuilder()
                  var inQ = false
                  var quoted = false
                  var i = 0
                  while (i < line.length) {
                      val ch = line[i]
                      if (inQ) {
                          if (ch == '"') {
                              if (i + 1 < line.length && line[i + 1] == '"') { sb.append('"'); i++ } else inQ = false
                          } else sb.append(ch)
                      } else if (ch == '"') {
                          inQ = true; quoted = true
                      } else if (ch == ',') {
                          out.add(if (!quoted && sb.isEmpty()) null else sb.toString())
                          sb.setLength(0); quoted = false
                      } else sb.append(ch)
                      i++
                  }
                  out.add(if (!quoted && sb.isEmpty()) null else sb.toString())
                  return out
              }

              fun restore(ctx: Context, text: String): Int {
                  val db = Db.get(ctx).writableDatabase
                  var n = 0
                  var table: String? = null
                  var cols: List<String>? = null
                  db.beginTransaction()
                  try {
                      for (line in text.lines()) {
                          if (line.isBlank()) continue
                          if (line.startsWith("## ")) { table = line.substring(3).trim(); cols = null; continue }
                          val tb = table ?: continue
                          if (tb !in tables) continue
                          val cells = parseLine(line)
                          val cs = cols
                          if (cs == null) { cols = cells.map { it ?: "" }; continue }
                          val cv = ContentValues()
                          for (i in cs.indices) {
                              val v = cells.getOrNull(i)
                              if (v == null) cv.putNull(cs[i]) else cv.put(cs[i], v)
                          }
                          db.insertWithOnConflict(tb, null, cv, SQLiteDatabase.CONFLICT_REPLACE)
                          n++
                      }
                      db.setTransactionSuccessful()
                  } finally {
                      db.endTransaction()
                  }
                  return n
              }
          }

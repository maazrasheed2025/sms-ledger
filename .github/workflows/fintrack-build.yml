                  val extras = sbn.notification?.extras ?: return
                  val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                  val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  val big = extras.getCharSequence(Notification.EXTRA_BIG_TEXT)?.toString() ?: ""
                  val full = (title + " " + text + " " + big).trim(); if (full.length < 5) return
                  val amt = Regex("""(?:₹|rs\.?|inr)\s*([0-9][0-9,]*(?:\.[0-9]{1,2})?)""", RegexOption.IGNORE_CASE).find(full)?.groupValues?.get(1)?.replace(",", "")?.toDoubleOrNull() ?: return
                  if (amt <= 0) return
                  val l = full.lowercase(); val debit = "debited" in l || "paid" in l || "sent" in l || "spent" in l || "withdrawn" in l || "purchase" in l
                  val merchant = sbn.packageName.take(40)
                  val t = Txn(smsKey = "NOTIF|${sbn.packageName}|${full.hashCode()}", ts = sbn.postTime, amount = amt, debit = debit, merchant = merchant,
                      category = Categories.classify(merchant, full, debit), institution = sbn.packageName, channel = "APP", sender = sbn.packageName, body = full, source = "NOTIF", status = "NOTIF")
                  Repo.save(ctx, t)
              }
          }

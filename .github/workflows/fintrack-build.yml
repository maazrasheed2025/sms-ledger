          object Icons {
              private val CAT_MAP: Map<String, String> = mapOf("grocery" to "cat_groceries","groceries" to "cat_groceries","fuel" to "cat_fuel","food" to "cat_dining","dining" to "cat_dining","travel" to "cat_transport","transport" to "cat_transport","shopping" to "cat_shopping","bills & recharge" to "cat_bills","bills" to "cat_bills","recharge" to "cat_bills","entertainment" to "cat_leisure","leisure" to "cat_leisure","health" to "cat_health","cash" to "cat_cash","emi/loan" to "cat_emi","emi" to "cat_emi","loan" to "cat_emi","transfer" to "cat_cash_debit","received" to "cat_cash_credit","salary/income" to "cat_business","salary" to "cat_business","income" to "cat_business","investment" to "cat_investment","business" to "cat_business","education" to "cat_education","house" to "cat_house","household" to "cat_household","kids" to "cat_kids","grooming" to "cat_grooming","gadgets" to "cat_gadgets","credit card" to "cat_credit_card","other" to "cat_misc","misc" to "cat_misc")
              fun category(ctx: Context, displayName: String, fallback: Int = R.drawable.ic_bank): Int { val slug = CAT_MAP[displayName.trim().lowercase()] ?: return fallback; return lookup(ctx, slug, fallback) }
              private val BANK_PATTERNS: List<Pair<Regex, String>> = listOf(Regex("(?i)\\bhdfc\\b") to "bank_hdfc", Regex("(?i)\\bsbi\\b") to "bank_sbi", Regex("(?i)\\bicici\\b") to "bank_icici", Regex("(?i)\\baxis\\b") to "bank_axis", Regex("(?i)\\bkotak\\b") to "bank_kotak", Regex("(?i)\\bidfc\\b") to "bank_idfc", Regex("(?i)\\bpnb\\b") to "bank_pnb", Regex("(?i)\\bcanara\\b") to "bank_canara", Regex("(?i)\\bpaytm\\b") to "biller_paytm", Regex("(?i)\\bairtel\\b") to "biller_airtel", Regex("(?i)\\bjio\\b") to "biller_jio", Regex("(?i)\\bphonepe\\b") to "wallet_phonepe")
              private val POLICY_PATTERNS: List<Pair<Regex, String>> = listOf(Regex("(?i)\\blic\\b") to "policy_lic", Regex("(?i)\\bicici\\s*pru") to "policy_icici", Regex("(?i)\\bhdfc\\s*life") to "policy_hdfc_life", Regex("(?i)\\bsbi\\s*life") to "policy_sbi_life", Regex("(?i)\\bmax\\s*life") to "policy_max_life", Regex("(?i)\\bbajaj\\s*allianz") to "policy_bajaj", Regex("(?i)\\btata\\s*aia") to "policy_tata_aia", Regex("(?i)\\breliance\\s*(nippon|general|life)") to "policy_reliance")
              private val LOAN_PATTERNS: List<Pair<Regex, String>> = listOf(Regex("(?i)\\bbajaj\\s*(finserv|finance)") to "loan_bajaj", Regex("(?i)\\btata\\s*capital") to "loan_tata", Regex("(?i)\\bhdb\\s*financial") to "loan_hdb", Regex("(?i)\\bfullerton") to "loan_fullerton", Regex("(?i)\\bidfc\\b") to "loan_idfc", Regex("(?i)\\bpaysense") to "loan_paysense", Regex("(?i)\\bkreditbee") to "loan_kreditbee")
              fun bank(ctx: Context, institution: String, fallback: Int = R.drawable.ic_bank): Int { if (institution.isBlank()) return fallback; for ((re, slug) in BANK_PATTERNS) if (re.containsMatchIn(institution)) { val id = lookup(ctx, slug, 0); if (id != 0) return id }; return fallback }
              fun wallet(ctx: Context, name: String, fallback: Int = R.drawable.ic_transfer): Int = bank(ctx, name, fallback)
              fun policy(ctx: Context, name: String, fallback: Int = R.drawable.ic_bank): Int { if (name.isBlank()) return fallback; for ((re, slug) in POLICY_PATTERNS) if (re.containsMatchIn(name)) { val id = lookup(ctx, slug, 0); if (id != 0) return id }; return fallback }
              fun loan(ctx: Context, name: String, fallback: Int = R.drawable.ic_loan): Int { if (name.isBlank()) return fallback; for ((re, slug) in LOAN_PATTERNS) if (re.containsMatchIn(name)) { val id = lookup(ctx, slug, 0); if (id != 0) return id }; return fallback }
              fun forAccount(ctx: Context, kind: String, institution: String): Int = when (kind) { "WALLET" -> wallet(ctx, institution); "LOAN" -> loan(ctx, institution); "POLICY" -> policy(ctx, institution); "FASTAG" -> R.drawable.ic_fastag; "CARD" -> bank(ctx, institution); else -> bank(ctx, institution) }
              private fun lookup(ctx: Context, slug: String, fallback: Int): Int { val id = try { ctx.resources.getIdentifier(slug, "drawable", ctx.packageName) } catch (e: Resources.NotFoundException) { 0 }; return if (id != 0) id else fallback }
          }

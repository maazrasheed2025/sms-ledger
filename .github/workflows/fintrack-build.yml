          import androidx.appcompat.app.AppCompatActivity
          import androidx.biometric.BiometricManager
          import androidx.biometric.BiometricPrompt
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private lateinit var content: FrameLayout
              private lateinit var lockView: LinearLayout
              private lateinit var lockMsg: TextView
              private lateinit var nav: LinearLayout
              private val screens = ArrayList<Screen>()
              private var cur = 0
              private var unlocked = false
              private var authBusy = false
              private var stopAt = 0L

              lateinit var home: HomeScreen
              lateinit var ledger: LedgerScreen

              private val openDoc = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) doRestore(uri)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  // keep financial data out of screenshots / recents
                  window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)

                  home = HomeScreen(this)
                  ledger = LedgerScreen(this)
                  screens.addAll(listOf(home, ledger, TravelScreen(this), PayeesScreen(this), MoneyScreen(this)))

                  content = FrameLayout(this)
                  nav = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setBackgroundColor(C.CARD) }
                  val icons = intArrayOf(R.drawable.ic_bank, R.drawable.ic_transfer, R.drawable.ic_fastag, R.drawable.ic_contacts, R.drawable.ic_networth)
                  val names = listOf("Home", "Ledger", "Travel", "Payees", "Money")
                  for (i in names.indices) {
                      val item = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          gravity = Gravity.CENTER
                          setPadding(0, dp(8), 0, dp(8))
                          tag = i
                          addView(icon(icons[i], C.MUTED, 22))
                          addView(tv(names[i], 11f, C.MUTED).apply { gravity = Gravity.CENTER })
                          setOnClickListener { show(i) }
                      }
                      nav.addView(item, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  }
                  val main = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(C.BG)
                      addView(content, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                      addView(nav)
                  }

                  lockMsg = tv("Locked", 14f, C.MUTED).apply { gravity = Gravity.CENTER }
                  lockView = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setBackgroundColor(C.BG)
                      setPadding(dp(30), dp(30), dp(30), dp(30))
                      addView(icon(R.drawable.ic_networth, C.ACCENT, 56))
                      addView(tv("FinTrack", 26f, C.TEXT, true).apply { setPadding(0, dp(12), 0, dp(4)) })
                      addView(lockMsg)
                      addView(actionBtn("Unlock") { authenticate() }, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { topMargin = dp(20) })
                  }

                  setContentView(FrameLayout(this).apply {
                      addView(main)
                      addView(lockView)
                  })
                  show(0)
                  lock()
                  authenticate()
              }

              override fun onStop() {
                  super.onStop()
                  stopAt = System.currentTimeMillis()
              }

              override fun onStart() {
                  super.onStart()
                  if (unlocked && stopAt > 0 && System.currentTimeMillis() - stopAt > 60_000) {
                      lock()
                      authenticate()
                  }
              }

              private fun lock() {
                  unlocked = false
                  lockView.visibility = View.VISIBLE
              }

              private fun unlock() {
                  unlocked = true
                  lockView.visibility = View.GONE
                  refreshAll()
                  askPermissionsAndScan()
              }

              private fun authenticate() {
                  if (authBusy) return
                  val auth = BiometricManager.Authenticators.BIOMETRIC_STRONG or BiometricManager.Authenticators.DEVICE_CREDENTIAL
                  if (BiometricManager.from(this).canAuthenticate(auth) != BiometricManager.BIOMETRIC_SUCCESS) {
                      toast("Phone me fingerprint / screen lock set nahi hai - security ke liye set karo")
                      unlock()
                      return
                  }
                  authBusy = true
                  val prompt = BiometricPrompt(this, ContextCompat.getMainExecutor(this), object : BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) { authBusy = false; unlock() }
                      override fun onAuthenticationError(errorCode: Int, errString: CharSequence) { authBusy = false; lockMsg.text = "Locked: $errString" }
                  })
                  prompt.authenticate(
                      BiometricPrompt.PromptInfo.Builder()
                          .setTitle("FinTrack unlock")
                          .setSubtitle("Fingerprint / Face / PIN")
                          .setAllowedAuthenticators(auth)
                          .build()
                  )
              }

              // ---------------- navigation ----------------
              fun show(i: Int) {
                  cur = i
                  content.removeAllViews()
                  content.addView(screens[i].root)
                  for (k in 0 until nav.childCount) {
                      val item = nav.getChildAt(k) as LinearLayout
                      val col = if (k == i) C.ACCENT else C.MUTED
                      (item.getChildAt(0) as android.widget.ImageView).setColorFilter(col)
                      (item.getChildAt(1) as TextView).setTextColor(col)
                  }
                  if (unlocked) screens[i].refresh()
              }

              fun openLedger(filter: String) {
                  ledger.setFilter(filter)
                  show(1)
              }

              fun refreshAll() {
                  if (unlocked) screens[cur].refresh()
              }

              fun toast(m: String) = Toast.makeText(this, m, Toast.LENGTH_LONG).show()

              // ---------------- SMS import ----------------
              private fun hasSms() =
                  ContextCompat.checkSelfPermission(this, Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED

              private fun askPermissionsAndScan() {
                  if (hasSms()) { rescan(); return }
                  ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.READ_SMS, Manifest.permission.RECEIVE_SMS), 1)
              }

              override fun onRequestPermissionsResult(code: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(code, p, r)
                  if (hasSms()) rescan()
                  else toast("SMS permission zaroori hai. Settings -> Apps -> FinTrack -> Permissions (Android 13+: pehle app info me ⋮ -> Allow restricted settings)")
              }

              fun rescan() {
                  if (!hasSms()) { askPermissionsAndScan(); return }
                  toast("SMS scan ho raha hai...")
                  Thread {
                      var n = 0
                      var err: String? = null
                      try { n = SmsImport.run(applicationContext) } catch (e: Exception) { err = e.message }
                      runOnUiThread {
                          toast(if (err != null) "Scan error: $err" else "$n naye transactions mile")
                          refreshAll()
                      }
                  }.start()
              }

              // ---------------- backup / restore ----------------
              fun backup() {
                  try {
                      val name = "fintrack_backup_" + SimpleDateFormat("yyyyMMdd_HHmm", Locale.US).format(Date()) + ".csv"
                      val values = ContentValues().apply {
                          put(MediaStore.Downloads.DISPLAY_NAME, name)
                          put(MediaStore.Downloads.MIME_TYPE, "text/csv")
                          put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                      }
                      val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      if (uri == null) { toast("Backup fail ho gaya"); return }
                      contentResolver.openOutputStream(uri)?.use { it.write(Backup.export(this).toByteArray()) }
                      toast("Downloads me save: $name (Excel me khul jayegi)")
                  } catch (e: Exception) {
                      toast("Backup error: ${e.message}")
                  }
              }

              fun pickRestore() {
                  openDoc.launch(arrayOf("text/*", "application/csv", "application/vnd.ms-excel", "*/*"))
              }

              private fun doRestore(uri: Uri) {
                  Thread {
                      var msg: String
                      try {
                          val text = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""
                          msg = "${Backup.restore(applicationContext, text)} rows restore hue"
                      } catch (e: Exception) {
                          msg = "Restore error: ${e.message}"
                      }
                      runOnUiThread { toast(msg); refreshAll() }
                  }.start()
              }
          }

              private val adapter = RowAdapter<Map<String, String?>>(act, emptyList()) { p, r -> val id = p["id"] ?: ""; val shown = if (tab == 1) id.substringBefore("@") else id; r.icon.setImageResource(R.drawable.ic_contacts); r.icon.setColorFilter(C.ACCENT); r.title.text = shown; val cnt = p["n"]?.toIntOrNull() ?: 0; val inA = p["in"]?.toDoubleOrNull() ?: 0.0; val outA = p["out"]?.toDoubleOrNull() ?: 0.0; r.sub.text = "$cnt ${Str.s("contacts_txns")} • ${Str.s("contacts_in")} ${inr(inA)} • ${Str.s("contacts_out")} ${inr(outA)}"; r.amt.text = "" }
              private lateinit var list: ListView
              init { list = ListView(act).apply { divider = null; adapter = this@ContactsScreen.adapter; setBackgroundColor(C.BG); setOnItemClickListener { _, _, pos, _ -> val p = this@ContactsScreen.adapter.items.getOrNull(pos) ?: return@setOnItemClickListener; this@ContactsScreen.showContact(p["id"] ?: return@setOnItemClickListener) } } }
              override val root: View = act.vbox().apply { setBackgroundColor(C.BG); put(search, 8); put(HorizontalScrollView(act).apply { isHorizontalScrollBarEnabled = false; addView(chips) }, 2); put(summary, 0); put(list, 0, 1f) }
              override fun refresh() {
                  try {
                      chips.removeAllViews()

          package com.example.fintrack

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.provider.Telephony

          class SmsReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action != Telephony.Sms.Intents.SMS_RECEIVED_ACTION) return
                  val msgs = Telephony.Sms.Intents.getMessagesFromIntent(intent) ?: return
                  if (msgs.isEmpty()) return
                  val sender = msgs[0].originatingAddress ?: return
                  val body = msgs.joinToString("") { it.messageBody ?: "" }
                  val ts = msgs[0].timestampMillis
                  val app = context.applicationContext
                  val pending = goAsync()
                  Thread { try { val t = SmsEngine.build(app, Db.get(app), sender, body, ts); if (t != null) Repo.save(app, t) } catch (e: Exception) {} finally { pending.finish() } }.start()
              }
          }

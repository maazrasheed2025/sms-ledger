                  if (body.isBlank()) return
                  val col = if (debit) "d" else "c"
                  for (wd in words(body)) db.exec("INSERT INTO nb_words(word, $col) VALUES(?, ?) ON CONFLICT(word) DO UPDATE SET $col = $col + excluded.$col", wd, w)
              }

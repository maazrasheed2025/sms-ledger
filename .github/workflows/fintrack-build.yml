                      historyContainer.addView(line)
                  }
                  col.addView(ScrollView(act).apply { addView(historyContainer) }, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, act.dp(340)))
                  val dlg = AlertDialog.Builder(act).setTitle(name).setView(ScrollView(act).apply { addView(col) })
                      .setPositiveButton(Str.s("pay_upi")) { _, _ -> pay(key, name, p["upi_id"]) }
                      .setNegativeButton(Str.s("close"), null)
                      .setNeutralButton("${Str.s("delete")} (${selectedIds.size})", null)
                      .create()
                  dlg.setOnShowListener {
                      dlg.getButton(AlertDialog.BUTTON_NEUTRAL).setOnClickListener {
                          if (selectedIds.isEmpty()) { act.toast("Select transactions first"); return@setOnClickListener }
                          PayeeOps.bulkDelete(act, selectedIds.toList()); PayeeOps.cleanupOrphanPayees(act); act.toast("${selectedIds.size} deleted"); act.refreshAll(); dlg.dismiss()
                      }
                  }
                  dlg.show()
              }
              private fun addAliasDialog(payeeKey: String, payeeName: String) {
                  act.showForm(Str.s("add_id"), listOf(Field(Str.s("add_id_hint"), "")), Str.s("add_btn")) { v ->
                      val alias = v[0].trim()
                      if (alias.isBlank()) return@showForm
                      Thread {
                          val moved = PayeeOps.addAlias(act, payeeKey, alias)
                          act.runOnUiThread { act.toast("${Str.s("merge_done")} · $moved txns"); refresh(); act.refreshAll() }
                      }.start()
                  }
              }
              private fun pay(key: String, name: String, upi: String?) {
                  if (upi.isNullOrBlank() || !upi.contains("@")) { act.toast(Str.s("upi_id_missing")); return }
                  act.showForm("Pay: $name", listOf(Field("Amount (optional)", "", true), Field("Note (optional)", "")), "Pay") { v ->
                      var url = "upi://pay?pa=" + Uri.encode(upi) + "&pn=" + Uri.encode(name) + "&cu=INR"
                      val amt = v[0].toDoubleOrNull(); if (amt != null && amt > 0) url += "&am=" + String.format(Locale.US, "%.2f", amt)
                      if (v[1].isNotBlank()) url += "&tn=" + Uri.encode(v[1])
                      try { act.startActivity(Intent.createChooser(Intent(Intent.ACTION_VIEW, Uri.parse(url)), "Pay with")) } catch (e: Exception) { act.toast("No UPI app found") }
                  }
              }
          }

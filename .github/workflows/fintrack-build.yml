          package com.example.fintrack
          object SenderMap {
              private fun b(n: String) = n to "BANK"
              private fun w(n: String) = n to "WALLET"
              private fun l(n: String) = n to "LOAN"
              private fun p(n: String) = n to "POLICY"
              private val known: Map<String, Pair<String, String>> = mapOf("HDFCBK" to b("HDFC Bank"),"SBIINB" to b("State Bank of India"),"ICICIB" to b("ICICI Bank"),"AXISBK" to b("Axis Bank"),"KOTAKB" to b("Kotak Mahindra Bank"),"IDFCFB" to b("IDFC FIRST Bank"),"PNBSMS" to b("Punjab National Bank"),"CANBNK" to b("Canara Bank"),"UNIONB" to b("Union Bank of India"),"PAYTMB" to w("Paytm"),"AIRBNK" to w("Airtel"),"AIRTEL" to w("Airtel"),"JIOPAY" to w("Jio Payments Bank"),"PHONPE" to w("PhonePe"),"AMAZON" to w("Amazon Pay"),"GPAY" to w("Google Pay"),"MBKWIK" to w("Mobikwik"),"BAJAJF" to l("Bajaj Finance"),"LICIND" to p("LIC"),"LICI" to p("LIC"),"ICICIP" to p("ICICI Prudential"),"HDFCLF" to p("HDFC Life"),"SBILIF" to p("SBI Life"),"FASTAG" to ("FASTag" to "FASTAG"),"NETCFT" to ("FASTag" to "FASTAG"))
              fun core(header: String): String { var p = header.uppercase().trim().split("-").filter { it.isNotEmpty() }; if (p.size >= 2 && p[0].length == 2) p = p.drop(1); if (p.size >= 2 && p.last().length == 1) p = p.dropLast(1); return p.joinToString("-") }
              fun identify(db: Db, header: String): Pair<String, String> { try { val c = core(header); known[c]?.let { return it }; for ((k, v) in known) if (c.contains(k)) return v; return ("Unknown ($c)") to "UNKNOWN" } catch (_: Exception) { return ("Unknown") to "UNKNOWN" } }
          }

          cat > app/src/main/java/com/example/fintrack/Subs.kt <<'EOF_12'
          package com.example.fintrack

          import android.content.Context

          object Subs {
              fun detect(ctx: Context, t: Txn) {
                  if (!t.debit) return
                  val key = Learner.norm(t.merchant)
                  if (key.isBlank() || key == "unknown") return
                  val db = Db.get(ctx)
                  val rows = db.rows(
                      "SELECT amount, ts FROM txn WHERE merchant_key=? AND debit=1 ORDER BY ts DESC LIMIT 6",
                      key
                  )
                  if (rows.size < 3) return
                  val amounts = rows.mapNotNull { it["amount"]?.toDoubleOrNull() }
                  if (amounts.size < 3) return
                  val avg = amounts.average()
                  val spread = (amounts.maxOrNull()!! - amounts.minOrNull()!!) / avg
                  if (spread > 0.15) return
                  val timestamps = rows.mapNotNull { it["ts"]?.toLongOrNull() }.sortedDescending()
                  val gaps = timestamps.zipWithNext { a, b -> (a - b) / 86_400_000L }
                  if (gaps.isEmpty()) return
                  val avgGap = gaps.average()
                  if (avgGap in 25.0..35.0) {
                      db.exec(
                          "INSERT OR REPLACE INTO subs_detected(merchant_key, avg_amt, last_ts, count) VALUES(?,?,?,?)",
                          key, avg, timestamps.first(), amounts.size
                      )
                  }
              }
          }

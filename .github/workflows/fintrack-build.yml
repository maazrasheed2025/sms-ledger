          package com.example.fintrack

          import java.util.Calendar

          object LoanCalc {
              fun emi(p: Double, annualRate: Double, n: Int): Double {
                  if (n <= 0) return 0.0
                  val r = annualRate / 1200.0
                  if (r == 0.0) return p / n
                  val g = Math.pow(1 + r, n.toDouble())
                  return p * r * g / (g - 1)
              }

              fun paidMonths(startTs: Long, tenure: Int): Int {
                  val s = Calendar.getInstance().apply { timeInMillis = startTs }
                  val n = Calendar.getInstance()
                  var m = (n.get(Calendar.YEAR) - s.get(Calendar.YEAR)) * 12 + n.get(Calendar.MONTH) - s.get(Calendar.MONTH)
                  if (n.get(Calendar.DAY_OF_MONTH) < s.get(Calendar.DAY_OF_MONTH)) m--
                  return m.coerceIn(0, tenure)
              }

              fun outstanding(p: Double, annualRate: Double, emi: Double, paid: Int): Double {
                  val r = annualRate / 1200.0
                  val v = if (r == 0.0) p - emi * paid
                  else p * Math.pow(1 + r, paid.toDouble()) - emi * (Math.pow(1 + r, paid.toDouble()) - 1) / r
                  return if (v < 0) 0.0 else v
              }

              fun outstandingOf(l: Map<String, String?>): Double {
                  val p = l["principal"]?.toDoubleOrNull() ?: 0.0
                  val rate = l["rate"]?.toDoubleOrNull() ?: 0.0
                  val tenure = l["tenure"]?.toIntOrNull() ?: 0
                  var e = l["emi"]?.toDoubleOrNull() ?: 0.0
                  if (e <= 0) e = emi(p, rate, tenure)
                  val paid = paidMonths(l["start_ts"]?.toLongOrNull() ?: System.currentTimeMillis(), tenure)
                  return outstanding(p, rate, e, paid)
              }
          }

          package com.example.fintrack

          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          class HomeScreen(act: MainActivity) : Screen(act) {
              private val body = act.vbox(12)
              private var year = Calendar.getInstance().get(Calendar.YEAR)
              private var month = Calendar.getInstance().get(Calendar.MONTH)
              override val root: View = ScrollView(act).apply { addView(body) }
              override fun refresh() {
                  body.removeAllViews()
                  val db = Db.get(act)
                  val cal = Calendar.getInstance().apply { set(Calendar.YEAR, year); set(Calendar.MONTH, month); set(Calendar.DAY_OF_MONTH, 1); set(Calendar.HOUR_OF_DAY, 0); set(Calendar.MINUTE, 0); set(Calendar.SECOND, 0); set(Calendar.MILLISECOND, 0) }
                  val start = cal.timeInMillis
                  val daysInMonth = cal.getActualMaximum(Calendar.DAY_OF_MONTH)
                  cal.add(Calendar.MONTH, 1); val end = cal.timeInMillis
                  val label = SimpleDateFormat("MMMM yyyy", Locale.getDefault()).format(Date(start))
                  val spent = db.num("SELECT SUM(amount) FROM txn WHERE debit=1 AND ts>=? AND ts<?", start.toString(), end.toString())
                  val recv = db.num("SELECT SUM(amount) FROM txn WHERE debit=0 AND ts>=? AND ts<?", start.toString(), end.toString())
                  val exp = act.card()
                  val monthRow = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL }
                  monthRow.addView(act.tv("◀", 16f, C.TEXT).apply { setPadding(act.dp(8), act.dp(4), act.dp(8), act.dp(4)); setOnClickListener { month--; if (month < 0) { month = 11; year-- }; refresh() } })
                  monthRow.addView(act.tv(label, 13f, C.MUTED).apply { gravity = Gravity.CENTER; setOnClickListener { pickMonthYear() } }, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  monthRow.addView(act.tv("▶", 16f, C.TEXT).apply { setPadding(act.dp(8), act.dp(4), act.dp(8), act.dp(4)); setOnClickListener { month++; if (month > 11) { month = 0; year++ }; refresh() } })
                  exp.addView(monthRow)
                  exp.addView(act.tv(Str.s("expenses"), 12f, C.MUTED))
                  exp.addView(act.tv(inr(spent), 30f, C.RED, true))
                  exp.addView(act.tv("${Str.s("income")} ${inr(recv)}", 13f, C.GREEN))
                  val now = System.currentTimeMillis()
                  val elapsed = (((now - start).toFloat() / 86_400_000f).coerceIn(1f, daysInMonth.toFloat()))
                  val projected = (spent / elapsed) * daysInMonth
                  val avgText = if (projected > 0) "${Str.s("projected")}: ${inr(projected)}  •  ${((spent / projected) * 100).toInt()}% ${Str.s("used")}" else Str.s("no_spend")
                  exp.addView(act.tv(avgText, 12f, C.MUTED))
                  val btnRow = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL }
                  btnRow.addView(act.actionBtn(Str.s("view_charts")) { act.show(act.chartsIndex()) }, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  exp.put(btnRow, 10)
                  body.put(exp)
                  val latest = db.queryTxns("1=1", emptyArray(), 5)
                  val lt = act.card()
                  lt.addView(act.tv(Str.s("latest_txns"), 15f, C.TEXT, true))
                  if (latest.isEmpty()) lt.addView(act.tv(Str.s("no_txns"), 12f, C.MUTED))
                  else for (t in latest) {
                      val r = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(0, act.dp(8), 0, act.dp(8)); setOnClickListener { act.show(act.ledgerIndex()) } }
                      r.addView(act.icon(Icons.category(act, t.category, R.drawable.ic_bank), C.ACCENT, 24))
                      val mid = act.vbox(2); mid.addView(act.tv(t.merchant, 13f, C.TEXT, true)); mid.addView(act.tv(fmtDate(t.ts) + " • " + t.institution + " •#" + t.msgNo, 11f, C.MUTED))
                      r.addView(mid, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { leftMargin = act.dp(10) })
                      r.addView(act.tv((if (t.debit) "-" else "+") + inr(t.amount, true), 13f, if (t.debit) C.RED else C.GREEN, true))
                      lt.put(r, 2)
                  }
                  lt.put(act.actionBtn(Str.s("view_txns")) { act.show(act.ledgerIndex()) }, 10)
                  body.put(lt)
                  val half = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL }
                  val atmTotal = db.num("SELECT SUM(amount) FROM txn WHERE debit=1 AND (channel='ATM' OR category='Cash') AND ts>=? AND ts<?", start.toString(), end.toString())
                  val cashCard = act.card()
                  cashCard.addView(act.icon(R.drawable.ic_grocery, C.AMBER, 22))
                  cashCard.addView(act.tv(Str.s("cash_atm"), 11f, C.MUTED))
                  cashCard.addView(act.tv(inr(atmTotal), 16f, C.AMBER, true))
                  cashCard.setOnClickListener { act.openLedger(LedgerScreen.Filter(mode = "cat", category = "Cash", year = year, month = month)) }
                  half.addView(cashCard, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { rightMargin = act.dp(6) })
                  val nw = NetWorth.compute(act)
                  val accCard = act.card()
                  accCard.addView(act.icon(R.drawable.ic_bank, C.ACCENT, 22))
                  accCard.addView(act.tv(Str.s("net_worth"), 11f, C.MUTED))
                  val netWorthVal = nw.assets - nw.liabilities
                  accCard.addView(act.tv(inr(netWorthVal), 15f, if (netWorthVal >= 0) C.GREEN else C.RED, true))
                  accCard.addView(act.tv("${nw.bank.size + nw.wallets.size} accounts", 10f, C.MUTED))
                  accCard.setOnClickListener { act.show(act.accountsIndex()) }
                  half.addView(accCard, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { leftMargin = act.dp(6) })
                  body.put(half)
                  val review = db.num("SELECT COUNT(*) FROM txn WHERE review=1").toInt()
                  if (review > 0) {
                      val rc = act.card()
                      rc.addView(act.tv("⚠ $review ${Str.s("review_needed")}", 14f, C.AMBER, true))
                      rc.addView(act.tv(Str.s("tap_fix"), 12f, C.MUTED))
                      rc.setOnClickListener { act.openLedger(LedgerScreen.Filter(mode = "review")) }
                      body.put(rc)
                  }
                  val billsThisMonth = db.num("SELECT COUNT(*) FROM txn WHERE debit=1 AND category='Bills & Recharge' AND ts>=? AND ts<?", start.toString(), end.toString()).toInt()
                  val billCard = act.card()
                  billCard.addView(act.tv(Str.s("bills_subs"), 15f, C.TEXT, true))
                  billCard.addView(act.tv(if (billsThisMonth == 0) Str.s("no_bills") else "$billsThisMonth ${Str.s("paid_this_month")}", 12f, C.MUTED))
                  billCard.put(act.actionBtn(Str.s("view_bills")) { act.openLedger(LedgerScreen.Filter(mode = "cat", category = "Bills & Recharge", year = year, month = month)) }, 10)
                  body.put(billCard)
                  val nwCard = act.card()
                  nwCard.addView(act.tv(Str.s("net_worth"), 12f, C.MUTED))
                  nwCard.addView(act.tv(inr(netWorthVal), 24f, if (netWorthVal >= 0) C.GREEN else C.RED, true))
                  nwCard.setOnClickListener { act.show(act.accountsIndex()) }
                  body.put(nwCard)
              }
              private fun pickMonthYear() {
                  val years = (Calendar.getInstance().get(Calendar.YEAR) - 5..Calendar.getInstance().get(Calendar.YEAR) + 1).toList()
                  android.app.AlertDialog.Builder(act).setTitle(Str.s("year")).setItems(years.map { it.toString() }.toTypedArray()) { _, yi ->
                      val y = years[yi]; val months = listOf("Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec")
                      android.app.AlertDialog.Builder(act).setTitle(Str.s("month") + " ($y)").setItems(months.toTypedArray()) { _, mi -> year = y; month = mi; refresh() }.show()
                  }.show()
              }
          }

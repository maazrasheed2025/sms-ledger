          import java.util.Calendar

          abstract class Screen(val act: MainActivity) { abstract val root: View; abstract fun refresh() }

          class LedgerScreen(act: MainActivity) : Screen(act) {
              data class Filter(val mode: String = "all", val category: String? = null, val year: Int? = null, val month: Int? = null)
              private var filter = Filter(); private var query = ""; private var selectMode = false
              private val selected = LinkedHashSet<Long>(); private val collapsed = HashSet<Int>()
              private val summary = act.tv("", 12f, C.MUTED).apply { setPadding(act.dp(14), act.dp(4), act.dp(14), act.dp(4)) }
              private val chips = LinearLayout(act).apply { orientation = LinearLayout.HORIZONTAL; setPadding(act.dp(8), 0, act.dp(8), 0) }
              sealed class Row { data class T(val t: Txn) : Row(); data class Y(val y: Int, val n: Int, val net: Double, val c: Boolean) : Row() }
              private val adapter = RowAdapter<Row>(act, emptyList()) { item, r ->
                  when (item) {
                      is Row.Y -> { r.icon.setImageResource(R.drawable.ic_bank); r.icon.setColorFilter(C.ACCENT); r.title.text = "${if (item.c) "▶" else "▼"} ${item.y} · ${item.n}"; val (l, c) = inrSigned(item.net); r.sub.text = l; r.sub.setTextColor(c); r.amt.text = "" }
                      is Row.T -> { val t = item.t; r.icon.setImageResource(Icons.category(act, t.category, R.drawable.ic_bank)); r.icon.clearColorFilter(); r.title.text = (if (selectMode && selected.contains(t.id)) "☑ " else "") + t.merchant; r.sub.text = fmtDate(t.ts) + " • " + t.institution; r.amt.text = (if (t.debit) "-" else "+") + inr(t.amount, true); r.amt.setTextColor(if (t.debit) C.RED else C.GREEN) }
                  }
              }
              private lateinit var list: ListView
              init {
                  list = ListView(act).apply {
                      divider = null; adapter = this@LedgerScreen.adapter
                      setOnItemClickListener { _, _, pos, _ ->
                          when (val i = this@LedgerScreen.adapter.items.getOrNull(pos)) {
                              is Row.T -> if (selectMode) { if (!selected.add(i.t.id)) selected.remove(i.t.id); this@LedgerScreen.adapter.notifyDataSetChanged() } else showTxn(i.t)
                              is Row.Y -> { if (!collapsed.add(i.y)) collapsed.remove(i.y); refresh() }
                              null -> {}
                          }
                      }
                  }
              }
              override val root: View = act.vbox().apply {
                  val s = EditText(act).apply { hint = Str.s("search_hint"); setHintTextColor(C.MUTED); setTextColor(C.TEXT); setSingleLine(); setPadding(act.dp(14), act.dp(10), act.dp(14), act.dp(10)); background = act.shape(C.CARD, 12)
                      addTextChangedListener(object : android.text.TextWatcher { override fun beforeTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {} override fun onTextChanged(s: CharSequence?, a: Int, b: Int, c: Int) {} override fun afterTextChanged(s: android.text.Editable?) { query = s?.toString()?.trim() ?: ""; refresh() } })
                  }
                  put(s, 8); put(HorizontalScrollView(act).apply { isHorizontalScrollBarEnabled = false; addView(chips) }, 4); put(summary, 0); put(list, 0, 1f)
              }

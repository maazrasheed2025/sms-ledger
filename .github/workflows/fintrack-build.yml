              override fun refresh() {
                  chips.removeAllViews()
                  for ((k, l) in listOf("all" to Str.s("all"), "debit" to Str.s("debit"), "credit" to Str.s("credit"))) chips.addView(act.pill(l, filter.mode == k) { filter = Filter(mode = k); refresh() })
                  if (filter.mode == "cat" && filter.category != null) chips.addView(act.pill("${filter.category} ✕", true) { filter = Filter(); refresh() })
                  chips.addView(act.pill(Str.s("scan_duplicates"), false) { showDups() })
                  if (selectMode) {
                      chips.addView(act.pill("${Str.s("delete")} (${selected.size})", true) { act.bulkDelete(selected.toList()); selectMode = false; selected.clear(); refresh() })
                      chips.addView(act.pill("${Str.s("categorize")} (${selected.size})", true) { act.bulkCategory(selected.toList()); selectMode = false; selected.clear(); refresh() })
                      chips.addView(act.pill(Str.s("cancel"), false) { selectMode = false; selected.clear(); refresh() })
                  }
                  Thread {
                      val all = rows()
                      val i = all.filter { !it.debit }.sumOf { it.amount }; val o = all.filter { it.debit }.sumOf { it.amount }
                      val years = all.groupBy { Calendar.getInstance().apply { timeInMillis = it.ts }.get(Calendar.YEAR) }.toSortedMap(compareByDescending { it })

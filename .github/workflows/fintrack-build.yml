                      val name = "imrans_finances_${SimpleDateFormat("yyyyMMdd_HHmm", Locale.US).format(Date())}.csv"
                      try {
                          val dir = java.io.File(getExternalFilesDir(null), "exports"); dir.mkdirs()
                          val f = java.io.File(dir, name); f.writeText(csv)
                          val uri = androidx.core.content.FileProvider.getUriForFile(this, "$packageName.fileprovider", f)
                          val sh = Intent(Intent.ACTION_SEND).apply { type = "text/csv"; putExtra(Intent.EXTRA_STREAM, uri); addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION) }
                          runOnUiThread { startActivity(Intent.createChooser(sh, "Save backup")) }
                      } catch (ex: Exception) { runOnUiThread { toast("Backup error: ${ex.message}") } }
                  }.start()
              }
              fun pickRestore() { openDoc.launch(arrayOf("text/*", "application/csv", "*/*")) }
              private fun afterRestore(t: String) {
                  val n = Backup.restore(applicationContext, t)
                  val m = Db.get(applicationContext).one("SELECT MAX(ts) FROM txn")?.toLongOrNull() ?: 0L
                  if (m > 0) getSharedPreferences("fin", MODE_PRIVATE).edit().putLong("last_sms_date", m).apply()
                  runOnUiThread { toast("$n restored"); refreshAll() }
              }
              private fun doRestore(uri: Uri) { Thread { try { val t = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""; afterRestore(t) } catch (e: Exception) { runOnUiThread { toast("Restore error") } } }.start() }
              fun cleanAndRestore() {
                  AlertDialog.Builder(this).setTitle("Clean database").setMessage("Delete all transactions and rules?")
                      .setPositiveButton("Clean + Restore") { _, _ -> openBackupRestore.launch(arrayOf("text/*", "application/csv", "*/*")) }
                      .setNeutralButton("Clean only") { _, _ -> Thread { Backup.cleanAll(applicationContext); runOnUiThread { toast("Cleared"); refreshAll() } }.start() }
                      .setNegativeButton(Str.s("cancel"), null).show()
              }
              private fun doCleanRestore(uri: Uri) { Thread { try { val t = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""; Backup.cleanAll(applicationContext); afterRestore(t) } catch (e: Exception) { runOnUiThread { toast("Error") } } }.start() }
              private fun doFirstRestore(uri: Uri) { Thread { try { val t = contentResolver.openInputStream(uri)?.bufferedReader()?.use { it.readText() } ?: ""; afterRestore(t); runOnUiThread { show(0) } } catch (e: Exception) { runOnUiThread { toast("Error") } } }.start() }
              private fun firstRun() {
                  AlertDialog.Builder(this).setTitle(Str.s("welcome")).setMessage(Str.s("first_run_msg"))
                      .setPositiveButton(Str.s("scan_sms")) { _, _ -> scanIfAllowed() }
                      .setNeutralButton(Str.s("restore_backup")) { _, _ -> openFirstRunRestore.launch(arrayOf("text/*", "application/csv", "*/*")) }
                      .setNegativeButton(Str.s("later"), null).setCancelable(false).show()
              }
              fun pickTollJson() { openTollJson.launch(arrayOf("application/json", "*/*")) }
              private fun doImportTolls(uri: Uri) { Thread { val c = Importer.importTollJson(applicationContext, uri); Tolls.load(this); val r = Tolls.rematchAll(this); runOnUiThread { toast("$c plazas • $r tolls"); refreshAll() } }.start() }
              fun pickCsvStatement() { openCsvStmt.launch(arrayOf("text/*", "application/csv", "*/*")) }
              private fun showCsv(uri: Uri) {
                  Thread {
                      val pr = CsvImporter.preview(applicationContext, uri)
                      runOnUiThread {
                          if (pr.header.isEmpty()) { toast("CSV empty"); return@runOnUiThread }
                          val map = CsvMap.guess(pr.header)
                          val labels = listOf("Bank","Account_No","Txn_Date","Description","Ref_No","Withdrawal","Deposit").map { f -> val i = map[f]; f + (if (i != null) " → " + pr.header.getOrNull(i) else " → skip") }
                          AlertDialog.Builder(this).setTitle("CSV columns").setMessage(labels.joinToString("\n") + "\n\nImport?")
                              .setPositiveButton("Import") { _, _ -> Thread { val r = CsvImporter.import(applicationContext, uri, map, 0); runOnUiThread { toast("Imp ${r.first} • Dup ${r.second} • Fail ${r.third}"); refreshAll() } }.start() }
                              .setNegativeButton(Str.s("cancel"), null).show()
                      }
                  }.start()
              }
              fun bulkCategory(ids: List<Long>) {
                  if (ids.isEmpty()) return
                  val c = Categories.ALL(this)
                  AlertDialog.Builder(this).setTitle("Category").setItems(c.toTypedArray()) { _, i -> PayeeOps.bulkSetCategory(this, ids, c[i]); refreshAll() }.show()
              }
              fun bulkDelete(ids: List<Long>) {
                  if (ids.isEmpty()) return
                  AlertDialog.Builder(this).setTitle("Delete ${ids.size}?").setPositiveButton("Delete") { _, _ -> PayeeOps.bulkDelete(this, ids); PayeeOps.cleanupOrphanPayees(this); refreshAll() }.setNegativeButton(Str.s("cancel"), null).show()
              }
              fun openNotifAccessSettings() { try { startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS)) } catch (e: Exception) { toast("Manual") } }
              fun changeTxnCategory(t: Txn, done: () -> Unit) {
                  val c = Categories.ALL(this)
                  AlertDialog.Builder(this).setTitle(Str.s("change_category")).setItems(c.toTypedArray()) { _, i -> val n = t.copy(category = c[i], status = "USER", review = false); Db.get(this).updateTxn(n); done(); refreshAll() }.setNegativeButton(Str.s("cancel"), null).show()
              }
              fun changeTxnPayee(t: Txn, done: () -> Unit) {
                  showForm(Str.s("change_payee"), listOf(Field(Str.s("new_payee"), t.merchant))) { v ->
                      val n = t.copy(merchant = v[0].trim(), status = "USER", review = false); if (n.merchant.isBlank()) return@showForm
                      Db.get(this).updateTxn(n); Repo.ensurePayee(this, n); done(); refreshAll()
                  }
              }
          }

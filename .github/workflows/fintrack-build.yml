                      hist.addView(line)
                  }
                  col.addView(ScrollView(act).apply { addView(hist) }, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, act.dp(360)))
                  AlertDialog.Builder(act).setTitle(name).setView(ScrollView(act).apply { addView(col) }).setPositiveButton(Str.s("close"), null).show()
              }
          }

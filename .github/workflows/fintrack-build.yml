          cat > app/src/main/java/com/example/fintrack/Tolls.kt <<'EOF_15'
          package com.example.fintrack

          import android.content.Context
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.ConcurrentHashMap

          data class Plaza(val id: Int, val name: String, val state: String, val nh: String, val lat: Double, val lon: Double, val car: Double?, val toks: Set<String>)
          data class TollCheckpoint(val plaza: String, val ts: Long, val amount: Double, val lat: Double, val lon: Double)
          data class TollTrip(val tripId: Int, val direction: String, val dayKey: String, val title: String, val total: Double, val checkpoints: List<TollCheckpoint>, val roadPolyline: List<DoubleArray>)

          object Tolls {
              val TOLL_SEED: Map<String, DoubleArray> = linkedMapOf(
                  "Nawabganj Toll Plaza" to doubleArrayOf(80.6591, 26.6214),
                  "Shahabpur Toll Plaza" to doubleArrayOf(81.1422, 26.7845),
                  "Aaini Toll Plaza"     to doubleArrayOf(81.9845, 26.8012),
                  "Newada Toll Plaza"    to doubleArrayOf(81.1234, 26.5120),
                  "Basheerapur Toll Plaza" to doubleArrayOf(81.6789, 26.2345),
                  "Tarwa Deva"           to doubleArrayOf(82.1234, 25.9876)
              )
              private var index: Map<String, List<Plaza>> = emptyMap()
              private var loaded = false
              private val stop = setOf("toll","plaza","tp","the","road","ltd","pvt","and","bridge","gate","check","post")
              private val splitRe = Regex("""[^a-z0-9]+""")
              private fun toks(s: String): Set<String> = s.lowercase().split(splitRe).filter { it.length >= 3 && it !in stop }.toSet()
              @Synchronized
              fun load(ctx: Context) {
                  if (loaded) return
                  val idx = HashMap<String, MutableList<Plaza>>()
                  try {
                      val db = Db.get(ctx); val rows = db.rows("SELECT * FROM toll_plazas")
                      for (r in rows) {
                          val name = r["name"] ?: continue; val tk = toks(name); if (tk.isEmpty()) continue
                          val p = Plaza(r["plaza_id"]?.toIntOrNull() ?: 0, name, r["state"] ?: "", r["nh"] ?: "", r["lat"]?.toDoubleOrNull() ?: 0.0, r["lon"]?.toDoubleOrNull() ?: 0.0, r["car_fare"]?.toDoubleOrNull(), tk)
                          for (t in tk) idx.getOrPut(t) { ArrayList() }.add(p)
                      }
                  } catch (_: Exception) {}
                  index = idx; loaded = true
              }
              fun match(ctx: Context, text: String, amount: Double): Plaza? {
                  load(ctx); val raw = toks(text); if (raw.isEmpty()) return null
                  val cand = HashSet<Plaza>(); for (t in raw) index[t]?.let { cand.addAll(it) }
                  var best: Plaza? = null; var bestScore = 0.0
                  for (p in cand) {
                      val overlap = p.toks.count { it in raw }; if (overlap == 0) continue
                      var score = overlap * 10.0 + (overlap.toDouble() / p.toks.size) * 10.0
                      val car = p.car; if (car != null && car > 0) score -= Math.min(Math.abs(car - amount) / car, 5.0)
                      if (score > bestScore) { best = p; bestScore = score }
                  }
                  return best
              }
              private val vehicleRe = Regex("""\b([A-Z]{2}[\s\-]?\d{1,2}[\s\-]?[A-Z]{1,3}[\s\-]?\d{4})\b""")
              private val plazaNameRe = Regex("""(?i)(?:at|for)\s+([A-Z][A-Za-z .\-]{2,40}?)(?:\s*\(|\s+on\b|$)""")
              fun record(ctx: Context, t: Txn) {
                  val db = Db.get(ctx); db.exec("DELETE FROM toll_trips WHERE txn_id=?", t.id)
                  if (!t.debit) return
                  val p = match(ctx, t.merchant + " " + t.body, t.amount)
                  val veh = vehicleRe.find(t.body.uppercase())?.groupValues?.get(1)
                  if (p != null) db.exec("INSERT OR REPLACE INTO toll_trips(txn_id, plaza_id, plaza, state, lat, lon, ts, amount, vehicle) VALUES(?,?,?,?,?,?,?,?,?)", t.id, p.id, p.name, p.state, p.lat, p.lon, t.ts, t.amount, veh)
                  else {
                      val plazaFromBody = plazaNameRe.find(t.body)?.groupValues?.get(1)?.trim() ?: t.merchant
                      db.exec("INSERT OR REPLACE INTO toll_trips(txn_id, plaza_id, plaza, state, lat, lon, ts, amount, vehicle) VALUES(?,?,?,?,?,?,?,?,?)", t.id, 0, plazaFromBody, "", 0.0, 0.0, t.ts, t.amount, veh)
                  }
                  ctx.getSharedPreferences("fin", Context.MODE_PRIVATE).edit().putBoolean("map_cached", false).apply()
              }
              fun rematchAll(ctx: Context): Int {
                  load(ctx); val list = Db.get(ctx).queryTxns("category='Travel' AND debit=1", emptyArray(), 5000)
                  var n = 0; for (t in list) { record(ctx, t); n++ }
                  return n
              }
              private val dayFmt = SimpleDateFormat("yyyy-MM-dd", Locale.US)
              private fun plazaCoord(name: String): DoubleArray? {
                  TOLL_SEED[name]?.let { return it }
                  for ((k, v) in TOLL_SEED) if (k.equals(name, ignoreCase = true)) return v
                  return null
              }
              fun fetchRoadRoute(wps: List<DoubleArray>): List<DoubleArray> {
                  if (wps.size < 2) return wps.map { doubleArrayOf(it[1], it[0]) }
                  return try {
                      val coords = wps.joinToString(";") { "${it[0]},${it[1]}" }
                      val url = URL("https://router.project-osrm.org/route/v1/driving/$coords?overview=full&geometries=polyline")
                      val conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "GET"; conn.connectTimeout = 8000; conn.readTimeout = 8000
                      conn.setRequestProperty("User-Agent", "ImransFinances/11.0")
                      if (conn.responseCode != 200) throw RuntimeException("OSRM ${conn.responseCode}")
                      val txt = conn.inputStream.bufferedReader().use { it.readText() }
                      val json = org.json.JSONObject(txt); if (json.optString("code") != "Ok") throw RuntimeException("not Ok")
                      val routes = json.optJSONArray("routes") ?: throw RuntimeException("no routes")
                      if (routes.length() == 0) throw RuntimeException("no routes")
                      val geom = routes.getJSONObject(0).optString("geometry", ""); if (geom.isBlank()) throw RuntimeException("no geom")
                      decodePolyline(geom)
                  } catch (_: Exception) { wps.map { doubleArrayOf(it[1], it[0]) } }
              }
              fun decodePolyline(encoded: String): List<DoubleArray> {
                  val points = ArrayList<DoubleArray>(); var index = 0; val len = encoded.length; var lat = 0; var lng = 0
                  while (index < len) {
                      var b: Int; var shift = 0; var result = 0
                      do { b = encoded[index++].code - 63; result = result or ((b and 0x1f) shl shift); shift += 5 } while (b >= 0x20)
                      val dlat = if (result and 1 != 0) (result shr 1).inv() else (result shr 1); lat += dlat
                      shift = 0; result = 0
                      do { b = encoded[index++].code - 63; result = result or ((b and 0x1f) shl shift); shift += 5 } while (b >= 0x20)
                      val dlng = if (result and 1 != 0) (result shr 1).inv() else (result shr 1); lng += dlng
                      points.add(doubleArrayOf(lat * 1e-5, lng * 1e-5))
                  }
                  return points
              }
              fun buildTrips(ctx: Context): Pair<List<TollTrip>, Double> {
                  val prefs = ctx.getSharedPreferences("fin", Context.MODE_PRIVATE)
                  val cached = prefs.getBoolean("map_cached", false)
                  val rows = Db.get(ctx).rows("SELECT plaza, lat, lon, ts, amount FROM toll_trips ORDER BY ts ASC")
                  val events = rows.mapNotNull { r ->
                      val name = r["plaza"] ?: return@mapNotNull null
                      val ts = r["ts"]?.toLongOrNull() ?: return@mapNotNull null
                      val amt = r["amount"]?.toDoubleOrNull() ?: return@mapNotNull null
                      val seed = plazaCoord(name)
                      val lat = seed?.get(1) ?: r["lat"]?.toDoubleOrNull() ?: 0.0
                      val lon = seed?.get(0) ?: r["lon"]?.toDoubleOrNull() ?: 0.0
                      if (lat == 0.0 || lon == 0.0) return@mapNotNull null
                      TollCheckpoint(name, ts, amt, lat, lon)
                  }.sortedBy { it.ts }
                  if (events.isEmpty()) return emptyList<TollTrip>() to 0.0
                  val legs = ArrayList<MutableList<TollCheckpoint>>()
                  var cur = ArrayList<TollCheckpoint>()
                  for (ev in events) {
                      if (cur.isEmpty()) { cur.add(ev); continue }
                      val prev = cur.last()
                      val gapMs = ev.ts - prev.ts
                      val samePlaza = ev.plaza.equals(prev.plaza, ignoreCase = true)
                      val sameDay = dayFmt.format(Date(ev.ts)) == dayFmt.format(Date(prev.ts))
                      if (samePlaza || gapMs > 6L * 60 * 60 * 1000 || !sameDay) { legs.add(cur); cur = ArrayList() }
                      cur.add(ev)
                  }
                  if (cur.isNotEmpty()) legs.add(cur)
                  val cache = ConcurrentHashMap<String, List<DoubleArray>>()
                  val trips = ArrayList<TollTrip>(); var total = 0.0
                  for ((i, leg) in legs.withIndex()) {
                      val direction = if (i % 2 == 0) "Going" else "Returning"
                      val wps = leg.map { doubleArrayOf(it.lon, it.lat) }
                      val key = wps.joinToString("|") { "${it[0]},${it[1]}" }
                      val route = if (cached) wps.map { doubleArrayOf(it[1], it[0]) } else cache.getOrPut(key) { fetchRoadRoute(wps) }
                      val legTotal = leg.sumOf { it.amount }; total += legTotal
                      val title = leg.joinToString(" → ") { it.plaza }
                      trips.add(TollTrip(i + 1, direction, dayFmt.format(Date(leg.first().ts)), title, legTotal, leg.toList(), route))
                  }
                  if (!cached) prefs.edit().putBoolean("map_cached", true).apply()
                  return trips to total
              }
          }

        run: |
          mkdir -p /tmp/proj/app /tmp/proj/app/src/main /tmp/proj/app/src/main/java/com/example/wfcmonitor /tmp/proj/app/src/main/res/drawable /tmp/proj/app/src/main/res/layout /tmp/proj/app/src/main/res/xml
          cd /tmp/proj
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }

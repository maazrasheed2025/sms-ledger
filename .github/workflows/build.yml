                  refresh()
              }

              private fun refresh() {
                  val tile = qsTile ?: return
                  val on = Util.isWfc(Status.service)
                  tile.state = if (on) Tile.STATE_ACTIVE else Tile.STATE_INACTIVE
                  tile.label = "Wi-Fi Calling"

name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Generate project files
        run: |
          mkdir -p /tmp/proj/app /tmp/proj/app/src/main /tmp/proj/app/src/main/java/com/example/smsledger
          cd /tmp/proj
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "SmsLedger"
          include(":app")
          EOF_0
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF_2
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.smsledger"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.smsledger"
                  minSdk = 29
                  targetSdk = 33
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF_3
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.READ_SMS"/>
              <application android:label="SMS Ledger" android:theme="@style/Theme.AppCompat.Light.DarkActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          cat > app/src/main/java/com/example/smsledger/MainActivity.kt <<'EOF_5'
          package com.example.smsledger

          import android.Manifest
          import android.content.ContentValues
          import android.content.Context
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Environment
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.BaseAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import androidx.core.widget.doAfterTextChanged
          import java.text.SimpleDateFormat
          import java.util.Calendar
          import java.util.Date
          import java.util.Locale

          class MainActivity : AppCompatActivity() {

              private class Holder(val name: TextView, val sub: TextView, val amt: TextView)

              private var txns: List<Txn> = emptyList()
              private var shown: List<Txn> = emptyList()
              private val cal: Calendar = Calendar.getInstance()
              private var allTime = false
              private var query = ""
              private var selCat: String? = null

              private lateinit var monthLabel: TextView
              private lateinit var summary: TextView
              private lateinit var chips: LinearLayout
              private lateinit var listView: ListView
              private val txnAdapter = TxnAdapter()
              private val dateFmt = SimpleDateFormat("dd MMM yy", Locale.getDefault())

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun money(v: Double): String =
                  if (v % 1.0 == 0.0) String.format(Locale.US, "%,.0f", v) else String.format(Locale.US, "%,.2f", v)

              private fun smallBtn(label: String, onClick: () -> Unit) = Button(this).apply {
                  text = label
                  isAllCaps = false
                  minWidth = 0
                  minimumWidth = 0
                  setPadding(dp(10), 0, dp(10), 0)
                  setOnClickListener { onClick() }
              }

              private fun chip(label: String, sel: Boolean, onClick: () -> Unit) = TextView(this).apply {
                  text = label
                  textSize = 13f
                  setPadding(dp(12), dp(6), dp(12), dp(6))
                  setTextColor(if (sel) Color.WHITE else Color.BLACK)
                  background = GradientDrawable().apply {
                      cornerRadius = dp(16).toFloat()
                      setColor(Color.parseColor(if (sel) "#1565C0" else "#E0E0E0"))
                  }
                  setOnClickListener { onClick() }
                  layoutParams = LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  ).apply { setMargins(dp(4), dp(4), dp(4), dp(4)) }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  cal.set(Calendar.DAY_OF_MONTH, 1)

                  monthLabel = TextView(this).apply {
                      textSize = 17f
                      gravity = Gravity.CENTER
                      setTypeface(null, Typeface.BOLD)
                  }
                  summary = TextView(this).apply {
                      textSize = 15f
                      setPadding(dp(12), dp(6), dp(12), dp(6))
                  }
                  chips = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(6), 0, dp(6), 0)
                  }
                  val chipScroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      addView(chips)
                  }
                  val search = EditText(this).apply {
                      hint = "Search: naam ya dukaan (jaise ramesh)"
                      setSingleLine()
                      doAfterTextChanged { e ->
                          query = e?.toString()?.trim() ?: ""
                          refresh()
                      }
                  }
                  listView = ListView(this).apply {
                      adapter = txnAdapter
                      setOnItemClickListener { _, _, pos, _ -> shown.getOrNull(pos)?.let { showTxn(it) } }
                  }

                  val topRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(4), dp(4), dp(4), 0)
                      addView(smallBtn("◀") { allTime = false; cal.add(Calendar.MONTH, -1); refresh() })
                      addView(monthLabel, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                      addView(smallBtn("▶") { allTime = false; cal.add(Calendar.MONTH, 1); refresh() })
                      addView(smallBtn("All") { allTime = !allTime; refresh() })
                      addView(smallBtn("⟳") { loadSms() })
                      addView(smallBtn("CSV") { exportCsv() })
                  }

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      addView(topRow)
                      addView(summary)
                      addView(chipScroll)
                      addView(search)
                      addView(listView, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                  }
                  setContentView(root)
                  refresh()

                  if (hasSms()) loadSms()
                  else ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.READ_SMS), 1)
              }

              private fun hasSms() =
                  ContextCompat.checkSelfPermission(this, Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED

              override fun onRequestPermissionsResult(code: Int, p: Array<out String>, r: IntArray) {
                  super.onRequestPermissionsResult(code, p, r)
                  if (hasSms()) loadSms()
                  else summary.text = "SMS permission nahi mili. Phone Settings → Apps → SMS Ledger → Permissions me SMS allow karo " +
                      "(Android 13+ par pehle app info me ⋮ → 'Allow restricted settings' dabana pad sakta hai)."
              }

              private fun loadSms() {
                  if (!hasSms()) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.READ_SMS), 1)
                      return
                  }
                  summary.text = "SMS padhe ja rahe hain..."
                  Thread {
                      var err: String? = null
                      val list = try {
                          SmsLoader.load(this)
                      } catch (e: Exception) {
                          err = e.message
                          emptyList<Txn>()
                      }
                      runOnUiThread {
                          txns = list
                          refresh()
                          if (err != null) summary.text = "Error: $err"
                      }
                  }.start()
              }

              private fun refresh() {
                  val start = Calendar.getInstance().apply {
                      timeInMillis = cal.timeInMillis
                      set(Calendar.DAY_OF_MONTH, 1)
                      set(Calendar.HOUR_OF_DAY, 0)
                      set(Calendar.MINUTE, 0)
                      set(Calendar.SECOND, 0)
                      set(Calendar.MILLISECOND, 0)
                  }
                  val end = Calendar.getInstance().apply {
                      timeInMillis = start.timeInMillis
                      add(Calendar.MONTH, 1)
                  }
                  monthLabel.text = if (allTime) "Poora record"
                  else SimpleDateFormat("MMMM yyyy", Locale.getDefault()).format(start.time)

                  val q = query.lowercase()
                  val base = txns.filter { t ->
                      (allTime || (t.date >= start.timeInMillis && t.date < end.timeInMillis)) &&
                          (q.isEmpty() || t.merchant.lowercase().contains(q) ||
                              t.category.lowercase().contains(q) || t.body.lowercase().contains(q))
                  }

                  val spent = base.filter { it.debit }.sumOf { it.amount }
                  val recv = base.filter { !it.debit }.sumOf { it.amount }
                  summary.text = "Kharch: ₹${money(spent)}     Mila: ₹${money(recv)}\n${base.size} transactions" +
                      (if (txns.isEmpty()) "  (koi bank SMS nahi mila)" else "")

                  val cats = base.groupBy { it.category }
                  val sc = selCat
                  if (sc != null && !cats.containsKey(sc)) selCat = null

                  chips.removeAllViews()
                  chips.addView(chip("All", selCat == null) { selCat = null; refresh() })
                  cats.entries.sortedByDescending { e -> e.value.sumOf { it.amount } }.forEach { e ->
                      val d = e.value.filter { it.debit }.sumOf { it.amount }
                      val c = e.value.filter { !it.debit }.sumOf { it.amount }
                      val label = e.key + " " + (if (d > 0) "₹" + money(d) else "+₹" + money(c))
                      chips.addView(chip(label, selCat == e.key) { selCat = e.key; refresh() })
                  }

                  val cur = selCat
                  shown = if (cur == null) base else base.filter { it.category == cur }
                  txnAdapter.notifyDataSetChanged()
              }

              private fun showTxn(t: Txn) {
                  val msg = dateFmt.format(Date(t.date)) + " • " + t.category + "\n" +
                      (if (t.debit) "Kharch: ₹" else "Mila: ₹") + money(t.amount) +
                      "\nSender: " + t.sender + "\n\n" + t.body
                  AlertDialog.Builder(this)
                      .setTitle(t.merchant)
                      .setMessage(msg)
                      .setPositiveButton("Category badlo") { _, _ -> pickCategory(t) }
                      .setNegativeButton("Band karo", null)
                      .show()
              }

              private fun pickCategory(t: Txn) {
                  AlertDialog.Builder(this)
                      .setTitle("Category chuno")
                      .setItems(Parser.CATEGORIES.toTypedArray()) { _, which ->
                          val cat = Parser.CATEGORIES[which]
                          val key = Parser.keyOf(t)
                          getSharedPreferences("ledger", Context.MODE_PRIVATE).edit().putString("ov:$key", cat).apply()
                          txns.filter { Parser.keyOf(it) == key }.forEach { it.category = cat }
                          refresh()
                      }
                      .show()
              }

              private fun csvq(s: String): String = "\"" + s.replace("\"", "\"\"") + "\""

              private fun exportCsv() {
                  try {
                      val f = SimpleDateFormat("yyyy-MM-dd HH:mm", Locale.US)
                      val sb = StringBuilder("date,type,amount,merchant,category,sender,sms\n")
                      for (t in shown) {
                          sb.append(f.format(Date(t.date))).append(',')
                              .append(if (t.debit) "DEBIT" else "CREDIT").append(',')
                              .append(t.amount).append(',')
                              .append(csvq(t.merchant)).append(',')
                              .append(csvq(t.category)).append(',')
                              .append(csvq(t.sender)).append(',')
                              .append(csvq(t.body)).append('\n')
                      }
                      val name = "ledger_" + SimpleDateFormat("yyyyMMdd_HHmm", Locale.US).format(Date()) + ".csv"
                      val values = ContentValues().apply {
                          put(MediaStore.Downloads.DISPLAY_NAME, name)
                          put(MediaStore.Downloads.MIME_TYPE, "text/csv")
                          put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS)
                      }
                      val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)
                      if (uri == null) {
                          Toast.makeText(this, "Export fail ho gaya", Toast.LENGTH_LONG).show()
                          return
                      }
                      contentResolver.openOutputStream(uri)?.use { it.write(sb.toString().toByteArray()) }
                      Toast.makeText(this, "Downloads me save: $name (${shown.size} rows)", Toast.LENGTH_LONG).show()
                  } catch (e: Exception) {
                      Toast.makeText(this, "Export error: ${e.message}", Toast.LENGTH_LONG).show()
                  }
              }

              inner class TxnAdapter : BaseAdapter() {
                  override fun getCount(): Int = shown.size
                  override fun getItem(position: Int): Any = shown[position]
                  override fun getItemId(position: Int): Long = shown[position].id

                  private fun makeRow(): LinearLayout {
                      val name = TextView(this@MainActivity).apply {
                          textSize = 15f
                          setTypeface(null, Typeface.BOLD)
                          setSingleLine()
                      }
                      val sub = TextView(this@MainActivity).apply {
                          textSize = 12f
                          setTextColor(Color.GRAY)
                      }
                      val amt = TextView(this@MainActivity).apply {
                          textSize = 16f
                          setTypeface(null, Typeface.BOLD)
                      }
                      val left = LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.VERTICAL
                          addView(name)
                          addView(sub)
                      }
                      return LinearLayout(this@MainActivity).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(dp(12), dp(10), dp(12), dp(10))
                          addView(left, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                          addView(amt)
                          tag = Holder(name, sub, amt)
                      }
                  }

                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                      val row = convertView as? LinearLayout ?: makeRow()
                      val h = row.tag as Holder
                      val t = shown[position]
                      h.name.text = t.merchant
                      h.sub.text = dateFmt.format(Date(t.date)) + " • " + t.category
                      h.amt.text = (if (t.debit) "-₹" else "+₹") + money(t.amount)
                      h.amt.setTextColor(Color.parseColor(if (t.debit) "#C62828" else "#2E7D32"))
                      return row
                  }
              }
          }
          EOF_5
          cat > app/src/main/java/com/example/smsledger/Parser.kt <<'EOF_6'
          package com.example.smsledger

          import android.content.Context
          import android.net.Uri

          data class Txn(
              val id: Long,
              val date: Long,
              val sender: String,
              val amount: Double,
              val debit: Boolean,
              val merchant: String,
              var category: String,
              val body: String
          )

          object Parser {

              val CATEGORIES = listOf(
                  "Grocery", "Fuel", "Food", "Travel", "Shopping", "Bills & Recharge", "Entertainment",
                  "Health", "Cash", "EMI/Loan", "Transfer", "Salary/Income", "Received", "Other"
              )

              private val amountRe = Regex("(?i)(?:\\b(?:rs\\.?|inr)|₹)\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)")
              private val excludeRe = Regex("(?i)\\b(otp|one[- ]time|verification|requested|request|will be|due|pre-?approved|eligible|reminder|statement|failed|declined|unsuccessful|offer|apply)\\b")
              private val accountRe = Regex("(?i)(a/c|\\bac\\b|acct|account|card|upi|bank|wallet|neft|imps|rtgs|atm|x{2,}\\d{2,}|\\*{2,}\\d{2,})")
              private val debitRe = Regex("(?i)\\b(debited|spent|paid|withdrawn|withdrawal|purchase|sent|transferred|debit of)\\b")
              private val creditRe = Regex("(?i)\\b(credited|received|deposited|refund(?:ed)?)\\b")

              private val toRe = Regex("(?i)\\b(?:to|at)\\s+([A-Za-z][A-Za-z0-9 &.\\-']{2,30}?)(?=\\s+(?:on|ref\\w*|via|upi|using|avl|bal|a/c|account|txn|not|if|vide|dated|date)\\b|[.,;(]|$)")
              private val fromRe = Regex("(?i)\\b(?:from|by)\\s+([A-Za-z][A-Za-z0-9 &.\\-']{2,30}?)(?=\\s+(?:on|ref\\w*|via|upi|using|avl|bal|a/c|account|txn|not|if|vide|dated|date)\\b|[.,;(]|$)")
              private val vpaRe = Regex("(?i)\\bvpa\\s+([\\w.\\-]+@[\\w.\\-]+)")
              private val upiSlashRe = Regex("(?i)upi/\\w+/\\d+/([A-Za-z][A-Za-z0-9 .\\-]{2,30}?)(?:/|$)")
              private val semiRe = Regex("(?i)[;,]\\s*([A-Za-z][A-Za-z0-9 &.\\-']{2,30}?)\\s+credited")
              private val infoRe = Regex("(?i)info[:\\-\\s]+([A-Za-z0-9 &.\\-/@']{3,30})")
              private val amountAfterRe = Regex("(?i)\\b(?:debited|credited|spent|paid|withdrawn|sent|received|deposited)\\s+(?:by|for|of|with)?\\s*(?:rs\\.?|inr|₹)?\\s*([0-9][0-9,]*(?:\\.[0-9]{1,2})?)")
              private val atmRe = Regex("(?i)\\batm\\b")
              private val upiWordRe = Regex("(?i)\\b(upi|imps|neft|rtgs|vpa)\\b")

              private val stopExact = setOf("upi", "neft", "imps", "rtgs", "a/c", "ac", "acct", "account", "you", "bank", "card", "self")
              private val stopStarts = listOf("your", "a/c", "ac ", "acct", "account", "upi ", "bank", "card", "you ")

              private fun rule(name: String, words: String) = name to Regex("(?i)\\b(?:$words)\\b")

              private val rules = listOf(
                  rule("Grocery", "bigbasket|big basket|blinkit|zepto|dmart|d-mart|avenue supermarts|grofers|jiomart|instamart|kirana|grocery|groceries|supermarket|super market|vegetable|vegetables|fruits|dairy|milk|reliance fresh|more retail|spencer|provision|general store"),
                  rule("Fuel", "petrol|diesel|fuel|hpcl|bpcl|iocl|indian ?oil|indianoil|bharat petroleum|hindustan petroleum|shell|nayara|essar|filling station|hp pay"),
                  rule("Food", "swiggy|zomato|restaurant|cafe|dominos|domino's|mcdonald's|mcdonalds|kfc|pizza|burger|hotel|dhaba|biryani|bakery|sweets|food|eatery|starbucks|chai|canteen|barbeque"),
                  rule("Travel", "uber|ola|rapido|irctc|redbus|makemytrip|goibibo|railway|metro|fastag|toll|indigo|air india|spicejet|yatra|cleartrip|ixigo|cab|taxi|travels"),
                  rule("Bills & Recharge", "airtel|jio|vodafone|bsnl|electricity|bijli|bescom|msedcl|tneb|water bill|piped gas|dth|tata play|tatasky|dish tv|recharge|broadband|postpaid|prepaid|bill|insurance|lic|municipal|property tax|bbps"),
                  rule("Shopping", "amazon|flipkart|myntra|ajio|meesho|nykaa|snapdeal|decathlon|retail|mall|fashion|garments|clothing|electronics|croma|reliance digital|lenskart"),
                  rule("Entertainment", "netflix|hotstar|spotify|prime video|bookmyshow|youtube|pvr|inox|sonyliv|zee5|gaming|dream11"),
                  rule("Health", "pharmacy|medical|medicos|apollo|1mg|pharmeasy|hospital|clinic|diagnostic|labs|netmeds|dental|doctor")
              )

              private val bodyRules = listOf(
                  rule("Cash", "atm|cash withdrawal|cash wdl|atm wdl"),
                  rule("EMI/Loan", "emi|loan"),
                  rule("Salary/Income", "salary"),
                  rule("Bills & Recharge", "recharge|fastag|insurance|bbps|electricity|bill payment|dth")
              )

              fun keyFor(merchant: String, id: Long): String =
                  if (merchant == "Unknown") "sms$id" else merchant.lowercase()

              fun keyOf(t: Txn): String = keyFor(t.merchant, t.id)

              fun parse(id: Long, date: Long, sender: String, rawBody: String, overrides: (String) -> String?): Txn? {
                  if (sender.none { it.isLetter() }) return null
                  val body = rawBody.replace("\n", " ").replace(Regex("\\s+"), " ").trim()
                  if (excludeRe.containsMatchIn(body)) return null
                  if (!accountRe.containsMatchIn(body)) return null
                  val d = debitRe.find(body)
                  val c = creditRe.find(body)
                  if (d == null && c == null) return null
                  val debit = if (d != null && c != null) d.range.first < c.range.first else d != null
                  val amount = findAmount(body) ?: return null
                  val found = findMerchant(body, debit)
                  val merchant = if (found == "Unknown" && debit && atmRe.containsMatchIn(body)) "ATM Withdrawal" else found
                  val category = overrides(keyFor(merchant, id)) ?: classify(merchant, body, debit)
                  return Txn(id, date, sender, amount, debit, merchant, category, body)
              }

              private fun findAmount(body: String): Double? {
                  for (m in amountRe.findAll(body)) {
                      val start = maxOf(0, m.range.first - 18)
                      val before = body.substring(start, m.range.first).lowercase()
                      if (before.contains("bal") || before.contains("avl") || before.contains("available") || before.contains("limit")) continue
                      val v = m.groupValues[1].replace(",", "").toDoubleOrNull()
                      if (v != null && v > 0) return v
                  }
                  val m2 = amountAfterRe.find(body)
                  if (m2 != null) {
                      val v = m2.groupValues[1].replace(",", "").toDoubleOrNull()
                      if (v != null && v > 0) return v
                  }
                  return null
              }

              private fun valid(s: String): Boolean {
                  val t = s.trim().lowercase()
                  if (t.length < 3) return false
                  if (t in stopExact) return false
                  for (p in stopStarts) if (t.startsWith(p)) return false
                  return true
              }

              private fun pretty(s: String): String {
                  var t = s.trim().trimEnd('.', '-', ',', ' ')
                  if (t.contains("@")) return t.lowercase()
                  if (t.none { it.isLowerCase() }) {
                      t = t.lowercase().split(" ").joinToString(" ") { w -> w.replaceFirstChar { ch -> ch.uppercase() } }
                  }
                  return t.take(30)
              }

              private fun findMerchant(body: String, debit: Boolean): String {
                  val cands = ArrayList<String>()
                  upiSlashRe.find(body)?.let { cands.add(it.groupValues[1]) }
                  val primary = if (debit) toRe else fromRe
                  for (m in primary.findAll(body)) cands.add(m.groupValues[1])
                  if (debit) semiRe.find(body)?.let { cands.add(it.groupValues[1]) }
                  vpaRe.find(body)?.let { cands.add(it.groupValues[1]) }
                  infoRe.find(body)?.let { cands.add(it.groupValues[1]) }
                  for (cand in cands) if (valid(cand)) return pretty(cand)
                  return "Unknown"
              }

              private fun classify(merchant: String, body: String, debit: Boolean): String {
                  for ((name, re) in rules) if (re.containsMatchIn(merchant)) return name
                  for ((name, re) in bodyRules) if (re.containsMatchIn(body)) return name
                  if (!debit) return "Received"
                  return if (upiWordRe.containsMatchIn(body)) "Transfer" else "Other"
              }
          }

          object SmsLoader {
              fun load(ctx: Context): List<Txn> {
                  val prefs = ctx.getSharedPreferences("ledger", Context.MODE_PRIVATE)
                  val out = ArrayList<Txn>()
                  val cur = ctx.contentResolver.query(
                      Uri.parse("content://sms/inbox"),
                      arrayOf("_id", "address", "body", "date"),
                      null, null, "date DESC"
                  ) ?: return out
                  cur.use { c ->
                      val iId = c.getColumnIndex("_id")
                      val iAddr = c.getColumnIndex("address")
                      val iBody = c.getColumnIndex("body")
                      val iDate = c.getColumnIndex("date")
                      while (c.moveToNext()) {
                          val t = Parser.parse(
                              c.getLong(iId), c.getLong(iDate),
                              c.getString(iAddr) ?: "", c.getString(iBody) ?: ""
                          ) { key -> prefs.getString("ov:$key", null) }
                          if (t != null) out.add(t)
                      }
                  }
                  return out
              }
          }
          EOF_6
      - name: Build
        working-directory: /tmp/proj
        run: gradle assembleDebug --no-daemon
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ github.run_number }}" /tmp/proj/app/build/outputs/apk/debug/app-debug.apk --repo "${{ github.repository }}" --title "SMS Ledger build ${{ github.run_number }}" --notes "Debug APK"
